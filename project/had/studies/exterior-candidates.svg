<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"><title>HAD exterior candidates — front elevation</title><desc>Candidate appearance study. All apertures and roof outline retain RH-LAYOUT-FAMILY-02; material fields are proposals, not products or construction.</desc><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#242424} .t{font-size:21px;font-weight:600}.h{font-size:15px;font-weight:600}.n{font-size:12px}.q{fill:none;stroke:#333;stroke-width:1}.f{fill:#eee;stroke:#333;stroke-width:1}</style><text x="40" y="42" class="t">Exterior candidates / held front geometry</text><text x="40" y="66" class="n">HAD-01E · RH-LAYOUT-FAMILY-02 · appearance study; no performance or final selection</text><text x="40" y="106" class="h">E-A / masonry body, pale entry</text><path d="M 40 435 H 520 V 163 H 40 Z" fill="#e6e3df" stroke="#333"/><path d="M 40 163 L 125 123.36383999999998 H 435 L 520 163 Z" fill="#d2d2d2" stroke="#333"/><rect x="40" y="163" width="480" height="7.2" fill="#fafafa" stroke="#333"/><line x1="40" x2="520" y1="429" y2="429" stroke="#555"/><rect x="92" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="176" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="238" y="313.8" width="84" height="121.2" fill="#fafafa" stroke="#333"/><rect x="244" y="321" width="72" height="114" fill="#fff" stroke="#333"/><line x1="244" x2="316" y1="342.6" y2="342.6" stroke="#777"/><line x1="280" x2="280" y1="435" y2="345" stroke="#777"/><rect x="344" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="428" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="92" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="176" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="260" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="344" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="428" y="183" width="40" height="84" fill="#fff" stroke="#333"/><text x="40" y="472" class="n">Same axes, apertures, storeys and roof in both studies.</text><text x="40" y="493" class="n">Public entry carries the concentrated material emphasis.</text><text x="610" y="106" class="h">E-B / quiet mineral body</text><path d="M 610 435 H 1090 V 163 H 610 Z" fill="#f7f5ef" stroke="#333"/><path d="M 610 163 L 695 123.36383999999998 H 1005 L 1090 163 Z" fill="#d2d2d2" stroke="#333"/><rect x="610" y="163" width="480" height="7.2" fill="#fafafa" stroke="#333"/><line x1="610" x2="1090" y1="429" y2="429" stroke="#555"/><rect x="662" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="746" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="808" y="313.8" width="84" height="121.2" fill="#fafafa" stroke="#333"/><rect x="814" y="321" width="72" height="114" fill="#fff" stroke="#333"/><line x1="814" x2="886" y1="342.6" y2="342.6" stroke="#777"/><line x1="850" x2="850" y1="435" y2="345" stroke="#777"/><rect x="914" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="998" y="321" width="40" height="84" fill="#fff" stroke="#333"/><rect x="662" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="746" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="830" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="914" y="183" width="40" height="84" fill="#fff" stroke="#333"/><rect x="998" y="183" width="40" height="84" fill="#fff" stroke="#333"/><text x="610" y="472" class="n">Same axes, apertures, storeys and roof in both studies.</text><text x="610" y="493" class="n">Entrance rank retained without a masonry material contrast.</text><text x="40" y="540" class="n">Apertures only: operating frames, glazing bars, fixing, sill water paths and door hardware remain OAS work.</text><text x="40" y="561" class="n">Roof outline has inner as well as outer falls. Court collection, overflow and maintenance remain unresolved