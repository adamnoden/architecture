<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc"><title id="title">East courtyard egress: window-bay versus solid-pier route</title><desc id="desc">Source-derived 300 millimetre gross strip compared at y7000, y7125 and y6000. The y6000 route passes through aligned masonry pier projections but conflicts with plant service reservations; neither route is adopted.</desc><rect width="420" height="297" fill="#fffdf8"/><text x="15" y="17" font-family="DejaVu Sans,Arial,sans-serif" font-size="5.15" font-weight="bold" fill="#26343a">HAD / East court escape: find the passage before sizing the drain</text><text x="15" y="25" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Accepted 12 m house · plan at 1:50 for the represented crop · three unadopted 300 mm gross envelope trials</text><path d="M15 32L405 32" fill="none" stroke="#61716e" stroke-width="0.4" /><text x="20" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" font-weight="bold" fill="#26343a">01 / Plan crop: court wall → gallery → plant / pantry → outer wall</text><rect x="25" y="121.9" width="8.35" height="82.1" fill="#b1b6b2" stroke="#61716e" stroke-width="0.3"/><rect x="33.35" y="121.9" width="25.4" height="82.1" fill="#eff1eb" stroke="#61716e" stroke-width="0.3"/><rect x="58.75" y="121.9" width="2.5" height="82.1" fill="#b4b5b1" stroke="#61716e" stroke-width="0.3"/><rect x="61.25" y="151" width="40.4" height="53" fill="#e7ece6" stroke="#61716e" stroke-width="0.3"/><rect x="61.25" y="121.9" width="40.4" height="29.1" fill="#eee7d8" stroke="#61716e" stroke-width="0.3"/><rect x="101.65" y="121.9" width="8.35" height="82.1" fill="#b1b6b2" stroke="#61716e" stroke-width="0.3"/><rect x="25" y="171" width="8.35" height="20" fill="#fffdf8" stroke="#3e7a91" stroke-width="0.45"/><rect x="25" y="137" width="8.35" height="20" fill="#fffdf8" stroke="#3e7a91" stroke-width="0.45"/><rect x="101.65" y="178" width="8.35" height="28" fill="#fffdf8" stroke="#3e7a91" stroke-width="0.45"/><rect x="101.65" y="126" width="8.35" height="20" fill="#fffdf8" stroke="#3e7a91" stroke-width="0.45"/><rect x="67.25" y="156" width="10" height="20" fill="#d6ded4" stroke="#52665b" stroke-width="0.5"/><rect x="83.25" y="154" width="18.4" height="74" fill="#eee4ce" stroke="#80775f" stroke-width="0.5"/><rect x="25" y="161" width="85" height="6" fill="#2c766b" stroke="#2c766b" stroke-width="0.1"/><rect x="25" y="141" width="85" height="6" fill="#a7664e" stroke="#a7664e" stroke-width="0.1"/><rect x="25" y="138.5" width="85" height="6" fill="#7f7b67" stroke="#7f7b67" stroke-width="0.1"/><text x="32" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.5" font-weight="normal" fill="#26343a">GALLERY</text><text x="61.4" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.6" font-weight="normal" fill="#26343a">PLANT</text><text x="61" y="131.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.5" font-weight="normal" fill="#26343a">PANTRY</text><text x="20" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" font-weight="normal" fill="#26343a">Solid teal = E-P y=6000. Orange = old E-W y=7000. Grey = E-W y=7125.</text><text x="20" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Line width is an authored 300 mm envelope; shown strips are NOT openings already cut into the walls.</text><text x="162" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" font-weight="bold" fill="#26343a">02 / Source overlap facts</text><text x="162" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Court east windows: 4650–5650, 6350–7350 mm</text><text x="162" y="65.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Outer east: plant-replacement DOOR 3900–5300;</text><text x="162" y="73.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">outer upper WINDOW 6900–7900 mm.</text><text x="162" y="81.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Common court/outer solid pier: 5650–6350 (700).</text><text x="162" y="89.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Common window-bay projection: 6900–7350 (450).</text><text x="162" y="97.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a"></text><text x="162" y="105.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="bold" fill="#26343a">At y7000: 300 band = 6850–7150.</text><text x="162" y="113.69999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Outer window begins 6900: 50 mm overrun</text><text x="162" y="121.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">into supporting masonry beneath its jamb zone.</text><text x="162" y="129.89999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a"></text><text x="162" y="138" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="bold" fill="#26343a">At y7125: 300 band = 6975–7275.</text><text x="162" y="146.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">Only 75 mm nominal bay projection each side.</text><text x="162" y="154.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">This is not a structural bearing allowance.</text><text x="162" y="162.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a"></text><text x="162" y="170.39999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="bold" fill="#26343a">At y6000: 300 band = 5850–6150.</text><text x="162" y="178.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">200 mm nominal court-pier projection each side;</text><text x="162" y="186.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">outer-pier projection gives 550 / 750 mm.</text><text x="162" y="194.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">No load-path or actual arch/portal is yet sized.</text><text x="162" y="202.79999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a"></text><text x="162" y="210.9" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">BUT y6000 crosses PLANT DRY and WORKING</text><text x="162" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">reservations; riser y4500–5200 does not intersect.</text><text x="162" y="227.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">A wet-service / electrical-plant separation and</text><text x="162" y="235.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">new room/equipment packing would be required.</text><path d="M15 244L405 244" fill="none" stroke="#61716e" stroke-width="0.4" /><text x="15" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" font-weight="bold" fill="#26343a">Decision: y6000 solid-pier route is the better geometric *challenger*, not a selected emergency outlet.</text><text x="15" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#26343a">Require actual STR portal, dry plant reallocation, cover renewal, OAS/IAS wet boundaries and RWT failed-state head.</text><path d="M15 275L405 275" fill="none" stroke="#a7b1ad" stroke-width="0.4" /><text x="15" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">RH-LAYOUT-REVISION-02 · HAD-03 / RWT-06 · 1 November 2026 · source-grounded architectural comparison</text><text x="15" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#26343a">No roof-water capacity, physical opening, waterproofing system, site flood datum or programme closeout is claimed.</text></svg>
