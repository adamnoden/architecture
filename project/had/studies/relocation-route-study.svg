<text x="210" y="47" font-size="3.6">What this sheet tests</text>
<text x="210" y="56" font-size="2.65">ROUTE LAYER: door leaf omitted, final state varies.</text>
<text x="210" y="61.3" font-size="2.65">Separate coupled entry/closing model accompanies it.</text>
<text x="210" y="66.6" font-size="2.65">A 600 mm circular body traverses 5 mm axis steps.</text>
<text x="210" y="71.9" font-size="2.65">Each whole step is checked against every rectangle.</text>
<text x="210" y="77.2" font-size="2.65">The start must be free; targets lie on the same lattice.</text>
<text x="210" y="82.5" font-size="2.65">This does not test people, carrying or required access.</text>
<text x="210" y="87.8" font-size="2.65"></text>
<text x="210" y="93.1" font-size="2.65">Bed: 1350 × 1900 actual base + 90 north headboard.</text>
<text x="210" y="98.4" font-size="2.65">Both lower sides connect via east side and south foot.</text>
<text x="210" y="103.69999999999999" font-size="2.65">The west side above the retained wall is not a route.</text>
<text x="210" y="109" font-size="2.65">Smallest raw side reserve: 617.5 before tolerances.</text>
<text x="210" y="114.3" font-size="2.65"></text>
<text x="210" y="119.6" font-size="2.65">WC moved north; shower reduced to actual 900 × 800.</text>
<text x="210" y="124.89999999999999" font-size="2.65">Basin moved south; service cabinet moves with WC.</text>
<text x="210" y="130.2" font-size="2.65">The shower target is outside its east edge: no step,</text>
<text x="210" y="135.5" font-size="2.65">screen/door, waterproofing or tray access is accepted.</text>
<text x="210" y="140.8" font-size="2.65"></text>
<text x="210" y="146.1" font-size="2.65">Bedroom slider: 750 final clear, 826 stock-leaf trial.</text>
<text x="210" y="151.39999999999998" font-size="2.65">Wet door: 800 rough, 686 leaf, hinge y 1693 trial.</text>
<text x="210" y="156.7" font-size="2.65">Dashed 750 swing is conservative, not a doorset.</text>
<text x="210" y="162" font-size="2.65">Frame, stop, handle and final clear passage still govern.</text>
<text x="210" y="167.3" font-size="2.65"></text>
<text x="210" y="172.6" font-size="2.65">Storage, window use and second-stack installation</text>
<text x="210" y="177.89999999999998" font-size="2.65">remain part of continued design, not implied by paths.</text>
<text x="210" y="183.2" font-size="2.65">No canonical room, fixture or authority is changed.</text>
