idth="0.7" /><path d="M183 87.58 L183 61.58" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><rect x="168" y="68" width="30" height="2" fill="none" stroke="#ac4f3d" stroke-width="0.3"/><text x="241" y="58" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Grey: RC120 flange +140×100 upper rib.</text><text x="241" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Rib replaces100insulation;220total depth.</text><text x="241" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Red: slope-following750translation,</text><text x="241" y="85" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">then650vertical lift into cleared floor.</text><text x="241" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Dry caps and lower airlid first release</text><text x="241" y="103" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">are separate operations, not one slab.</text><text x="241" y="112" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Caps/lids above red lifts are removed.</text><text x="20" y="112" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Court piece moves NORTH into family; garden piece moves SOUTH.</text><text x="20" y="137" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.6" font-weight="bold" fill="#23323a">07 / E LONGITUDINAL · 1:25</text><rect x="57" y="162" width="170" height="11.2" fill="#d8d3bf" stroke="#52616a" stroke-width="0.3"/><path d="M25 174.72 L228 174.72" fill="none" stroke="#778c91" stroke-width="0.4" /><path d="M25 187.52 L228 187.52" fill="none" stroke="#568d94" stroke-width="0.4" /><polyline points="25.3,183.203 228,185.23" fill="none" stroke="#287678" stroke-width="1"/><polyline points="25.3,176.803 228,178.82999999999998" fill="none" stroke="#287678" stroke-width="1"/><rect x="56.3" y="169.2" width="28" height="4.8" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><rect x="67.5" y="165.2" width="5.6" height="4" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><rect x="105" y="169.2" width="28" height="4.8" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><rect x="116.2" y="165.2" width="5.6" height="4" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><rect x="199" y="169.2" width="28" height="4.8" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><rect x="210.9" y="165.2" width="5.6" height="4" fill="#acb5ae" stroke="#646f68" stroke-width="0.3"/><path d="M70.3 180.453 L40.3 180.153" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><path d="M40.3 180.153 L40.3 154.153" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><rect x="25.3" y="162" width="30" height="2" fill="none" stroke="#ac4f3d" stroke-width="0.3"/><path d="M119 180.94 L149 181.24" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><path d="M149 181.24 L149 155.24" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><rect x="134" y="162" width="30" height="2" fill="none" stroke="#ac4f3d" stroke-width="0.3"/><path d="M213 181.88 L183 181.57999999999998" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><path d="M183 181.57999999999998 L183 155.58" fill="none" stroke="#ac4f3d" stroke-width="0.7" /><rect x="168" y="162" width="30" height="2" fill="none" stroke="#ac4f3d" stroke-width="0.3"/><text x="241" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Grey: RC120 flange +140×100 upper rib.</text><text x="241" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Rib replaces100insulation;220total depth.</text><text x="241" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Red: slope-following750translation,</text><text x="241" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">then650vertical lift into cleared floor.</text><text x="241" y="188" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Dry caps and lower airlid first release</text><text x="241" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">are separate operations, not one slab.</text><text x="241" y="206" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Caps/lids above red lifts are removed.</text><text x="20" y="206" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Court piece moves WEST into court; spine EAST into pantry; outer WEST.</text><text x="20" y="231" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Both joints lie25 outside each700permanent bridge; actual bolt/tool and water/gas seals remain unqualified.</text><text x="20" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">N/E court interaction: E full-width outside release endsy7626.5; N bridge beginsy7732.5 →106clear.</text><text x="20" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">All other fixed bridges are checked. The old500piece /450lift witness is explicitly rejected for this design.</text><text x="20" y="263" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">No person enters the low box. A400×1003RC100 cap is about100kg before other layers: engineered lifting needed.</text><path d="M15 275 L405 275" fill="none" stroke="#52616a" stroke-width="0.4" /><text x="15" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">UNADOPTED COMPACT B / 1 November 2026 / HAD03 incomplete; RWT06 blocked.</text><text x="15" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#23323a">Reference design, not released for construction. Primary source and unresolved physical/material/site duties accompany the result.</text></svg>
