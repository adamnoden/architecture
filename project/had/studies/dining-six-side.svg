<text x="15" y="174" font-size="2.7" fill="#263c40">500 mm station pitch; chairs 450 wide × 520 deep.</text>
<text x="15" y="182" font-size="2.7" fill="#263c40">Zero insertion + 400 pull: no assumed tuck under the top.</text>
<text x="15" y="190" font-size="2.7" fill="#263c40">Green: 600 disc through-route, not approach to each seat.</text>
<text x="15" y="198" font-size="2.7" fill="#9b4b33">Red dashed arc: unselected inward door hits E3.</text>
<text x="222" y="39" font-size="3.3" fill="#263c40">B / the manufacturer placement dimension</text>
