<text x="222" y="123" font-size="2.7" fill="#53816e">500 pitch → 1450 span; 45 each end if centred.</text>
<text x="222" y="135" font-size="2.7" fill="#263c40">Top is 2200 long; published placement space is 1540.</text>
<text x="222" y="143" font-size="2.7" fill="#263c40">50 between adjacent envelopes is not elbow clearance.</text>
<text x="222" y="151" font-size="2.7" fill="#263c40">660 underframe − 470 seat = 190 gross; knees unknown.</text>
<text x="222" y="164" font-size="3.3" fill="#263c40">C / limits that the plan cannot close</text>
<text x="222" y="175" font-size="2.6" fill="#263c40">Zero-tuck withdrawal: 80 to sofa / 30 to old central strip.</text>
<text x="222" y="183" font-size="2.6" fill="#263c40">Separate + 50 sofa trial leaves only 30 on the west.</text>
<text x="222" y="191" font-size="2.6" fill="#263c40">South corridor 782.5; centred disc margin 91.25 each side.</text>
<text x="222" y="199" font-size="2.6" fill="#263c40">Table north end 432.5 from wall: no proved operator space.</text>
<text x="222" y="207" font-size="2.6" fill="#263c40">Extension needs catches, lifting and temporary separation.</text>
<text x="222" y="215" font-size="2.6" fill="#263c40">No actual chair-entry, occupied comfort or knee-space proof.</text>
<text x="15" y="231" font-size="2.8" fill="#263c40">Decision: reject the 600-pitch fit claim. Retain 500-pitch as an unresolved sensitivity, with both sofas and six chairs visible.</text>
<text x="15" y="241" font-size="2.7" fill="#263c40">Do not adopt a seat count, crowded arrangement, door direction or plastic-containing finish merely to obtain a geometric pass.</text>
<text x="15" y="254" font-size="2.6" fill="#263c40">Source: RH-LAYOUT-REVISION-02; ercol 4291G + 4102G drawings, inspected 31 Oct 2026. Controlled PDF identity is recorded in the note.</text>
<text x="15" y="264" font-size="2.6" fill="#263c40">Plan shows the finished extended table; conversion, moving 41 kg, window access, RWT maintenance and exterior landing remain open.</text>
<text x="15" y="278" font-size="2.9" fill="#263c40">Envelope screen only · household brief, actual assembly/material admission and HAD-03 completion remain unresolved.</text>
