<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900"><rect width="1250" height="900" fill="#f8f6ef"/><g font-family="sans-serif" fill="#252b2e"><text x="35" y="32" font-size="22">ONE PATH UNAVAILABLE + RAIN · project temporary-weather reference</text><rect x="78.75" y="78.75" width="192.5" height="192.5" fill="#77a8c0" opacity="0.4" stroke="#333"/><rect x="109" y="271.25" width="132" height="319" fill="#add2dc" opacity="0.4" stroke="#333"/><rect x="95.25" y="98" width="68.75" height="93.5" fill="#ba9a6c" opacity="0.4" stroke="#333"/><rect x="80.125" y="80.125" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="253.375" y="80.125" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="80.125" y="173.625" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="253.375" y="173.625" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="223.125" y="322.125" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="223.125" y="404.625" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="223.125" y="484.375" width="13.75" height="13.75" fill="#555" opacity="0.8" stroke="#333"/><rect x="176.375" y="186" width="92.125" height="88" fill="#b8a2c8" opacity="0.4" stroke="#333"/><text x="70" y="640" font-size="16">N work: full court catch roof to E shaft; loggia roof drains separately to N/W.</text><text x="70" y="665" font-size="16">E work: enclosed well roof, gutter to intact N; no bare socket storage credit.</text><text x="600" y="115" font-size="20">Sections / operating limits</text><text x="600" y="160" font-size="15">Court roof underside2200; bails max1100; people1800.</text><text x="600" y="191" font-size="15">Court gutter2250 → drop2060 → pipe2050 → E outlet150.</text><text x="600" y="222" font-size="15">125ID /128OD pipe crown2176.5:23.5 below roof.</text><text x="600" y="253" font-size="15">Loggia pipe axis6800 clears east posts; outlet−600,</text><text x="600" y="284" font-size="15">separate receiver max−800 gives200 free drop.</text><text x="600" y="315" font-size="15">E roof skirts / well-side bunds / covered two-flap entry</text><text x="600" y="346" font-size="15">are CLOSED before any E hood/body is released.</text><text x="600" y="377" font-size="15">N roof is erected/tested before N covers are opened.</text><text x="600" y="408" font-size="15">Threshold bypass transfers primary tray to E secondary.</text><text x="600" y="439" font-size="15">Steel weather planes≈308kg; complete apparatus≈1tonne.</text><text x="600" y="470" font-size="15">No one-person rail erection; no unrestrained overhead load.</text><text x="600" y="501" font-size="15">Wind/anchors/erection/weather/loss/splash remain unqualified.</text><text x="35" y="750" font-size="16">Blue: N-work temporary roofs. Purple: E-work roof (alternative state). Brown: separate cover/module storage.</text><text x="35" y="780" font-size="16">These roofs are never credited as free permanent architecture; actual equipment/support/weather admission is mandatory.</text></g></svg>
