<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-label="COMPACT B / FULL DEPTH AND FIRST-HARM BOUNDARY"><rect width="420" height="297" fill="#fffdf8"/><text x="15" y="17" font-family="DejaVu Sans,Arial,sans-serif" font-size="5" font-weight="bold" fill="#23323a">COMPACT B / FULL DEPTH AND FIRST-HARM BOUNDARY</text><text x="15" y="26" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">D1300 sole constructive trial / independent carrier and containment / no material or water acceptance</text><path d="M15 32 L405 32" fill="none" stroke="#52616a" stroke-width="0.4" /><text x="20" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.6" font-weight="bold" fill="#23323a">03 / TRANSVERSE JOINED SECTION · 1:10</text><rect x="24.85" y="113.8" width="100.3" height="20.15" fill="#bfc6be" stroke="#52616a" stroke-width="0.3"/><rect x="24.85" y="78" width="10" height="35.8" fill="#bfc6be" stroke="#52616a" stroke-width="0.3"/><rect x="115.15" y="78" width="10" height="35.8" fill="#bfc6be" stroke="#52616a" stroke-width="0.3"/><rect x="34.85" y="78" width="10" height="35.8" fill="#e4d3ac" stroke="#52616a" stroke-width="0.3"/><rect x="105.15" y="78" width="10" height="35.8" fill="#e4d3ac" stroke="#52616a" stroke-width="0.3"/><rect x="34.85" y="113.95" width="80.3" height="10" fill="#e4d3ac" stroke="#52616a" stroke-width="0.3"/><polyline points="45,81 45,113.8 105,113.8 105,81" fill="none" stroke="#2d8490" stroke-width="0.7"/><rect x="42" y="81" width="66" height="0.6" fill="#6b8790" stroke="#52616a" stroke-width="0.3"/><rect x="42" y="81.6" width="66" height="0.2" fill="#b78658" stroke="#52616a" stroke-width="0.3"/><rect x="24.85" y="50" width="100.3" height="1.5" fill="#c1b79c" stroke="#52616a" stroke-width="0.3"/><rect x="24.85" y="51.5" width="100.3" height="6.5" fill="#e1dbca" stroke="#52616a" stroke-width="0.3"/><rect x="24.85" y="58" width="100.3" height="10" fill="#e4d3ac" stroke="#52616a" stroke-width="0.3"/><rect x="24.85" y="68" width="100.3" height="10" fill="#bfc6be" stroke="#52616a" stroke-width="0.3"/><rect x="65" y="87.8" width="20" height="16" fill="#78a6a1" stroke="#52616a" stroke-width="0.3"/><path d="M10 180 L140 180" fill="none" stroke="#8b7355" stroke-width="0.6" /><path d="M10 150 L140 150" fill="none" stroke="#ba7654" stroke-width="0.5" stroke-dasharray="2 1"/><text x="20" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">Soil−1300;300rise→−1000;50loss→−950. Box underside−839.5.</text><text x="20" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">460.5 raw clear →110.5 after300H+50loss →60.5 beyond50 reserve.</text><text x="180" y="49" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">All z relative proposed whole-house FFL0.</text><text x="180" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">15stone +65distribution +100foam +100RCcap =280.</text><text x="180" y="65" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Separate lid:SS6+Cuseal2 below RC, top−310 / bottom−318.</text><text x="180" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">SS1.5 secondary tray stays while carrier is removed.</text><text x="180" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Tray600clear +2×(1.5liner+100foam+100RC) =1003.</text><text x="180" y="89" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">RC cap/support design and thermal bridges belong to STR/MAT.</text><text x="180" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Carrier outside200×160; crown−378; inlet invert−538.</text><text x="180" y="105" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Separate tray inside bottom−638; lowest primary outlet−580.5.</text><text x="180" y="113" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Independent containment outlet and joined floor gas seals</text><text x="180" y="121" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">remain subject to the material result; no hydraulic pass.</text><text x="180" y="129" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">D1300 is derived from839.5depth+300H+50loss+50reserve,</text><text x="180" y="137" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">rounded up60.5. Actual soil/heave/receiver evidence can fail it.</text><text x="20" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.6" font-weight="bold" fill="#23323a">04 / DOOR AND FIRST-HARM GEOGRAPHY</text><text x="20" y="221" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">North door x4800–7200, centre6000; water axis6600. Support survives every carrier release.</text><text x="20" y="230" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Open near-level door: walking plane0 is a water entry route; closed-doorset lowest joint UNKNOWN.</text><text x="20" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Stormguard confirms drain/fixing holes; its weather claim supplies no installed flood datum.</text><text x="20" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Separate lid at−310..−318 is a potential escape joint if secondary containment fills.</text><text x="20" y="257" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#23323a">Actual lowest threshold/end/weep joint and complete tray/lid penetration integrity remain unaccepted.</text><text x="20" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="bold" fill="#9f4534">Inherited100/300rise fails: final outlet−580.5 is130.5 below its synthetic−450 receiver.</text><path d="M15 275 L405 275" fill="none" stroke="#52616a" stroke-width="0.4" /><text x="15" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#23323a">UNADOPTED COMPACT B / 1 November 2026 / HAD03 incomplete; RWT06 blocked.</text><text x="15" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#23323a">Reference design, not released for construction. Primary source and unresolved physical/material/site duties accompany the result.</text></svg>
