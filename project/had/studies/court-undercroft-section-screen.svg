<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Dry-access undercroft: 150 mm current floor-to-grade versus a raised-house trial</title>
  <desc id="desc">Comparison of two authored vertical sections. At present FFL zero and exterior grade minus 150, a hypothetical 300 mm floor has soffit minus 300, below the drawn exterior ground. For a 900 mm usable dry space with the same floor and fixed outside grade, the floor must rise 1050 mm before freeboard.</desc>
  <style>
    .bg{fill:#fbfaf7}.floor{fill:#a9a8a3;stroke:#232323;stroke-width:2}.void{fill:#e8e8e4;stroke:#878781;stroke-width:1;stroke-dasharray:7 5}
    .ground{stroke:#444;stroke-width:2;stroke-dasharray:10 6}.guide{stroke:#8a8a83;stroke-width:1.5;stroke-dasharray:4 5}.dim{stroke:#111;stroke-width:1.8;fill:none}
    .title{font:600 24px Georgia,serif;fill:#151515}.sub{font:15px Georgia,serif;fill:#3b3b39}.head{font:600 20px Georgia,serif;fill:#1d1d1d}.txt{font:15px Arial,sans-serif;fill:#1b1b1b}.small{font:13px Arial,sans-serif;fill:#3b3b3b}.mark{font:700 17px Arial,sans-serif;fill:#111}
  </style>
  <rect class="bg" width="1180" height="650"/>
  <text id="heading" class="title" x="48" y="47">The undercroft is an architectural section, not a deeper pipe</text>
  <text class="sub" x="48" y="75">Vertical sensitivity only · no selected site, slab, foundation, water line or access specification</text>
  <line x1="590" y1="105" x2="590" y2="558" stroke="#bbb" stroke-width="1"/>
  <text class="head" x="48" y="125">A · Current drawn separation</text>
  <text class="small" x="48" y="152">Finished floor z = 0; outside grade z = −150</text>
  <text class="head" x="637" y="125">B · Raised building hypothesis</text>
  <text class="small" x="637" y="152">Same fixed outside grade; +1,050 mm floor shift</text>
  <line class="guide" x1="92" y1="450" x2="1090" y2="450"/>
  <rect class="floor" x="124" y="450" width="341" height="60"/>
  <text class="mark" x="134" y="436">FFL 0</text>
  <text class="txt" x="280" y="483">T = 300 mm</text>
  <line class="ground" x1="80" y1="480" x2="515" y2="480"/>
  <text class="txt" x="126" y="537">Soffit −300</text>
  <text class="small" x="126" y="561">Below outside grade by 150 mm</text>
  <line class="dim" x1="88" y1="450" x2="88" y2="480"/>
  <path class="dim" d="M83 456L88 450L93 456 M83 474L88 480L93 474"/>
  <text class="small" x="48" y="422">150 mm</text>
  <text class="txt" x="124" y="590">The drawn grade intersects the floor package.</text>
  <rect class="void" x="711" y="300" width="330" height="180"/>
  <rect class="floor" x="711" y="240" width="330" height="60"/>
  <text class="mark" x="711" y="223">FFL +1,050</text>
  <text class="txt" x="811" y="275">T = 300 mm</text>
  <text class="txt" x="721" y="322">Soffit +750</text>
  <text class="mark" x="802" y="391">H = 900 mm</text>
  <text class="small" x="790" y="414">clear-access sensitivity</text>
  <line class="ground" x1="667" y1="480" x2="1095" y2="480"/>
  <text class="txt" x="710" y="506">Outside grade −150</text>
  <line class="dim" x1="1068" y1="240" x2="1068" y2="450"/>
  <path class="dim" d="M1062 247L1068 240L1074 247 M1062 443L1068 450L1074 443"/>
  <text class="txt" x="1084" y="349" transform="rotate(90 1084 349)" text-anchor="middle">+1,050 mm</text>
  <line class="dim" x1="686" y1="300" x2="686" y2="480"/>
  <path class="dim" d="M680 307L686 300L692 307 M680 473L686 480L692 473"/>
  <text class="small" x="701" y="541">No spare flood/movement/repair allowance included.</text>
  <line x1="48" y1="608" x2="1132" y2="608" stroke="#aaa"/>
  <text class="small" x="48" y="629">Drawn D = 150 mm. With authored T = 300 mm and H = 900 mm, D ≥ 1,200 mm + F; shortfall ≥ 1,050 mm + F.</text>
</svg>
