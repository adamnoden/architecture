<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080"><rect width="1400" height="1080" fill="#fbfaf5"/><text x="30" y="35" font-family="Arial" font-size="17">N-UNAVAILABLE GARDEN STATE · ONE SOURCE-DRAWN WEST BYPASS / NOT SITE OR ACCESS APPROVAL</text><rect x="175" y="350" width="300" height="300" fill="#dedbd2"/><rect x="155" y="225" width="120" height="112.5" fill="#c4d5a8"/><rect x="295" y="287.5" width="60" height="62.5" fill="#a2ccdf"/><rect x="110" y="297.5" width="105" height="30" fill="#8cbda0"/><rect x="110" y="297.5" width="30" height="512.5" fill="#8cbda0"/><rect x="110" y="780" width="80" height="30" fill="#8cbda0"/><rect x="310" y="680" width="30" height="225" fill="#ba9d70"/><rect x="272.5" y="680" width="30" height="225" fill="#ba9d70"/><rect x="235" y="680" width="30" height="225" fill="#ba9d70"/><rect x="197.5" y="680" width="30" height="225" fill="#ba9d70"/><rect x="160" y="680" width="30" height="100" fill="#ba9d70"/><rect x="310" y="650" width="30" height="30" fill="#dec9a4"/><rect x="272.5" y="905" width="67.5" height="30" fill="#dec9a4"/><rect x="235" y="650" width="67.5" height="30" fill="#dec9a4"/><rect x="197.5" y="905" width="67.5" height="30" fill="#dec9a4"/><rect x="160" y="650" width="67.5" height="30" fill="#dec9a4"/><rect x="160" y="780" width="30" height="30" fill="#dec9a4"/><polyline points="200,312.5 125,312.5 125,795 175,795" stroke="#254e42" stroke-width="2" fill="none"/><polyline points="325,650 325,665 325,680 325,905 325,920 287.5,920 287.5,905 287.5,680 287.5,665 250,665 250,680 250,905 250,920 212.5,920 212.5,905 212.5,680 212.5,665 175,665 175,680 175,780 175,795" stroke="#254e42" stroke-width="2" fill="none"/><text x="200" y="462.5" font-family="Arial" font-size="13">HOUSE 12×12m</text><text x="90" y="500" font-family="Arial" font-size="13">WEST</text><text x="187.5" y="262.5" font-family="Arial" font-size="13">Usable garden</text><text x="285" y="272.5" font-family="Arial" font-size="13">N water zone</text><text x="690" y="140" font-family="Arial" font-size="13">One exterior grade -2000; front exit0. No low-loggia escape credited.</text><text x="690" y="180" font-family="Arial" font-size="13">1200 clear route /600 actor;1500 flight centres leave300 between clear lanes.</text><text x="690" y="220" font-family="Arial" font-size="13">Folded front flights retain1:20 and≤9000 runs;1200 long turn/terminal landings.</text><text x="690" y="260" font-family="Arial" font-size="13">Turning landings2700 wide;100 outside guard territory /1100 guard height.</text><text x="690" y="300" font-family="Arial" font-size="13">Actual ground bypass 24.30m; folded front 52.65m.</text><text x="690" y="340" font-family="Arial" font-size="13">Total garden-to-front reference 76.95m: a real convenience/site cost.</text><text x="690" y="380" font-family="Arial" font-size="13">N receiver is east of usable garden; E module/hoist work is east of house.</text><text x="690" y="420" font-family="Arial" font-size="13">No person crosses either water/maintenance territory on this route.</text><text x="690" y="460" font-family="Arial" font-size="13">West roof/surface drainage, whole plot fit, ground/supports and actual weather</text><text x="690" y="485" font-family="Arial" font-size="13">must be qualified. Keep this route free of parked vehicles/stored components.</text><text x="690" y="540" font-family="Arial" font-size="13">Ordinary operator geometry only: wheelchair/assisted escape/regulatory</text><text x="690" y="565" font-family="Arial" font-size="13">classification, guarding capacity, lighting/slip and physical acceptance remain open.</text><text x="30" y="1030" font-family="Arial" font-size="13">The declared garden is at exterior grade. The north garden/loggia approach is closed while N is unavailable; front access remains independently connected.</text></svg>
