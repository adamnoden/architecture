<text x="218" y="146" font-size="2.6" fill="#263c40">4 side places; table +200 east / −150 south</text>
<text x="218" y="153" font-size="2.45" fill="#263c40">Blue: seated envelope. Dashed: +400 mm translation.</text>
<text x="218" y="160" font-size="2.4" fill="#263c40">Door arcs: prior inward comparison, not selected operation.</text>
<text x="15" y="174" font-size="3.6" fill="#263c40">What the comparison changes</text>
<text x="15" y="184" font-size="2.55" fill="#263c40">Chair: ercol 1875, 490 wide × 600 deep; overall rectangle only.</text>
<text x="15" y="191" font-size="2.55" fill="#263c40">100 under-table projection is an unproved positioning trial.</text>
<text x="15" y="198" font-size="2.55" fill="#263c40">500 seated projection + 400 travel = 900; old 600 field is short 300.</text>
<text x="15" y="205" font-size="2.55" fill="#263c40">A: west/south envelope flags remain with either door direction.</text>
<text x="15" y="212" font-size="2.55" fill="#263c40">A: E2 also enters the hypothetical inward leaf sweep.</text>
<text x="15" y="219" font-size="2.55" fill="#263c40">B: west sofa gap 100; a separate +50 sofa trial leaves 50.</text>
<text x="15" y="226" font-size="2.55" fill="#263c40">B: east to 1000 route 200; north to inward sweep 187.5.</text>
<text x="218" y="184" font-size="2.45" fill="#263c40">Six end/side places are not retained by the four-place result.</text>
<text x="218" y="191" font-size="2.45" fill="#263c40">Adding a pulled south end chair to B enters the corner 217.5.</text>
<text x="218" y="198" font-size="2.45" fill="#263c40">Six-place axial envelope with 100 insertion consumes 3400 of 3415.</text>
<text x="218" y="205" font-size="2.45" fill="#263c40">The 15 remainder proves no usable human clearance.</text>
<text x="218" y="212" font-size="2.45" fill="#263c40">Nominal paired-leaf tip gaps: 30° 322 / 45° 703 / 60° 1200.</text>
<text x="218" y="219" font-size="2.45" fill="#263c40">The source door symbol opens outward; exterior use is unresolved.</text>
<text x="218" y="226" font-size="2.45" fill="#263c40">B green path: authored 600 disc; smallest model margin 32.5.</text>
<text x="15" y="244" font-size="2.8" fill="#263c40">Next: confirm required seats; compare actual chair/table/apron, occupied use, access and selected opening in one room.</text>
<text x="15" y="253" font-size="2.65" fill="#263c40">No material admission: ash/wedges do not disclose lacquer, paint, glue, glides or pads. No furniture or door purchase is implied.</text>
<text x="15" y="262" font-size="2.6" fill="#263c40">North court leaves must remain into court. Occupied use, open RWT floor panels and maintenance staging are different, unproved states.</text>
<text x="15" y="273" font-size="2.65" fill="#263c40">Envelope overlap flags prevent admission from this model; they are not measured solid collisions or a regulatory/ergonomic verdict.</text>
<text x="15" y="284" font-size="2.6" fill="#263c40">Source: RH-LAYOUT-REVISION-02 + HAD furnished study; manufacturer fact sheet inspected 30 Oct 2026. HAD-03 remains planned.</text>
