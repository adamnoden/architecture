667 5.066666666666667 0 0 1 326.4 67.1544741758111L326.4 84.4Z" fill="#dce5df"/><path d="M265.2 127L265.2 104.5 A21.25333333333333 21.25333333333333 0 0 1 294.8 104.5L294.8 127Z" fill="#e8e2d4"/><path d="M268 127L268 105.73457764279107 A18.45333333333333 18.45333333333333 0 0 1 292 105.73457764279107L292 127Z" fill="#445f5d"/><rect x="268.915566470646" y="104.75" width="22.168867058707953" height="0.5" fill="#aab8b5" stroke="none" stroke-width=".25"/><text x="220" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">NORTH / lowered wide insulated loggia arch</text><text x="18" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" font-weight="normal" fill="#293a40">Roofdatum7100/ridge8090.9;200overhang actualedge7006.74. Grade−1300→8400datum/9390.9ridge.</text><text x="18" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" font-weight="normal" fill="#293a40">Warm masonry +pale openings +dark ring roof retained; north material/arch and pairedwindow order are actual rewinds.</text><text x="18" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.5" font-weight="bold" fill="#293a40">FINITE PLOT / APPROACH RESERVATIONS / 1:200</text><text x="20" y="196" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">FRONT:26m sloping +4.8m landings =30.8m straight reservation</text><rect x="20" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="26" y="200" width="45" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="71" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="77" y="200" width="45" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="122" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="128" y="200" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="168" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><text x="210" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">Rise1300; sloping26m +4×1.2m landings.</text><text x="20" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">GARDEN:22.95m sloping +4.8m landings =27.75m</text><rect x="20" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="26" y="224" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="66" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="72" y="224" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="112" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="118" y="224" width="34.75" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="152.75" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><text x="210" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">Rise1147.5; sloping22.95m +4×1.2m landings.</text><text x="18" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">1200 clearwidth authored; actual approachcategory, turning/handrails/guards/site availability NOT established.</text><text x="18" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">No height saving versus D1300 indoor-box benchmark. Benefit is removal of heavy indoor caps/gas lids; room/circulation price remains.</text><text x="18" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">The elevated garden terrace requires real support/guarded spill edges. It is not ground level and does not evade fire-height measurement.</text><path d="M15 277L405 277" stroke="#687777" stroke-width="0.5" fill="none"/><text x="15" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#293a40">Selected HAD spatial development. Site, structural, thermal, fire, material and hydraulic admission remains with named owners.</text></svg>
