y="96.5" width="18" height="28.5" fill="#e6ded0" stroke="#eee8db" stroke-width=".25"/><rect x="75" y="103" width="14" height="22" fill="#48534c" stroke="#eee8db" stroke-width=".25"/><text x="22" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">SOUTH / retained five-axis principal front</text><rect x="220" y="57" width="120" height="68" fill="#c7aa89" stroke="#617069" stroke-width=".25"/><rect x="220" y="125" width="120" height="13" fill="#aa9175" stroke="#617069" stroke-width=".25"/><path d="M220 57L241.25 47.09096226420628L318.75 47.09096226420628L340 57Z" fill="#3d4b4a" stroke="#273c3d" stroke-width=".4"/><path d="M215 138L345 138" stroke="#91684d" stroke-width="0.6" fill="none"/><rect x="233" y="96.5" width="10" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="253.5" y="96.5" width="7" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="299.5" y="96.5" width="7" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="317" y="96.5" width="10" height="18" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="233" y="62" width="10" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="253.5" y="62" width="7" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="299.5" y="62" width="7" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><rect x="317" y="62" width="10" height="21" fill="#dce5df" stroke="#f4eadb" stroke-width=".25"/><path d="M265.2 125L265.2 102.5 A21.25333333333333 21.25333333333333 0 0 1 294.8 102.5L294.8 125Z" fill="#e8e2d4"/><path d="M268 125L268 103.73457764279107 A18.45333333333333 18.45333333333333 0 0 1 292 103.73457764279107L292 125Z" fill="#445f5d"/><text x="220" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">NORTH / lowered wide insulated loggia arch</text><text x="18" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" font-weight="normal" fill="#293a40">Roof geometry:6800eaves/7790.9ridge. With authoredground−1300:8100/9090.9 abovegrade.</text><text x="18" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" font-weight="normal" fill="#293a40">Warm masonry +pale openings +dark ring roof retained; north material/arch and pairedwindow order are actual rewinds.</text><text x="18" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.5" font-weight="bold" fill="#293a40">FINITE PLOT / APPROACH RESERVATIONS / 1:200</text><text x="20" y="196" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">FRONT:26m sloping +4.8m landings =30.8m straight reservation</text><rect x="20" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="26" y="200" width="45" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="71" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="77" y="200" width="45" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="122" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="128" y="200" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="168" y="200" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><text x="210" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">Rise1300; sloping26m +4×1.2m landings.</text><text x="20" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">GARDEN:22.95m sloping +4.8m landings =27.75m</text><rect x="20" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="26" y="224" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="66" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="72" y="224" width="40" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="112" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><rect x="118" y="224" width="34.75" height="7" fill="#c2d5cd" stroke="#617069" stroke-width=".25"/><rect x="152.75" y="224" width="6" height="7" fill="#e4d4b2" stroke="#617069" stroke-width=".25"/><text x="210" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">Rise1147.5; sloping22.95m +4×1.2m landings.</text><text x="18" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">1200 clearwidth authored; actual approachcategory, turning/handrails/guards/site availability NOT established.</text><text x="18" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">No height saving versus D1300 indoor-box benchmark. Benefit is removal of heavy indoor caps/gas lids; room/circulation price remains.</text><text x="18" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#293a40">The elevated garden terrace requires real support/guarded spill edges. It is not ground level and does not evade fire-height measurement.</text><path d="M15 277L405 277" stroke="#687777" stroke-width="0.5" fill="none"/><text x="15" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#293a40">Authored unadopted design. Site, structural, thermal, fire, material and hydraulic admission remains bounded by named interfaces.</text></svg>
