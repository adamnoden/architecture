<text x="710" y="529" font-size="15" font-weight="400">Sloped upper baffle leads into the impact cell.</text>
<text x="710" y="569" font-size="15" font-weight="400">Eight low ports feed a quieter outlet cell.</text>
<text x="710" y="596" font-size="15" font-weight="400">460 × 40 bottom opening, invert −797.65.</text>
<text x="710" y="637" font-size="15" font-weight="400">2 cm freeboard is reserved in the 100 mm body.</text>
<text x="710" y="665" font-size="15" font-weight="400">The complete low shoe releases before the draw.</text>
<text x="34" y="736" font-size="14" font-weight="400">Levels shown for the 4.43895 L/s maintenance comparison. Upstream water and real transfer depend on losses, tailwater and obstruction.</text></g></svg>
