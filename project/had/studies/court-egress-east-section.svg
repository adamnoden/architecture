ommon high tailwater and first-harm joint remain unproved.</text><path d="M15 274 H405" stroke="#aeb5b3" stroke-width=".3"/><text x="15" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.6" font-weight="normal" fill="#263138">RH-LAYOUT-REVISION-02 · HAD-03 / RWT-06 · 1 November 2026 · exploratory geometry only</text><text x="15" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.55" font-weight="normal" fill="#263138">Not a construction drawing. Invert, flood level, first-harm joint, supports, material assembly and lawful outlet remain UNDEFINED.</text></svg>