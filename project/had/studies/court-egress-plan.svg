troke-width="0" /><path d="M140 97 L140 87" fill="none" stroke="#3d768e" stroke-width="1.2" /><text x="69.5" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.5" font-weight="bold" fill="#263138">OPEN COURT</text><text x="39" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="normal" fill="#263138">FAMILY / DINING</text><text x="117.6" y="91.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#263138">PANTRY</text><text x="119.6" y="119" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#263138">PLANT</text><text x="103.8" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.5" font-weight="normal" fill="#263138">GALLERY</text><polyline points="80,90 80,40" fill="none" stroke="#146b72" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 1.5"/><polyline points="97,96 146,96" fill="none" stroke="#aa5d38" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 1.5"/><rect x="78.3" y="88.3" width="3.4" height="3.4" fill="#146b72" stroke="white" stroke-width="0.6" /><rect x="95.3" y="94.3" width="3.4" height="3.4" fill="#aa5d38" stroke="white" stroke-width="0.6" /><text x="81" y="75" font-family="DejaVu Sans,Arial,sans-serif" font-size="4" font-weight="bold" fill="#146b72">N</text><text x="106" y="94.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="4" font-weight="bold" fill="#aa5d38">E</text><path d="M80 46 L80 40" fill="none" stroke="#146b72" stroke-width="1.1" /><path d="M140 96 L146 96" fill="none" stroke="#aa5d38" stroke-width="1.1" /><text x="20" y="180" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="bold" fill="#146b72">N / x=6000 passes below the north court and garden doors</text><text x="20" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" font-weight="bold" fill="#aa5d38">E / y=7000 passes beneath the court and outer east window bays</text><text x="20" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#263138">Neither line is an approved structural opening, joint or gravity outfall.</text><text x="20" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#263138">North line cuts the family/dining slab across a 4.25 m gross ring.</text><text x="20" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#263138">East line cuts the east gallery, 125 mm spine and pantry.</text><text x="20" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.65" font-weight="normal" fill="#263138">Two destinations shown schematically: true independence is unproven.</text><path d="M110 166 L140 166" fill="none" stroke="#263138" stroke-width="0.65" /><text x="117" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.6" font-weight="normal" fill="#263138">3 m</text><text x="166" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.1" font-weight="bold" fill="#263138">GEOMETRY THAT CAN BE STATED</text><text x="166" y="56.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">House 12.0 × 12.0 m; exposed court 3.5 × 3.5 m.</text><text x="166" y="64.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">North route: court edge to garden face = 4,250 mm.</text><text x="166" y="72.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">East route: court edge to outer face = 4,250 mm.</text><text x="166" y="80.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">The east passage crosses the 1,270 mm clear gallery,</text><text x="166" y="89" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">a nominal 125 mm partition and the 2,020 mm</text><text x="166" y="97.19999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">clear pantry before reaching the outer weather wall.</text><text x="166" y="105.39999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">Existing door and window bays do not admit a pipe</text><text x="166" y="113.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">below the threshold or sill without support design.</text><text x="166" y="121.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138"></text><text x="166" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.1" font-weight="bold" fill="#263138">MAJOR ARCHITECTURAL CHOICE</text><text x="166" y="138.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">B · raise house/plinth for a genuine dry undercroft.</text><text x="166" y="146.39999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">D · near-floor daylight relief with no crawlable space.</text><text x="166" y="154.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">C · open north loggia takes 9.198 m² from the source</text><text x="166" y="162.79999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">family/dining rectangle even before new weather walls.</text><text x="166" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138"></text><text x="166" y="179.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">B remains conditional. D has no proven normal outfall.</text><text x="166" y="187.39999999999998" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">C is a real replan, not a drain detail.</text><text x="166" y="195.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" font-weight="normal" fill="#263138">None is a source geometry amendment or selection.</text><text x="20" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#263138">Plan paths are cross-sections to be designed: N = normal gravity; E = emergency passive escape.</text><text x="20" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" font-weight="normal" fill="#263138">The distinct N and E routes still need first-release, cleaning, renewal and independent receiving-ground proof.</text><path d="M15 274 H405" stroke="#aeb5b3" stroke-width=".3"/><text x="15" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.6" font-weight="normal" fill="#263138">RH-LAYOUT-REVISION-02 · HAD-03 / RWT-06 · 1 November 2026 · exploratory geometry only</text><text x="15" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.55" font-weight="normal" fill="#263138">Not a construction drawing. Invert, flood level, first-harm joint, supports, material assembly and lawful outlet remain UNDEFINED.</text></svg>