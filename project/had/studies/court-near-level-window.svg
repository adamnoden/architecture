<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc"><title id="title">Courtyard shallow gravity exit: relative grade sensitivity</title><desc id="desc">Five source-bound pan and crossing scenarios compared with the current 150 mm schematic difference between floor and exterior grade. Shortfalls are geometry only; actual drainage remains unproved.</desc><rect width="420" height="297" fill="#fffdf8"/><text x="15" y="18" font-size="5.2" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">HAD / Courtyard water: the near-level gravity window</text><text x="15" y="27" font-size="3" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Source-bound level screen, NOT a drain or section acceptance. Synthetic receiving water at −150 mm.</text><path d="M15 35L405 35" fill="none" stroke="#5b696c" stroke-width="0.35" /><text x="15" y="45" font-size="2.8" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Total depth budget = perimeter pan depth + 35 court fall + inlet drop + crossing fall + receiving clearance</text><text x="15" y="53" font-size="2.8" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">D required (mm above synthetic receiver); source D = 150 mm. Change in D must be relative, not shared uplift.</text><path d="M248 59L248 229" fill="none" stroke="#3c7377" stroke-width="0.8" stroke-dasharray="2 1"/><text x="231" y="61" font-size="2.9" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#24676e">D = 150</text><text x="15" y="80" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Inherited deep-pan geometry</text><path d="M146 85L357 85" fill="none" stroke="#adb5b1" stroke-width="0.3" /><rect x="146" y="76" width="198.9" height="9" fill="#b3b4b1" stroke="#5c6664" stroke-width=".25"/><text x="347.9" y="82" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">292.5 mm</text><text x="357" y="82" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#943e2f">+142.5 rise</text><text x="15" y="109.5" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">20+6+60 mm support family</text><path d="M146 114.5L357 114.5" fill="none" stroke="#adb5b1" stroke-width="0.3" /><rect x="146" y="105.5" width="135" height="9" fill="#839d9b" stroke="#5c6664" stroke-width=".25"/><text x="283.98" y="111.5" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">198.5 mm</text><text x="357" y="111.5" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#943e2f">+48.5 rise</text><text x="15" y="139" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Same pan / 0.5% crossing</text><path d="M146 144L357 144" fill="none" stroke="#adb5b1" stroke-width="0.3" /><rect x="146" y="135" width="120.5" height="9" fill="#adbfb9" stroke="#5c6664" stroke-width=".25"/><text x="269.53000000000003" y="141" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">177.25 mm</text><text x="357" y="141" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#943e2f">+27.25 rise</text><text x="15" y="168.5" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">20 mm unsupported low-support idea</text><path d="M146 173.5L357 173.5" fill="none" stroke="#adb5b1" stroke-width="0.3" /><rect x="146" y="164.5" width="107.8" height="9" fill="#adbfb9" stroke="#5c6664" stroke-width=".25"/><text x="256.78" y="170.5" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">158.5 mm</text><text x="357" y="170.5" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#943e2f">+8.5 rise</text><text x="15" y="198" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Zero-drop, zero-clearance diagnostic</text><path d="M146 203L357 203" fill="none" stroke="#adb5b1" stroke-width="0.3" /><rect x="146" y="194" width="96.7" height="9" fill="#d1d0c8" stroke="#5c6664" stroke-width=".25"/><text x="245.73000000000002" y="200" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">142.25 mm</text><text x="357" y="200" font-size="2.65" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#466d5a">-7.7 spare</text><path d="M15 239L405 239" fill="none" stroke="#5b696c" stroke-width="0.35" /><text x="15" y="248" font-size="3.1" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" fill="#263338">At 1% fall, a 20+6+60 mm pan needs 198.5 mm relative height: 48.5 mm beyond the drawn 150.</text><text x="15" y="257" font-size="2.9" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Nominal E crest at −75, 1% drop → −117.5 outside; 32.5 mm above schematic grade, no flowing-head proof.</text><text x="15" y="268" font-size="2.8" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">Every bar excludes actual collector depth, structural bridge, thermal/gas boundary, threshold first harm and high-water exposure.</text><path d="M15 276L405 276" fill="none" stroke="#abb4ae" stroke-width="0.35" /><text x="15" y="284" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">RH-LAYOUT-REVISION-02 · HAD-03 / RWT-06 · source-bound option reduction · 1 November 2026</text><text x="15" y="291" font-size="2.7" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" fill="#263338">No actual site datum, permissible discharge, physical assembly, pump, water volume or safety rating is selected.</text></svg>
