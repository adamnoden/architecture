<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><title>Boundary Service Lodge / proportional form comparison</title><desc>Authored pre-site study. Dimensions mm. All forms 1:40 at A3 100%. Not a selected or provider-approved installation.</desc><rect width="420" height="297" fill="#fffdf8"/><g font-family="Arial,sans-serif" fill="#263c40"><text x="12" y="14" font-size="5.3">Boundary Service Lodge / proportional form comparison</text><text x="12" y="22" font-size="3">Authored pre-site study. Dimensions mm. All forms 1:40 at A3 100%. Not a selected or provider-approved installation.</text><text x="12" y="34" font-size="4">A / compact front cabinet</text><text x="150" y="34" font-size="4">B / walk-in masonry lodge</text><text x="288" y="34" font-size="4">C / separate small cells</text><rect x="20" y="92.5" width="30.625" height="37.5" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="25.375" y="100" width="19.875" height="27.5" fill="#c9b49c" stroke="#536466" stroke-width="0.5"/><path d="M20,92.5L35.3125,83.65932400303386L50.625,92.5" fill="#909b9d" stroke="#536466" stroke-width="0.6"/><text x="20" y="136" font-size="2.8">1225 W / 515 D; 30-degree roof trial</text><rect x="154" y="67" width="55.75" height="60" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="170.625" y="72" width="22.5" height="52.5" fill="#c9b49c" stroke="#536466" stroke-width="0.5"/><path d="M154,67L181.875,50.90636124633918L209.75,67" fill="#909b9d" stroke="#536466" stroke-width="0.6"/><text x="154" y="133" font-size="2.8">2230 square; 30-degree roof trial</text><rect x="292" y="92.5" width="30.625" height="37.5" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="297.375" y="100" width="19.875" height="27.5" fill="#c9b49c" stroke="#536466" stroke-width="0.5"/><path d="M292,92.5L307.3125,83.65932400303386L322.625,92.5" fill="#909b9d" stroke="#536466" stroke-width="0.6"/><text x="292" y="136" font-size="2.8">Electrical cell: same as A</text><rect x="330.125" y="106.25" width="20.75" height="23.75" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="335.5" y="112.5" width="10" height="15" fill="#c9b49c" stroke="#536466" stroke-width="0.5"/><path d="M330.125,106.25L340.5,100.25999095715764L350.875,106.25" fill="#909b9d" stroke="#536466" stroke-width="0.6"/><text x="330.125" y="136" font-size="2.8"></text><text x="330.125" y="90" font-size="2.7">Data cell</text><text x="12" y="144" font-size="3.2">Electrical clear 795 W × 250 D × 1100 H</text><text x="12" y="151" font-size="3.2">445 source DNO-only + 350 customer trial</text><text x="12" y="158" font-size="3.2">No water/gas/active data in this cell.</text><text x="150" y="171" font-size="3.2">1800 square internal; 500 equipment +</text><text x="150" y="178" font-size="3.2">1300 working trial. 900 door must clear.</text><text x="288" y="144" font-size="3.2">Separate data cell: 830 W × 515 D.</text><text x="288" y="151" font-size="3.2">300 gap; 2355 total masonry-row field.</text><text x="288" y="158" font-size="3.2">Water chamber separate, not in roofed cell.</text><rect x="20" y="178" width="30.625" height="12.875" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="25.375" y="183.375" width="19.875" height="6.25" fill="white" stroke="#536466" stroke-width="0.5"/><path d="M20,190.875L50.625,190.875" fill="none" stroke="#a56a4b" stroke-width="0.5" /><rect x="20" y="190.875" width="30.625" height="25" fill="#e9f1ed" stroke="#536466" stroke-width="0.5"/><text x="22" y="205" font-size="2.4">1000 front</text><text x="12" y="263" font-size="3.2">0.631 m² masonry footprint; no internal room.</text><rect x="154" y="185" width="55.75" height="55.75" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="159.375" y="190.375" width="45" height="45" fill="white" stroke="#536466" stroke-width="0.5"/><text x="160" y="220" font-size="2.7">500 equipment</text><text x="160" y="230" font-size="2.7">1300 work</text><text x="154" y="248" font-size="2.7">Plan 1:40; 1800 internal square.</text><text x="150" y="273" font-size="3.2">4.973 m²; rain/frost control still required.</text><rect x="290" y="180" width="30.625" height="12.875" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="295.375" y="185.375" width="19.875" height="6.25" fill="white" stroke="#536466" stroke-width="0.5"/><path d="M290,192.875L320.625,192.875" fill="none" stroke="#a56a4b" stroke-width="0.5" /><rect x="328.125" y="180" width="20.75" height="12.875" fill="#ece7de" stroke="#536466" stroke-width="0.5"/><rect x="333.5" y="185.375" width="10" height="6.25" fill="white" stroke="#536466" stroke-width="0.5"/><path d="M328.125,192.875L348.875,192.875" fill="none" stroke="#a56a4b" stroke-width="0.5" /><rect x="290" y="192.875" width="58.875" height="25" fill="#e9f1ed" stroke="#536466" stroke-width="0.5"/><text x="292" y="206" font-size="2.4">1000 front clear across both.</text><text x="288" y="263" font-size="3.2">1.058 m² built; 1.213 m² row envelope.</text><text x="12" y="282" font-size="3">Recommendation: C as a pre-site arrangement; remote water isolation and separate sealed foul access. No common all-service room.</text><text x="12" y="290" font-size="2.65">215 walls / 50 door depth / 350 customer width / roof are authored. Actual equipment, roof structure, openings and material admission remain unselected.</text></g></svg>
