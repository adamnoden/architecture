<text x="15" y="171" font-size="2.9">A: shower intersects the held service lining. WC comparison includes the 155 mm carrier, not its finish.</text>
<text x="15" y="179" font-size="2.9">At 155 mm carrier depth, the cross-room remainder is 585 mm before added finishes/tolerances.</text>
<text x="15" y="190" font-size="2.9">B: front of WC to shower is 190 mm. Door operation and basin approach remain unresolved.</text>
<text x="15" y="198" font-size="2.9">The dashed box identifies an operation reservation to investigate; it is not an exact leaf sweep.</text>
<text x="15" y="212" font-size="2.9">North-wall translation reaches the next window after only 187.5 mm; useful pier margin reduces that.</text>
<text x="15" y="220" font-size="2.9">Room enlargement must coordinate the bedroom, gallery, adjacent bathroom, windows and service access.</text>
<text x="15" y="234" font-size="3.1">DECISION / neither arrangement is adopted. Retain the current source as an unfitted reservation.</text>
<text x="15" y="243" font-size="2.8">Actual wet-floor section, carrier/support, door, tap/trap and replacement routes remain required.</text>
<text x="15" y="251" font-size="2.8">600 mm front task field used in the accompanying comparison is a project test, not a statutory minimum.</text>
<text x="15" y="263" font-size="2.6">Manufacturer envelopes: Duravit D-Code 251509, 070536, 720106; 155 mm carrier comparison WD1019.</text>
<text x="15" y="271" font-size="2.6">Source register, calculations, interpretation and next design decisions: ../had-03-ensuite-fit-review.md</text>
<text x="15" y="284" font-size="2.8">Not a general impossibility proof, installed product design, accessibility assessment or construction issue.</text>
