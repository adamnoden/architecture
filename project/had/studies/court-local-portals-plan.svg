<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-label="COURT LOCAL PORTALS / ONE JOINED ROOM ALLOCATION"><rect width="420" height="297" fill="#fffdf8"/><text x="15" y="18" font-family="DejaVu Sans,Arial,sans-serif" font-size="5" fill="#233b42">COURT LOCAL PORTALS / ONE JOINED ROOM ALLOCATION</text><text x="15" y="27" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#233b42">UNADOPTED reference design · accepted source intersections, authored section and room reservations</text><path d="M15 33L405 33" stroke="#506569" stroke-width=".6" fill="none"/><rect x="20" y="49" width="120" height="120" fill="#cbd0cb" stroke="#506569" stroke-width=".35"/><rect x="24.175" y="53.175" width="111.65" height="111.65" fill="#f1ecdf" stroke="#506569" stroke-width=".35"/><rect x="58.325" y="87.325" width="43.35" height="43.35" fill="#cbd0cb" stroke="#506569" stroke-width=".35"/><rect x="62.5" y="91.5" width="35" height="35" fill="#d7ebe7" stroke="#506569" stroke-width=".35"/><rect x="114.375" y="87.95" width="1.25" height="81.05" fill="#b9c1bc" stroke="#506569" stroke-width=".35"/><rect x="77" y="49" width="6" height="42.5" fill="#5a9894" stroke="#506569" stroke-width=".35"/><path d="M77 91.5L83 91.5" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 87.325L83 87.325" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 82.44642857142857L83 82.44642857142857" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 77.56785714285714L83 77.56785714285714" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 72.68928571428573L83 72.68928571428573" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 67.8107142857143L83 67.8107142857143" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 62.932142857142864L83 62.932142857142864" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 58.05357142857143L83 58.05357142857143" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 53.175L83 53.175" stroke="#506569" stroke-width=".6" fill="none"/><path d="M77 49L83 49" stroke="#506569" stroke-width=".6" fill="none"/><rect x="97.5" y="94.75" width="42.5" height="6" fill="#b78254" stroke="#506569" stroke-width=".35"/><path d="M97.5 100.75L97.5 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M101.675 100.75L101.675 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M105.90833333333335 100.75L105.90833333333335 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M110.14166666666667 100.75L110.14166666666667 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M114.375 100.75L114.375 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M115.625 100.75L115.625 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M119.665 100.75L119.665 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M123.705 100.75L123.705 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M127.745 100.75L127.745 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M131.785 100.75L131.785 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M135.825 100.75L135.825 94.75" stroke="#506569" stroke-width=".6" fill="none"/><path d="M140 100.75L140 94.75" stroke="#506569" stroke-width=".6" fill="none"/><text x="25" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.5" fill="#233b42">FAMILY</text><text x="119" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.3" fill="#233b42">PANTRY</text><text x="118" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.4" fill="#233b42">PLANT</text><text x="102" y="112" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.2" fill="#233b42">GALLERY</text><text x="68" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="4" fill="#233b42">N</text><text x="104" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="3" fill="#233b42">E-W1</text><text x="165" y="47" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#233b42">Plan 1:100 at A3. All covers lift from the occupied side.</text><text x="165" y="58" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">N: x5700–6300 through both door thresholds and family floor.</text><text x="165" y="67.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">E: y6825–7425 via east gallery, service spine and pantry.</text><text x="165" y="77.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">No fixed pantry cabinets or appliance bases in the E strip.</text><text x="165" y="87.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Pantry residual y-strips: 175 mm south / 680 mm north.</text><text x="165" y="97.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">These are not both usable storage depths: E corridor is floor.</text><text x="165" y="107" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">E cover crosses window projection edges by 75 mm.</text><text x="165" y="116.80000000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Therefore a separately engineered window-base bridge is mandatory.</text><text x="165" y="126.60000000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Four bedrooms, 12 m shell and room partitions stay as source.</text><text x="165" y="136.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Candidate raises all building levels 300 mm relative to fixed grade.</text><text x="165" y="146.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Front/rear step-free approach needs a real site: 6 m at 1:20</text><text x="165" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">before landings is arithmetic; no site length is claimed.</text><text x="165" y="165.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42"></text><text x="165" y="175.60000000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">E-P at y6000: 600 mm access strip overlaps fixed plant 600 mm.</text><text x="165" y="185.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Do not substitute a 300 mm wet piece for full repair width.</text><text x="165" y="195.20000000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">No plant reallocation has been earned; retain it as rejected drop-in.</text><text x="165" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42"></text><text x="165" y="214.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Covers &lt;=500 mm long; walls/spine have independent bridge caps.</text><text x="165" y="224.60000000000002" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Room covers may carry routine traffic only after load proof.</text><text x="165" y="234.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.85" fill="#233b42">Door/window support must survive every carrier-removal state.</text><text x="20" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="3" fill="#233b42">First release from above; every carrier segment &lt;=500 mm.</text><text x="20" y="200" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#233b42">Nominal carrier joint width 300 inside 600 access strip.</text><text x="20" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.6" fill="#233b42">150 mm each side is reserved tool space, not verified ergonomics.</text><text x="20" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" fill="#233b42">N and E remain distinct until exterior receivers: no shared sump.</text><text x="20" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" fill="#233b42">Opposite destinations do not establish event independence.</text><text x="20" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.7" fill="#233b42">Furniture and safe temporary rain routing govern repair states.</text><path d="M15 275L405 275" stroke="#506569" stroke-width=".6" fill="none"/><text x="15" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#233b42">No structural sizing, complete material assembly, site datum, hydraulic capacity or first-harm acceptance.</text><text x="15" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#233b42">HAD-03 remains planned · RWT-06 remains blocked · RH-LAYOUT-REVISION-02 · 1 November 2026</text></svg>
