<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="40" y="40" font-size="25">One copper isolation cabinet · whole-arrangement challenger</text><text x="40" y="69" font-size="14">Source-bound study; not selected, certified or released for construction.</text><rect x="70" y="124.79999999999995" width="229.50000000000003" height="475.20000000000005" fill="none" stroke="black" stroke-width="2"/><path d="M184.075 600V124.79999999999995" stroke="black"/><path d="M121.30000000000001 573V97.79999999999995" stroke="#333" stroke-width="4"/><rect x="113.74000000000001" y="327.3675" width="15.120000000000001" height="26.865000000000002" fill="white" stroke="black"/><text x="101.30000000000001" y="588" font-size="12">utility</text><path d="M246.85000000000002 573V97.79999999999995" stroke="#333" stroke-width="4"/><rect x="239.29000000000002" y="327.3675" width="15.120000000000001" height="26.865000000000002" fill="white" stroke="black"/><text x="226.85000000000002" y="588" font-size="12">plant</text><text x="450" y="145" font-size="18">850 wide × 250.5 deep · top Z1900</text><text x="450" y="180" font-size="15">Two independent wet compartments; no sliding top gland.</text><text x="450" y="215" font-size="15">28mm copper + matching Conex metal-sealing joints.</text><text x="450" y="250" font-size="15">Steel 130.729816kg · declared full gross bound 237.352871kg</text><text x="450" y="285" font-size="15">Nominal bounding-window loss 0.978m².</text><text x="450" y="340" font-size="15">Known valve PTFE/EPDM has no owner exception.</text><text x="450" y="375" font-size="15">Actual floor seat, wall/pipe restraints, bulkhead seals,</text><text x="450" y="400" font-size="15">pan/outlet joints, flow and whole movement remain open.</text><text x="40" y="667" font-size="14">The generous cabinet buys service space by spending window area; the owner judges that trade.</text><text x="40" y="699" font-size="12">Nominal plan and conditional service/structure host remain distinct. Diagram does not adopt either.</text><text x="40" y="730" font-size="10">Source 449c2028afa6b230f9bd75e7711820f7ea5bb91817f981866c8a79063405a3d1</text></g></svg>
