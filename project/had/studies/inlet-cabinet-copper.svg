<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="40" y="40" font-size="25">Copper inlet cabinet · rejected whole arrangement</text><text x="40" y="69" font-size="14">Owner review: retain the evidence; stop local refinement of this tall cabinet.</text><rect x="121" y="139.29999999999995" width="170" height="357" fill="#edf5f8" stroke="#29728a" stroke-dasharray="none"/><rect x="70" y="139.29999999999995" width="170" height="357" fill="none" stroke="#8b5e24" stroke-dasharray="7 4"/><rect x="131.2" y="300.79999999999995" width="144.5" height="299.20000000000005" fill="#ddd" stroke="black" stroke-width="2"/><path d="M203.025 600V300.79999999999995" stroke="black"/><path d="M131.2 521.240411h71.825" stroke="#a14426" stroke-width="3"/><path d="M131.2 568.96755927h71.825" stroke="#237da3" stroke-dasharray="4 3"/><path d="M203.025 504.240411h72.67500000000001" stroke="#a14426" stroke-width="3"/><path d="M203.025 551.96755927h72.67500000000001" stroke="#237da3" stroke-dasharray="4 3"/><path d="M131.2 516.140411h71.825" stroke="#777"/><path d="M131.2 408.4702055h71.825" stroke="#777"/><path d="M203.025 499.140411h72.67500000000001" stroke="#777"/><path d="M203.025 399.9702055h72.67500000000001" stroke="#777"/><path d="M168.60000000000002 583V283.79999999999995" stroke="#333" stroke-width="4"/><rect x="163.84" y="411.3425" width="9.520000000000001" height="16.915000000000003" fill="white" stroke="black"/><text x="148.60000000000002" y="588" font-size="12">utility</text><path d="M237.45000000000002 583V283.79999999999995" stroke="#333" stroke-width="4"/><rect x="232.69" y="411.3425" width="9.520000000000001" height="16.915000000000003" fill="white" stroke="black"/><text x="217.45000000000002" y="588" font-size="12">plant</text><text x="40" y="110" font-size="12" fill="#29728a">Blue: nominal window bounding rectangle</text><text x="40" y="128" font-size="12" fill="#8b5e24">Ochre dashed: conditional shifted window</text><text x="450" y="145" font-size="18">850 wide × 250.5 deep · top Z1900</text><text x="450" y="180" font-size="15">Separate wet compartments do not qualify the whole boundary.</text><text x="450" y="215" font-size="15">28mm copper + matching Conex metal-sealing joints.</text><text x="450" y="250" font-size="15">Steel 166.751826kg · declared full gross bound 304.503913kg</text><text x="450" y="285" font-size="15">Nominal bounding-window loss 0.978m².</text><text x="450" y="340" font-size="15">Six known valve PTFE/EPDM items: zero owner exceptions.</text><text x="450" y="445" font-size="15">Raised permanent pans require outward wall-tube renewal.</text><text x="450" y="475" font-size="15">Rust lines: fixed pan crests; blue dashed:90L/min stage.</text><text x="450" y="375" font-size="15">REJECT: pressure posts cross pans without a motion closure;</text><text x="450" y="400" font-size="15">thin impact faces and closed-front controls are unresolved.</text><text x="40" y="667" font-size="14">DECISION: do not select this cabinet. Replan the low entry and genuine internal branch isolation together.</text><text x="40" y="699" font-size="12">Nominal plan and conditional service/structure host remain distinct. Diagram does not adopt either.</text><text x="40" y="730" font-size="10">Source 324062f1cd88f541d45ae16f9b474501886dc5eccb5e3b50363583832fec8120</text></g></svg>
