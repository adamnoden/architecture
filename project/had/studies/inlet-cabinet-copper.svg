<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="40" y="40" font-size="25">One copper isolation cabinet · whole-arrangement challenger</text><text x="40" y="69" font-size="14">Source-bound study; not selected, certified or released for construction.</text><rect x="121" y="139.29999999999995" width="170" height="357" fill="#edf5f8" stroke="#29728a" stroke-dasharray="none"/><rect x="70" y="139.29999999999995" width="170" height="357" fill="none" stroke="#8b5e24" stroke-dasharray="7 4"/><rect x="131.2" y="300.79999999999995" width="144.5" height="299.20000000000005" fill="#ddd" stroke="black" stroke-width="2"/><path d="M203.025 600V300.79999999999995" stroke="black"/><path d="M131.2 600h144.5" stroke="#777"/><path d="M131.2 525.2h144.5" stroke="#777"/><path d="M131.2 450.4h144.5" stroke="#777"/><path d="M131.2 375.6h144.5" stroke="#777"/><path d="M163.5 583V283.79999999999995" stroke="#333" stroke-width="4"/><rect x="158.74" y="428.3425" width="9.520000000000001" height="16.915000000000003" fill="white" stroke="black"/><text x="143.5" y="588" font-size="12">utility</text><path d="M242.55 583V283.79999999999995" stroke="#333" stroke-width="4"/><rect x="237.79000000000002" y="428.3425" width="9.520000000000001" height="16.915000000000003" fill="white" stroke="black"/><text x="222.55" y="588" font-size="12">plant</text><text x="40" y="110" font-size="12" fill="#29728a">Blue: nominal window bounding rectangle</text><text x="40" y="128" font-size="12" fill="#8b5e24">Ochre dashed: conditional shifted window</text><text x="450" y="145" font-size="18">850 wide × 250.5 deep · top Z1900</text><text x="450" y="180" font-size="15">Two independent wet compartments; no sliding top gland.</text><text x="450" y="215" font-size="15">28mm copper + matching Conex metal-sealing joints.</text><text x="450" y="250" font-size="15">Steel 130.729816kg · declared full gross bound 237.352871kg</text><text x="450" y="285" font-size="15">Nominal bounding-window loss 0.978m².</text><text x="450" y="340" font-size="15">Known valve PTFE/EPDM has no owner exception.</text><text x="450" y="375" font-size="15">Actual floor seat, wall/pipe restraints, bulkhead seals,</text><text x="450" y="400" font-size="15">pan/outlet joints, flow and whole movement remain open.</text><text x="40" y="667" font-size="14">The generous cabinet buys service space by spending window area; the owner judges that trade.</text><text x="40" y="699" font-size="12">Nominal plan and conditional service/structure host remain distinct. Diagram does not adopt either.</text><text x="40" y="730" font-size="10">Source 1e086fd5ba4f3f183583c3bb097d28c2c47ad1b9d2386f061d9faf9a8140d010</text></g></svg>
