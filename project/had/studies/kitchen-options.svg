<text x="82" y="112" font-size="2.1">PANTRY</text>
<text x="20" y="135" font-size="2.8">Plan 1:50 · north ↑ · dashed states are separate</text>
<text x="20" y="143" font-size="2.8">No loose prep table: common working floor is restored.</text>
<text x="20" y="151" font-size="2.8">Green lines: five whole-segment 600-body paths pass.</text>
<text x="137" y="40" font-size="2.65">B / Continuous 900-high counter: 600 DW + 800 sink + 1300 prep + 600 cook + 182.5 filler.</text>
<text x="137" y="48.2" font-size="2.65">Raise only the two ground kitchen sills from 750 to 1050; retain 1000 widths and 2850 heads.</text>
<text x="137" y="56.4" font-size="2.65">Fridge: actual 100 side / top and 50 rear allowances require a 750-wide ventilated bay.</text>
<text x="137" y="64.6" font-size="2.65">Reflected left-hinge 135° envelope is 940 × 1088; the pantry leaf reserve remains separate.</text>
<text x="137" y="72.8" font-size="2.65">Dishwasher: 1150 actual open depth. Drawers: 600 authored extension, not selected hardware.</text>
<text x="137" y="81" font-size="2.65">Oven: 650 authored door / handle projection; actual under-hob ventilation section remains open.</text>
<text x="137" y="89.19999999999999" font-size="2.65">Accessible sink-module connections are proposed; no hidden socket, trap or hose fit is claimed.</text>
<text x="137" y="97.39999999999999" font-size="2.65">A 1200-deep temporary appliance staging strip replaces working space during maintenance.</text>
<text x="137" y="105.6" font-size="2.65">Actual carrying / sack truck, helpers, pantry and garden door transitions still need testing.</text>
<text x="137" y="113.8" font-size="2.65">Two higher sills cost 0.60 m² nominal aperture area; this is not a daylight calculation.</text>
<text x="137" y="122" font-size="2.65">Seated outlook and rear composition change. Standing views and frame / shade operation remain.</text>
<text x="137" y="130.2" font-size="2.65">A 600-deep counter obstructs direct window reach; front approach does not prove sash control.</text>
<text x="137" y="138.39999999999998" font-size="2.65">Retained 750-sill option A keeps low outlook but has interrupted stations and a loose table.</text>
<text x="137" y="146.6" font-size="2.65">HAD remains incomplete. Source adoption requires OAS and current-house / BCR reconciliation.</text>
