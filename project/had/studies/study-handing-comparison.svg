<text x="12" y="247" font-size="3.15" fill="#24343b">Decision: retain the current handing as eligible. A simpler contact sequence alone does not support changing the source door.</text>
<text x="12" y="258" font-size="2.7" fill="#24343b">The high hinge also moves the closed handle bound into the accepted west-window approach: −26.5 mm body clearance in that separate state.</text>
<text x="12" y="269" font-size="2.65" fill="#24343b">All contacts and frame/stop positions are authored. These are finite geometric comparisons, not one-handed use, comfort or installed-door passes.</text>
<text x="12" y="281" font-size="2.65" fill="#24343b">The earlier two-hand sequence and its generated sheets are preserved. Exact paths, movement bounds and limits: study-handing-comparison.json.</text>
