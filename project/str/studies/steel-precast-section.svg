<text x="16" y="35" class="text-note" text-anchor="start" data-entity="ffl">First FFL 3800 · change +350 mm</text>
<text x="157" y="35" class="text-note" text-anchor="start" data-entity="clearance">Insulated beam / arch gap 120.4 mm</text>
<text x="16" y="155" class="text-note" text-anchor="start" data-entity="left-key-1">Plank 200; finish 80; camber reserve 20 mm.</text>
<text x="16" y="162" class="text-note" text-anchor="start" data-entity="left-key-2">Setting 25; bed 10; soffit allowance 70 mm.</text>
<text x="16" y="169" class="text-note" text-anchor="start" data-entity="left-key-3">Deepest beam 259.6; total required 664.6 mm.</text>
<text x="157" y="155" class="text-note" text-anchor="start" data-entity="right-key-1">Portal 203x203x60 UC; beside-planks.</text>
<text x="157" y="162" class="text-note" text-anchor="start" data-entity="right-key-2">Retained insulation/lining envelope 280 mm.</text>
<text x="157" y="169" class="text-note" text-anchor="start" data-entity="right-key-3">Independent arch, ties, beam seats and junctions still require design.</text>
<text x="16" y="185" class="text-note" text-anchor="start" data-entity="stair">Stair: 20 rises of 190.0 mm; going 300; pitch 32.3°.</text>
<text x="16" y="194" class="text-note" text-anchor="start" data-entity="limitations">This is a selected-source comparison, not an adopted whole-house section, fire detail or precast shop drawing.</text>
