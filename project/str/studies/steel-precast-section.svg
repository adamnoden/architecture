<text x="17" y="124" class="text-note" text-anchor="start" data-entity="ceiling-label">Ceiling 3100 · spare 35.4 mm</text>
<rect x="157" y="49" width="118" height="12.5" class="line-secondary fill-faint" data-entity="portal-finish"/>
