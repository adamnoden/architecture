<line x1="459.500" y1="213.195" x2="499.500" y2="213.195" stroke="#a1262f" stroke-width="2"/>
<text x="50.000" y="680.000" class="note" >RC262.5..462.5 | nominal gap10 | new masonry472.5..612.5</text>
<text x="50.000" y="707.000" class="note" >Ground face with 27 mm finish: 639.5; finished toe 1299.5</text>
<text x="50.000" y="734.000" class="note red" >Only 0.5 mm nominal to first raw window: reveal/tolerance replan OPEN.</text>
<text x="50.000" y="761.000" class="note" >Both full140mm arms sit on the real 700 mm ground girders.</text>
<text x="50.000" y="788.000" class="note" >Minimum transverse edge margin 70 mm; no new pile or floating cap.</text>
<text x="50.000" y="815.000" class="note" >Ground load is distributed onto the beams, not assigned wholly to P01.</text>
<text x="50.000" y="856.000" class="sub" >Three horizontal constraints, using two real western cores:</text>
<text x="50.000" y="884.000" class="note" >A / SW: X + Y.   B / NW: X only; allow Y movement.</text>
<text x="50.000" y="911.000" class="note" >SE / NE: in-plane free. All interfaces permit vertical slip and rotation.</text>
<text x="50.000" y="938.000" class="note red" >Wind reversal needs captive opposed faces; actual gaps and engagement OPEN.</text>
<text x="50.000" y="965.000" class="note" >Uniform thermal origin[462.5, 462.5]; four tight keys avoided.</text>
<text x="50.000" y="992.000" class="note" >No plastic/PTFE, resin anchorage or friction resistance is admitted.</text>
<text x="50.000" y="1019.000" class="note red" >Four northern beam/pier beds also release H; their gravity support stays.</text>
<text x="800.000" y="112.000" class="sub" >West-leaf section at interface — NTS</text>
