<text x="40.000" y="930.000" class="note blue" >Three pin centres:SW-X(622.5,912.5), SW-Y(912.5,622.5), NW-X(622.5,11087.5); z3270.</text>
<text x="40.000" y="959.000" class="note" >300mm core cover comparison consumes50mm inward AND50mm outward. The110mm glass profile must move with the outside face.</text>
<text x="40.000" y="988.000" class="note red" >This is a rejected finite family, not rejection of all conventional interfaces. A braced fork and one coordinated SW root/mat would be a new detail.</text>
<text x="40.000" y="1032.000" class="sub red" >No native52-head solve, product approval, physical fit, all-four corner closure or owner acceptance.</text>
