<text x="650.00" y="519.00" class="small muted" text-anchor="start">The earlier cover ended at Z4300. The socket rows are at Z4400 and Z4720.</text>
<line x1="32.00" y1="548.00" x2="1228.00" y2="548.00" stroke="#9baea8" stroke-width="1" stroke-dasharray=""/>
<text x="33.00" y="578.00" class="head" text-anchor="start">The room-side strip</text>
<text x="33.00" y="602.00" class="small" text-anchor="start">The Ø104 trial costs Ø24 + 2 × (15 setout + 25 work).</text>
<text x="33.00" y="623.00" class="small" text-anchor="start">The straight-jamb strip is 4 mm short. At spring height,</text>
<text x="33.00" y="644.00" class="small" text-anchor="start">the green offset trial clears the arch opening by 7.63 mm.</text>
<text x="445.00" y="578.00" class="head" text-anchor="start">The stack station</text>
<text x="445.00" y="602.00" class="small" text-anchor="start">The straight approach crosses the retained pipe axis</text>
<text x="445.00" y="623.00" class="small" text-anchor="start">at the spring, guard and barrier levels. Removing</text>
<text x="445.00" y="644.00" class="small" text-anchor="start">the cabinet cover leaves the pipe in place.</text>
<text x="842.00" y="578.00" class="head" text-anchor="start">The gap over the crown</text>
<text x="842.00" y="602.00" class="small" text-anchor="start">The arch reaches Z6515 at its crown, 25 mm below</text>
<text x="842.00" y="623.00" class="small" text-anchor="start">the collector. A Ø24 transverse member in that</text>
<text x="842.00" y="644.00" class="small" text-anchor="start">same strip would leave 1 mm total.</text>
<line x1="32.00" y1="665.00" x2="1228.00" y2="665.00" stroke="#b8c6c0" stroke-width="1" stroke-dasharray=""/>
<text x="33.00" y="691.00" class="small" text-anchor="start">The green Ø104 gauge at Y10740 clears the cabinet by 8 mm. Its centre lands inside the RC arch and 54.85 mm off the pin. It is a face-space control only.</text>
<text x="33.00" y="718.00" class="small muted" text-anchor="start">For arch work, shore both arms independently. For window work, fit the room barrier and capture the guard before either jamb releases.</text>
<text x="33.00" y="746.00" class="small muted" text-anchor="start">Sources  ·  HAD water-replan  /  MAT whole-house services and rear-crossing proposal  /  STR corner pivot, window renewal, guard receivers and welded roof heel</text>
</svg>
