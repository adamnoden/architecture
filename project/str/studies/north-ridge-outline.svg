<text x="36" y="81" fill="#263a40" font-size="16">Ordinary north section at a 1.60 m eye level above ground-floor datum. Unobstructed sightlines.</text>
<text x="36" y="119" fill="#263a40" font-size="19">Eye 12 m outside the wall</text>
<text x="570" y="119" fill="#263a40" font-size="19">Change in apparent outline</text>
