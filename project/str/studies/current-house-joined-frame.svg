<text x="45" y="735" font-size="15" fill="#24383d">52 proposed shafts. Rust: independent tensile bound exceeds 100 kN.</text>
<text x="45" y="762" font-size="15" fill="#24383d">Gold: actual ridge loop. Amber: four courtyard holds shifted to real shafts.</text>
<text x="665" y="132" font-size="22" fill="#24383d">Force returned through the pitched frame</text>
