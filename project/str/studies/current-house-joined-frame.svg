<text x="1022" y="203" font-size="15" fill="#24383d">45 mm crown pin</text>
<text x="695" y="417" font-size="16" fill="#24383d">Inclined steel returns real horizontal and vertical forces into both heels.</text>
<text x="665" y="474" font-size="22" fill="#24383d">Two floor loops, different depths</text>
<text x="665" y="505" font-size="17" fill="#24383d">Outer 140 × 750; court 140 × 650. Soffit stays at +3170.</text>
<text x="665" y="532" font-size="15" fill="#24383d">The slab has the court, stair and entry removed; the 400 mm wet well is challenged too.</text>
<text x="665" y="560" font-size="15" fill="#24383d">Eight mid-height H12 bars address the narrow stair-side strip and in-plane edge forces.</text>
<text x="665" y="620" font-size="22" fill="#24383d">An open result at the water bay</text>
<text x="665" y="650" font-size="17" fill="#24383d">140 mm suspended floor at −1200; 180 mm side walls.</text>
<text x="665" y="676" font-size="16" fill="#24383d">The staff slab passes its 5 kN / 200 mm print. The joint does not:</text>
<text x="665" y="702" font-size="16" fill="#24383d">7 mm clear at the pile starters versus 25 mm. No moving sled load on this slab.</text>
<polyline points="40.00,808.00 1455.00,808.00" fill="none" stroke="#bec8c7" stroke-width="1"/>
<text x="40" y="850" font-size="19" fill="#24383d">Scope</text>
<text x="40" y="881" font-size="16" fill="#24383d">The 52 positions are a structural comparison. Negative head actions require a positive ground path; they are not demonstrated soil resistance.</text>
<text x="40" y="909" font-size="16" fill="#24383d">Steel/RC detailing, construction stages, capillary edges, window renewal, site stiffness and the full bay cage remain open.</text>
</g></svg>
