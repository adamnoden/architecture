<text x="936.0" y="236.9" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#20343d" font-weight="400">5570    M16 permanent guard rod</text>
<text x="754.0" y="567.0" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#20343d" font-weight="400">H6/55 nominal. At +5 inward cage setout, both arch and jamb exceed link capacity.</text>
<line x1="38.00" y1="603.00" x2="1462.00" y2="603.00" stroke="#b5c3bd" stroke-width="2"/>
<text x="38.0" y="645.0" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#20343d" font-weight="700">Release sequence  /  independent support at each transfer</text>
<text x="40.0" y="680.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#20343d" font-weight="400">1    Fit the room barrier before opening the window or detaching the external guard.</text>
<text x="40.0" y="712.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#20343d" font-weight="400">2    Capture the grille on two blades and four cuffs. Support each fork and withdraw both collars 100.</text>
<text x="40.0" y="744.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#20343d" font-weight="400">3    Draw the grille 665, or the closed frame 880 on four external fittings, to q −520.</text>
<text x="40.0" y="776.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#20343d" font-weight="400">4    Transfer onto the lifting yoke before releasing the carriage. Retract the blades and lower clear of the rails.</text>
<text x="40.0" y="825.0" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#20343d" font-weight="700">Occupied-room check</text>
<text x="40.0" y="855.0" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#20343d" font-weight="400">Rear north  /  barrier bottom 830; radiator top 700. Rear west  /  a socket at Y11020 falls behind fixed joinery.</text>
<text x="40.0" y="886.0" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#20343d" font-weight="400">The cabinet height and access are unbound. That west occurrence stays unresolved; a clear external travel path cannot release it.</text>
<text x="40.0" y="921.0" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#4d686b" font-weight="400">The permanent receiver still needs a proven concrete stress field, fitted seals and joint assembly. The mobile support needs its ground and handling proof.</text>
</svg>
