<text x="32" y="565" font-size="17" font-weight="700" fill="#24343b">Construction order</text>
<text x="223" y="565" font-size="15" font-weight="400" fill="#24343b">Level the individual heads. Slide the block west. Fit a positive wet-side keeper. Install upper rods.</text>
<text x="32" y="595" font-size="14" font-weight="400" fill="#24343b">The drawn pocket is a trial. Survey both head elevations and demonstrate load sharing, keeper access and perimeter continuity before bedding.</text>
<text x="32" y="620" font-size="13" font-weight="400" fill="#506269">Steel geometry only. The keeper, thread form, grout and wall finish are outside this drawing.</text>
