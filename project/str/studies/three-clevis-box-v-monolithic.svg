<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img"><title>Boxed clevis versus conventional monolithic upstand</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="#23714e"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#252b30}.title{font-size:27px;font-weight:700}.sub{font-size:18px;font-weight:700}.note{font-size:15px}.small{font-size:12px}.red{fill:#a1262f}.blue{fill:#315c86}.gold{fill:#896a20}</style>
<text x="40.000" y="42.000" class="title" >One boxed clevis comparison — then stop and compare the house</text>
<text x="40.000" y="73.000" class="note red" >Same source pressure minimum94.581kN; development141.8715kN. No complete resistance, product, physical or house acceptance.</text>
<text x="40.000" y="115.000" class="sub" >Closed cheek section:190high×100outward</text>
<rect x="100.000" y="190.000" width="200.000" height="380.000" fill="#626b74" stroke="#87929c" />
<rect x="180.000" y="210.000" width="100.000" height="340.000" fill="white" stroke="#87929c" />
<line x1="140.000" y1="380.000" x2="300.000" y2="380.000" stroke="#315c86" stroke-dasharray="4 3"/>
<text x="330.000" y="220.000" class="note" >40mm inner face /10mm other plates</text>
<text x="330.000" y="249.000" class="note blue" >Genuine closed-section bending +torsion</text>
<text x="330.000" y="278.000" class="note" >Inner bearing faces support D60 pin at130mm centres</text>
<text x="330.000" y="307.000" class="note red" >Pin surface axial friction adds an eccentric bending couple</text>
<text x="330.000" y="336.000" class="note" >Outer access port90mm;220mm pin;270mm withdrawal</text>
<text x="330.000" y="365.000" class="note" >Slot gap stays90mm: no box flange crosses the moving blade</text>
<text x="330.000" y="394.000" class="note" >SW one fabricated cross-root;X16/Y14bars at separate levels</text>
<text x="330.000" y="423.000" class="note" >No duplicated plates;9centred anchors each face, coordinated gaps</text>
<text x="330.000" y="452.000" class="small red" >Closed boxes still require a300core and through-plate concrete proof</text>
<text x="40.000" y="620.000" class="note" >μ=0: boxVM28.4; pinVM229.1;Ybar51.2MPa</text>
<text x="40.000" y="647.000" class="note" >μ=0.3: boxVM73.1; pinVM311.2;Ybar204.8MPa</text>
<text x="40.000" y="674.000" class="note" >μ=0.6: boxVM119.8; pinVM394.7;Ybar358.4MPa</text>
<text x="40.000" y="701.000" class="note" >μ=1: boxVM182.6; pinVM514.3;Ybar563.2MPa</text>
<text x="40.000" y="765.000" class="note red" >No pin-only pass: boxed cheeks solve one failure; the connector remains unqualified.</text>
<text x="930.000" y="115.000" class="sub" >Ordinary monolithic comparison</text>
