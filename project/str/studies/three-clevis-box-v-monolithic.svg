<text x="930.000" y="800.000" class="note blue" >200×350 upstand; floor and FIRST unchanged</text>
<text x="930.000" y="826.000" class="note" >70mm high×60mm roomward first-floor plinth</text>
<text x="930.000" y="852.000" class="small" >300cores grow100mm inward; no outward glass move</text>
<text x="930.000" y="878.000" class="small red" >Same350 downstand would overlap actual arch rings45mm</text>
<text x="40.000" y="940.000" class="sub" >PREFERRED NEXT: develop a normal beam/column/slab cage and join the real plinth/rooms before any new full signed programme.</text>
<text x="40.000" y="978.000" class="note red" >No additional native physics edits or new house solves. Existing650/750 northern upstands and all52 supports/roof origins must be retained.</text>
