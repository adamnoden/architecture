<text x="34" y="42" font-size="27" text-anchor="start" fill="#213a42">A 45 mm haunch at the corner-window spring</text>
<text x="34" y="71" font-size="16" text-anchor="start" fill="#213a42">Near half of one inner arch. Opening, outer brick ring and wall-normal width are held fixed.</text>
