# Canonical installation source for runtime/claims:.github/workflows/control-operations.yml.
# Only this trigger lives on the runtime branch; all executable reporting code comes from main.
name: Project operations
on:
  push:
    branches: [runtime/claims]
    paths:
      - '.pco/claims/**'
      - '.github/workflows/control-operations.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: project-operations-runtime/claims
  cancel-in-progress: false
jobs:
  report:
    uses: adamnoden/architecture/.github/workflows/operations-report.yml@main
