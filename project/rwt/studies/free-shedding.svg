<text x="218" y="105" font-size="2.5" fill="#243c45">impact</text>
<text x="260" y="105" font-size="2.5" fill="#243c45">open spill</text>
<text x="318" y="109" font-size="2.5" fill="#243c45">hedge beyond essential route</text>
<text x="182" y="116" font-size="2.5" fill="#243c45">Collector invert / spill crest / susceptible fabric: actual levels unresolved.</text>
<text x="182" y="126" font-size="2.5" fill="#243c45">Normal conveyance leaves section; actual outlet and destination unresolved.</text>
<text x="182" y="138" font-size="3" fill="#a45f3e">B / copper comparator: protect doors and service routes</text>
