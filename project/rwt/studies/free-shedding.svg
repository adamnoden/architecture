<text x="248" y="157" font-size="2.6" fill="#243c45">Accessible gutter, joint and downpipe</text>
<text x="248" y="165" font-size="2.6" fill="#243c45">Separate safe overflow still required</text>
<text x="248" y="173" font-size="2.6" fill="#243c45">Ground receptor and site handoff still unproved</text>
<text x="182" y="199" font-size="3" fill="#a45f3e">REJECT / a drain-dependent moat or a hedge as a flood barrier</text>
<text x="182" y="207" font-size="2.6" fill="#243c45">A blocked outlet must not raise water against vulnerable fabric.</text>
<text x="182" y="215" font-size="2.6" fill="#243c45">No pump, buried tanking or existing deep carrier bay earns a shortcut.</text>
<line x1="12" y1="226" x2="408" y2="226" stroke="#566c72" stroke-width="0.3"/>
<text x="12" y="237" font-size="3.3" fill="#243c45">03 / The court cost</text>
<text x="12" y="246" font-size="2.8" fill="#243c45">60.0625 m² inside the ridge: 4.90 × nominal direct court area.</text>
<text x="12" y="254" font-size="2.8" fill="#243c45">At the illustrative 144 mm/h: 2.403 L/s; 1,441.5 L in 10 minutes.</text>
<text x="12" y="262" font-size="2.6" fill="#243c45">No escape / no losses: volume only, never safe storage or flood level.</text>
<text x="224" y="237" font-size="3.3" fill="#243c45">04 / Space is a real design cost</text>
<text x="224" y="246" font-size="2.8" fill="#243c45">600 mm all-round court band leaves 2.3 × 2.3 m (5.29 m²).</text>
<text x="224" y="254" font-size="2.8" fill="#243c45">1 m full outside ring occupies 52 m², including corners.</text>
<text x="224" y="262" font-size="2.6" fill="#243c45">Authored sensitivities only: neither width is specified or proved safe.</text>
<text x="12" y="282" font-size="2.5" fill="#243c45">Evidence: Approved Document H H3 §1.13; Historic England; current house and BCR catchment ledger. See linked research/result.</text>
