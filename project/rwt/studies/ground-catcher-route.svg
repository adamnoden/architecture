<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><rect width="1680" height="1188" fill="white"/><g font-family="Arial,sans-serif" fill="#20343e"><text x="45" y="50" font-size="29" font-weight="bold">Worker route trial / longitudinal level reservation</text><text x="45" y="84" font-size="18">Horizontal and vertical scales differ · source court/loggia/terrace grades · no site or safe-exit admission</text><polyline points="60,480 285,489 585,513 1222.5,525.75 1402.5,525.75" fill="none" stroke="#465c65" stroke-width="4" /><polyline points="172.5,478.5 457.5,468 1470,468" fill="none" stroke="#a76b1e" stroke-width="6" /><polyline points="457.5,474 1470,474" fill="none" stroke="#a76b1e" stroke-width="2" /><polyline points="472.5,489 525,489" fill="none" stroke="#b63e35" stroke-width="3" stroke-dasharray="8 5"/><polyline points="1402.5,525.75 1402.5,195.75" fill="none" stroke="#865743" stroke-width="5" /><circle cx="600" cy="485.4" r="4" fill="#66523c"/><circle cx="690" cy="485.4" r="4" fill="#66523c"/><circle cx="780" cy="485.4" r="4" fill="#66523c"/><circle cx="870" cy="485.4" r="4" fill="#66523c"/><circle cx="960" cy="485.4" r="4" fill="#66523c"/><circle cx="1050" cy="485.4" r="4" fill="#66523c"/><circle cx="1140" cy="485.4" r="4" fill="#66523c"/><circle cx="1230" cy="485.4" r="4" fill="#66523c"/><circle cx="1320" cy="485.4" r="4" fill="#66523c"/><circle cx="1380" cy="485.4" r="4" fill="#66523c"/><line x1="172.5" y1="520" x2="172.5" y2="550" stroke="#73848a" stroke-width="2"/><text x="137.5" y="580" font-size="15">Ramp start</text><line x1="457.5" y1="520" x2="457.5" y2="550" stroke="#73848a" stroke-width="2"/><text x="422.5" y="580" font-size="15">Raised crossing</text><line x1="585" y1="520" x2="585" y2="550" stroke="#73848a" stroke-width="2"/><text x="550" y="580" font-size="15">Court portal</text><line x1="1222.5" y1="520" x2="1222.5" y2="550" stroke="#73848a" stroke-width="2"/><text x="1187.5" y="580" font-size="15">Garden portal</text><line x1="1402.5" y1="520" x2="1402.5" y2="550" stroke="#73848a" stroke-width="2"/><text x="1367.5" y="580" font-size="15">Existing guard</text><line x1="1470" y1="520" x2="1470" y2="550" stroke="#73848a" stroke-width="2"/><text x="1435" y="612" font-size="15">Unknown onward route</text><text x="45" y="665" font-size="22" font-weight="bold">Top +5 → +40 over 1900; 825 gross / 729 nominal between 48 rails.</text><text x="45" y="710" font-size="20">Crossing underside +20 is 50 above the unqualified −30 wetting comparison.</text><text x="45" y="755" font-size="20">Ten trial shoes x5235–5285 occupy the 75 gap; grating preserves inlet only if the actual flow path remains open.</text><text x="45" y="800" font-size="20">Trial +20/−18 beams: ideal 1 kN cantilever deflection 1.87 mm; not an anchor, load or flow pass.</text><text x="45" y="845" font-size="20">At y13200 the trial gate opens north; its tip projects 369 over the N/W receiver, with safety unproved.</text><text x="45" y="890" font-size="20">The route ends at an unsurveyed receiver edge, not demonstrated safe ground; actual high water is unknown.</text><text x="45" y="960" font-size="20" font-weight="bold">Descent from +5540, load, wet slip/egress and casualty rescue are missing. Do not use this as an escape plan.</text></g></svg>
