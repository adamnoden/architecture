<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,sans-serif" fill="black"><text x="14" y="18" font-size="6.2">Copper gutters: movement must not defeat backup drainage</text><text x="14" y="28" font-size="3.8">RWT-METALS / 30 October 2026 / unadopted mechanism study / schematic, not to scale</text><path d="M14 34L406 34" fill="none" stroke="black" stroke-width=".45"/><text x="14" y="45" font-size="4.8">A   Two pipes are not a redundant pair across a solid expansion divider</text><rect x="24" y="58" width="174" height="25" fill="none" stroke="black" stroke-width=".45"/><rect x="206" y="58" width="174" height="25" fill="none" stroke="black" stroke-width=".45"/><text x="38" y="73" font-size="3.8">Compartment A / trial 3000 mm</text><text x="220" y="73" font-size="3.8">Compartment B / trial 3000 mm</text><path d="M194 55L194 88" fill="none" stroke="black" stroke-width=".45"/><path d="M210 55L210 88" fill="none" stroke="black" stroke-width=".45"/><path d="M190 52L214 52" fill="none" stroke="black" stroke-width=".45"/><text x="162" y="99" font-size="3.5">Capped movement break</text><path d="M55 83L55 117" fill="none" stroke="black" stroke-width=".45"/><path d="M350 83L350 117" fill="none" stroke="black" stroke-width=".45"/><text x="24" y="127" font-size="3.8">P-A BLOCKED</text><text x="317" y="127" font-size="3.8">P-B open</text><path d="M46 100L64 113" fill="none" stroke="black" stroke-width=".45"/><path d="M46 113L64 100" fill="none" stroke="black" stroke-width=".45"/><text x="107" y="119" font-size="3.8">No cross-divider flow path to P-B.</text><path d="M14 136L406 136" fill="none" stroke="black" stroke-width=".45"/><text x="14" y="147" font-size="4.8">B   Give each compartment its own primary and separately routed relief</text><rect x="24" y="158" width="174" height="20" fill="none" stroke="black" stroke-width=".45"/><rect x="206" y="158" width="174" height="20" fill="none" stroke="black" stroke-width=".45"/><text x="53" y="171" font-size="3.8">A: P-A + R-A</text><text x="237" y="171" font-size="3.8">B: P-B + R-B</text><path d="M55 178L55 198" fill="none" stroke="black" stroke-width=".45"/><path d="M160 178L160 198" fill="none" stroke="black" stroke-width=".45"/><path d="M245 178L245 198" fill="none" stroke="black" stroke-width=".45"/><path d="M350 178L350 198" fill="none" stroke="black" stroke-width=".45"/><text x="27" y="207" font-size="3.8">Primary A</text><text x="133" y="207" font-size="3.8">Relief A</text><text x="217" y="207" font-size="3.8">Primary B</text><text x="323" y="207" font-size="3.8">Relief B</text><text x="14" y="219" font-size="3.8">Separate labels do not prove independent receivers. Check blocked ends and common backwater.</text><text x="14" y="228" font-size="3.8">Every relief still needs a reachable crest, full failure-case flow and safe discharge below vulnerable fabric.</text><path d="M14 235L406 235" fill="none" stroke="black" stroke-width=".45"/><text x="14" y="246" font-size="4.4">C   Movement arithmetic / both outer ends fixed / adjacent ends slide</text><text x="14" y="257" font-size="3.8">Trial metal -10 to +70 C; installed +20 C. Two 3 m lengths close the gap 5.292 mm hot.</text><text x="14" y="267" font-size="3.8">12 mm installed gap minus 2 mm combined allowance leaves 4.708 mm in this model.</text><text x="14" y="277" font-size="3.8">Not a climate specification, weather-lap proof or joint selection. Do not solder the sliding cover to both ends.</text><text x="14" y="288" font-size="3.3">Source and exclusions: ../copper-assembly-candidates.md; copper-compartments.mjs and .test.mjs</text></g></svg>
