<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><rect width="100%" height="100%" fill="#fbfaf5"/><g font-family="sans-serif" fill="#273d43"><text x="30" y="40" font-size="28">UNADOPTED · conventional native release / open working platform</text><text x="30" y="75" font-size="18">Necessary access/load reference. No RC retaining duty, native8bolt pass or unowned support is invented.</text><text x="35" y="120" font-size="22">Located plan · staff support and carrier support are separate</text><rect x="70" y="155" width="549" height="345" fill="#e8e2d3" stroke="#637974"/><rect x="79" y="402.5" width="108" height="90" fill="#b4cec1" stroke="#527b6b"/><rect x="502" y="402.5" width="108" height="90" fill="#b4cec1" stroke="#527b6b"/><rect x="79" y="162.5" width="108" height="90" fill="#b4cec1" stroke="#527b6b"/><rect x="502" y="162.5" width="108" height="90" fill="#b4cec1" stroke="#527b6b"/><path d="M448 275 H655" stroke="#42859a" stroke-width="50"/><rect x="583" y="232.25" width="9" height="85.5" fill="none" stroke="#8f7258" stroke-width="4"/><path d="M583 425 H691" stroke="#8c6a99" stroke-width="12"/><path d="M583 185 H691" stroke="#8c6a99" stroke-width="12"/><ellipse cx="493" cy="402.5" rx="108" ry="90" fill="none" stroke="#ad6e45" stroke-dasharray="7 4"/><rect x="70" y="215" width="72" height="180" fill="none" stroke="#486476"/><text x="730" y="165" font-size="20">Green:300square actual pad reservations</text><text x="730" y="200" font-size="18">Pads avoid known node face X7650 by25</text><text x="730" y="235" font-size="18">Orange:R300 low seated service reference</text><text x="730" y="270" font-size="18">Blue:native bend/285flange comparator</text><text x="730" y="305" font-size="18">Purple:separate draw-frame rails/supports</text><text x="730" y="340" font-size="18">Grey:removable service ladder, not stair</text><text x="730" y="390" font-size="18">Actual pad anchors/grade remain conditional.</text><text x="730" y="425" font-size="18">Freestanding adverse lateral support fails.</text><text x="35" y="565" font-size="22">Section / loads · a working floor600above comparison grade is not a retaining pit</text><path d="M80 585 H660" stroke="#8b877e" stroke-width="14"/><circle cx="200" cy="614" r="28.5" fill="none" stroke="#8f7258" stroke-width="4"/><path d="M80 699 H660" stroke="#527b6b" stroke-width="12"/><path d="M80 719 H660 M80 819 H660" stroke="#8b877e" stroke-dasharray="7 4"/><text x="730" y="595" font-size="20">Metal staff floor 230.3kg / 2.26kN reference</text><text x="730" y="630" font-size="18">RC box36.53kN and cage6.96/25FAIL retained</text><text x="730" y="665" font-size="18">−1200 deck /−1300 frame /−1800 grade comparator</text><text x="730" y="700" font-size="18">500belowframe leaves no extra grade allowance</text><text x="730" y="735" font-size="18">Tube+water+flanges+bare drawframe 251.5kg</text><text x="730" y="770" font-size="18">3kN moving budget; actual clamps/rigging still needed</text><text x="35" y="885" font-size="18">Tilted8bolt reference: maximumgrip 574.6mm under600hypothesis; NOT physical/counterhold proof.</text><text x="35" y="920" font-size="18">Originalfloor/standing controls retained. Full curved bend/head/bolts/clock/torque/loaded support remain internal exits.</text><text x="35" y="955" font-size="18">Open platform preserves separate leak catch and80drain. No full-duty credit, pump or groundwater exclusion is invented.</text><text x="35" y="1000" font-size="20">HOLD first release. No HAD adoption; RWT06 remains STARTED and incomplete.</text></g></svg>
