<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><title>Copper receiver backing and the inspection boundary</title><desc>Authored support and repair comparison for the outer-west wet liner. A nominal linear strip sensitivity accompanies separate load paths and explicit hidden-face access limits; no selected construction or capacity.</desc><rect width="420" height="297" fill="white"/><defs><marker id="back-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#287989"/></marker><pattern id="back-hatch" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 3L3 0" stroke="#a4b3b4" stroke-width=".3"/></pattern></defs><style>text{font-family:Arial,sans-serif;font-size:3.15px;fill:#203943}.title{font-size:6px;font-weight:bold}.head{font-size:4.1px;font-weight:bold}.small{font-size:2.8px}.bold{font-weight:bold}.line{fill:none;stroke:#768589;stroke-width:.4}.wet{fill:none;stroke:#a76532;stroke-width:1.2}.back{fill:url(#back-hatch);stroke:#768589;stroke-width:.4}.frame{fill:#dbe5e7;stroke:#496e76;stroke-width:.45}.water{fill:#e0f0f3;stroke:none}.move{fill:none;stroke:#287989;stroke-width:.6;marker-end:url(#back-arrow)}.rule{stroke:#cfdbde;stroke-width:.45}.alert{fill:#a04733}.panel{fill:#f5f8f8;stroke:#d7e0e1;stroke-width:.4}</style><text x="12" y="15" class="title">Backing changes the inspection and repair promise</text><text x="12" y="24" class="">Outer-west R1 / 31 October 2026 / construction and linear-bending comparison / schematic, not for construction</text><path d="M12 30H408" class="rule"/><text x="12" y="41" class="head">A  Retain backing; keep upper loads independent</text><text x="12" y="49" class="small">Flat-base support topology — sidewalls and all contacts need design</text><rect x="43" y="66" width="4" height="48" class="frame"/><rect x="169" y="66" width="4" height="48" class="frame"/><rect x="39" y="62" width="138" height="4" class="frame"/><path d="M49 61V67" class="line"/><path d="M59 61V67" class="line"/><path d="M69 61V67" class="line"/><path d="M79 61V67" class="line"/><path d="M89 61V67" class="line"/><path d="M99 61V67" class="line"/><path d="M109 61V67" class="line"/><path d="M119 61V67" class="line"/><path d="M129 61V67" class="line"/><path d="M139 61V67" class="line"/><path d="M149 61V67" class="line"/><path d="M159 61V67" class="line"/><rect x="55" y="96" width="102" height="8" class="back"/><rect x="64" y="104" width="10" height="12" class="frame"/><rect x="138" y="104" width="10" height="12" class="frame"/><rect x="56" y="81" width="100" height="14" class="water"/><path d="M55 72V95H157V72" class="wet"/><path d="M68 54V60 M147 54V60" class="move"/><path d="M95 74V91 M120 74V91" class="move"/><path d="M36 116H180" class="line"/><text x="12" y="78" class="small">Upper loads</text><path d="M31 80L44 88" class="line"/><text x="12" y="86" class="small">bypass sheet</text><text x="178" y="85" class="small">Wet</text><text x="178" y="90" class="small">face</text><path d="M175 89L158 93" class="line"/><text x="178" y="102" class="small">Hidden</text><text x="178" y="107" class="small">contact</text><path d="M175 100H158" class="line"/><text x="52" y="124" class="small">Backing → frame/cradles → qualified foundation</text><text x="12" y="132" class="small">Contact/separator, seam relief and movement remain to qualify.</text><text x="220" y="41" class="head">B  Opening a gap changes bending sensitivity</text><text x="220" y="49" class="small">AUTHOR reference: t = 0.7 mm / water 50 mm / debris 0 kPa</text><text x="220" y="56" class="small">q=0.5516163 kPa including copper selfweight</text><text x="220" y="65" class="">Span s</text><text x="252" y="65" class="">R/line</text><text x="289" y="65" class="">Stress</text><text x="328" y="65" class="">δ linear</text><text x="371" y="65" class="">δ/s</text><text x="220" y="71" class="small">mm</text><text x="252" y="71" class="small">kN/m</text><text x="289" y="71" class="small">MPa</text><text x="328" y="71" class="small">mm</text><text x="371" y="71" class="small">ratio</text><path d="M220 74H408" class="rule"/><text x="220" y="83" class="">50</text><text x="252" y="83" class="">0.01379</text><text x="289" y="83" class="">2.11</text><text x="328" y="83" class="">0.0133</text><text x="371" y="83" class="">0.000266</text><text x="220" y="92" class="">100</text><text x="252" y="92" class="">0.02758</text><text x="289" y="92" class="">8.44</text><text x="328" y="92" class="">0.2130</text><text x="371" y="92" class="">0.002130</text><text x="220" y="101" class="">150</text><text x="252" y="101" class="">0.04137</text><text x="289" y="101" class="">19.00</text><text x="328" y="101" class="">1.0781</text><text x="371" y="101" class="">0.007187</text><text x="220" y="110" class="">300</text><text x="252" y="110" class="">0.08274</text><text x="289" y="110" class="">75.99</text><text x="328" y="110" class="">17.2491</text><text x="371" y="110" class="">0.057497</text><text x="220" y="119" class="small">s: ideal reaction-line span, not a clear aperture or bracket pitch.</text><text x="220" y="126" class="small">R220 proof 140 MPa is a MAXIMUM, not minimum resistance.</text><text x="220" y="133" class="small alert">No strength, actual deformed shape or collapse result.</text><path d="M12 140H408" class="rule"/><text x="12" y="152" class="head">C  The operation determines what remains supported and what can be inspected</text><rect x="12" y="159" width="396" height="11" class="panel"/><text x="17" y="166" class="bold">Operation</text><text x="112" y="166" class="bold">Support / water state</text><text x="274" y="166" class="bold">Inspection limit</text><text x="17" y="180" class="small">Routine upper-unit removal</text><text x="112" y="180" class="small">Control water; retain backing and captures.</text><text x="274" y="180" class="small">Wet face, visible edges and terminal.</text><path d="M12 185H408" class="rule"/><text x="17" y="192" class="small">Designed underside opening</text><text x="112" y="192" class="small">Actual span/profile and support must be proved.</text><text x="274" y="192" class="small">Real line of sight and reachable tool path.</text><path d="M12 197H408" class="rule"/><text x="17" y="204" class="small">Withdraw required backing</text><text x="112" y="204" class="small">Empty, then support or remove the wet body first.</text><text x="274" y="204" class="small">Hidden face; selfweight does not disappear.</text><path d="M12 209H408" class="rule"/><text x="17" y="216" class="small">Larger liner removal</text><text x="112" y="216" class="small">Free terminal, datum and every keeper; handle safely.</text><text x="274" y="216" class="small">Bench access is a larger declared intervention.</text><path d="M12 221H408" class="rule"/><text x="12" y="234" class="bold">Backing is not a secondary waterproof tray. Locate first leak observation and first vulnerable fabric.</text><path d="M12 241H408" class="rule"/><text x="12" y="252" class="head">D  What the numbers earn</text><text x="12" y="261" class="small">100 → 300 mm, same pressure: stress ×9 / δ ×81 / reaction ×3. Two ideal strips, not a support-removal analysis.</text><text x="12" y="268" class="small">Empty t0.7 / s300 trial: δ = 1.9111 mm from selfweight. Water 150 mm + debris 0.5 kPa: δ = 63.5601 mm is a linear extrapolation.</text><text x="12" y="275" class="small">E = 118000 N/mm²; density 8900 kg/m³. Fixed projected pressure; one end free in-plane. No ponding, formed-side or membrane credit.</text><text x="12" y="282" class="small">δ/t alone is not a validity cutoff. Actual profile, restraint, rotations, joints, loads and contact need design; no universal bound.</text><text x="12" y="291" class="small">Sources: Aurubis 2013 pp 31/32/106/108; CDA A4050-8/24 pp 144/148. No backing material, receiver size or installed load capacity admitted.</text></svg>
