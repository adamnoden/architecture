<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,sans-serif" fill="black"><text x="12" y="16" font-size="6">North court carrier | support and renewal subassembly</text><text x="12" y="24" font-size="3.4">30 October 2026 | Unadopted development study | mm unless stated | not for construction</text><path d="M12,29L408,29" fill="none" stroke="black" stroke-width=".35" /><text x="12" y="39" font-size="4.2">A   Located support stations along each 4250 crossing</text><path d="M28,65L368,65" fill="none" stroke="black" stroke-width=".35" /><path d="M20,70L376,70" fill="none" stroke="black" stroke-width=".35" /><rect x="38" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="38" y="82" font-size="2.8">175</text><rect x="69.2" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="69.2" y="82" font-size="2.8">565</text><rect x="100.4" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="100.4" y="82" font-size="2.8">955</text><rect x="131.60000000000002" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="131.60000000000002" y="82" font-size="2.8">1345</text><rect x="162.8" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="162.8" y="82" font-size="2.8">1735</text><rect x="194" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="194" y="82" font-size="2.8">2125</text><rect x="225.20000000000002" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="225.20000000000002" y="82" font-size="2.8">2515</text><rect x="256.4" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="256.4" y="82" font-size="2.8">2905</text><rect x="287.6" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="287.6" y="82" font-size="2.8">3295</text><rect x="318.8" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="318.8" y="82" font-size="2.8">3685</text><rect x="350" y="54" width="8" height="20" fill="none" stroke="black" stroke-width=".35"/><text x="350" y="82" font-size="2.8">4075</text><path d="M28,48L28,75" fill="none" stroke="black" stroke-width=".35" /><path d="M368,48L368,75" fill="none" stroke="black" stroke-width=".35" /><text x="12" y="92" font-size="3.4">11 support stations per carrier; 22 for two carriers; 390 centre pitch. Longitudinal scale 1:12.5.</text><text x="12" y="100" font-size="3.4">Rectangles reserve 100 axial each, not actual ring profiles. First/last station 175 from sleeve end.</text><text x="12" y="108" font-size="3.4">125 clear end territory; 275 to projecting pipe end needs separate external support. No seal is a support.</text><path d="M12,116L408,116" fill="none" stroke="black" stroke-width=".35" /><text x="12" y="127" font-size="4.2">B   Gravity-profile screen, not a hydraulic capacity calculation</text><text x="12" y="138" font-size="3.3">Span</text><text x="113" y="138" font-size="3.3">E / MPa</text><text x="158" y="138" font-size="3.3">Sag / mm</text><text x="213" y="138" font-size="3.3">Worst downhill / mm/m</text><text x="333" y="138" font-size="3.3">Screen</text><text x="12" y="146" font-size="3.3">2500</text><text x="113" y="146" font-size="3.3">160</text><text x="158" y="146" font-size="3.3">105.83</text><text x="213" y="146" font-size="3.3">-121.34</text><text x="333" y="146" font-size="3.3">reverse fall</text><text x="12" y="154" font-size="3.3">1250</text><text x="113" y="154" font-size="3.3">160</text><text x="158" y="154" font-size="3.3">6.61</text><text x="213" y="154" font-size="3.3">-2.81</text><text x="333" y="154" font-size="3.3">reverse fall</text><text x="12" y="162" font-size="3.3">487.5</text><text x="113" y="162" font-size="3.3">160</text><text x="158" y="162" font-size="3.3">0.15</text><text x="213" y="162" font-size="3.3">13.11</text><text x="333" y="162" font-size="3.3">positive</text><text x="12" y="170" font-size="3.3">390 (Intact)</text><text x="113" y="170" font-size="3.3">80</text><text x="158" y="170" font-size="3.3">0.125</text><text x="213" y="170" font-size="3.3">5.40</text><text x="333" y="170" font-size="3.3">positive</text><text x="12" y="178" font-size="3.3">780 (One inactive)</text><text x="113" y="178" font-size="3.3">80</text><text x="158" y="178" font-size="3.3">2.006</text><text x="213" y="178" font-size="3.3">2.04</text><text x="333" y="178" font-size="3.3">positive</text><text x="12" y="186" font-size="3.3">1170 (Two inactive)</text><text x="113" y="186" font-size="3.3">80</text><text x="158" y="186" font-size="3.3">10.153</text><text x="213" y="186" font-size="3.3">-16.22</text><text x="333" y="186" font-size="3.3">reverse fall</text><text x="12" y="199" font-size="3.4">80 MPa and 3 mm adverse endpoint differential are authored sensitivities, not certified design limits.</text><text x="12" y="207" font-size="3.4">Simply supported uniform full-water load; large sag rows are rejection screens, not physical predictions.</text><path d="M12,215L408,215" fill="none" stroke="black" stroke-width=".35" /><text x="12" y="226" font-size="4.2">C   Product geometry and removal boundary</text><text x="12" y="236" font-size="3.4">Carrier: Radius VS2751 / 110 SDR17; sleeve comparator: VS3050 / 180 SDR17.</text><text x="12" y="244" font-size="3.4">Published OD 110.0-110.7; sleeve bore 156.2-159.7. Use delivered circularity, not nominal 160.</text><text x="12" y="252" font-size="3.4">PSI PA/PE 4, 16 skid: ideal envelope 142.7; minimum radial remainder 6.75.</text><text x="12" y="260" font-size="3.4">25 skid: smallest ideal envelope 160 exceeds best listed 159.7 bore. Not a viable nominal substitution.</text><text x="12" y="268" font-size="3.4">16 skid is a candidate only: bolts, actual profile, contact clocking and seal movement remain unverified.</text><text x="12" y="280" font-size="3.4">Keep 5250 x 1600 exterior withdrawal territory; remove end coupling/seal first; preserve visible annular drain.</text><text x="12" y="289" font-size="3.1">Read ../carrier-support.md and executable source for evidence, assumptions and exclusions. RWT-06 remains open.</text></g></svg>
