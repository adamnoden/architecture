<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:3.1px;fill:#23363e}.title{font-size:6px;font-weight:bold}.sub{font-size:4px;font-weight:bold}.wall{fill:#e1e5e6;stroke:#52646d;stroke-width:.3}.pipe{fill:#b8dce8;stroke:#286b87;stroke-width:.4}.sleeve{fill:#eef6f8;stroke:#286b87;stroke-width:.4}.ins{fill:#f6e6ac;stroke:#958150;stroke-width:.3}.bad{fill:none;stroke:#af4b37;stroke-width:.5;stroke-dasharray:2,1}.line{fill:none;stroke:#53676f;stroke-width:.3}</style><text x="12" y="14" class="title">North court crossing: continuous floor, external renewal</text><text x="12" y="23" class="">30 October 2026 / unadopted comparison / no load, hydraulic, threshold or real-site admission</text><text x="12" y="35" class="sub">A  Located plan / unequal scales below</text><rect x="15" y="126.825" width="48" height="4.175" class="wall"/><rect x="29.5" y="126.825" width="19" height="4.175" class="ins"/><rect x="15" y="88.5" width="48" height="4.175" class="wall"/><rect x="29.5" y="88.5" width="19" height="4.175" class="ins"/><rect x="33.2" y="88.5" width="3.6" height="42.5" class="sleeve"/><rect x="41.2" y="88.5" width="3.6" height="42.5" class="sleeve"/><rect x="23" y="36" width="32" height="52.5" class="bad"/><rect x="27" y="131" width="24" height="6" class="bad"/><text x="74" y="45" class="">Required external extraction corridor: 5250 ×1600.</text><text x="74" y="53" class="">No actual garden, ownership or clear site is assumed.</text><text x="74" y="66" class="">Two separate carriers: x5800 and6200.</text><text x="74" y="74" class="">Both existing door apertures: x4800–7200.</text><text x="74" y="87" class="">Two independent threshold bridges; no pier drilling.</text><text x="74" y="95" class="">Family-room floor remains continuous above route.</text><text x="74" y="108" class="">Court terminal access600 deep; actual fittings needed.</text><text x="74" y="116" class="">Lifting pavers exposes ends, not the whole carrier.</text><text x="12" y="145" class="">Plan longitudinal scale1:100; transverse1:50 (deliberately unequal).</text><text x="215" y="35" class="sub">B  Threshold crossing / transverse1:10</text><rect x="225" y="48" width="100" height="2.5" class="wall"/><rect x="225" y="50.5" width="100" height="10.833333333333334" class="wall"/><rect x="225" y="61.333333333333336" width="100" height="16.666666666666668" class="ins"/><rect x="227.5" y="78.83333333333333" width="95" height="16.666666666666668" class="wall"/><ellipse cx="255" cy="117.16666666666667" rx="9" ry="15" class="sleeve"/><ellipse cx="255" cy="118" rx="5.5" ry="9.1667" class="pipe"/><ellipse cx="295" cy="117.16666666666667" rx="9" ry="15" class="sleeve"/><ellipse cx="295" cy="118" rx="5.5" ry="9.1667" class="pipe"/><path d="M242.5,95.5L242.5,143" class="bad"/><path d="M307.5,95.5L307.5,143" class="bad"/><text x="329" y="54" class="">Finish15</text><text x="329" y="65" class="">Screed65</text><text x="329" y="78" class="">Insulation100</text><text x="329" y="94" class="">Slab envelope100</text><text x="329" y="108" class="">650 clear /150 seats</text><text x="329" y="122" class="">Sleeves180 outside</text><text x="329" y="137" class="">Carriers110 outside</text><text x="215" y="148" class="">Vertical1:6; transverse1:10. All supports unselected.</text><text x="12" y="163" class="sub">C  Longitudinal section / horizontal1:25; vertical1:6</text><rect x="15" y="176" width="170" height="2.5" class="wall"/><rect x="15" y="178.5" width="170" height="10.833333333333334" class="wall"/><rect x="15" y="189.33333333333334" width="170" height="16.666666666666668" class="ins"/><rect x="15" y="206.83333333333334" width="170" height="16.666666666666668" class="wall"/><path d="M15,230.16666666666666L185,240.16666666666669L185,270.1666666666667L15,260.1666666666667Z" class="sleeve"/><path d="M15,236.83333333333334L185,246.83333333333331L185,265.1666666666667L15,255.16666666666669Z" class="pipe"/><path d="M15,226L185,226" class="bad"/><path d="M185,201L205,201" class="bad"/><path d="M185,273.5L205,273.5" class="bad"/><text x="215" y="177" class="">Continuous floor has no removable wet access strip.</text><text x="215" y="188" class="">Floor/bridge is an authored envelope, not a load proof.</text><text x="215" y="199" class="">Sleeve bottom−505→−565: 265 below old reserve.</text><text x="215" y="210" class="">Carrier outer bottom−475→−535; bore not selected.</text><text x="215" y="221" class="">Receiver maximum trial−585: 435 below old grade.</text><text x="215" y="232" class="">Separate primary/relief receiving identities required.</text><text x="215" y="243" class="">Full-length body4450 +handling800 =5250 corridor.</text><text x="215" y="254" class="">No unseen coupling through sleeve; withdraw outside.</text><text x="215" y="265" class="">Lost free-outfall advantage is explicit, not repaired by label.</text><text x="12" y="286" class="">RWT remains planned. See north-court-carrier.md for product evidence, rejection cases, threshold and access obligations.</text></svg>
