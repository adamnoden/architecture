<text x="496" y="154" font-size="14">107 mm removable casing</text>
<text x="510" y="255" font-size="14">Fork</text>
<text x="818" y="255" font-size="14">Spool</text>
<text x="474" y="363" font-size="14">2 mm nominal end gap. Both sealing lands are plain copper.</text>
<text x="474" y="389" font-size="14">60 mm exposed spigot / 31 mm socket engagement trial.</text>
<text x="32" y="444" font-size="15">WITH ONE BRANCH BLOCKED</text>
<text x="32" y="473" font-size="14">At 4.439 L/s and K = 2, 8.1 mm remains after a 10 mm adverse endpoint difference.</text>
<text x="32" y="503" font-size="14">Test the actual inlet, fitting loss, level control and common receiver before relying on the second route.</text>
<text x="32" y="552" font-size="13">Dimensional comparison. The gasket, tool opening, independent restraints and discharge are unqualified.</text>
