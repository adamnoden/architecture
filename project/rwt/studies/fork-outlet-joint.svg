<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 580" width="990" height="580">
<title>Service joint at the removable rainwater fork</title>
<desc>Plan of the straight joint and fork, with a larger axial section of the two plain tube ends and the removable coupling.</desc>
<rect width="990" height="580" fill="#f9f8f3"/><g font-family="sans-serif" fill="#233936">
<text x="32" y="39" font-size="25">Service joint at the removable rainwater fork</text>
<text x="32" y="67" font-size="14">The clasp comes off before either the native spool or the outlet carriage moves.</text>
<text x="32" y="110" font-size="14">PLAN  /  NORTH UP</text>
