<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,sans-serif" fill="black"><text x="12" y="16" font-size="6">Conventional carrier | support and terminal comparison</text><text x="12" y="25" font-size="3.3">30 October 2026 / RWT-06 / development comparison only / mm / not for construction</text><path d="M12,31L408,31" fill="none" stroke="black" stroke-width=".3"/><text x="12" y="42" font-size="4.2">A   Same 4250 crossing; PVC-U solid wall instead of PE100</text><path d="M24,65L364,65" fill="none" stroke="black" stroke-width=".3"/><rect x="34" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="33" y="83" font-size="2.8">175.0</text><rect x="78.57142857142857" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="77.57142857142857" y="83" font-size="2.8">732.1</text><rect x="123.14285714285714" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="122.14285714285714" y="83" font-size="2.8">1289.3</text><rect x="167.7142857142857" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="166.7142857142857" y="83" font-size="2.8">1846.4</text><rect x="212.28571428571428" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="211.28571428571428" y="83" font-size="2.8">2403.6</text><rect x="256.85714285714283" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="255.85714285714283" y="83" font-size="2.8">2960.7</text><rect x="301.4285714285714" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="300.4285714285714" y="83" font-size="2.8">3517.9</text><rect x="346" y="54" width="8" height="19" fill="none" stroke="black" stroke-width=".35"/><text x="345" y="83" font-size="2.8">4075.0</text><text x="12" y="96" font-size="3.3">Eight rings per carrier at 557.14 centres; 16 total, versus previous 22. Four end supports remain.</text><text x="12" y="104" font-size="3.3">100 axial ring zones are reservations, not measured PSI collars. Longitudinal scale 1:12.5.</text><path d="M12,112L408,112" fill="none" stroke="black" stroke-width=".3"/><text x="12" y="123" font-size="4.2">B   Conditional fall screen / 3 mm adverse end difference / one inactive ring</text><text x="12" y="135" font-size="3.3">Case</text><text x="125" y="135" font-size="3.3">E MPa</text><text x="206" y="135" font-size="3.3">Rings</text><text x="282" y="135" font-size="3.3">Residual mm/m</text><text x="12" y="143" font-size="3.3">PE previous</text><text x="125" y="143" font-size="3.3">80</text><text x="206" y="143" font-size="3.3">11</text><text x="282" y="143" font-size="3.3">2.043</text><text x="12" y="151" font-size="3.3">PVC reference</text><text x="125" y="151" font-size="3.3">900</text><text x="206" y="151" font-size="3.3">6</text><text x="282" y="151" font-size="3.3">0.744</text><text x="12" y="159" font-size="3.3">PVC sensitivity</text><text x="125" y="159" font-size="3.3">450</text><text x="206" y="159" font-size="3.3">7</text><text x="282" y="159" font-size="3.3">-1.443</text><text x="12" y="167" font-size="3.3">PVC candidate</text><text x="125" y="167" font-size="3.3">450</text><text x="206" y="167" font-size="3.3">8</text><text x="282" y="167" font-size="3.3">3.080</text><text x="12" y="175" font-size="3.3">PVC two inactive</text><text x="125" y="175" font-size="3.3">450</text><text x="206" y="175" font-size="3.3">8</text><text x="282" y="175" font-size="3.3">-15.844</text><text x="12" y="186" font-size="3.3">900 is generic PVC creep reference; 450 is authored sensitivity. Neither is a Marley product rating.</text><path d="M12,193L408,193" fill="none" stroke="black" stroke-width=".3"/><text x="12" y="204" font-size="4.2">C   Accessible terminal / axial development reservation, 1:2</text><path d="M235,225L31,225" fill="none" stroke="black" stroke-width=".3"/><path d="M235,215L235,239" fill="none" stroke="black" stroke-width=".3"/><rect x="182.5" y="216" width="30" height="18" fill="none" stroke="black" stroke-width=".35"/><rect x="103" y="218" width="64" height="14" fill="none" stroke="black" stroke-width=".35"/><text x="182.5" y="245" font-size="3.1">60 support</text><text x="103" y="245" font-size="3.1">UE405 / 128</text><text x="243" y="224" font-size="3.1">Sleeve mouth</text><text x="12" y="256" font-size="3.3">Support centre 75 out; pipe projects 200; assumed coupling overlap 64; clear axial gap 31.</text><text x="12" y="264" font-size="3.3">128 fixed-stub parking + 80 tool territory gives 408 reach; 192 remains inside the 600 court access trial.</text><text x="12" y="272" font-size="3.3">Pipe body increases to 4650; exterior withdrawal becomes 5450 x 1600. No hidden corridor reduction.</text><text x="12" y="282" font-size="3.3">End supports at the sleeve mouth fail the 3 mm / 175 span case regardless of pipe stiffness.</text><text x="12" y="290" font-size="3">Coupling engagement, ring retention, seal, terminal loads and hydraulics remain unresolved. Read ../conventional-carrier.md.</text></g></svg>
