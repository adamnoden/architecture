<text x="73" y="543" font-size="15" font-weight="400">Orange is the dry first rest. Purple is the 600-wide operator.</text>
<text x="73" y="568" font-size="15" font-weight="400">Lock the two screens before any long northern-roof diversion.</text>
<text x="685" y="124" font-size="19" font-weight="700">2   The northern screen crosses the backup crest</text>
