<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 838" role="img" aria-labelledby="title"><title id="title">Two courtyard spill galleries and independent north basin return</title><rect x="0" y="0" width="1330" height="838" fill="#fafaf6" stroke="none"/><text x="35" y="45" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#193b3c">A low route past a blocked courtyard receiver</text><text x="35" y="73" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#193b3c">Project comparison. Pipe and receiving levels are conditional. All dimensions in mm. North is up in both plans.</text><text x="35" y="112" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193b3c">1   Collect before the old side spills</text><text x="685" y="112" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193b3c">2   Carry water below the two loggia ties</text><rect x="84.5" y="144" width="99" height="228" fill="#d5dfd3" stroke="#16706a"/><rect x="183.5" y="144" width="288" height="153" fill="#ebebdf" stroke="#16706a"/><rect x="275" y="264" width="181.5" height="33" fill="#a7c6bd" stroke="#16706a"/><rect x="275" y="144" width="181.5" height="33" fill="#a7c6bd" stroke="#16706a"/><rect x="459.5" y="192" width="60" height="180" fill="#a0bdcd" stroke="#2c6689"/><rect x="459.5" y="150" width="60" height="42" fill="#baceda" stroke="#2c6689"/><path d="M281 264L365 264" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><path d="M368 264L440 264" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><path d="M443 264L455 264" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><path d="M281 177L365 177" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><path d="M368 177L440 177" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><path d="M443 177L455 177" fill="none" stroke="#ac4737" stroke-width="4" stroke-dasharray=""/><rect x="324.5" y="258" width="72" height="40.5" fill="none" stroke="#2c6689"/><rect x="324.5" y="138" width="72" height="40.5" fill="none" stroke="#2c6689"/><rect x="467" y="153" width="45" height="36" fill="none" stroke="#2c6689"/><rect x="441.5" y="202.5" width="30" height="69" fill="#d9bd78" stroke="#c49248"/><path d="M77 133.5L422 133.5" fill="none" stroke="#193b3c" stroke-width="3" stroke-dasharray=""/><text x="74" y="412" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Blue boxes = fixed cups below; red = stepped side spill edges.</text><text x="74" y="434" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Retained spout (ochre) and impact basket (blue) remain separate.</text><text x="92" y="263" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193b3c">West</text><text x="92" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#193b3c">carrier</text><text x="254" y="272" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193b3c">East carrier</text><rect x="760" y="234" width="300" height="192" fill="#ebece4" stroke="#bbbfaf"/><rect x="735" y="116" width="150" height="68" fill="#d3e3e7" stroke="#2c6689"/><rect x="815" y="146" width="50" height="24" fill="#789da9" stroke="#2c6689"/><rect x="760" y="388" width="300" height="24" fill="#d7c296" stroke="#c49248"/><rect x="760" y="243.29999999999998" width="300" height="24" fill="#d7c296" stroke="#c49248"/><rect x="730" y="388" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><rect x="1030" y="388" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><rect x="730" y="315" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><rect x="1030" y="315" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><rect x="730" y="243.29999999999998" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><rect x="1030" y="243.29999999999998" width="60" height="24" fill="#c2b79c" stroke="#c49248"/><path d="M1010 444.4L1010 210" fill="none" stroke="#16706a" stroke-width="5" stroke-dasharray=""/><path d="M1010 210L840 210" fill="none" stroke="#16706a" stroke-width="5" stroke-dasharray=""/><path d="M840 210L840 158" fill="none" stroke="#16706a" stroke-width="5" stroke-dasharray=""/><text x="1092" y="186" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193b3c">North basin</text><text x="1092" y="208" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Deep new forebay</text><text x="1098" y="262" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Tie at Y11667.5</text><text x="1098" y="404" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Tie at Y8050</text><text x="1098" y="444" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#193b3c">Courtyard drops</text><text x="684" y="466" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#193b3c">X and Y have different scales here. The numerical model uses true plan distances.</text><path d="M35 485L1294 485" fill="none" stroke="#b6c2bd" stroke-width="2" stroke-dasharray=""/><text x="35" y="522" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193b3c">3   Compare water levels in the adverse 4.439 L/s case</text><path d="M694 574.6736625L794 574.6736625" fill="none" stroke="#ac4737" stroke-width="3" stroke-dasharray=""/><path d="M694 580.0354334306027L794 580.0354334306027" fill="none" stroke="#16706a" stroke-width="3" stroke-dasharray=""/><path d="M694 665.3096569880452L794 665.3096569880452" fill="none" stroke="#2c6689" stroke-width="3" stroke-dasharray=""/><path d="M694 672.125L794 672.125" fill="none" stroke="#193b3c" stroke-width="3" stroke-dasharray=""/><path d="M694 719.1719819613942L794 719.1719819613942" fill="none" stroke="#2c6689" stroke-width="3" stroke-dasharray=""/><path d="M694 767.575L794 767.575" fill="none" stroke="#193b3c" stroke-width="3" stroke-dasharray=""/><text x="52" y="558" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#ac4737">First low pan edge, 5 lower  -185.2</text><path d="M355 553L694 574.6736625" fill="none" stroke="#ac4737" stroke-width="1" stroke-dasharray=""/><text x="52" y="593" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#16706a">Both galleries operating  -198.1</text><path d="M355 588L694 580.0354334306027" fill="none" stroke="#16706a" stroke-width="1" stroke-dasharray=""/><text x="52" y="628" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#2c6689">Separate basket · quiet cell  -403.6</text><path d="M355 623L694 665.3096569880452" fill="none" stroke="#2c6689" stroke-width="1" stroke-dasharray=""/><text x="52" y="663" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#193b3c">Gallery receiver rim  -420.0</text><path d="M355 658L694 672.125" fill="none" stroke="#193b3c" stroke-width="1" stroke-dasharray=""/><text x="52" y="698" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#2c6689">Backwater at the source  -533.4</text><path d="M355 693L694 719.1719819613942" fill="none" stroke="#2c6689" stroke-width="1" stroke-dasharray=""/><text x="52" y="733" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#193b3c">Faulted north basin  -650.0</text><path d="M355 728L694 767.575" fill="none" stroke="#193b3c" stroke-width="1" stroke-dasharray=""/><text x="855" y="564" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#16706a">Two gallery edges retain 12.9 mm</text><text x="855" y="587" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#193b3c">to the lowered old spill in this case.</text><text x="855" y="637" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ac4737">Loss of one whole gallery</text><text x="855" y="660" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#193b3c">with further debris fails by 4.0 mm.</text><text x="855" y="719" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#193b3c">A failed north site basin removes</text><text x="855" y="742" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#193b3c">this leg and the normal N outfall.</text><text x="35" y="807" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#193b3c">First harmful water, soil and actual basin tail remain unmeasured. The existing north weather skirt stays continuous.</text></svg>
