<text x="30" y="389" font-size="20">The retained mouth governs</text>
<text x="30" y="418" font-size="15">At 3.604 L/s it needs 57.08 mm even without a local loss. The adverse trial grants only 56.15 mm.</text>
<text x="30" y="447" font-size="15">With one velocity head lost, ideal width redistribution needs 395.94 mm clear. The guarded section offers 380 mm.</text>
<text x="30" y="474" font-size="13">Amber-grey = adjacent gutters. Blue = removable rear tray location. Green = bidirectional low connection.</text>
