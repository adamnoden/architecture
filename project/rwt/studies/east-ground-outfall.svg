<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" role="img" aria-labelledby="t d">
<title id="t">East basin, staff escape and module exchange</title>
<desc id="d">The upper service landing turns north before the stair descends. The goods lift and its unloading bay lie further north. Two open water channels continue east below the upper landing.</desc>
<defs>
  <pattern id="steps" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0V18" stroke="#68846f" stroke-width="2"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#286758"/></marker>
  <style>text{font-family:DejaVu Sans,sans-serif;fill:#25333c}.t{font-size:25px;font-weight:bold}.h{font-size:17px;font-weight:bold}.s{font-size:13px}.tiny{font-size:12px}.guide{stroke:#536875;fill:none;stroke-width:1.5}.wet{fill:#bfdeef;stroke:#407797}.dry{fill:#e4eee6;stroke:#577863}.cargo{fill:#e6def0;stroke:#856e9a}.panel{fill:#f4f6f6;stroke:#bcc6c8}</style>
</defs>
<rect width="1020" height="600" fill="#fff"/>
