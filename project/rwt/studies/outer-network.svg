<text x="263" y="357" fill="#253d3e" font-family="sans-serif" font-size="15" font-weight="700">COURT</text>
<text x="663" y="176" fill="#253d3e" font-family="sans-serif" font-size="18" font-weight="400">One outer face loads the eave at 1.405 L/s.</text>
<text x="663" y="204" fill="#253d3e" font-family="sans-serif" font-size="17" font-weight="400">West and east divide at mid-side. Each half falls</text>
<text x="663" y="229" fill="#253d3e" font-family="sans-serif" font-size="17" font-weight="400">round its corner to the north or south face.</text>
<text x="663" y="267" fill="#253d3e" font-family="sans-serif" font-size="18" font-weight="700">Each end must receive 2.811 L/s at the trial event.</text>
<text x="663" y="297" fill="#253d3e" font-family="sans-serif" font-size="17" font-weight="400">Teal is the normal circuit. Broken red is the relief.</text>
<text x="663" y="322" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">Keep their collecting boxes and receiving channels separate.</text>
<text x="663" y="347" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">Green is the dry escape. Ochre is the plant exchange dock.</text>
<text x="663" y="372" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">Hatched areas belong to the courtyard outlets.</text>
<path d="M663 402H1210" fill="none" stroke="#a1b7b2" stroke-width="1" stroke-dasharray="none"/>
<text x="663" y="443" fill="#253d3e" font-family="sans-serif" font-size="21" font-weight="700">03    The four courtyard downpipes</text>
<text x="663" y="482" fill="#253d3e" font-family="sans-serif" font-size="18" font-weight="400">Inner roof and court together assign 3.60375 L/s.</text>
<text x="663" y="514" fill="#253d3e" font-family="sans-serif" font-size="17" font-weight="400">Crosses mark the four feet. Permanent 450 mm boxes fail here.</text>
<text x="663" y="543" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">The north-west box covers 450 × 395 mm of the north inlet.</text>
<text x="663" y="570" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">The north-east box takes 50 × 75 mm of the crew platform.</text>
<text x="663" y="614" fill="#253d3e" font-family="sans-serif" font-size="17" font-weight="700">The temporary pipes work one corner at a time.</text>
<text x="663" y="640" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">A permanent connection must also work with the court occupied.</text>
<path d="M38 733H1220" fill="none" stroke="#a1b7b2" stroke-width="1" stroke-dasharray="none"/>
<text x="38" y="765" fill="#253d3e" font-family="sans-serif" font-size="16" font-weight="400">Source geometry and trial flows. Gutter spacing is enlarged by line weight. The drawing assigns no site drainage or construction capacity.</text>
</svg>
