<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="#fff"/><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#287989"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:3.2px;fill:#203943}.title{font-size:6px;font-weight:700}.head{font-size:4.3px;font-weight:700}.small{font-size:2.85px}.wall{fill:#e9e8e3;stroke:#7c8584;stroke-width:.4}.line{fill:none;stroke:#768589;stroke-width:.45}.wet{fill:none;stroke:#a76532;stroke-width:1.2}.water{fill:none;stroke:#287989;stroke-width:.65;marker-end:url(#arrow)}.lift{fill:none;stroke:#287989;stroke-width:.55;marker-end:url(#arrow)}.seat{fill:#e5eaeb;stroke:#768589;stroke-width:.4}.rule{stroke:#cfdbde;stroke-width:.5}.accent{fill:#ad743d}</style><text x="12" y="15" class="title">Outer-west receiver: separate the cover from the wet body</text><text x="12" y="24" class="">31 October 2026 / RWT-METALS / construction and renewal comparison / schematic, not for construction</text><text x="12" y="35" class="head">A  Inherited edge; proposed functional territories</text><rect x="20" y="47" width="60" height="60" class="wall"/><rect x="41.25" y="68.25" width="17.5" height="17.5" class="seat"/><path d="M20 47 L20 107" class="wet"/><path d="M88 68 L88 52" class="lift"/><text x="86" y="48" class="small">N</text><text x="28" y="58" class="small">12 m square shell</text><text x="39" y="79" class="small">Court</text><text x="12" y="115" class="small">West: no nominal exterior ground door in source</text><text x="12" y="122" class="small">No plot or safe capture width follows.</text><rect x="108" y="57" width="17" height="42" class="wall"/><text x="106" y="51" class="">House</text><text x="145" y="51" class="">a: inspect</text><text x="230" y="51" class="">b: capture</text><text x="348" y="51" class="">c: handle / roots</text><path d="M125 99 L210 99 M323 99 L396 99" class="line"/><rect x="209" y="90" width="17" height="20" class="seat"/><rect x="311" y="90" width="17" height="20" class="seat"/><path d="M226 88 L226 106 L311 106 L311 88" class="wet"/><path d="M212 87 L325 87" class="line"/><path d="M219 85 L219 89" class="line"/><path d="M231 85 L231 89" class="line"/><path d="M243 85 L243 89" class="line"/><path d="M255 85 L255 89" class="line"/><path d="M267 85 L267 89" class="line"/><path d="M279 85 L279 89" class="line"/><path d="M291 85 L291 89" class="line"/><path d="M303 85 L303 89" class="line"/><path d="M315 85 L315 89" class="line"/><path d="M237 72 L237 60 M298 72 L298 60" class="lift"/><path d="M252 57 L252 80 M275 57 L275 80" class="water"/><text x="139" y="112" class="small">Wall base stays accessible</text><text x="217" y="119" class="small">Independent seats carry upper units</text><text x="242" y="112" class="small">Separate cradles: not sized</text><text x="330" y="77" class="small">Hedge provides no</text><text x="330" y="84" class="small">essential drainage credit</text><text x="108" y="126" class="small">Widths, levels, capture, loads and supports remain unselected.</text><path d="M12 132 L408 132" class="rule"/><text x="12" y="143" class="head">B  R1: routine upper-unit removal; larger wet-body repair</text><text x="12" y="151" class="small">Lengthwise concept between designed movement/hydraulic divisions; not a 12 m component</text><path d="M25 167 L25 184 L282 190 L301 190" class="wet"/><rect x="39" y="161" width="45" height="3" class="seat"/><path d="M61 159 L61 152" class="lift"/><rect x="95" y="161" width="45" height="3" class="seat"/><path d="M117 159 L117 152" class="lift"/><rect x="151" y="161" width="45" height="3" class="seat"/><path d="M173 159 L173 152" class="lift"/><rect x="207" y="161" width="45" height="3" class="seat"/><path d="M229 159 L229 152" class="lift"/><rect x="55" y="188" width="17" height="7" class="seat"/><rect x="125" y="188" width="17" height="7" class="seat"/><rect x="200" y="188" width="17" height="7" class="seat"/><path d="M44 174 L266 180" class="water"/><text x="32" y="202" class="small">Upper units lift separately; soldered body seams remain.</text><rect x="266" y="191" width="14" height="6" class="seat"/><text x="244" y="207" class="small">Fixed datum</text><text x="102" y="207" class="small">Sliding seats: design required</text><path d="M306 196 L306 207 L345 207 L345 196" class="wet"/><path d="M300 191 L312 200" class="water"/><text x="318" y="158" class="small">Visible terminal</text><text x="318" y="165" class="small">Receiving level unknown</text><text x="318" y="174" class="small">Open separation shown;</text><text x="318" y="181" class="small">sealed outlet differs.</text><text x="12" y="216" class="small">Wet-body renewal must release its terminal and retainers, or declare the larger reconstruction.</text><path d="M12 223 L408 223" class="rule"/><text x="12" y="235" class="head">C  R2: open transfers spend level difference at every step</text><path d="M20 245 L20 251 L115 254 L124 254" class="wet"/><path d="M132 255 L132 263 L232 266 L240 266" class="wet"/><path d="M248 267 L248 275 L352 278 L363 278" class="wet"/><path d="M44 247 L109 250 M155 257 L224 261 M274 269 L344 273" class="water"/><path d="M124 254 L138 260 M240 266 L254 272" class="water"/><path d="M134 259 L167 260 M250 271 L283 272" class="line"/><text x="139" y="249" class="small">Water level + free gap</text><text x="255" y="260" class="small">Next level + free gap</text><text x="20" y="274" class="small">Each body has its own watertight seams;</text><text x="20" y="281" class="small">the open transfer is not a sealed lap.</text><text x="12" y="291" class="">D &gt;= sum(internal falls) + sum(receiving depths + positive gaps). No available site drop is assumed.</text></svg>
