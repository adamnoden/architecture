sharray="7 5"/><text x="1145" y="120" font-size="21" font-weight="bold">3  Corners diagonal</text><rect x="1152.25" y="152.25" width="507.49999999999994" height="507.49999999999994" fill="#f2f6f7" stroke="#aab7bb" stroke-width="2"/><rect x="1187.775" y="187.775" width="25.1575" height="57.99999999999999" fill="#e6c59d" stroke="#805d30" stroke-width="2"/><rect x="1599.0675" y="187.775" width="25.1575" height="57.99999999999999" fill="#e6c59d" stroke="#805d30" stroke-width="2"/><path d="M1181.25 630.75V181.25H1630.75V630.75" fill="none" stroke="#b43e32" stroke-width="4"/><path d="M1184.15 630.75V184.15H1627.85V630.75" fill="none" stroke="#d87960" stroke-width="2" stroke-dasharray="7 5"/><text x="45" y="730" font-size="20">Red solid: primary drip. Dashed: transferred secondary drip. Ochre: complete tray envelopes.</text><text x="45" y="770" font-size="20">At 240 middle return overlap = 30; the middle misses both side drip lines throughout.</text><text x="45" y="810" font-size="20">Corner trial at +170 toward centre / +145 outward clears both drip lines by 25; return overlap = 125.</text><text x="45" y="850" font-size="20">Corner boxes 175 wide: lateral return and pipe corridor separated; actual elbow and seal remain unproved.</text><text x="45" y="890" font-size="20">Return 150 wide / 65 wall: ideal minimum 58.34 mm at full 3.60375 L/s, not a capacity proof.</text><text x="45" y="940" font-size="20" font-weight="bold">Incomplete: actual gates, seal, drainage, support, rig and live installation must be proven.</text><text x="45" y="980" font-size="19">Parallel faces and moving tools are not all checked by the envelope tests; see result and JSON.</text><text x="45" y="1030" font-size="18">HAD courtSouth projection pinned to eb70d77ee57571088c4a73caa076681dc00590cd; supplied through the coordinated source.</text></g></svg>
