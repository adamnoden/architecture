<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 665" role="img" aria-labelledby="t d">
<title id="t">A corner exchange and two ground service heads</title>
<desc id="d">The upper catch moves diagonally clear of both returned drips. A lower transfer links the adjacent retained pickups. Below, two independent impact chambers precede the normal and east receiving routes. At the east basin angled lances clear both faces of the overflow.</desc>
