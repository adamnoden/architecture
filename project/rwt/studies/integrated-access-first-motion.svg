<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="white"/><g font-family="Arial" fill="#233b49"><text x="40" y="42" font-size="25" font-weight="bold">Integrated trial: gate first-motion negative control</text><text x="40" y="75" font-size="16">Selected court and finite authored ledger; no complete scaffold or escape acceptance</text><rect x="70" y="110" width="700" height="700" fill="#f4f7f7" stroke="#aab"/><rect x="417" y="303" width="306" height="340" fill="#efd6b6" stroke="#a15d21"/><rect x="70" y="660" width="700" height="70" fill="#badde8" stroke="#537a8b"/><line x1="430" y1="316" x2="710" y2="316" stroke="#b32420" stroke-width="6"/><line x1="659.4" y1="120" x2="522.4591003388689" y2="316" stroke="#b32420" stroke-width="5"/><line x1="180.60000000000002" y1="120" x2="180.60000000000002" y2="359.1" stroke="#245b84" stroke-width="5"/><text x="790" y="155" font-size="19">Tan: compact outer envelope</text><text x="790" y="190" font-size="19">Blue: full-width court inlet</text><text x="790" y="225" font-size="19">Red: trial ledger and east leaf</text><text x="790" y="260" font-size="19">East leaf touches at 55.06°</text><text x="790" y="295" font-size="19">Blue line: open west leaf</text><text x="790" y="350" font-size="17">West sweep misses tower box</text><text x="790" y="380" font-size="17">by 299.27 in this plan only.</text><text x="790" y="430" font-size="17">Continuous ledger is authored;</text><text x="790" y="460" font-size="17">another layout needs full proof.</text><text x="40" y="850" font-size="17">Screen, support, lifting, rain paths, access, rescue and assembly remain unadmitted.</text></g></svg>
