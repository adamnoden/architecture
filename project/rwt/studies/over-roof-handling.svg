<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><rect width="1680" height="1188" fill="white"/><g font-family="Arial,sans-serif" fill="#20343e"><text x="45" y="52" font-size="29" font-weight="bold">Sheltered gantry and stair: plan reservations only</text><text x="45" y="85" font-size="18">Both panels use the source court; rectangles are envelopes, not a claim of solid equipment or fit</text><text x="50" y="120" font-size="21" font-weight="bold">West setup</text><rect x="50" y="145" width="665" height="665" fill="#fff" stroke="#303b42" stroke-width="2"/><rect x="88" y="183" width="589" height="589" fill="none" stroke="#8da38c" stroke-width="2" stroke-dasharray="8 5"/><rect x="126.95" y="355.9" width="513" height="290.7" fill="#e9c88e" fill-opacity="0.45" stroke="#a66a16" stroke-width="2"/><rect x="107" y="265.84000000000003" width="380" height="220.02" fill="#8eb6da" fill-opacity="0.48" stroke="#246699" stroke-width="3"/><line x1="107" x2="487" y1="375.85" y2="375.85" stroke="#b62e3a" stroke-width="3" stroke-dasharray="8 5"/><rect x="69" y="164" width="627" height="66.5" fill="#8dc7a0" fill-opacity="0.5" stroke="#357444"/><rect x="69" y="240" width="627" height="66.5" fill="#8dc7a0" fill-opacity="0.5" stroke="#357444" stroke-dasharray="7 4"/><circle cx="139.3" cy="368.25" r="5" fill="#8b5011"/><circle cx="139.3" cy="634.25" r="5" fill="#8b5011"/><circle cx="627.6" cy="368.25" r="5" fill="#8b5011"/><circle cx="627.6" cy="634.25" r="5" fill="#8b5011"/><text x="880" y="120" font-size="21" font-weight="bold">East setup</text><rect x="880" y="145" width="665" height="665" fill="#fff" stroke="#303b42" stroke-width="2"/><rect x="918" y="183" width="589" height="589" fill="none" stroke="#8da38c" stroke-width="2" stroke-dasharray="8 5"/><rect x="956.95" y="355.9" width="513" height="290.7" fill="#e9c88e" fill-opacity="0.45" stroke="#a66a16" stroke-width="2"/><rect x="1108" y="265.84000000000003" width="380" height="220.02" fill="#8eb6da" fill-opacity="0.48" stroke="#246699" stroke-width="3"/><line x1="1108" x2="1488" y1="375.85" y2="375.85" stroke="#b62e3a" stroke-width="3" stroke-dasharray="8 5"/><rect x="899" y="164" width="627" height="66.5" fill="#8dc7a0" fill-opacity="0.5" stroke="#357444"/><rect x="899" y="240" width="627" height="66.5" fill="#8dc7a0" fill-opacity="0.5" stroke="#357444" stroke-dasharray="7 4"/><circle cx="969.3" cy="368.25" r="5" fill="#8b5011"/><circle cx="969.3" cy="634.25" r="5" fill="#8b5011"/><circle cx="1457.6" cy="368.25" r="5" fill="#8b5011"/><circle cx="1457.6" cy="634.25" r="5" fill="#8b5011"/><text x="50" y="850" font-size="19">Black: court · dashed green: physical roof opening · green: all module envelopes before / after 400 mm withdrawal</text><text x="50" y="885" font-size="19">Ochre: stair reservation · blue: gantry bounds · red dashed: assumed centred beam / hook line</text><text x="50" y="920" font-size="19">The 400 mm withdrawal leaves the hook line 365 mm beyond the module edge; actual beam position requires verification.</text><text x="50" y="970" font-size="19">The hook cannot be assumed to use the entire nominal 1500 clear span; each end module needs at least 214.29 mm inward shift.</text><text x="50" y="1010" font-size="19">Roller top, roof, castors, stairs, guards, workers, rigging and recovery are not represented by these plan rectangles.</text><text x="50" y="1060" font-size="20" font-weight="bold">No structural, handling, escape or operational pass.</text></g></svg>
