<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><rect width="1680" height="1188" fill="white"/><g font-family="Arial,sans-serif" fill="#20343e"><text x="45" y="50" font-size="29" font-weight="bold">Access, landing and casualty-transfer reservations</text><text x="45" y="83" font-size="18">Plan envelopes and ideal support probes only · neither ladder nor rescue operation is admitted</text><text x="65" y="122" font-size="20" font-weight="bold">Court / tower and water-live landing</text><rect x="74" y="149" width="630" height="369" fill="#f5f8f8" stroke="#aab7bb" stroke-width="2"/><rect x="74" y="383" width="630" height="63" fill="#bad6e5" stroke="#4f788a" stroke-width="2"/><rect x="231.5" y="149" width="148.5" height="216" fill="#f3d89d" stroke="#99732f" stroke-width="2"/><rect x="380" y="230" width="261" height="153" fill="#e4d5b6" stroke="#99732f" stroke-width="2"/><rect x="425" y="230" width="216" height="153" fill="none" stroke="#4f7180" stroke-width="2"/><rect x="551" y="293" width="81" height="9" fill="#6b7e86" stroke="#334c57" stroke-width="2"/><rect x="434" y="248" width="108" height="108" fill="none" stroke="#a14f45" stroke-width="2"/><rect x="429.5" y="230" width="9" height="9" fill="#263f49" stroke="#263f49" stroke-width="2"/><rect x="627.5" y="230" width="9" height="9" fill="#263f49" stroke="#263f49" stroke-width="2"/><rect x="429.5" y="372.2" width="9" height="9" fill="#263f49" stroke="#263f49" stroke-width="2"/><rect x="627.5" y="372.2" width="9" height="9" fill="#263f49" stroke="#263f49" stroke-width="2"/><text x="850" y="122" font-size="20" font-weight="bold">Loggia / gross transfer zone and supports</text><rect x="859" y="149" width="432" height="765" fill="#f5f8f8" stroke="#aab7bb" stroke-width="2"/><rect x="917.5" y="149" width="148.5" height="765" fill="#f3d89d" stroke="#99732f" stroke-width="2"/><rect x="1057" y="374" width="216" height="396" fill="#ead6d0" stroke="#a14f45" stroke-width="2"/><rect x="937.3" y="369.5" width="9" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="1276.6" y="369.5" width="10.799999999999999" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="937.3" y="477.5" width="9" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="1276.6" y="477.5" width="10.799999999999999" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="937.3" y="585.5" width="9" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="1276.6" y="585.5" width="10.799999999999999" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="937.3" y="693.5" width="9" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><rect x="1276.6" y="693.5" width="10.799999999999999" height="27" fill="#4f7180" stroke="#4f7180" stroke-width="2"/><text x="65" y="590" font-size="19">Yellow: raised route; tan: landing; outlined blue: tower.</text><text x="65" y="625" font-size="19">Red outline: 600-square hoist shaft; dark bar: 450-wide ladder.</text><text x="65" y="660" font-size="19">Foot pads stop 10 before the full-width inlet.</text><text x="65" y="695" font-size="19">A guarded opening and complete wet transfer are not detailed.</text><text x="65" y="755" font-size="19">The loggia's pink 1200 × 2200 area is gross, not usable-cot proof.</text><text x="65" y="790" font-size="19">Blue east/west shoes are narrow reservations in the gap and edge.</text><text x="65" y="825" font-size="19">Landing, support, bracing and actual descent/rescue remain unproved.</text><text x="65" y="860" font-size="19">Each support and guard must preserve the live intake and relief.</text><text x="45" y="1060" font-size="21" font-weight="bold">Do not treat this preliminary geometry as a safe working or rescue method.</text></g></svg>
