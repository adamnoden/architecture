<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><rect width="1680" height="1188" fill="white"/><g font-family="Arial,sans-serif" fill="#20343e"><text x="45" y="50" font-size="29" font-weight="bold">Compact stair and portable gantry / bounding plan</text><text x="45" y="84" font-size="18">Not a scaffold assembly, manufacturer-approved layout, safe lift or rescue plan</text><rect x="108.5" y="143.5" width="595" height="595" fill="#f5f8f8" fill-opacity="1" stroke="#aab7bb" stroke-width="2"/><rect x="125.5" y="160.5" width="561" height="127.50000000000001" fill="#dce6ef" fill-opacity="0.65" stroke="#6b8193" stroke-width="2"/><rect x="108.5" y="611" width="595" height="59.50000000000001" fill="#b9d6e6" fill-opacity="0.8" stroke="#537a8b" stroke-width="2"/><rect x="440" y="328.8" width="238.00000000000003" height="266.90000000000003" fill="#dfbe90" fill-opacity="0.6" stroke="#8d5926" stroke-width="2"/><rect x="270" y="251.62" width="340" height="196.86" fill="#c5b1df" fill-opacity="0.55" stroke="#6b438d" stroke-width="2"/><rect x="257.25" y="271" width="140.25" height="323" fill="#f3d89d" fill-opacity="0.5" stroke="#99732f" stroke-width="2"/><path d="M142.5 704.5V177.5H669.5V704.5" fill="none" stroke="#b43e32" stroke-width="4"/><path d="M202.51 152V355.235 M609.49 152V355.235" stroke="#245b84" stroke-width="5"/><circle cx="202" cy="492" r="12.750000000000002" fill="#1a87a5" stroke="#1a5261" stroke-width="2"/><circle cx="236" cy="560" r="12.750000000000002" fill="#1a87a5" stroke="#1a5261" stroke-width="2"/><text x="780" y="175" font-size="22" font-weight="bold">Plan envelopes at different heights</text><text x="780" y="220" font-size="20">Tan: compact 1400 × 1570 without console brackets.</text><text x="780" y="260" font-size="20">Purple: hypothetical PGRS20 2000 × 1158 bound.</text><text x="780" y="300" font-size="20">Pale blue: A's lower/withdrawal bounding band.</text><text x="780" y="340" font-size="20">Yellow: earlier raised escape ramp reservation.</text><text x="780" y="380" font-size="20">Dark blue: open screen-gate axes; red: roof edge.</text><text x="780" y="420" font-size="20">Teal: two relocated 150-outside deck drops.</text><text x="780" y="480" font-size="20">Tower/gantry bounds overlap 0.704 m² in plan.</text><text x="780" y="520" font-size="20">East open gate enters tower bound for 155.5 along y.</text><text x="780" y="560" font-size="20">Boxes are not solid: these are clashes to resolve, not proved collisions.</text><text x="780" y="600" font-size="20">Feet, stays, braces, roof, slings, use and evacuation need an actual model.</text><text x="45" y="1030" font-size="20" font-weight="bold">No independent access, hoist, water flow, product compatibility or physical acceptance is claimed.</text></g></svg>
