xt><text x="740" y="875" font-size="17">The 700 mm catcher slides 460 mm before the pipe rolls.</text><text x="740" y="921" font-size="17">Parked equipment stays 140 mm from the draw field.</text><text x="740" y="967" font-size="17">Half-width ideal margin at the rear sill: 19.4 mm.</text><text x="740" y="1013" font-size="17">Plan gap to the nearest represented cap: 432.5 mm.</text><text x="740" y="1073" font-size="16">Tilted, obstructed or splashing water can wet the dry lane.</text><text x="740" y="1110" font-size="16">Tail flow, support reactions and actual ground remain open.</text><text x="35" y="1265" font-size="23">Complete forward blockage · the rear and low side curbs are first to wet</text><polyline points="279.12,812.9 241.5,812.9 241.5,906.5 322.25,906.5 322.25,932.5" stroke="#9a582f" stroke-width="3" stroke-dasharray="5 3" fill="none"/><text x="38" y="1310" font-size="17">At 3.604 L/s the empty catcher reaches −1005 in at most 6.41 s.</text><text x="38" y="1350" font-size="16">Dashed ochre in the plan · proposed separate route to the south basin.</text><text x="38" y="1390" font-size="16">West guide ends Y6255. Dry lane starts Y6425.</text><text x="38" y="1430" font-size="16">Clear slot 146 mm. Ideal width needed even at the floor 158.9 mm.</text><text x="38" y="1470" font-size="17">Reject this single side slot. The blocked state still lacks a contained escape.</text></g></svg>
