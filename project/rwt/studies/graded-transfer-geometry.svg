er E floor.</text><text x="50" y="1230" font-size="20">Bank 85 → 100 → 95 mm; final nose drops 5 mm onto selected E floor.</text><text x="50" y="1260" font-size="20">Two-piece E carrier remains at its selected levels; no deeper stagnant sump.</text><text x="50" y="1310" font-size="21">Sectional energy ≠ plan-turn / pressure / splash or first-wetting proof.</text><text x="50" y="1130" font-size="17">Existing well floor −950 mm</text><text x="960" y="115" font-size="23">North-going canopy chase · direct to N receiver</text><path d="M970 205 H1684" stroke="#835f54" stroke-width="4"/><path d="M970 370 L1666 405.09243697478996" stroke="#26768b" stroke-width="6"/><path d="M970 430 H1684" stroke="#ad634b" stroke-dasharray="6 5"/><text x="1710" y="195" font-size="16">Tie 2175 mm</text><text x="1710" y="425" font-size="16">Crew 1800 mm</text><text x="960" y="475" font-size="20">150 × 150 clear; straight invert 1900 → 1841.51 mm.</text><text x="960" y="505" font-size="20">Crew band: lowest wall 1849.1 mm, 49.1 mm over 1800 mm proxy.</text><text x="960" y="535" font-size="20">Chase crown ≤ 2051.5 mm; capped frame bypass 2138 mm.</text><text x="960" y="565" font-size="20">Tie underside 2175 mm → 37 mm over actual bypass cap.</text><text x="960" y="595" font-size="20">Flashed side entries + 50 mm laps; no pipe through an uncut roof.</text><text x="960" y="625" font-size="20">Court 3.60375 + loggia 0.8352 = 4.43895 L/s to N receiver.</text><text x="960" y="655" font-size="20">North turn / west header → vertical outlet 5000,13700,−600 mm.</text><text x="960" y="720" font-size="23">Captured manual retrieval · retract, raise, then lower to locked tray</text><path d="M985 1240 H1212.5" stroke="#777" stroke-width="8"/><path d="M1202 973 L1684.125 1381.8582550251608" stroke="#3c7e91" stroke-width="7"/><path d="M1221.25 1124 H1352.5" stroke="#9d774a" stroke-width="8"/><polyline points="1684.125,1381.8582550251608 1684.125,1060 1261.98697775,1060 1261.98697775,1088" fill="none" stroke="#