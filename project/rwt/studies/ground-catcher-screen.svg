770" y="296" font-size="20">Red: selected primary roof edge.</text><text x="770" y="334" font-size="20">Pale blue: +5540 deck; tan: relocated pads; teal: deck drops.</text><text x="770" y="372" font-size="20">Blue strip: full-width y7000–7350 inlet.</text><text x="770" y="430" font-size="20">Screen hinges 4800/7200; building hinges 5150/6850.</text><text x="770" y="468" font-size="20">Gate tip y5495.5; pad starts y5700: 204.5 nominal.</text><text x="770" y="506" font-size="20">A continuous side-screen footer would cross the inlet.</text><text x="770" y="544" font-size="20">Screen frame/roof gap and all gate, base and corner seals remain open.</text><text x="45" y="1030" font-size="20" font-weight="bold">No physical, flow, weather or egress acceptance. Read the accompanying challenger result.</text></g></svg>
