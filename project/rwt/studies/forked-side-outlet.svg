<text x="45" y="643.1" font-size="13">South spill crest</text>
<text x="49" y="688.1" font-size="12">Spill continues south</text>
<text x="291" y="155.65" font-size="12">Dry draw lane</text>
<text x="73" y="407.1" font-size="12">Basin</text>
<text x="505" y="123" font-size="17">SERVING</text>
<text x="505" y="149" font-size="14">Two enclosed bores cross the old failure plane,</text>
<text x="505" y="169" font-size="14">marked in rust. Each ends over the south basin.</text>
<text x="505" y="215" font-size="17">ISOLATED AND DRAINED</text>
<text x="505" y="242" font-size="14">Release one upstream joint. Move 460 south,</text>
<text x="505" y="262" font-size="14">then 1650 east to the dashed dry parking box.</text>
<text x="505" y="302" font-size="14">During the first move the tips still overhang water.</text>
<text x="505" y="322" font-size="14">The permanent pipe stays locked until the fork is parked.</text>
<text x="505" y="376" font-size="17">GREY GUIDE HEADS</text>
<text x="505" y="402" font-size="14">Two east–west travel lines stay on the dry side</text>
<text x="505" y="422" font-size="14">of the north rim. Guide support and anchors are proposed.</text>
<text x="505" y="478" font-size="17">ONE BRANCH BLOCKED</text>
<text x="505" y="505" font-size="14">The other bore needs the full flow. The upstream</text>
<text x="505" y="525" font-size="14">fork, receiving basin and final outfall remain shared.</text>
<text x="32" y="729" font-size="13">Design comparison. Receiver levels, joint access, lifting, supports and freedom from backwater remain open.</text>
</g></svg>
