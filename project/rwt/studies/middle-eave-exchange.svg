<text x="28" y="503" font-size="14">The two end drips stay over the adjacent troughs throughout the 90 mm slide. The perpendicular roof edges remain on their own receivers.</text>
<text x="28" y="531" font-size="14">If a neighbouring outlet blocks downstream, its existing front lip spills first. This detail requires both receiving paths to remain available.</text>
