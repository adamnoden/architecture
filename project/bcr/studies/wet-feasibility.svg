trial</text><path d="M295,53L310,53" fill="none" stroke="#3c7485" stroke-width=".4" /><path d="M310,53L310,157.5" fill="none" stroke="#3c7485" stroke-width=".4" /><text x="344" y="75" class="">Gross 300 ×750</text><text x="344" y="83" class="">18 faces assumed</text><text x="344" y="91" class="">Inner 264 ×714</text><text x="344" y="103" class="">Circles: bare 110 only</text><text x="344" y="111" class="">No sockets/clips</text><text x="344" y="119" class="">or tool clearance</text><text x="344" y="131" class="">WC y 8977.5 is a</text><text x="344" y="139" class="">plan assumption.</text><text x="12" y="203" class="sub">D  Missing connection is a physical length, not a destination label</text><text x="12" y="214" class="">Source branch polyline: 2200 long; no duty/diameter/level selected. A hypothetical 43 shower pipe at 18/m needs 82.6 vertical envelope.</text><text x="12" y="223" class="">That exceeds 55 by 27.6 before supports; reaching the void through deck/framing remains an independent crossing problem.</text><text x="12" y="234" class="">Bedroom 4 shower arrives at cabinet (492.5,9500). South axis adds 597.5 and 10.755 fall; north adds 125 and 2.25 at 18/m.</text><text x="12" y="243" class="">WC plan route to south axis 150; to north 622.5. Neither includes real connector take-offs or establishes WC fall, vent or hydraulic capacity.</text><text x="12" y="254" class="">Choose the actual stack/fittings/access together. The cabinet footprint is not an approved floor opening; lower-room and base route remain real work.</text><path d="M12,263L408,263" fill="none" stroke="#3c7485" stroke-width=".4" /><text x="12" y="274" class="">Printed scales at 100%. Read bcr-wet-result.md and wet-feasibility.json for declared sources, assumptions, findings and limits.</text><text x="12" y="283" class="">Complete water boundary, isolated release, visible failure, drying and reinstatement must survive the selected assembly. This is an investigation.</text></svg>
