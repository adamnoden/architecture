ivity variables only. Read bcr-structure-result.md and structure-geometry.json for exact evidence and limits.</text><text x="10" y="267" class="">Source fingerprints and reproducible calculation: project/bcr/studies/structure-geometry.ts. Selected roof, floor and stair framing remain unresolved.</text><text x="10" y="279" class="">A3 study sheet / printed scales apply at 100% / schematic load directions and warning boundaries are not construction instructions.</text></svg>
