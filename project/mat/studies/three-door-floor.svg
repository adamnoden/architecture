<rect x="680.50" y="236.25" width="161.00" height="115.00" fill="#e1e7df" stroke="#82928e" />
<rect x="680.50" y="259.25" width="161.00" height="115.00" fill="none" stroke="#266970" stroke-dasharray="6 4" stroke-width="2"/>
<line x1="708.00" y1="438.00" x2="708.00" y2="363.00" stroke="#1c6d75" stroke-width="3" marker-end="url(#arrow)"/>
<text x="857" y="249" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">Lift 35, then move 80 north.</text>
<text x="857" y="277" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">The north panel mirrors this motion.</text>
<text x="857" y="323" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Fixed leg and head fit within</text>
<text x="857" y="346" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">40 mm. Leave 10 on release.</text>
<text x="857" y="400" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">The two-edge cut leaves one</text>
<text x="857" y="423" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">20 mm finger, outside traffic.</text>
<text x="857" y="474" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Remaining plates stay locked.</text>
<text x="611" y="552" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Solid teal = installed end plate. Dashed = translated envelope.</text>
<text x="611" y="578" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Brown = fixed upright. Remove the reveal trim first.</text>
<text x="611" y="611" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Dimensions in mm. Handling and supports remain open.</text>
<line x1="42.00" y1="640.00" x2="1138.00" y2="640.00" stroke="#82928e" stroke-width="1" />
<text x="42" y="676" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">03   Compare the actual wet levels</text>
<text x="42" y="704" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Each column is its own event. A walking crest is visible above the earlier vulnerable joints.</text>
<text x="43" y="747" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">SOUTH COURT</text>
<line x1="43.00" y1="762.00" x2="366.00" y2="762.00" stroke="#a3aba4" stroke-width="1" />
<text x="43" y="787" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">−35 quiet court</text>
<text x="43" y="813" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">+15 protective return</text>
<text x="43" y="849" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">50 mm allocated to splash and setout</text>
<text x="416" y="747" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">FRONT</text>
<line x1="416.00" y1="762.00" x2="739.00" y2="762.00" stroke="#a3aba4" stroke-width="1" />
<text x="416" y="787" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">−37.94 blocked primary</text>
<text x="416" y="813" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">−20 dry backdam</text>
<text x="416" y="849" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">28.00 mm above the wet pan toe</text>
<text x="790" y="747" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">EAST PLANT</text>
<line x1="790.00" y1="762.00" x2="1113.00" y2="762.00" stroke="#a3aba4" stroke-width="1" />
<text x="790" y="787" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">−62.89 blocked primary</text>
<text x="790" y="813" style="font-family:DejaVu Sans,sans-serif;font-size:16px;font-weight:400">−20 dry backdam</text>
<text x="790" y="849" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Only 2.89 mm below the wet toe</text>
