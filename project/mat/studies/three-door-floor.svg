<text x="42" y="138" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">01   East room and replacement opening</text>
<text x="611" y="138" style="font-family:DejaVu Sans,sans-serif;font-size:20px;font-weight:700">02   South end lid and fixed upright</text>
<text x="42" y="162" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Plan · north up · original and revised strips superimposed</text>
<text x="611" y="162" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Enlarged plan · n increases into the room, to the left</text>
