<text x="74" y="208" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">W9 body</text>
<text x="436" y="230" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Recessed strip</text>
<text x="436" y="250" style="font-family:DejaVu Sans,sans-serif;font-size:13px;font-weight:400">X11610–11750</text>
<text x="436" y="302" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">R300 crew</text>
<text x="436" y="323" style="font-family:DejaVu Sans,sans-serif;font-size:13px;font-weight:400">separate states</text>
<text x="68" y="558" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Warm room</text>
<text x="324" y="558" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">East wall →</text>
<text x="42" y="588" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Hatched = common sill. Clay = controls. Gold = rest.</text>
<text x="42" y="613" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:400">Recessing the strip buys 39.5 mm to the W9 cabinets.</text>
<rect x="680.50" y="351.25" width="161.00" height="115.00" fill="#5a9e9f" stroke="#24676c" />
<rect x="770.20" y="374.25" width="71.30" height="92.00" fill="#fbfaf5" stroke="#24676c" />
