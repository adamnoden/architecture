<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial, sans-serif"><text x="16" y="17" font-size="6" fill="#172033">Connected court / wall / internal support junctions</text><text x="16" y="25" font-size="3.5" fill="#172033">D1300 reference candidate · 1:10 at A3 · no adopted threshold or gas-boundary performance</text><text x="16" y="43" font-size="3.5" fill="#172033">A  COURT-WALL CROSSING · longitudinal crop</text><rect x="40" y="76" width="40" height="2" fill="#c7b18b" stroke="#334155" stroke-width=".35"/><line x1="40" y1="84.6" x2="65" y2="88.1" stroke="#087e8b" stroke-width=".35" /><rect x="121.75" y="76" width="65" height="1.5" fill="#c7b18b" stroke="#334155" stroke-width=".35"/><rect x="121.75" y="77.5" width="65" height="6.5" fill="#e5dfd5" stroke="#334155" stroke-width=".35"/><rect x="121.75" y="84" width="65" height="10" fill="#f6d67d" stroke="#334155" stroke-width=".35"/><rect x="148.25" y="94" width="38.5" height="10" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="78.25" y="94" width="70" height="12" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="80" y="77.5" width="41.75" height="16.5" fill="#e5dfd5" stroke="#334155" stroke-width=".35"/><rect x="106.25" y="84" width="14" height="10" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="90" y="66" width="20" height="14.5" fill="none" stroke="#be4a48" stroke-width=".35"/><text x="40" y="62" font-size="2.8" fill="#be4a48">Door/frame/jamb first-harm NOT QUALIFIED</text><line x1="70" y1="63.5" x2="100" y2="75" stroke="#be4a48" stroke-width=".35" /><line x1="65" y1="88.1" x2="65" y2="139.8" stroke="#087e8b" stroke-width=".35" /><line x1="65" y1="139.8" x2="186.75" y2="139.8" stroke="#087e8b" stroke-width=".35" /><line x1="70" y1="107" x2="186.75" y2="107" stroke="#617a8c" stroke-width=".35" /><line x1="70" y1="107.8" x2="186.75" y2="107.8" stroke="#be4a48" stroke-width=".35" /><rect x="70" y="113.8" width="116.75" height="16" fill="none" stroke="#087e8b" stroke-width=".35"/><line x1="65" y1="159.95" x2="186.75" y2="159.95" stroke="#64748b" stroke-width=".35" /><line x1="22" y1="206" x2="205" y2="206" stroke="#6a7a44" stroke-width=".35" /><text x="22" y="215" font-size="2.9" fill="#172033">Pan −86/−121 → inspectable collector to carrier invert −538.</text><text x="22" y="222" font-size="2.9" fill="#172033">W2 vertical/corner/collar continuously welded; fixed lid under bridge.</text><text x="22" y="229" font-size="2.9" fill="#172033">140 ×100 rib bypasses insulation below wall: thermal hold.</text><text x="22" y="236" font-size="2.9" fill="#172033">DPC is in side piers OUT OF this void section; see B route.</text><text x="227" y="43" font-size="3.5" fill="#172033">B  SUPPORT / DPC CONTINUITY ROUTE</text><rect x="240" y="61" width="16" height="12" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="240" y="73" width="16" height="15" fill="#a8a0b0" stroke="#334155" stroke-width=".35"/><rect x="240" y="88" width="16" height="20" fill="#ddd6cc" stroke="#334155" stroke-width=".35"/><text x="263" y="69" font-size="3" fill="#172033">120 flange +140 ×100 rib; bearing bottom −300</text><text x="263" y="81" font-size="3" fill="#172033">Two bonded courses: −300..−450</text><text x="263" y="102" font-size="3" fill="#172033">Aligned side pier → house ground support</text><rect x="240" y="116" width="16" height="20" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="240" y="136" width="16" height="15" fill="#a8a0b0" stroke="#334155" stroke-width=".35"/><rect x="240" y="151" width="16" height="20" fill="#ddd6cc" stroke="#334155" stroke-width=".35"/><text x="263" y="126" font-size="3" fill="#172033">Field RC200 bearing bottom −380</text><text x="263" y="144" font-size="3" fill="#172033">Two bonded courses: −380..−530</text><text x="263" y="165" font-size="3" fill="#172033">No wet RC bypass around mineral band</text><line x1="234" y1="73" x2="234" y2="151" stroke="#7d4973" stroke-width=".35" stroke-dasharray="2 1"/><text x="227" y="183" font-size="3" fill="#172033">Bonded stepped DPC connects side piers, inner/outer leaves</text><text x="227" y="190" font-size="3" fill="#172033">and internal spine supports; no unsupported DPC over void.</text><text x="227" y="197" font-size="3" fill="#172033">Actual bonded corner/step schedule and mortar shear unqualified.</text><text x="227" y="210" font-size="3.5" fill="#172033">C  LOCAL LID SUPPORT BELOW PERMANENT BRIDGE</text><text x="227" y="219" font-size="3" fill="#172033">U wall locally recessed to −330; bridge underside −300.</text><text x="227" y="226" font-size="3" fill="#172033">SS12 seat at −330..−318 crosses insulation to outward land.</text><text x="227" y="233" font-size="3" fill="#172033">Cu seal −318..−316; SS6 lid −316..−310; 10 clear to bridge.</text><text x="227" y="240" font-size="3" fill="#172033">Rib bypasses foam; seat carries lid / clamp only.</text><text x="16" y="254" font-size="3" fill="#172033">Renewal: open ≥780 mm length above a750 wet piece; remove enough400 dry caps. Fixed bridge / inner lid stays.</text><text x="16" y="261" font-size="3" fill="#172033">Translate the750 piece into its clear neighboring position, then lift650. E-court withdrawal is WEST; N-court is NORTH.</text><text x="16" y="268" font-size="3" fill="#172033">840-long air lids with30 end lands are a spatial reservation; bolt release / temporary gas isolation / seal qualification remain unearned.</text><line x1="16" y1="279" x2="66" y2="279" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#172033">500 model mm = 50 paper mm · only at original A3</text><text x="227" y="286" font-size="2.8" fill="#172033">Diagram B is a connected load-path schedule, not a drawn masonry bond.</text></g></svg>
