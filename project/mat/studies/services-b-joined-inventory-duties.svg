troke="#a14738" stroke-width=".35"/><circle cx="25.675" cy="59.225" r=".8" fill="#a14738"/><text x="24" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#a14738">R-01</text><text x="111" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#a14738">E-01</text><text x="20" y="182" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Rear and east wet groups are separate crossings.</text><text x="20" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Upper fixtures are source objects, not selected products.</text><text x="166" y="47" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">R-01 rear sanitary</text><text x="166" y="54" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">New territory within existing 300×750 cabinet.</text><text x="166" y="64" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">E-01 east stack</text><text x="166" y="71" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Two50 + one160 bores are only a local witness.</text><text x="166" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">E-02 east branches</text><text x="166" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">110 body fails80 upper and55 lower service bands.</text><text x="166" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">Domestic hot/cold</text><text x="166" y="105" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">No assigned circuits or third/fourth supply ports.</text><text x="166" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">Dry services</text><text x="166" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Power/data route and boundary crossing unallocated.</text><text x="166" y="132" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">Air / heating</text><text x="166" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">System choice remains open; no two250 duct mandate.</text><text x="166" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.2" fill="#223740">Ground / roof</text><text x="166" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Incoming services, foul outfall and soil vent not fitted.</text><text x="16" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.3" fill="#223740">B  INHERITED PACKING IS A STRESS CONTROL, NOT AN INSTALLED INVENTORY</text><text x="16" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="3" fill="#223740">BCR probes: 2×250 ducts, 3×72 water envelopes, 110 soil body and100×50 dry containment.</text><text x="16" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="3" fill="#223740">The current-house basis withholds historical MVHR / heat-pump routes. Do not force them into B.</text><text x="16" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="3" fill="#223740">Conversely, deleting those probes does not delete actual room ventilation, water, foul or power duties.</text><text x="16" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.1" fill="#a14738">Decision: keep rear R-01 and resolve east branch depth before freezing a whole-floor solid-slab design.</text><text x="16" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">No new bore is authorised by this drawing. Structural review must bind actual product, boundary and reinforcement.</text><path d="M16 279L404 279" fill="none" stroke="#54666b" stroke-width=".4" stroke-dasharray=""/><text x="16" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#223740">Whole-house duties retained; no invented system selection, complete service fit or polymer exception.</text></svg>
