<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial,sans-serif" fill="#203c42">
<title>Shower waste interface: closed-face packing and face-open movement budgets</title>
