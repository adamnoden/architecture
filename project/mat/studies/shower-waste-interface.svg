<text x="42" y="133" font-size="3.1" font-weight="normal" text-anchor="start" fill="#203c42">Centred sweep W</text>
<text x="42" y="140" font-size="3.1" font-weight="normal" text-anchor="start" fill="#203c42">≤ 500 before margins</text>
<text x="42" y="156" font-size="3.1" font-weight="bold" text-anchor="start" fill="#203c42">Exterior parking pocket</text>
<path d="M33.0,181 L108.75,181" fill="none" stroke="#b68031" stroke-width="0.45" stroke-dasharray=""/>
<path d="M33.0,178 L33.0,184" fill="none" stroke="#b68031" stroke-width="0.45" stroke-dasharray=""/>
<path d="M108.75,178 L108.75,184" fill="none" stroke="#b68031" stroke-width="0.45" stroke-dasharray=""/>
<text x="70.875" y="189" font-size="3.5" font-weight="bold" text-anchor="middle" fill="#203c42">757.5 in x</text>
<text x="18" y="206" font-size="3" font-weight="normal" text-anchor="start" fill="#203c42">West exclusion plane x577.5; boxes retained.</text>
<text x="18" y="213" font-size="3" font-weight="normal" text-anchor="start" fill="#203c42">Dashed sweep limits do not size the fascia opening.</text>
<text x="242" y="57" font-size="4.1" font-weight="bold" text-anchor="start" fill="#203c42">02  Separate the two connection states</text>
<text x="242" y="68" font-size="3.5" font-weight="normal" text-anchor="start" fill="#203c42">Outlet end → face: 43</text>
<text x="242" y="75" font-size="3.5" font-weight="normal" text-anchor="start" fill="#203c42">Outlet end → west obstruction: 800.5</text>
<rect x="242" y="83" width="160" height="39" fill="#e6eeeb" stroke="none" stroke-width=".4" stroke-dasharray=""/>
<text x="247" y="93" font-size="3.5" font-weight="bold" text-anchor="start" fill="#203c42">FACE CLOSED · installed envelope</text>
<text x="247" y="108" font-size="6.3" font-weight="bold" text-anchor="start" fill="#203c42">p + cF ≤ 43 mm</text>
<text x="247" y="117" font-size="2.9" font-weight="normal" text-anchor="start" fill="#203c42">p = installed west projection from the outlet end</text>
<rect x="242" y="131" width="160" height="47" fill="#f4ead6" stroke="none" stroke-width=".4" stroke-dasharray=""/>
<text x="247" y="141" font-size="3.5" font-weight="bold" text-anchor="start" fill="#203c42">FACE REMOVED · west translation</text>
<text x="247" y="156" font-size="6" font-weight="bold" text-anchor="start" fill="#203c42">p + r + cW ≤ 800.5 mm</text>
<text x="247" y="166" font-size="3" font-weight="normal" text-anchor="start" fill="#203c42">r moves the same part that defines p.</text>
<text x="247" y="173" font-size="2.8" font-weight="normal" text-anchor="start" fill="#203c42">Available travel bound; actual joint release unproved.</text>
<text x="242" y="190" font-size="3.3" font-weight="bold" text-anchor="start" fill="#203c42">Whole-body parking is independent:</text>
<text x="242" y="200" font-size="4.6" font-weight="bold" text-anchor="start" fill="#203c42">Lx + cW + cE ≤ 757.5 mm</text>
<text x="242" y="208" font-size="3" font-weight="normal" text-anchor="start" fill="#203c42">Lx includes all retained body projections.</text>
<text x="242" y="214" font-size="2.8" font-weight="normal" text-anchor="start" fill="#203c42">cF / cW / cE are separate clearances, not fixed values.</text>
<path d="M18,222 L402,222" fill="none" stroke="#6e8585" stroke-width="0.45" stroke-dasharray=""/>
<text x="18" y="233" font-size="4.1" font-weight="bold" text-anchor="start" fill="#203c42">03  Clear opening and retained supports remain unbound</text>
<text x="18" y="243" font-size="3.5" font-weight="normal" text-anchor="start" fill="#203c42">Clear width / height must contain the actual crossing swept envelope plus its margins.</text>
<text x="18" y="251" font-size="3.3" font-weight="normal" text-anchor="start" fill="#203c42">Keep the tray, frame and every required support fixed. No rail length is used as an aperture dimension.</text>
<text x="18" y="259" font-size="3.2" font-weight="normal" text-anchor="start" fill="#203c42">W + 2cN ≤ 500 applies to the centred straight-west sweep against the north-box footprint only.</text>
<text x="18" y="271" font-size="2.8" font-weight="normal" text-anchor="start" fill="#203c42">Sources: retained MAT plan and IAS/HAD JSON; Tecom PDOTT90 p1 (167 mm centre-to-brass-end). Dimensions in mm.</text>
<text x="18" y="279" font-size="2.8" font-weight="normal" text-anchor="start" fill="#203c42">Seat, complete body, connector, tool motion and vertical support datums are unknown. No installed vertical assembly is drawn.</text>
<text x="18" y="287" font-size="2.7" font-weight="normal" text-anchor="start" fill="#203c42">Reproduce: python project/mat/studies/shower-waste-interface.py --check · Source fingerprints and assumptions in companion JSON.</text>
</svg>
