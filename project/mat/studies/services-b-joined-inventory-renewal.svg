00east claims no rear-hand space. Green:separate body route.</text><text x="16" y="175" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Raw900 door aperture only; stage pan at3800/10622.5 in Bedroom4, clear of wardrobe.</text><text x="16" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Steel dry face455×800×2 ≈5.71kg; release30 east, then750 south onto a separate rack.</text><text x="16" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">Permanent cabinet frame, supported stack and floor seals stay. No person enters the cabinet.</text><text x="16" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">1  Isolate water / flush / foul use; support and release actual pan connections and fixings.</text><text x="16" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">2  Withdraw pan east, shift south, pass raw doorway and park; retain every connection tail in actual handling proof.</text><text x="16" y="234" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">3  Support dry cover, release room-side fixings, translate30east then750south to independently supported rack.</text><text x="16" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">4  Inspect from the separate body path; only renew a bounded supported pipe section with actual proved joints.</text><text x="16" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#223740">5  Restore/test boundaries, reverse cover and pan paths; inspect every disturbed joint and dry affected surfaces.</text><text x="16" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.9" fill="#a14738">This finite plan witness does not prove safe ceramic handling, real connector release, seal material or a tested sanitation system.</text><path d="M16 279L404 279" fill="none" stroke="#54666b" stroke-width=".4" stroke-dasharray=""/><text x="16" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="2.8" fill="#223740">Whole-house duties retained; no invented system selection, complete service fit or polymer exception.</text></svg>
