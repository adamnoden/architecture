<rect x="556.42" y="319.9" width="56.99999999999999" height="17.099999999999998" fill="#7e969c" stroke="#21363b"/>
<rect x="573.52" y="257.2" width="22.799999999999997" height="62.699999999999996" fill="#b4cec4" stroke="#21363b"/>
<text x="40" y="376" font-size="17" fill="#21363b" font-family="Arial,sans-serif">1006 outside / 806 inner rail lane / 629 complete GL width</text>
<text x="40" y="402" font-size="17" fill="#21363b" font-family="Arial,sans-serif">140 mm to beam underside; top plate height 226 mm</text>
<text x="660" y="155" font-size="19" fill="#21363b" font-family="Arial,sans-serif">Receiver stays under native base.</text>
<text x="660" y="186" font-size="18" fill="#21363b" font-family="Arial,sans-serif">6 plate + 80×40×3 crossbeams</text>
<text x="660" y="215" font-size="18" fill="#21363b" font-family="Arial,sans-serif">110 posts + 30-high outboard rails</text>
<text x="660" y="245" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Frame bracing/weld rigidity remain unproved.</text>
<text x="660" y="275" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Actual legs/wheels/handle/operator still bind.</text>
<text x="660" y="305" font-size="17" fill="#21363b" font-family="Arial,sans-serif">Native base 1006×593 ≠ cabinet 1000×597.</text>
<text x="35" y="458" font-size="23" fill="#21363b" font-family="Arial,sans-serif">Deposit on cart: preserve the space needed to withdraw</text>
<rect x="45" y="639.0" width="510" height="18" fill="#8c795f" stroke="#21363b"/>
<rect x="45" y="503.40000000000003" width="510" height="3.5999999999999996" fill="#7e969c" stroke="#21363b"/>
