<text x="35" y="43" font-size="29" fill="#21363b" font-family="Arial,sans-serif">A raised receiver that can actually release the forks</text>
<text x="35" y="74" font-size="19" fill="#21363b" font-family="Arial,sans-serif">Authored reference design — native CG/support and complete transfer remain OPEN</text>
<text x="35" y="117" font-size="22" fill="#21363b" font-family="Arial,sans-serif">Front section: a retained fork lane, not a flat lifting plate</text>
