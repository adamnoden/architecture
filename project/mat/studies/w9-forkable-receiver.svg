<text x="620" y="496" font-size="19" fill="#21363b" font-family="Arial,sans-serif">Cart deck 270 → fork support 410 mm</text>
<text x="620" y="530" font-size="19" fill="#21363b" font-family="Arial,sans-serif">Release fork top to390; then withdraw.</text>
<text x="620" y="564" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Tine thickness + tolerance must fit120 mm.</text>
<text x="620" y="598" font-size="18" fill="#8c402e" font-family="Arial,sans-serif">Flat plate on solid deck fails this handover.</text>
<text x="620" y="632" font-size="18" fill="#8c402e" font-family="Arial,sans-serif">Wheel/leg entry, dock and capture NOT proved.</text>
<text x="35" y="718" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Interface only — complete native machine and cart approach remain separate obligations.</text>
<text x="35" y="763" font-size="24" fill="#21363b" font-family="Arial,sans-serif">The receiver has a real whole-system price</text>
<text x="35" y="802" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Coarse ideal316L frame 48.51 kg; unit+frame 204.51 kg vs227 kg GL4.</text>
<text x="35" y="833" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Only 22.49 kg remains for unscoped native base and all capture hardware.</text>
<text x="35" y="864" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Conservative installed top 1741 mm / on cart 2011 mm; no door-head pass.</text>
<text x="35" y="895" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Cart+listed unit+frame 234.51 kg; gravity-only1:20 force 114.8 N.</text>
<text x="35" y="926" font-size="18" fill="#21363b" font-family="Arial,sans-serif">3kN ideal beam/rail calculation is not local bearing, weld, floor, impact or stability admission.</text>
<text x="35" y="957" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Actual combined CG ≤350 from load face; nominal298.5 depth midpoint is NOT measured CG.</text>
<text x="35" y="988" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Native condensate first release and annual cover/float withdrawal must remain accessible.</text>
<text x="35" y="1019" font-size="18" fill="#21363b" font-family="Arial,sans-serif">Keep96/128 capture/control/heat, all residues, port renewal and folded-route capture duties.</text>
<text x="35" y="1084" font-size="19" fill="#8c402e" font-family="Arial,sans-serif">No apparatus, material exception, cart/handling pass, selected air target or MAT completion.</text>
</svg>
