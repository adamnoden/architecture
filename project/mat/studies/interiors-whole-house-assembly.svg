s">Finished local hood: global2587.5; no universal3100 soffit.</text><text x="430" y="315" class="s">RC200 shown at upper−80..−280; new port is NOT approved.</text><text x="15" y="316" class="h">FINITE BATH RECOMMENDATION / SEPARATE RENEWAL</text><text x="15" y="329" class="s">Actual363-1 body1700x700x410; selected ordinary rim560, native hole local150. Native axis10850/4150; required100E port10950/4150.</text><text x="15" y="339" class="s">Complete trap/nuts/turns require300x300x110 at local40..150, water seal>=50, bore>=40. Outlet120 is AUTHOR target, not a product datum.</text><text x="15" y="349" class="s">Below-slab branch1200 at1:40; full100 fittings +25 support +25 air +20 panel. Existing soil2540 remains lower than bath2587.5.</text><text x="15" y="359" class="s">Ordinary lower task: zero-capture A/B, support retained parts,20S then20DOWN then450DOWN. Spool top2530 leaves57.5 below panel.</text><text x="15" y="369" class="s">Upper body: independently support; strip waste/overflow/feet/required kit before the&lt;=550 module. The long floor tail is NOT part of that body envelope.</text><text x="15" y="379" class="s">Plain tail&lt;=75 through97 sleeve only after all>75 lower halves/nuts/clamps strip.550UP; opened annulus requires isolation, temporary closure, complete reseal/test.</text><text x="15" y="389" class="s">Any actual kit/support/underside unable to meet this whole contract is rejected. No owner exception, actual product match, STR port or physical handling acceptance.</text></svg>
