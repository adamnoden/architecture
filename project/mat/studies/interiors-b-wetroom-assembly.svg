d support until the whole tray/frame module is supported. Lift400; shift40 east; rotate about N–S axis.</text><text x="15" y="241" class="n">4 Maximum900 ×900 ×250 envelope rotates inside934.08-wide sweep; vertical range57.96..992.04 above FFL.</text><text x="15" y="249" class="n">5 Move on edge east to x10275..10525, then north through net775 opening to y8540..9440. Bed starts9492.5.</text><text x="15" y="257" class="n">6 250 is a maximum admission envelope, not measured hardware. Larger Upstand/feet/fittings require a new whole route.</text><text x="15" y="265" class="n">No hydraulic pass: D50 route 2467.5 long, 1:40 target fall 61.69; actual output axis, joints and venting unknown.</text><text x="15" y="273" class="n">No metal-only wetroom: B568 body/PP connections are plastic; concealed seal, pads, fittings, binders and screen remain unadmitted.</text></svg>
