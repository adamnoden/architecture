<text x="683" y="363" class="small">300 upper lap</text>
<text x="905" y="446" class="small">One continuous 3824 lower blank</text>
<text x="661" y="487" class="small">316L sheet replaces the lead specials. Each lower strip arrives unformed</text>
<text x="661" y="509" class="small">on a 602 outside-diameter coil and is drawn uphill on supported guides.</text>
<text x="57" y="610" class="h2">03   Three individually replaceable panes</text>
<text x="57" y="638" class="small">Study at X2100 on SAP-C1. Diagram through its rectangular opening tier.</text>
