<text x="360" y="256" class="small">Six built-in collars.</text>
<text x="360" y="278" class="small">Keep all steel outside</text>
<text x="360" y="300" class="small">the existing RC cage.</text>
<text x="360" y="341" class="small">Outer face Y11737.5</text>
<text x="360" y="363" class="small">Shelf toe Y11977.5</text>
<text x="360" y="385" class="small">80 brick bearing,</text>
<text x="360" y="407" class="small">75 after 5 outward error.</text>
<text x="58" y="490" class="small">Outer collars stop 25 clear of the two reserved roof-rod spreaders.</text>
<text x="58" y="512" class="small">The 72.5 glass overlap isolates the otherwise exposed portal shoulder.</text>
<text x="660" y="180" class="h2">02   Separate the two valley waters</text>
<text x="661" y="207" class="small">Diagram along the 18.25° valley. The upper laps drain downhill.</text>
