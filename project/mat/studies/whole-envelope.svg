<text x="887" y="800" class="small">6.35 wet strip</text>
<text x="1091" y="800" class="small">6.825</text>
<text x="661" y="875" class="small">Four stops bypass excess preload. Hold a measured 0.74–0.84 thick</text>
<text x="661" y="897" class="small">lot at 0.480 nominal gap. Qualify wet seating, repeated release and</text>
<text x="661" y="919" class="small">ageing. This local silicone exception has no owner approval.</text>
<text x="41" y="1017" class="small">The raised roof, plate loads and cuffed wet junctions remain subject to their assembly and site checks.</text>
