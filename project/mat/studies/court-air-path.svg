<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><rect width="1200" height="950" fill="#faf9f4"/><g font-family="Arial" fill="#243842"><text x="30" y="38" font-size="27">Join the ordinary header band to the real pan air path</text><text x="30" y="69" font-size="17">WORKING DESIGN. Whole path not closed; no owning geometry, structure, material or physical admission.</text><text x="60" y="125" font-size="20">A  COURT-S SECTION / north to right</text><rect x="60.0" y="336.0" width="540.0" height="315.0" fill="#bebcb3" stroke="#61747a"/><path d="M60.0 476.0H600.0" stroke="#61747a" stroke-dasharray="7 5"/><rect x="60.0" y="266.0" width="144.0" height="70.0" fill="#c8ded0" stroke="#61747a"/><rect x="60.0" y="220.5" width="144.0" height="45.5" fill="#e5e0d2" stroke="#61747a"/><rect x="60.0" y="210.0" width="144.0" height="10.5" fill="#aebcc4" stroke="#61747a"/><rect x="204.0" y="329.0" width="193.5" height="7.0" fill="#ddd4c3" stroke="#61747a"/><rect x="204.0" y="283.5" width="193.5" height="45.5" fill="#bda17d" stroke="#61747a"/><rect x="204.0" y="276.5" width="193.5" height="7.0" fill="#ddd4c3" stroke="#61747a"/><rect x="204.0" y="231.0" width="193.5" height="45.5" fill="#bda17d" stroke="#61747a"/><rect x="204.0" y="210.0" width="193.5" height="21.0" fill="#d8d9cc" stroke="#61747a" stroke-dasharray="4 3"/><rect x="408.3" y="211.05" width="18.899999999999977" height="2.0999999999999943" fill="#7d9da7" stroke="#61747a"/><rect x="408.3" y="213.15" width="2.6999999999999886" height="29.400000000000006" fill="#7d9da7" stroke="#61747a"/><rect x="424.5" y="213.15" width="2.6999999999999886" height="29.400000000000006" fill="#7d9da7" stroke="#61747a"/><rect x="430.8" y="200.55" width="23.399999999999977" height="42.0" fill="none" stroke="#61747a" stroke-dasharray="4 3"/><path d="M402.0 231.0L402.0 213.15A4.05 3.15 0 0 1 406.05 210.0L429.0 210.0L429.0 199.5L456.0 199.5L456.0 241.5L600.0 244.61108000000002" fill="none" stroke="#a74734" stroke-width="2"/><path d="M213.45000000000002 155V336.0 M397.5 231.0V210.0" fill="none" stroke="#bd732c" stroke-dasharray="5 4"/><text x="70" y="180" font-size="15">Room face 3820.5; header starts 3810.</text><text x="70" y="370" font-size="16">215 mm header / two 65 courses + two 10 beds</text><text x="70" y="397" font-size="15">Proposed cap and fixed air interface remain unassigned.</text><text x="70" y="490" font-size="16">RC200 upper lift / actual common 600 × 450 beam</text><text x="70" y="516" font-size="15">Dashed high-carrier box is NOT a resolved fabrication.</text><text x="70" y="680" font-size="16">Header Y3810..4025 / Z−180..−30; room intrusion 10.5 mm.</text><text x="70" y="708" font-size="16">Local room strip 0.01995 m²; no empty Services route inferred.</text><text x="720" y="125" font-size="20">B  LOWER WEST REVEAL / plan</text><rect x="720" y="262.0" width="100" height="118.0" fill="#e9e5d8" stroke="#61747a"/><rect x="720" y="180.0" width="100" height="82.0" fill="#b9b09e" stroke="#61747a"/><rect x="796" y="180.0" width="24" height="200.0" fill="#e0f0ee" stroke="#61747a"/><rect x="796" y="180.0" width="6.0" height="200.0" fill="#6a9e98" stroke="#61747a"/><rect x="860" y="180.0" width="160" height="112.0" fill="#c9b28e" stroke="#61747a"/><rect x="828" y="180.0" width="6.0" height="176.0" fill="#ae5d48" stroke="#61747a"/><text x="720" y="415" font-size="16">Lower Z−65..100: pre-formed 6 mm + liner 1.5.</text><text x="720" y="444" font-size="16">Both pan/liner and pan/frame minima 2.5 mm.</text><text x="720" y="473" font-size="16">STR isolated jamb already needs return/restraint.</text><text x="720" y="530" font-size="20">C  FRONT BEND / low-carrier zoom</text><path d="M815 690V606.0A67.5 36 0 0 1 882.5 570H1040 M837.5 690V606.0A45 24 0 0 1 882.5 582.0H1040" fill="none" stroke="#a74734" stroke-width="2"/><rect x="845" y="582.0" width="45" height="24" fill="#d7a897" stroke="#61747a"/><rect x="920" y="582.0" width="120" height="24" fill="#7d9da7" stroke="#61747a"/><text x="720" y="738" font-size="16">Inner R3 / outer R4.5; flat starts 4034.5.</text><text x="720" y="768" font-size="16">Old sharp top clashes 1.342 mm; new edge clearance 0.5.</text><text x="60" y="837" font-size="17">Keep actual captures, walking edge, high-carrier bends and every corner/frame contact in the next joined design.</text><text x="60" y="872" font-size="17">No endcap release is deleted yet. No old 35 mm spring law, DPC performance or metal-foil air rating transfers.</text><text x="60" y="907" font-size="17">Crest, bulk water, capillary, thermal surfaces and site duties remain independent; MAT-ENVELOPE stays open.</text></g></svg>
