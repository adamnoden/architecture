troke="#334155" stroke-width=".35"/><rect x="71.85" y="118.95" width="80.3" height="10" fill="#f6d67d" stroke="#334155" stroke-width=".35"/><rect x="81.85" y="86.8" width="0.15" height="32.15" fill="#617a8c" stroke="#334155" stroke-width=".35"/><rect x="142" y="86.8" width="0.15" height="32.15" fill="#617a8c" stroke="#334155" stroke-width=".35"/><rect x="81.85" y="118.8" width="60.3" height="0.15" fill="#617a8c" stroke="#334155" stroke-width=".35"/><rect x="61.85" y="55" width="100.3" height="1.5" fill="#c7b18b" stroke="#334155" stroke-width=".35"/><rect x="61.85" y="56.5" width="100.3" height="6.5" fill="#e5dfd5" stroke="#334155" stroke-width=".35"/><rect x="61.85" y="63" width="100.3" height="10" fill="#f6d67d" stroke="#334155" stroke-width=".35"/><rect x="61.85" y="73" width="100.3" height="10" fill="#b9c2cc" stroke="#334155" stroke-width=".35"/><rect x="79" y="86" width="66" height="0.6" fill="#617a8c" stroke="#334155" stroke-width=".35"/><rect x="79" y="86.6" width="3" height="0.2" fill="#be4a48" stroke="#334155" stroke-width=".35"/><rect x="142" y="86.6" width="3" height="0.2" fill="#be4a48" stroke="#334155" stroke-width=".35"/><line x1="79" y1="86.8" x2="82" y2="86.8" stroke="#617a8c" stroke-width=".35" /><line x1="142" y1="86.8" x2="145" y2="86.8" stroke="#617a8c" stroke-width=".35" /><line x1="80.5" y1="85" x2="80.5" y2="88" stroke="#172033" stroke-width=".35" /><line x1="143.5" y1="85" x2="143.5" y2="88" stroke="#172033" stroke-width=".35" /><rect x="102" y="92.8" width="20" height="16" fill="none" stroke="#087e8b" stroke-width=".35"/><rect x="97" y="92.8" width="30" height="16" fill="none" stroke="#a7b6bd" stroke-width=".35"/><text x="102" y="90.8" font-size="2.7" fill="#087e8b">W1 body 200; joint 300</text><line x1="22" y1="185" x2="205" y2="185" stroke="#6a7a44" stroke-width=".35" /><text x="23" y="190" font-size="2.8" fill="#526039">Authored soil / grade −1300; not an assessed water surface</text><line x1="22" y1="150" x2="205" y2="150" stroke="#b65a42" stroke-width=".35" stroke-dasharray="2 1"/><text x="23" y="148" font-size="2.8" fill="#b65a42">H=300 stress: soil −950 (H300 + 50 loss)</text><line x1="167" y1="138.95" x2="167" y2="150" stroke="#b65a42" stroke-width=".35" /><text x="168.5" y="145" font-size="2.7" fill="#b65a42">110.5 residual</text><text x="22" y="194" font-size="3" fill="#172033">Field: 15 stone + 65 distribution + 100 bare T4+ + RC200 = 380.</text><text x="22" y="201" font-size="3" fill="#172033">Cover: upper180 + RC100 = 280; independent lid top −310 / seal −318.</text><text x="22" y="208" font-size="3" fill="#172033">Fixed U-box: 600 + 2(1.5 SS + 100 glass + 100 RC) = 1003 wide.</text><text x="22" y="215" font-size="3" fill="#172033">W1 and lifted cover support no wall. W2 containment remains fixed.</text><text x="227" y="43" font-size="3.5" fill="#172033">B  CONNECTED DATUM / FAILURE LEDGER</text><text x="227" y="54" font-size="3" fill="#172033">FFL / walking line</text><text x="388" y="54" font-size="3" fill="#172033">0</text><text x="227" y="62" font-size="3" fill="#172033">Independent lid / seal underside</text><text x="388" y="62" font-size="3" fill="#172033">−318</text><text x="227" y="70" font-size="3" fill="#172033">Carrier crown / inlet invert</text><text x="388" y="70" font-size="3" fill="#172033">−378 / −538</text><text x="227" y="78" font-size="3" fill="#172033">Outlet invert after 4250 at 1%</text><text x="388" y="78" font-size="3" fill="#172033">−580.5</text><text x="227" y="86" font-size="3" fill="#172033">Retained tray bottom</text><text x="388" y="86" font-size="3" fill="#172033">−638</text><text x="227" y="94" font-size="3" fill="#172033">Tray +100 glass + RC100 underside</text><text x="388" y="94" font-size="3" fill="#172033">−839.5</text><text x="227" y="102" font-size="3" fill="#172033">D1300 raw soil clearance</text><text x="388" y="102" font-size="3" fill="#172033">460.5</text><text x="227" y="110" font-size="3" fill="#172033">After H300 +50 loss / final surplus</text><text x="388" y="110" font-size="3" fill="#172033">110.5 / 60.5</text><text x="227" y="118" font-size="3" fill="#172033">D1200 surplus over final50</text><text x="388" y="118" font-size="3" fill="#172033">−39.5 FAIL</text><text x="227" y="136" font-size="3.3" fill="#172033">D = 839.5 + 300 + 50 loss + 50 final = 1239.5 → 1300.</text><text x="227" y="144" font-size="2.8" fill="#172033">300 heave, 50 construction loss and 50 final reserve are authored.</text><text x="227" y="151" font-size="2.8" fill="#172033">Not a soil forecast, heave requirement or vent clearance.</text><text x="227" y="165" font-size="3.5" fill="#172033">C  MINERAL WALL / DPC JOIN</text><text x="227" y="174" font-size="3" fill="#172033">Ketley WCBL65: two bonded 65 units + nominal beds</text><text x="227" y="181" font-size="3" fill="#172033">reserve 150. Field band −380..−530; bridge −300..−450.</text><text x="227" y="188" font-size="3" fill="#172033">Stepped return must interrupt every support path.</text><text x="227" y="195" font-size="3" fill="#172033">Lowest field edge is 770 above authored grade.</text><text x="227" y="202" font-size="3" fill="#172033">M12 chemistry, bond / shear and stepped joints unaccepted.</text><text x="227" y="209" font-size="3" fill="#172033">Four courses not fixed: added interfaces earn no reliability.</text><text x="16" y="232" font-size="3.5" fill="#172033">BOUNDARIES AND RENEWAL</text><text x="16" y="241" font-size="3" fill="#172033">Dry mineral cap lifts with rated mechanical handling. A separate bolted SS lid exposes W1 only after temporary wet/gas isolation.</text><text x="16" y="248" font-size="3" fill="#172033">W2 = retained welded stainless tray; separately led exterior declaration. A telltale is not an unsealed gas bypass.</text><text x="16" y="255" font-size="3" fill="#172033">All-metal lid / copper seal is a custom development hypothesis. Circular CF seal evidence does not qualify this rectangular closure.</text><text x="16" y="262" font-size="3" fill="#172033">Thermal resistance 100 / 1000 / 0.041 = 2.439 m²K/W for core only; corners, walls, supports and edge seals require calculation.</text><text x="16" y="269" font-size="3" fill="#172033">FIRST HARM: actual doorset drains / jamb joints remain unlocated; −45 sill underside is not a proved lowest failure boundary.</text><line x1="16" y1="279" x2="66" y2="279" stroke="#172033" stroke-width=".35" /><line x1="16" y1="277" x2="16" y2="281" stroke="#172033" stroke-width=".35" /><line x1="66" y1="277" x2="66" y2="281" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#172033">500 model mm = 50 paper mm · no scale if resized</text><text x="227" y="286" font-size="2.7" fill="#172033">Reproduce: node project/mat/studies/joined-ground-boundary.mjs --check</text></g></svg>
