<text x="300" y="581" font-size="13">outer-S beam</text>
<text x="640" y="371" font-size="16">+15 crossing  /  floor 0  /  original sill underside −60</text>
<text x="640" y="403" font-size="15">Support on the existing −180 beam top via a mineral bed.</text>
<text x="640" y="427" font-size="15">The pan turns up behind the weather path and drips</text>
<text x="640" y="451" font-size="15">20 mm into the independent front collector.</text>
<text x="640" y="483" font-size="15">A blocked side pipe can flood the pan toe.</text>
<text x="640" y="507" font-size="15">The backdam, jamb ends and separate dry air seal matter.</text>
<text x="640" y="539" font-size="15">The side relief must discharge clear of the lower route.</text>
