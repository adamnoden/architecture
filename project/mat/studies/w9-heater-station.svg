<text x="309.1" y="168.1" class="small">W9</text>
<text x="75.4" y="329.1" class="small">Riser</text>
<text x="128.7" y="450.3" class="small">Heater</text>
<text x="174.5" y="758.8" class="small">T7</text>
<text x="283.4" y="461.6" class="small">Warm pipes</text>
<text x="595.0" y="128.0" class="h">Two protected lengths</text>
<text x="595.0" y="162.0" class="body">A 60 mm vertical slip space and two R150 turns feed the station.</text>
<text x="595.0" y="188.0" class="body">The 20.5 mm tangent joins the two fabricated turn planes.</text>
<text x="595.0" y="214.0" class="body">Both ends of the heater retain 1,000 mm of straight duct.</text>
<text x="595.0" y="240.0" class="body">The plotted 370 mm body includes its connections.</text>
<text x="595.0" y="266.0" class="body">The control box, hatch and tools require a measured envelope.</text>
<text x="595.0" y="345.0" class="h">Installed geometry</text>
<text x="595.0" y="379.0" class="body">Round jacket Ø254. Trial horizontal axis Z2451.</text>
<text x="595.0" y="405.0" class="body">Riser / first warm shoulder / second shoulder gaps</text>
<text x="595.0" y="431.0" class="body">   5.8 / 5.9 / 21.3 mm after the stated setout.</text>
<text x="595.0" y="457.0" class="body">Heater transverse envelope limit at the first shoulder: 265.8 mm.</text>
<text x="595.0" y="483.0" class="body">Circular duct to finished intrados: at least 134.0 mm radially.</text>
<text x="595.0" y="509.0" class="body">Service-height reserve over the 2,250 mm field: 64 mm.</text>
<text x="595.0" y="585.0" class="h">After the sensor</text>
<text x="595.0" y="619.0" class="body">Thin line = further routing comparison, centreline only.</text>
<text x="595.0" y="645.0" class="body">A 10 mm probe allowance precedes the R150 west turn.</text>
<text x="595.0" y="671.0" class="body">A 100 mm reducer drops the branch axis 6 mm. Two turns</text>
<text x="595.0" y="697.0" class="body">meet the proposed 214 × 234 jacket at the spine.</text>
<text x="595.0" y="723.0" class="body">Allowance to the south wall: 4.1 mm.</text>
<text x="595.0" y="749.0" class="body">Test the real probe, bend loss, firestop and removal before selection.</text>
<text x="44.0" y="858.0" class="small">Ochre = retained low-level pipework and shoulder reservations. Grey = other apparatus / walls.</text>
<text x="44.0" y="889.0" class="small">The other three ducts, full hatch opening, access platform and support frame are outside this route proof.</text>
<text x="44.0" y="945.0" class="body">Pre-site reference study. The house model still represents local extract.</text>
</svg>
