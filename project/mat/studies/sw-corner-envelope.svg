ont-size="3.2" fill="#263e4a">Two diagonal tension-only ties: roof point outside hull; one tie would compress under roof-only uplift.</text><text x="12.00" y="228.00" font-size="3.2" fill="#263e4a">Four unsealed bores: 12.57% of nominal band footprint bored; replacement grout/contact unqualified.</text><text x="12.00" y="235.00" font-size="3.2" fill="#263e4a">Solid 300 RC bypass: continuous structural concept but direct thermal and capillary bridge.</text><text x="12.00" y="247.00" font-size="3.2" fill="#263e4a">Isolated axial indicator: four Ø20 steel G0.1632 W/K; solid RC 300² G0.4091 W/K across385 mm.</text><text x="12.00" y="254.00" font-size="3.2" fill="#263e4a">Fixed-end 1D only; no 3D ψ/U/surface temperature, no moisture or structural capacity result.</text><text x="12.00" y="266.00" font-size="3.3" fill="#263e4a">Actual collar/bond, reinforcement, signed load, movement, cavity drain, installation and renewal are HOLDS.</text><text x="12.00" y="277.00" font-size="3.1" fill="#263e4a">Source: selected HAD scene, physical slab axis and prior unadopted warm-grid recipe. STR station dimensions bound; structural candidate remains unqualified.</text></g></svg>
