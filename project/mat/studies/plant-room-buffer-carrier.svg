<text x="55" y="1020" font-family="Arial,sans-serif" font-size="16" fill="#21363b">Brown: Ø600 carrier; blue: crew; purple: spotter.</text>
<text x="55" y="1048" font-family="Arial,sans-serif" font-size="16" fill="#21363b">Dock / detach / carry / re-pin at11000/3186.</text>
<text x="55" y="1076" font-family="Arial,sans-serif" font-size="16" fill="#8c402e">East line: no level receiver or grade handling pass.</text>
<text x="660" y="145" font-family="Arial,sans-serif" font-size="23" fill="#21363b">Same-caster comparison</text>
<text x="660" y="190" font-family="Arial,sans-serif" font-size="19" fill="#21363b">Ø600 / carrier 41.07kg / dry assembly 75.07kg</text>
<text x="660" y="220" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Swivel radius 287.99mm; ideal contact-centre support ±100mm</text>
<text x="660" y="250" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Measured CG±25 gives nominal edge margin75mm</text>
<text x="660" y="280" font-family="Arial,sans-serif" font-size="17" fill="#365d86">GL pod / native fork lane overlap 0mm</text>
<text x="660" y="345" font-family="Arial,sans-serif" font-size="19" fill="#21363b">Ø700 / carrier 49.30kg / dry assembly 83.30kg</text>
<text x="660" y="375" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Swivel radius 344.56mm; ideal contact-centre support ±140mm</text>
<text x="660" y="405" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Measured CG±25 gives nominal edge margin115mm</text>
<text x="660" y="435" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">GL pod / native fork lane overlap 35mm</text>
<text x="660" y="535" font-family="Arial,sans-serif" font-size="23" fill="#21363b">Earned plan scope</text>
<text x="660" y="575" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Ø600 +25 reserve: continuous body / crew segments clear.</text>
<text x="660" y="607" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Crew protects full700 cylinder station; body uses native595.</text>
<text x="660" y="639" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Bar25 wide +25 reserve: &gt;106mm continuous plan bound.</text>
<text x="660" y="671" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Grip902–1120mm; frame held during captured bar regrip.</text>
<text x="660" y="703" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Ø700 +25: body-only pass after50mm west centre change.</text>
<text x="660" y="735" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Ø700 needs changed fork/pod and bar/ring handover.</text>
<text x="660" y="805" font-family="Arial,sans-serif" font-size="23" fill="#21363b">Physical joins still open</text>
<text x="660" y="845" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Body path enters full700×700 station by170.12mm.</text>
<text x="660" y="877" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Bind actual cylinder feet / valves / pipe supports there.</text>
<text x="660" y="909" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Native3 buffer feet / capture / residual mass / CG unbound.</text>
<text x="660" y="941" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Four contacts, positive dock and leg/caster transfer unproved.</text>
<text x="660" y="973" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Native200 lateral +150 top / ports need actual room fit.</text>
<text x="660" y="1005" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Polymer/rubber / native insulation / seals remain unapproved.</text>
<text x="660" y="1037" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">W9 crew / riser task / condensate and East receiver stay open.</text>
<text x="35" y="1135" font-family="Arial,sans-serif" font-size="20" fill="#21363b">Current direction: persistent carrier + front. These retained controls do not admit apparatus or geometry.</text>
