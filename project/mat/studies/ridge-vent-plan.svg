<title id="title">Cold roof channels at the raised ridge</title>
<desc id="desc">A square roof and an enlarged north-side plan compare a direct eave-to-ridge route, an outer route ending at a hip, and an inner route starting at a valley. Valley and hip openings are unproven.</desc>
