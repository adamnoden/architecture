<text x="40" y="495" font-size="14" fill="#17242e">Plan: brown support envelopes below the upper deck; blue/green are separate same-level modules. Operators shown are alternative positions.</text>
<text x="1120" y="125" font-size="17" fill="#17242e">One controlled sequence</text>
<text x="1120" y="160" font-size="14" fill="#17242e">1 N verified / E isolated</text>
<text x="1120" y="190" font-size="14" fill="#17242e">2 Guards, then joint hatch</text>
<text x="1120" y="220" font-size="14" fill="#17242e">3 Four side bolts captive</text>
<text x="1120" y="250" font-size="14" fill="#17242e">4 All park covers opened</text>
<text x="1120" y="280" font-size="14" fill="#17242e">5 Rack, then OUTER lands</text>
<text x="1120" y="310" font-size="14" fill="#17242e">6 Upper bearers, INNER</text>
<text x="1120" y="340" font-size="14" fill="#17242e">7 Old out before new in</text>
<text x="1120" y="370" font-size="14" fill="#17242e">8 INNER returns first</text>
<text x="1120" y="400" font-size="14" fill="#17242e">9 Then OUTER / seal test</text>
