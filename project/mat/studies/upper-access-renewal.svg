<text x="850" y="570" font-size="18" fill="#17242e">Actual preferred proof</text>
<text x="850" y="605" font-size="14" fill="#17242e">Bolt full release clearance: 50 mm</text>
<text x="850" y="637" font-size="14" fill="#17242e">Max hand reach: 585.5 / 600 mm</text>
<text x="850" y="669" font-size="14" fill="#17242e">Ratchet half-step bound: 2.182 mm</text>
<text x="850" y="701" font-size="14" fill="#17242e">Hook guard half-step bound: 1.511 mm</text>
<text x="850" y="733" font-size="14" fill="#17242e">U-frame nominal deflections: 0.097 / 0.063 mm</text>
<text x="850" y="765" font-size="14" fill="#17242e">Rack bearer nominal deflection: 0.210 mm</text>
<text x="850" y="797" font-size="14" fill="#17242e">Local D minimum incl. pipe support: 1688 mm</text>
<text x="850" y="829" font-size="14" fill="#a12b23">E / preload / loadshare explicitly assumed</text>
<text x="850" y="861" font-size="14" fill="#a12b23">First-harm margin remains UNKNOWN</text>
<text x="40" y="1060" font-size="16" fill="#17242e">No person below a beam. No bottom flange bolt. No live second receiver. Storage never loads a wet pan.</text>
<text x="40" y="1090" font-size="14" fill="#a12b23">The diagram and internal checks do not substitute for qualified seal, material, force, support, rigging, receiving or actual plot evidence.</text>
