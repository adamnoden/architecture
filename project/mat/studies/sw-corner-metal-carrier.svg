<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="210mm" viewBox="0 0 420 210"><rect width="420" height="210" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:3px;fill:#203b47}.t{font-size:5px;font-weight:bold}.h{font-size:3.6px;font-weight:bold}.m{fill:none;stroke:#bb3e32;stroke-width:1}.rc{fill:#b8ccd5;stroke:#526772;stroke-width:.4}.glass{fill:#eadc9f;stroke:#526772;stroke-width:.3}.aac{fill:#b8d1b0;stroke:#526772;stroke-width:.3}</style><text x="10" y="11" class="t">SW below-structure metal field · finite carrier trial</text><text x="10" y="19">One 1 m panel and corner patch; complete field/perimeter and structural connections remain unresolved.</text><text x="10" y="30" class="h">A PLAN · one panel, not a house-wide grid</text><rect x="16" y="41" width="19.2" height="19.2" fill="#d1e0db" stroke="#bb3e32"/><rect x="37.6" y="62.6" width="64" height="64" fill="#f1f5f4" stroke="#bb3e32" stroke-width="1"/><rect x="34.4" y="59.4" width="6.4" height="6.4" fill="none" stroke="#a55d37" stroke-width=".5" stroke-dasharray="1 1"/><circle cx="37.6" cy="62.6" r="1.6"/><circle cx="101.6" cy="62.6" r="1.6"/><circle cx="37.6" cy="126.6" r="1.6"/><circle cx="101.6" cy="126.6" r="1.6"/><text x="10" y="136">Patch x/y262.5..562.5.</text><text x="10" y="142">Panel x/y600..1600; four hangers.</text><text x="10" y="148">37.5 gap each axis; connector x/y550..650.</text><text x="145" y="30" class="h">B SECTION · geometry at field and receiver</text><rect x="151" y="44" width="111" height="24" class="rc"/><text x="270" y="50">Warm slab −80..−280</text><rect x="151" y="68" width="111" height="36" class="glass"/><text x="270" y="78">320 glass −280..−600</text><rect x="151" y="68" width="26" height="11" class="rc"/><rect x="151" y="79" width="26" height="25" class="aac"/><text x="270" y="89">Local grid bottom −380</text><path d="M158,44 V103 M170,44 V103 M158,105 V125 M170,105 V125" stroke="#263e4a" stroke-width="1"/><path d="M151,104 H262" class="m"/><path d="M184,104 V98 H256 V104 M184,68 V98 M256,68 V98" fill="none" stroke="#325d70" stroke-width="1"/><text x="270" y="100">Field −605..−604</text><text x="270" y="106">40 rail cuts 36 mm glass locally</text><text x="270" y="112">324 hangers through glass</text><rect x="151" y="106" width="26" height="16" fill="#a697b5"/><text x="270" y="122">DPC −615..−765; cold RC below</text><text x="145" y="136">Frame anchors to slab underside; tabs welded to upper field.</text><text x="145" y="142">Split rods weld to opposite faces of plate; no field through-hole.</text><text x="10" y="165" class="h">C LOAD AND BOUNDARY</text><text x="10" y="172">1 mm sheet 7.85 kg + four 40×40×4 rails 9.55 kg + four Ø8 ×324 hangers 0.51 kg = 17.91 kg / nominal panel.</text><text x="10" y="179">0.176 kN gravity only; four equal 0.044 kN reactions are a sensitivity, not anchor design or loaded-capacity proof.</text><text x="10" y="188">Sheet seams, support anchors, slab steel, glass cuts, corrosion, movement, pressure, water/gas testing and repair are HOLDS.</text><text x="10" y="195">Court, walls, thresholds, services and all other bays are not mapped: not a complete barrier or selected system.</text></svg>
