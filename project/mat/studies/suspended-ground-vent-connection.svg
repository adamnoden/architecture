<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,sans-serif" fill="#222"><text x="14" y="17" font-size="6">A mineral vent needs a complete wall connection</text><text x="14" y="26" font-size="3.5">MAT-ENVELOPE | 31 October 2026 | inherited trial, NOT construction | dimensions mm; areas mm²</text><path d="M14,32L406,32" fill="none" stroke="#222" stroke-width=".35"/><text x="14" y="43" font-size="4.4">A   YA13 nominal envelope in the inherited section</text><text x="14" y="51" font-size="3.1">65 is outside height; no clear-passage or weather pass.</text><rect x="60" y="66" width="20.5" height="138" fill="#eee" stroke="#222" stroke-width=".35"/><rect x="112.5" y="66" width="31" height="138" fill="#eee" stroke="#222" stroke-width=".35"/><rect x="112.5" y="78" width="89.5" height="66" fill="#e2e7eb" stroke="#222" stroke-width=".35"/><path d="M112.5,144L202,144" fill="none" stroke="#222" stroke-width=".35"/><rect x="60" y="144" width="20.5" height="30" fill="#dac8a5" stroke="#222" stroke-width=".35"/><rect x="112.5" y="144" width="31" height="30" fill="#dac8a5" stroke="#222" stroke-width=".35"/><rect x="60" y="178" width="10" height="13" fill="#ce916b" stroke="#222" stroke-width=".35"/><rect x="70" y="178" width="73.5" height="13" fill="white" stroke="#222" stroke-width=".35" stroke-dasharray="2 1"/><path d="M73,184.5L155.5,184.5" fill="none" stroke="#222" stroke-width=".35" stroke-dasharray="2 1"/><path d="M14,204L60,204" fill="none" stroke="#222" stroke-width=".35"/><path d="M143.5,204L202,204" fill="none" stroke="#222" stroke-width=".35"/><text x="151" y="75" font-size="3">FFL 0</text><text x="151" y="107" font-size="3">330 stack</text><text x="151" y="141" font-size="3">soffit −330</text><text x="151" y="169" font-size="3">band bottom −480</text><text x="151" y="177" font-size="3">body top −500</text><text x="151" y="192" font-size="3">body base −565</text><text x="151" y="209" font-size="3">solum / ground −630</text><path d="M37,144L37,204" fill="none" stroke="#222" stroke-width=".35"/><path d="M35.5,144L38.5,144" fill="none" stroke="#222" stroke-width=".35"/><path d="M35.5,204L38.5,204" fill="none" stroke="#222" stroke-width=".35"/><text x="39" y="175" font-size="3">300 void</text><path d="M22,191L22,204" fill="none" stroke="#222" stroke-width=".35"/><path d="M20.5,191L23.5,191" fill="none" stroke="#222" stroke-width=".35"/><path d="M20.5,204L23.5,204" fill="none" stroke="#222" stroke-width=".35"/><text x="24" y="198.5" font-size="3">65</text><text x="14" y="218" font-size="3.1">Dashed throat = unresolved connection, not an empty cavity air route.</text><text x="60" y="61" font-size="3">102.5</text><text x="88" y="61" font-size="3">160 cavity</text><text x="124" y="61" font-size="3">155*</text><text x="58" y="225" font-size="3">* Inner allocation includes finish; bearing/masonry below floor unknown.</text><text x="224" y="43" font-size="4.4">B   Free area versus depth and exposure</text><text x="224" y="59" font-size="3.1">Unit</text><text x="253" y="59" font-size="3.1">H</text><text x="274" y="59" font-size="3.1">Free area</text><text x="306" y="59" font-size="3.1">Count*</text><text x="335" y="59" font-size="3.1">V min</text><text x="365" y="59" font-size="3.1">Body base**</text><path d="M224,63L406,63" fill="none" stroke="#222" stroke-width=".35"/><text x="224" y="74" font-size="3.5">YA13</text><text x="253" y="74" font-size="3.5">65</text><text x="274" y="74" font-size="3.5">1300</text><text x="306" y="74" font-size="3.5">14</text><text x="335" y="74" font-size="3.5">265</text><text x="371" y="74" font-size="3.5">+65</text><text x="224" y="86" font-size="3.5">YA14</text><text x="253" y="86" font-size="3.5">140</text><text x="274" y="86" font-size="3.5">2890</text><text x="306" y="86" font-size="3.5">7</text><text x="335" y="86" font-size="3.5">340</text><text x="371" y="86" font-size="3.5">-10</text><text x="224" y="98" font-size="3.5">YA15</text><text x="253" y="98" font-size="3.5">215</text><text x="274" y="98" font-size="3.5">4624</text><text x="306" y="98" font-size="3.5">4</text><text x="335" y="98" font-size="3.5">415</text><text x="371" y="98" font-size="3.5">-85</text><text x="224" y="111" font-size="3.1">* 12 m × 1,500 only. Floor-area / all-parts test still required.</text><text x="224" y="119" font-size="3.1">** Body base above trial ground. Actual aperture edge unknown.</text><text x="224" y="129" font-size="3.1">V min = 150 band + 20 + H + 30; beds/body joints can add depth.</text><text x="224" y="137" font-size="3.1">Nominal residuals: +35 / −40 / −115. None is a complete fit.</text><text x="224" y="152" font-size="4.1">C   The liner crosses the cavity, not the whole wall</text><rect x="244" y="168" width="100" height="6" fill="#eee" stroke="#222" stroke-width=".35"/><rect x="254" y="168" width="80" height="6" fill="#b8c4ce" stroke="#222" stroke-width=".35"/><text x="244" y="164" font-size="3.2">200 liner length</text><text x="267" y="181" font-size="3.2">160 cavity</text><text x="224" y="191" font-size="3.1">40 total nominal surplus; no end engagement is selected.</text><text x="224" y="199" font-size="3.1">Outer / inner masonry throats, joints and support remain open.</text><text x="224" y="209" font-size="3.1">TE115 draws D.P.M. over the liner: protect against cavity water.</text><text x="224" y="217" font-size="3.1">A mineral substitute for that function is not yet qualified.</text><path d="M14,232L406,232" fill="none" stroke="#222" stroke-width=".35"/><text x="14" y="243" font-size="4.4">D   Construction and intervention travel together</text><text x="14" y="253" font-size="3.35">Support the actual opening and DPC above it; identify retained beds / treatments. Do not cut a floor member to obtain a vent.</text><text x="14" y="262" font-size="3.35">Provide reachable clearing of the full passage. Embedded-unit replacement needs its real masonry / support sequence; no crawlway is implied.</text><text x="14" y="271" font-size="3.35">Rytons A1PUFVRGS is a real offset topology, but its supplied acrylic factory sealant excludes the unmodified comparator under policy.</text><path d="M14,278L406,278" fill="none" stroke="#222" stroke-width=".35"/><text x="14" y="288" font-size="3">Sources, hashes and limits: suspended-ground-vent-connection.json and ../suspended-mineral-ground-floor.md. Original section retained.</text></g></svg>
