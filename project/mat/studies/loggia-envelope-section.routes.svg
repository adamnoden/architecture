x1="39.166666666666664" y1="79.83333333333333" x2="79.16666666666666" y2="79.83333333333333" stroke="#67578f" stroke-width=".35" stroke-dasharray="1 1"/><text x="112" y="62" font-size="3" fill="#1e293b">Normal350gross; broadrelief1800clear.</text><text x="112" y="69" font-size="3" fill="#1e293b">Inlet before dam, no downstream cover holes.</text><text x="112" y="76" font-size="3" fill="#1e293b">Solid10SS covers500pitch/50overlap;</text><text x="112" y="83" font-size="3" fill="#1e293b">550×350 module≈15.4kg before handles.</text><text x="112" y="94" font-size="3" fill="#a03535">Actual tiesTOP−550/BOTTOM−750.</text><text x="112" y="101" font-size="3" fill="#a03535">27.5 below deepestlocaldecksoffit.</text><text x="230" y="48" font-size="3.5" fill="#1e293b">B  REPRODUCIBLE UNIFORM-FLOW STRESS</text><text x="230" y="57" font-size="3" fill="#1e293b">Input L/s     Cu250 depth     Surface1800 depth</text><text x="230" y="66" font-size="3" fill="#1e293b">1                   14.48 mm              4.86 mm</text><text x="230" y="74" font-size="3" fill="#1e293b">3                   29.14 mm              9.41 mm</text><text x="230" y="82" font-size="3" fill="#1e293b">6                   46.05 mm              14.30 mm</text><text x="230" y="94" font-size="3" fill="#1e293b">Manning SI: Q=A·R^(2/3)·sqrt(S)/n;</text><text x="230" y="101" font-size="3" fill="#1e293b">R=by/(b+2y), S=.01; n=.020/.025 authored.</text><text x="230" y="108" font-size="3" fill="#1e293b">No inletcapture, bends, surcharge or tailwater</text><text x="230" y="115" font-size="3" fill="#1e293b">acceptance follows from normaldepth.</text><text x="230" y="130" font-size="3.5" fill="#1e293b">C  DEPTH / FAILURE BOUNDARIES</text><text x="230" y="139" font-size="3" fill="#1e293b">100localRCdepression retains200RC;</text><text x="230" y="146" font-size="3" fill="#1e293b">northlocalsoffit−522.5; no heaveD fromfieldalone.</text><text x="230" y="153" font-size="3" fill="#1e293b">Cu bottoms−206.25 at7000,−213.75 at7750,</text><text x="230" y="160" font-size="3" fill="#1e293b">−256.25 at12000,−268.25 at13200.</text><text x="230" y="171" font-size="3" fill="#a03535">Mouthdam110 reachesFFL0;125 reaches+15.</text><text x="230" y="178" font-size="3" fill="#a03535">Actualdoor/panfirstharm may be lower.</text><text x="20" y="219" font-size="3" fill="#1e293b">Separateprimary exterior downroute and broadE spill need independentreceivers; raisedterrace flood/backwater remains explicit.</text><text x="20" y="226" font-size="3" fill="#1e293b">Normalblockage leavesoverlandroute; loggiamouthdam leaves upstreamintake. A blanket spanningBOTH remains a commonfailure.</text><text x="20" y="233" font-size="3" fill="#1e293b">Whole copperrenewal: remove outdoor covers, expose supports/seams, isolate rain and lift released lengths; actual joints/temporaryrouting to earn.</text><text x="20" y="240" font-size="3" fill="#1e293b">Plainmetal cover is debris protection, not a pressure/gas seal. Copperseams, filler/flux, boltresidues and corrosion remain disclosed unknowns.</text><text x="20" y="255" font-size="3" fill="#1e293b">Primary and relief are physically separate hydraulic routes at one loggia. No fullsystem independence is claimed while capacity/receiver acceptance remains unearned.</text><line x1="16" y1="279" x2="49.333" y2="279" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#1e293b">2000 model mm =33.33 paper mm · panel A only</text></g></svg>
