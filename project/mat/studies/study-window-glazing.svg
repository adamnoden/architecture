<text x="32" y="81.5" font-size="13" fill="#233e49">crown +2850</text>
<path d="M135 147.00H147" stroke="#52646b" stroke-dasharray="3 3"/>
<text x="32" y="152.0" font-size="13" fill="#233e49">spring +2550</text>
<path d="M135 172.85H147" stroke="#52646b" stroke-dasharray="3 3"/>
<text x="32" y="177.85" font-size="13" fill="#233e49">rail +2440</text>
<path d="M135 547.67H147" stroke="#52646b" stroke-dasharray="3 3"/>
<text x="32" y="552.67" font-size="13" fill="#233e49">glass +845</text>
<path d="M135 570.00H147" stroke="#52646b" stroke-dasharray="3 3"/>
<text x="32" y="575.0" font-size="13" fill="#233e49">sill +750</text>
<text x="435" y="112" font-size="22" fill="#233e49">12 rectangular vacuum units</text>
<text x="435" y="145" font-size="16" fill="#233e49">Three columns, four rows, with real 40 mm bars.</text>
<text x="435" y="171" font-size="16" fill="#233e49">Each unit 273.33 × 393.75 mm at 15 mm bite.</text>
<text x="435" y="197" font-size="16" fill="#233e49">Raise the transom to the spring and height becomes 421.25 mm.</text>
<text x="435" y="244" font-size="22" fill="#233e49">1 shaped monolithic light</text>
<text x="435" y="276" font-size="16" fill="#233e49">14.8% of clear glass area, 59.0% of centre-only conductance.</text>
<text x="435" y="302" font-size="16" fill="#233e49">The shaped pane needs its own supports and replacement access.</text>
<text x="435" y="350" font-size="22" fill="#233e49">A stock room-side lift-out</text>
<text x="435" y="382" font-size="16" fill="#233e49">The complete outline is inside S45 size and radius limits.</text>
<text x="435" y="408" font-size="16" fill="#233e49">The spring fanlight has 265 mm gross height for a 700 mm</text>
<text x="435" y="433" font-size="16" fill="#233e49">minimum sash. Factory gasket and perimeter bedding also fail</text>
<text x="435" y="458" font-size="16" fill="#233e49">the default material requirement.</text>
<text x="435" y="506" font-size="22" fill="#233e49">40 mm true bar</text>
<text x="435" y="538" font-size="16" fill="#233e49">15 mm bite + 3 mm edge space on each side leave 4 mm</text>
<text x="435" y="563" font-size="16" fill="#233e49">between rebate roots. Strength and retention need a real section.</text>
<text x="32" y="617" font-size="14" fill="#233e49">Architectural comparison in mm. Substrates, joints, independent capture, complete heat loss and weather testing remain open.</text>
</svg>
