<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 455" width="920" height="455" role="img"><title>East plant alternatives at the cargo lift and in the plant room</title><desc>The old outdoor unit overlaps the cargo lift. The new site lies east. The mineral tank requires a separate detachable bridge stand.</desc><rect width="920" height="455" fill="#fcfcf8"/><g font-family="DejaVu Sans, sans-serif" fill="#263b42"><text x="26" y="31" font-size="22" font-weight="700">Six local extracts · plant and cargo access</text><text x="26" y="59" font-size="16" font-weight="700">Outdoor equipment</text><text x="477" y="59" font-size="16" font-weight="700">Mineral-cylinder renewal</text><rect x="26.00" y="75.00" width="407.00" height="310.80" fill="#f4f6f4" stroke="#aab5b2" /><rect x="117.02" y="182.30" width="118.40" height="133.20" fill="#dee8ec" stroke="#35688c" /><rect x="296.10" y="198.95" width="81.40" height="122.10" fill="#e1e8dc" stroke="#70818b" /><rect x="244.30" y="141.60" width="179.82" height="236.80" fill="none" stroke="#137466" stroke-dasharray="5 3"/><rect x="161.79" y="215.60" width="31.82" height="88.80" fill="#efc6b5" stroke="#a44936" /><rect x="318.30" y="215.60" width="31.82" height="88.80" fill="#5f9b86" stroke="#137466" /><rect x="477.00" y="75.00" width="317.33" height="289.59" fill="#f4f6f4" stroke="#aab5b2" /><rect x="477.44" y="130.55" width="80.30" height="102.20" fill="#dbe5e8" stroke="#70818b" /><rect x="583.29" y="94.05" width="94.90" height="94.90" fill="#dbe5e8" stroke="#70818b" /><rect x="695.78" y="75.00" width="94.90" height="43.80" fill="#dbe5e8" stroke="#70818b" /><rect x="623.44" y="80.33" width="146.88" height="87.16" fill="none" stroke="#a44936" stroke-dasharray="4 3"/><rect x="600.81" y="229.10" width="131.40" height="102.20" fill="#e6ecdd" stroke="#8c9d85" /><circle cx="540.22" cy="298.45" r="62.05" fill="none" stroke="#70818b" stroke-dasharray="4 3"/><circle cx="540.22" cy="298.45" r="55.48" fill="#c4ded3" stroke="#137466" /><polyline points="721.99,339.33 578.18,339.33" fill="none" stroke="#a44936" stroke-width="3"/><polyline points="721.99,339.33 593.51,339.33" fill="none" stroke="#137466" stroke-width="4"/><polyline points="593.51,339.33 611.03,324.73" fill="none" stroke="#137466" stroke-width="3"/><circle cx="593.51" cy="339.33" r="5.40" fill="#137466" stroke="#137466" /><circle cx="578.18" cy="339.33" r="4.09" fill="#efc6b5" stroke="#a44936" /><text x="125" y="204" font-size="14" font-weight="700">Lift</text><text x="135" y="350" font-size="12" font-weight="400">Former unit</text><text x="307" y="326" font-size="12" font-weight="400">New unit</text><text x="518" y="300" font-size="13" font-weight="700">Ø760</text><text x="634" y="315" font-size="12" font-weight="400">Work field</text><text x="485" y="163" font-size="11" font-weight="400">Riser</text><text x="591" y="148" font-size="11" font-weight="400">Buffer</text><text x="702" y="102" font-size="11" font-weight="400">Controls</text><text x="26" y="409" font-size="14" font-weight="400">Solid green unit, dashed 1 m protection zone.</text><text x="26" y="433" font-size="14" font-weight="400">The former footprint is wholly inside the lift.</text><text x="477" y="409" font-size="14" font-weight="400">Red marks the old bridge end and W9 footprint.</text><text x="477" y="433" font-size="14" font-weight="400">Green marks the new seat and first diagonal move.</text></g></svg>
