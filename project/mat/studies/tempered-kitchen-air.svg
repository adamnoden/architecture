<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" role="img"><title>Kitchen supply on the south pier and furniture retained for renewal</title><rect width="1060" height="710" fill="#fbfaf5"/><g font-family="DejaVu Sans, sans-serif" fill="#20373e"><text x="32" y="35" font-size="24" font-weight="700">The kitchen keeps its east radiator</text><text x="32" y="61" font-size="15" font-weight="700">Plan · north up</text><text x="647" y="61" font-size="16" font-weight="700">One horizontal supply unit</text><rect x="58.73" y="79.13" width="539.14" height="440.44" fill="#f0f2ea" stroke="#82908e"/><polyline points="136.8,519.6 255.2,519.6" fill="none" stroke="#f0f2ea" stroke-width="3" stroke-dasharray=""/><rect x="168.00" y="257.00" width="112.00" height="168.00" fill="#e4e7e3" stroke="#82908e"/><rect x="98.00" y="348.00" width="70.00" height="70.00" fill="#e4e7e3" stroke="#82908e"/><rect x="98.00" y="264.00" width="70.00" height="70.00" fill="#e4e7e3" stroke="#82908e"/><rect x="196.00" y="79.13" width="126.00" height="84.00" fill="#e4e7e3" stroke="#82908e"/><rect x="483.00" y="79.13" width="84.00" height="84.00" fill="#e4e7e3" stroke="#82908e"/><rect x="506.87" y="344.50" width="91.00" height="91.00" fill="#e4e7e3" stroke="#82908e"/><rect x="569.87" y="152.00" width="28.00" height="189.00" fill="#e4e7e3" stroke="#82908e"/><rect x="329.00" y="79.13" width="140.00" height="28.00" fill="#e4e7e3" stroke="#82908e"/><rect x="70.00" y="181.40" width="70.00" height="70.00" fill="#dcebe6" stroke="#267060"/><rect x="70.00" y="104.40" width="70.00" height="70.00" fill="#dcebe6" stroke="#267060"/><rect x="304.64" y="223.40" width="114.80" height="203.00" fill="none" stroke="#27678a"/><rect x="294.00" y="431.37" width="136.08" height="51.80" fill="#b6d8c6" stroke="#267060"/><text x="170.52" y="341.0" font-size="12" font-weight="400">Table</text><text x="485.52000000000004" y="121.13" font-size="12" font-weight="400">Hob</text><text x="509.39000000000004" y="390.00000000000006" font-size="12" font-weight="400">Fridge</text><text x="406.00000000000006" y="160.4" font-size="11" font-weight="400">Sink / larder</text><polyline points="362.0,457.3 362.0,427.8 371.0,427.8 371.0,467.0 185.5,477.5 185.5,477.5 175.0,498.5 175.0,551.0 196.0,617.5" fill="none" stroke="#a55532" stroke-width="3" stroke-dasharray=""/><polyline points="315.0,299.0 325.5,299.0 325.5,216.4 105.0,216.4 105.0,139.4" fill="none" stroke="#267060" stroke-width="1.5" stroke-dasharray="5 3"/><text x="147.0" y="588.8000000000001" font-size="12" font-weight="400">To east gallery</text><text x="647" y="95" font-size="14" font-weight="400">Outside air → filter, coil and fan → kitchen</text><rect x="675.00" y="128.00" width="45.00" height="30.00" fill="#d6e2e5" stroke="#27678a"/><rect x="721.00" y="136.00" width="82.00" height="14.00" fill="#e1e8e7" stroke="#27678a"/><rect x="804.00" y="119.00" width="97.00" height="48.00" fill="#bfddce" stroke="#267060"/><rect x="902.00" y="136.00" width="100.00" height="14.00" fill="#e1e8e7" stroke="#27678a"/><text x="653" y="190" font-size="12" font-weight="400">West outlet</text><text x="799" y="190" font-size="12" font-weight="400">972 mm unit</text><text x="929" y="190" font-size="12" font-weight="400">East intake</text><text x="647" y="234" font-size="13" font-weight="700">HOT COOKING</text><text x="647" y="259" font-size="14" font-weight="400">Prove ≥48 L/s at the hood and ≥18°C supply.</text><text x="647" y="284" font-size="14" font-weight="400">Largest coil call 3.38 kW, kitchen 1.381 kW.</text><text x="647" y="309" font-size="14" font-weight="400">East emitter supplies 1.443 kW at 55/45°C.</text><text x="647" y="353" font-size="13" font-weight="700">STANDBY</text><text x="647" y="378" font-size="14" font-weight="400">12–15 L/s through the small outlet.</text><text x="647" y="403" font-size="14" font-weight="400">Kitchen stays between −4.34 and −2.00 Pa.</text><text x="647" y="447" font-size="13" font-weight="700">RENEWAL</text><text x="647" y="472" font-size="14" font-weight="400">Park the two east chairs. The table stays.</text><text x="647" y="497" font-size="14" font-weight="400">Isolate and drain, support, then release.</text><text x="647" y="522" font-size="14" font-weight="400">Turn the low 1020 × 450 cart at the doorway.</text><text x="33" y="670" font-size="13" font-weight="400">Green dash · first chair move     Blue frame · service steps     Rust · drained unit on cart</text><text x="33" y="692" font-size="12" font-weight="400">All dimensions are design comparisons. Qualify controls, bracket loads, tools and the occupied route.</text></g></svg>
