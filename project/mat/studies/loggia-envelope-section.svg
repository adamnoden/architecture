frame</text><text x="370" y="208" font-size="2.6" fill="#1e293b">may be wet;</text><text x="370" y="213" font-size="2.6" fill="#1e293b">floor duty</text><text x="370" y="218" font-size="2.6" fill="#1e293b">is separate.</text><text x="22" y="246" font-size="3" fill="#1e293b">Tray base−20→weep−35; return+190 in actual inner block bed;60 spout clears25 gap. Qualification remains required.</text><text x="22" y="253" font-size="3" fill="#1e293b">Deepest cap722.5 +heave300 +loss50 +vent150 =1222.5→D1300; residual227.5, surplus77.5.</text><text x="22" y="260" font-size="3" fill="#1e293b">No side doors in the current loggia source. South court1800 doors remain: exact profile/jamb first harm is unqualified.</text><text x="22" y="267" font-size="3" fill="#1e293b">Normal N edge carrier and independently available relief need finite levels/intakes/receivers; two strips are not automatic independence.</text><text x="22" y="274" font-size="3" fill="#1e293b">900 cap projects150 into deck; actual notch/island follows slope, with6 metal slip cover over25 joint (qualification pending).</text><line x1="16" y1="279" x2="66" y2="279" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#1e293b">500 model mm =50 paper mm · only at original A3</text><text x="220" y="286" font-size="2.6" fill="#1e293b">Reproduce: node project/mat/studies/loggia-envelope-section.mjs --check</text></g></svg>
