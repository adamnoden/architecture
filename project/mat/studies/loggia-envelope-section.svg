="#e4dccb" stroke="#475569" stroke-width=".3"/><line x1="70.75" y1="67" x2="70.75" y2="88.5" stroke="#334155" stroke-width=".35" /><line x1="130.75" y1="67" x2="130.75" y2="88.5" stroke="#334155" stroke-width=".35" /><line x1="190.75" y1="67" x2="190.75" y2="88.5" stroke="#334155" stroke-width=".35" /><line x1="250.75" y1="67" x2="250.75" y2="88.5" stroke="#334155" stroke-width=".35" /><line x1="310.75" y1="67" x2="310.75" y2="88.5" stroke="#334155" stroke-width=".35" /><text x="22" y="111" font-size="3" fill="#1e293b">507.5 wall =15 finish +140 core +200 bare glass +50 drained gap +102.5 brick.</text><text x="22" y="118" font-size="3" fill="#1e293b">RC soffit3170 −200 glass −15 rail/lath −25 render =2930. Anchors/rails bridge insulation.</text><text x="22" y="125" font-size="3" fill="#1e293b">Wet dead80 kg/m²;600×450 grid≈0.212 kN/node; authored±1.5 kPa wind gives ULS≈0.894 kN/node.</text><text x="16" y="135" font-size="3.5" fill="#1e293b">B  WALL BASE / SEPARATED DPC PATHS · vertical crop, 1:10</text><rect x="20" y="155" width="1.5" height="33" fill="#ece4d5" stroke="#475569" stroke-width=".3"/><rect x="21.5" y="155" width="14" height="33" fill="#c9bbb0" stroke="#475569" stroke-width=".3"/><rect x="35.5" y="155" width="20" height="33" fill="#f5d57d" stroke="#475569" stroke-width=".3"/><rect x="55.5" y="155" width="5" height="33" fill="#eef7fa" stroke="#475569" stroke-width=".3"/><rect x="60.5" y="155" width="10.25" height="33" fill="#b87861" stroke="#475569" stroke-width=".3"/><rect x="310.75" y="155" width="10.25" height="33" fill="#b87861" stroke="#475569" stroke-width=".3"/><rect x="321" y="155" width="5" height="33" fill="#eef7fa" stroke="#475569" stroke-width=".3"/><rect x="326" y="155" width="20" height="33" fill="#f5d57d" stroke="#475569" stroke-width=".3"/><rect x="346" y="155" width="14" height="33" fill="#c9bbb0" stroke="#475569" stroke-width=".3"/><rect x="360" y="155" width="1.5" height="33" fill="#ece4d5" stroke="#475569" stroke-width=".3"/><rect x="2