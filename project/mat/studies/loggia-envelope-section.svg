ggia source. South court1800 doors remain: exact profile/jamb first harm is unqualified.</text><text x="22" y="267" font-size="3" fill="#1e293b">Normal N edge carrier and independently available relief need finite levels/intakes/receivers; two strips are not automatic independence.</text><text x="22" y="274" font-size="3" fill="#1e293b">This checkpoint exposes unfinished deck/tray/door duties; it does not redraw them as a completed water boundary.</text><line x1="16" y1="279" x2="66" y2="279" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#1e293b">500 model mm =50 paper mm · only at original A3</text><text x="220" y="286" font-size="2.6" fill="#1e293b">Reproduce: node project/mat/studies/loggia-envelope-section.mjs --check</text></g></svg>
