<text x="355" y="835" font-family="Arial,sans-serif" font-size="22" fill="#21363b">Actual folded front: three source-bound hairpins</text>
<text x="355" y="875" font-family="Arial,sans-serif" font-size="17" fill="#21363b">750 radius in2700×1200 landing; body600 + two crew600 + bar25.</text>
<text x="355" y="909" font-family="Arial,sans-serif" font-size="17" fill="#21363b">990 fore/rear spacing; rear crew80 left-normal clears low-rope conflict.</text>
<text x="355" y="943" font-family="Arial,sans-serif" font-size="17" fill="#21363b">All shapes independently clipped with50 mm inflated samples.</text>
<text x="355" y="977" font-family="Arial,sans-serif" font-size="17" fill="#21363b">1113 poses / turn; continuous raw plan reserve &gt;44.51 mm.</text>
<text x="355" y="1011" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Grip902.90–1051.37 mm includes worst1:20 floor-height difference.</text>
<text x="355" y="1045" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Wheel tilt / transition / steering / braking / final toe are NOT proved.</text>
<text x="355" y="1079" font-family="Arial,sans-serif" font-size="17" fill="#21363b">New anchors / redirects / floor support / independent failure capture open.</text>
<text x="45" y="1215" font-family="Arial,sans-serif" font-size="19" fill="#21363b">Keep the whole system: W9 crew/GL,450 mm riser gap, native condensate/ports, floor/heat/material and capture duties.</text>
<text x="45" y="1250" font-family="Arial,sans-serif" font-size="18" fill="#8c402e">Conditional +60 wall pays the RC offset and actual East-door skewback; no free structure or clearance waiver.</text>
