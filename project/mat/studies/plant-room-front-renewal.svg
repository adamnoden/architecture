<text x="45" y="742" font-family="Arial,sans-serif" font-size="16" fill="#21363b">Brown: full proposed 600 package; blue/purple: real crew paths.</text>
<text x="45" y="770" font-family="Arial,sans-serif" font-size="16" fill="#8c402e">Native 563 casing alone is not full feet / ports / fittings / capture.</text>
<text x="680" y="145" font-family="Arial,sans-serif" font-size="22" fill="#21363b">Persistent carrier: remove the under-load conversion</text>
<text x="680" y="185" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Coarse moving fixture 40.510 kg; native-dry total 74.510 kg.</text>
<text x="680" y="218" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Complete listed water-filled 175.510 kg &gt;150 rolling limit.</text>
<text x="680" y="251" font-family="Arial,sans-serif" font-size="17" fill="#21363b">All four native casters remain fitted; no pod work under GL load.</text>
<text x="680" y="284" font-family="Arial,sans-serif" font-size="17" fill="#21363b">276 mm plate top; 1208 listed stack is not a fitted maximum.</text>
<text x="680" y="317" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Accessible removable stops; flush floor receivers are NEW work.</text>
<text x="680" y="350" font-family="Arial,sans-serif" font-size="17" fill="#21363b">Native full feet / port access / 100 usable litres still qualify.</text>
<text x="680" y="383" font-family="Arial,sans-serif" font-size="17" fill="#21363b">EPP / PUR roles unresolved; caster plastics / seals remain unapproved.</text>
<text x="680" y="450" font-family="Arial,sans-serif" font-size="21" fill="#21363b">Do not turn a positive force case into transport approval</text>
<text x="680" y="490" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Measured CG ≤600 high, ±25 offset; actual four contacts qualify.</text>
<text x="680" y="523" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Signed first-flight equilibrium:150 kg needs ≤124.75 N line tension.</text>
<text x="680" y="556" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">150 N is an authored operating bound, not a native limiter.</text>
<text x="680" y="589" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">1876 high-CG challenge includes negative support resultants.</text>
<text x="680" y="622" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">No drain:175.51 kg wet case remains over the150 kg limit.</text>
<text x="680" y="655" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">TU8 native7.845 kN per anchor; pair15.691 kN on the real beam.</text>
<text x="680" y="688" font-family="Arial,sans-serif" font-size="17" fill="#8c402e">Door/threshold receivers,620 handle and all operator fields open.</text>
