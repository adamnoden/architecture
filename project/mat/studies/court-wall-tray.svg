<text x="209" y="190" font-size="15">Door and jamb aprons</text>
<text x="178" y="253" font-size="15">Separate threshold grate</text>
<text x="32" y="310" font-size="16">Four cleanable outlets discharge onto the landing.</text>
<text x="32" y="340" font-size="15">Each wing has two low points and a closed end at each side.</text>
<text x="32" y="369" font-size="15">The door pan and its removable grates keep their own routes.</text>
<text x="592" y="112" font-size="14">SECTION AT ONE OUTLET</text>
