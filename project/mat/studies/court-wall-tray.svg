<text x="810.85" y="249" font-size="15">+280 weep</text>
<text x="810.85" y="282.5" font-size="15">+120 to +270</text>
<text x="810.85" y="302.5" font-size="15">compared DPC band</text>
<text x="812.75" y="390" font-size="15">Landing 0</text>
<polyline points="32,425 988,425" fill="none" stroke="#bcc6c0" stroke-width="1"/>
<text x="32" y="462" font-size="14">WEST JAMB  /  DEVELOPED SECTION</text>
<text x="32" y="489" font-size="15">The fixed high flashing drains left over the stop. The lower bridge drains onto its own apron.</text>
