<path d="M327.4 667.08 V711" stroke="#176d74" fill="none" stroke-dasharray="3 4"/>
<text x="75" y="635" font-size="13">Wing to spouts</text>
<text x="345.5" y="544.58" font-size="14">High return</text>
<text x="448.1" y="669.08" font-size="14">Bridge +217</text>
<text x="448.1" y="720" font-size="14">Apron +150</text>
<text x="577" y="530" font-size="14">AT THE HIGH DRIP</text>
<text x="577" y="563" font-size="15">1 in 8 fall, with a 12 mm downturned nose</text>
<text x="577" y="595" font-size="15">10.25 mm clear above the bounded stop</text>
<text x="577" y="627" font-size="15">16 mm remains inside the receiving wing</text>
<text x="577" y="659" font-size="15">6 mm remains outside the rough opening</text>
<text x="577" y="691" font-size="15">Clearances include one 4 mm relative error.</text>
<text x="32" y="753" font-size="14">West end shown, east end mirrored. Concealed support, jamb collection, lower-wall wetting and installed drainage remain open.</text>
