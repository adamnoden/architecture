<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,sans-serif"><text x="16" y="16" font-size="6" fill="#1e293b">South-door support / direct bearing and axial restraint</text><text x="16" y="24" font-size="3.5" fill="#1e293b">ONE preferred route;350cantilever removed · authored engineering calculation, no installed capacity/material admission</text><text x="16" y="32" font-size="3" fill="#1e293b">Outerzone mineral seat takes gravity. Short175plate +M12through-ties take restraint; no clampforce through cellular glass.</text><text x="16" y="44" font-size="3.5" fill="#1e293b">A  CAVITY / THROUGH-TIE SECTION ·1:5, at onehingelevel</text><rect x="30" y="68" width="28" height="64" fill="#c8b7a6" stroke="#475569" stroke-width=".3"/><rect x="58" y="68" width="32" height="64" fill="#eef5f6" stroke="#475569" stroke-width=".3"/><rect x="90" y="68" width="20.5" height="64" fill="#b8765f" stroke="#475569" stroke-width=".3"/><rect x="28.4" y="74" width="1.6" height="52" fill="#71818d" stroke="#475569" stroke-width=".3"/><rect x="58" y="74" width="1.6" height="52" fill="#71818d" stroke="#475569" stroke-width=".3"/><rect x="88.4" y="74" width="1.6" height="52" fill="#71818d" stroke="#475569" stroke-width=".3"/><rect x="110.5" y="74" width="1.6" height="52" fill="#71818d" stroke="#475569" stroke-width=".3"/><rect x="59.6" y="112.5" width="28.8" height="5" fill="#71818d" stroke="#475569" stroke-width=".3"/><line x1="24.5" y1="115" x2="116.5" y2="115" stroke="#283d49" stroke-width=".35" /><rect x="59.6" y="82.5" width="28.8" height="5" fill="#71818d" stroke="#475569" stroke-width=".3"/><line x1="24.5" y1="85" x2="116.5" y2="85" stroke="#283d49" stroke-width=".35" /><text x="20" y="143" font-size="3" fill="#1e293b">140inner +160cavity +102.5outer;8faceplates leave144spacer.</text><text x="20" y="150" font-size="3" fill="#1e293b">25OD×3spacer carries clamp; FourM12:100horizontal×150verticalpitch.</text><text x="20" y="157" font-size="3" fill="#1e293b">200×260×8bearingplates;actualair/drip/thermaljoins remain.</text><text x="150" y="44" font-size="3.5" fill="#1e293b">B  EIGHT M5 PER HINGE-SIDE / TIMBER GEOMETRY</text><rect x="166" y="63" width="12" height="40" fill="#987b55" stroke="#475569" stroke-width=".3"/><rect x="178" y="63" width="10" height="40" fill="#71818d" stroke="#475569" stroke-width=".3"/><circle cx="172" cy="66" r=".6" fill="#253d4b"/><circle cx="172" cy="71.2" r=".6" fill="#253d4b"/><circle cx="172" cy="76.4" r=".6" fill="#253d4b"/><circle cx="172" cy="81.6" r=".6" fill="#253d4b"/><circle cx="172" cy="86.8" r=".6" fill="#253d4b"/><circle cx="172" cy="92" r=".6" fill="#253d4b"/><circle cx="172" cy="97.2" r=".6" fill="#253d4b"/><circle cx="172" cy="102.4" r=".6" fill="#253d4b"/><text x="150" y="116" font-size="3" fill="#1e293b">Vertical26pitch,continuous45×240backstrap,50jamb/120stileminimum.</text><text x="150" y="123" font-size="3" fill="#1e293b">Hinges400/1100/1900;minleafend128≥80probe.</text><text x="150" y="130" font-size="3" fill="#1e293b">Lowestrods325, above300panends;no lowpanpuncture.</text><rect x="175" y="138" width="20" height="26" fill="#71818d" stroke="#475569" stroke-width=".3"/><circle cx="180" cy="143.5" r=".6" fill="white" stroke="#283d49" stroke-width=".2"/><circle cx="180" cy="158.5" r=".6" fill="white" stroke="#283d49" stroke-width=".2"/><circle cx="190" cy="143.5" r=".6" fill="white" stroke="#283d49" stroke-width=".2"/><circle cx="190" cy="158.5" r=".6" fill="white" stroke="#283d49" stroke-width=".2"/><text x="200" y="145" font-size="2.8" fill="#1e293b">Fourrod frontalgroup1:10; twohorizontalcolumns</text><text x="200" y="152" font-size="2.8" fill="#1e293b">resist actualyaw, not a verticalpair assumption.</text><text x="225" y="166" font-size="3.5" fill="#1e293b">C  REPRODUCIBLE COMPOUND PROBE</text><text x="225" y="175" font-size="2.8" fill="#1e293b">G/jambincl30kgframe : 0.981kN</text><text x="225" y="182" font-size="2.8" fill="#1e293b">Windonly/level incl1.5unequal : 1.997kN</text><text x="225" y="189" font-size="2.8" fill="#1e293b">Allwindonelevel+1kNuser+stop : 5.291kN</text><text x="225" y="196" font-size="2.8" fill="#1e293b">175×240×14plateσ/δ : 118.1MPa /0.892mm</text><text x="225" y="203" font-size="2.8" fill="#1e293b">M12incl4kNpreloadσ : 121.5MPa</text><text x="225" y="210" font-size="2.8" fill="#1e293b">Masonrybearing /required : 0.788 /1.0MPa</text><text x="225" y="217" font-size="2.8" fill="#1e293b">Timberwasher /required : 0.675 /1.5MPa</text><text x="225" y="224" font-size="2.8" fill="#1e293b">Linearinteractionprobe : 0.893</text><text x="20" y="177" font-size="3.5" fill="#1e293b">Failureboundaries:</text><text x="20" y="185" font-size="3" fill="#1e293b">60×6web≈4.5mmweak-axis→REJECTED.</text><text x="20" y="192" font-size="3" fill="#1e293b">Outerleaf-onlygenericanchor/Type1label lacks</text><text x="20" y="199" font-size="3" fill="#1e293b">localpointload/tiegroup/brickflexure proof.</text><text x="20" y="206" font-size="3" fill="#1e293b">Directbearing+axialties avoids350cantilever;</text><text x="20" y="213" font-size="3" fill="#1e293b">penetrations require actualweather/airdetails.</text><text x="20" y="244" font-size="3" fill="#1e293b">Simplepaired6filletweldline≈68.2MPa;12pin bending≈128.7MPa. Comparators are authored, not exactstainless/filler approval.</text><text x="20" y="251" font-size="3" fill="#1e293b">Timber shear uses educationalEC5/Johansen method,ρ350/fu400/kmod.5/γ1.3/no ropecredit;actualgrade/service/group must bind.</text><text x="20" y="258" font-size="3" fill="#1e293b">No frictioncredit;M5clamp≤.25kN/M12≤4kN require measured method, not generic torque. Lubricants/coatings/residues remain unknown.</text><text x="20" y="265" font-size="3" fill="#1e293b">This is a coherent reference calculation and geometry. Originalstandards, suppliedmaterial, coupledframe and physicalacceptance remain separate.</text><line x1="16" y1="279" x2="66" y2="279" stroke="#172033" stroke-width=".35" /><text x="16" y="286" font-size="2.8" fill="#1e293b">250modelmm=50paper mm in A;B is dimensioned diagram</text></g></svg>
