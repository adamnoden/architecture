<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="210mm" viewBox="0 0 420 210"><rect width="420" height="210" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#263e4a;font-size:3px}.title{font-size:5px;font-weight:bold}.head{font-size:3.7px;font-weight:bold}.metal{fill:none;stroke:#b3352c;stroke-width:1.2}.rc{fill:#b8cbd4;stroke:#526772;stroke-width:.35}.mineral{fill:#c8d8b6;stroke:#526772;stroke-width:.35}.dim{fill:none;stroke:#526772;stroke-width:.35}</style><text x="10" y="12" class="title">SW: welded pan to supported upper field · conditional geometry</text><text x="10" y="20">Four sides close at lower diaphragm; 1 mm upper field on warm slab. No gas/water, structural or physical qualification.</text><text x="10" y="31" class="head">A PLAN · plate and four sides</text><rect x="17" y="38" width="90" height="90" class="rc"/><rect x="34" y="55" width="45" height="45" fill="#dfe8e5" stroke="#b3352c" stroke-width="1.2"/><circle cx="43" cy="64" r="2" fill="#283f4b"/><circle cx="70" cy="64" r="2" fill="#283f4b"/><circle cx="43" cy="91" r="2" fill="#283f4b"/><circle cx="70" cy="91" r="2" fill="#283f4b"/><text x="10" y="137">Pan x/y262.5..562.5; 300 square.</text><text x="10" y="143">Dots: four split-rod axes.</text><text x="10" y="149">Side joins at all four corners.</text><text x="10" y="158">Field must continue across entire</text><text x="10" y="164">floor, walls, court and services.</text><text x="125" y="31" class="head">B WEST CUT · x direction at y502.5</text><text x="272" y="31" class="head">C SOUTH CUT · y direction at x502.5</text><rect x="128.0" y="45.2" width="39.375" height="18" class="rc"/><rect x="212.375" y="45.2" width="20.625" height="18" class="rc"/><rect x="167.375" y="45.2" width="45" height="27" class="rc"/><rect x="167.375" y="72.19999999999999" width="45" height="17.46" class="mineral"/><path class="metal" d="M128.0 45.2 H167.375 V89.66 H212.375 V45.2 H233.0"/><path d="M176.375 45.2 V89.39 M176.375 89.66 V127.1" stroke="#263e4a" stroke-width="1"/><path d="M203.375 45.2 V89.39 M203.375 89.66 V127.1" stroke="#263e4a" stroke-width="1"/><text x="128" y="143">Field −80; pan bottom −574..−571.</text><text x="128" y="149">Split ties: no plate through-hole.</text><text x="128" y="155">Metal sides interrupt warm RC!</text><rect x="275.0" y="45.2" width="39.375" height="18" class="rc"/><rect x="359.375" y="45.2" width="20.625" height="18" class="rc"/><rect x="314.375" y="45.2" width="45" height="27" class="rc"/><rect x="314.375" y="72.19999999999999" width="45" height="17.46" class="mineral"/><path class="metal" d="M275.0 45.2 H314.375 V89.66 H359.375 V45.2 H380.0"/><path d="M323.375 45.2 V89.39 M323.375 89.66 V127.1" stroke="#263e4a" stroke-width="1"/><path d="M350.375 45.2 V89.39 M350.375 89.66 V127.1" stroke="#263e4a" stroke-width="1"/><text x="275" y="143">Field −80; pan bottom −574..−571.</text><text x="275" y="149">Split ties: no plate through-hole.</text><text x="275" y="155">Metal sides interrupt warm RC!</text><text x="10" y="184">RED = proposed continuous metal surface; welds, transitions and movement remain unproved. Schematic, not a construction detail.</text><text x="10" y="191">Structural redesign: sides cross the intended monolithic slab/receiver. Seat, cage, lateral path and all barrier edges are holds.</text><text x="10" y="198">Cold anchor, ground gas/pressure, corrosion, tests, accessible repair and 3D thermal/moisture fields require separate evidence.</text></svg>
