<text x="417" y="527" class="dim" text-anchor="start">200 square foot</text>
<text x="62" y="655" class="body" text-anchor="start">The walking strip is 10.20 m². Only 6.744 m² is flat ceiling.</text>
<text x="62" y="680" class="body" text-anchor="start">The grey ends continue as separate curved, wrapped masonry.</text>
<text x="62" y="706" class="body" text-anchor="start">Lift from a supported station east of the 400-wide water cover.</text>
