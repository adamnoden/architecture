<text x="648" y="271" class="dim" text-anchor="start">+3370 RC top</text>
<text x="648" y="377" class="dim" text-anchor="start">+3170 soffit</text>
<text x="648" y="505" class="dim" text-anchor="start">+2930 glass</text>
<text x="648" y="530" class="dim" text-anchor="start">+2890 finish</text>
<text x="781" y="331" class="body" text-anchor="start">RC200</text>
<text x="971" y="453" class="body" text-anchor="start">240 soffit glass</text>
<text x="753" y="589" class="dim" text-anchor="start">140 core</text>
<text x="850" y="589" class="dim" text-anchor="start">200 glass</text>
<text x="982" y="589" class="dim" text-anchor="start">102.5 brick</text>
<text x="659" y="633" class="body" text-anchor="start">Stop the weather leaf below the glass and turn its head flashing</text>
<text x="659" y="657" class="body" text-anchor="start">out over the face. Keep the 50 cavity free to drain. Bringing</text>
<text x="659" y="681" class="body" text-anchor="start">that cavity to the RC instead costs 19.67 W/m in the 20 K cut.</text>
<text x="659" y="706" class="dim" text-anchor="start">The red line is the room-side air return, accessible from inside.</text>
<rect x="40.00" y="757.00" width="1160.00" height="227.00" fill="#eef2ec" stroke="#cad0c9" stroke-width="1"/>
<text x="61" y="791" class="h" text-anchor="start">03  |  First supported release</text>
<text x="60" y="838" class="h" text-anchor="start">1   Hold the finish</text>
<text x="60" y="870" class="dim" text-anchor="start">Keep both water routes available. Place the stage</text>
<text x="60" y="893" class="dim" text-anchor="start">on four pads east of the channel. Couple the</text>
<text x="60" y="916" class="dim" text-anchor="start">panel frame to a supported tray before release.</text>
<text x="449" y="838" class="h" text-anchor="start">2   Lower one cassette</text>
<text x="449" y="870" class="dim" text-anchor="start">Stand beside the frame, 25 clear of its fall zone.</text>
<text x="449" y="893" class="dim" text-anchor="start">Use the guided side drives. Lower 80 mm on the</text>
<text x="449" y="916" class="dim" text-anchor="start">captured tray. The glass bears on other shelves.</text>
<text x="837" y="838" class="h" text-anchor="start">3   Exchange and restore</text>
<text x="837" y="870" class="dim" text-anchor="start">Remove the catch tray and independent ledge</text>
<text x="837" y="893" class="dim" text-anchor="start">under a supported glass bay. Refit both courses,</text>
<text x="837" y="916" class="dim" text-anchor="start">catches and finish. Check the drained joint.</text>
<text x="62" y="961" class="dim" text-anchor="start">Design comparison only. The cast-in cage, render retention, platform and complete classified assembly require their own qualification.</text>
</svg>
