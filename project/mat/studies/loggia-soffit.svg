<text x="43" y="35" class="k" text-anchor="start">MATERIALS  /  THE NORTH LOGGIA</text>
<text x="42" y="83" class="title" text-anchor="start">A ceiling that can come down one panel at a time</text>
<text x="44" y="113" class="body" text-anchor="start">Trial dimensions in mm. Upper-floor datum +3450. The two masonry portals, their ties and the water channel stay in place.</text>
