<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title desc"><title id="title">Study finish retention and local release</title><desc id="desc">A dimensioned 1:2 section across the finish seam and a 1:5 Study plan excerpt show geometric limits of a top-lifted tile. Both retain the continuous substrate.</desc><style>.title{font:7px Georgia;fill:#362c25}.head{font:4px Georgia;fill:#362c25}.body{font:3.3px Arial;fill:#443830}.small{font:2.7px Arial;fill:#443830}</style><rect width="297" height="210" fill="#f8f4eb"/><text x="12" y="14" class="title">Study · retain, lift and put one piece down</text><text x="12" y="22" class="body">Millimetres · print at actual size · scale bars verify output</text><text x="12" y="36" class="head">A · 1:2 finish support and top access</text><text x="154" y="36" class="head">B · 1:5 first lift and projected rest</text><rect x="12" y="74" width="124" height="10" fill="#c7bba5" stroke="#362c25" stroke-width=".25"/><rect x="12" y="73" width="124" height="1" fill="#d8caae" stroke="#362c25" stroke-width=".25"/><rect x="12" y="64" width="60" height="9" fill="#ac8060" stroke="#362c25" stroke-width=".25"/><rect x="73.5" y="64" width="62.5" height="9" fill="#ac8060" stroke="#362c25" stroke-width=".25"/><rect x="90.5" y="64" width="4" height="1.5" fill="#777f7d" stroke="#362c25" stroke-width=".25"/><rect x="92.1" y="65.5" width="0.8" height="5" fill="#777f7d" stroke="#362c25" stroke-width=".25"/><path d="M72 53L72 55" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M73.5 53L73.5 55" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M72 54L73.5 54" stroke="#362c25" fill="none" stroke-width="0.3"/><text x="72" y="52" class="small">3 seam</text><path d="M73.5 59L73.5 61" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M92.5 59L92.5 61" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M73.5 60L92.5 60" stroke="#362c25" fill="none" stroke-width="0.3"/><text x="73.5" y="58" class="small">38 retention stud axis</text><path d="M92.5 51L92.5 64" stroke="#362c25" fill="none" stroke-width="0.3"/><text x="94.5" y="51" class="small">Top release, no projecting head</text><text x="12" y="94" class="body">18 timber + 2 bedding = 20 finish allowance.</text><text x="12" y="100" class="body">The continuous structural support stays in place.</text><text x="12" y="106" class="body">The removable piece leaves a 20 mm finish recess.</text><rect x="12" y="114" width="25" height="1" fill="#362c25" stroke="#362c25" stroke-width=".25"/><rect x="37" y="114" width="25" height="1" fill="#f8f4eb" stroke="#362c25" stroke-width=".25"/><text x="12" y="119" class="small">100 mm at 1:2</text><rect x="154" y="51" width="79.4" height="79.4" fill="#b29370" stroke="#362c25" stroke-width=".25"/><rect x="234" y="51" width="61" height="79.4" fill="#ecdfc3" stroke="#362c25" stroke-width=".25"/><path d="M295 51h-61v79.4h61" fill="none" stroke="#544939" stroke-width=".25" stroke-dasharray="1.5 1"/><circle cx="158" cy="79.7" r="1.3" fill="#777f7d" stroke="#362c25" stroke-width=".25"/><circle cx="158" cy="101.7" r="1.3" fill="#777f7d" stroke="#362c25" stroke-width=".25"/><path d="M158 79.7L158 101.7" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M158 79.7H229.4V101.7H158" fill="none" stroke="#76614c" stroke-width=".35" stroke-dasharray="1 1.5"/><path d="M154 45L154 47" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M233.4 45L233.4 47" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M154 46L233.4 46" stroke="#362c25" fill="none" stroke-width="0.3"/><text x="154" y="44" class="small">397 finished · 400 pitch</text><path d="M154 138L154 140" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M158 138L158 140" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M154 139L158 139" stroke="#362c25" fill="none" stroke-width="0.3"/><text x="154" y="137" class="small">20 pickup setback</text><path d="M197 97L255 97" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M251 94L255 97" stroke="#362c25" fill="none" stroke-width="0.3"/><path d="M255 97L251 100" stroke="#362c25" fill="none" stroke-width="0.3"/><rect x="154" y="148" width="20" height="1" fill="#362c25" stroke="#362c25" stroke-width=".25"/><rect x="174" y="148" width="20" height="1" fill="#f8f4eb" stroke="#362c25" stroke-width=".25"/><text x="154" y="153" class="small">200 mm at 1:5</text><text x="154" y="167" class="body">55 vertical release, then 400 east to flush first rest.</text><text x="154" y="173" class="body">Adjacent landing is shown cropped at the sheet edge.</text><text x="154" y="179" class="body">Temporary openings stay inside a closed room.</text><text x="12" y="151" class="body">Two close pickups on one edge need a positive</text><text x="12" y="157" class="body">pitch restraint for the load. Independent grips</text><text x="12" y="163" class="body">leave a large gravity moment about their axis.</text><text x="12" y="176" class="body">Keep anchorage and any structural receiver</text><text x="12" y="182" class="body">separate from the 18 mm wearing layer.</text><text x="12" y="199" class="small">Concept only · fabrication, material movement, sound, handling and capacity remain design and test duties</text></svg>
