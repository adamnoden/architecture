50=30.</text><text x="465" y="396" class="n">   Actual frame/grips/force/table recovery capability must match.</text><text x="30" y="515" class="t">A · Fixed frame / front release</text><line x1="30" y1="787.5" x2="425" y2="787.5" stroke="#555"/><rect x="60" y="626" width="10" height="161.5" fill="#9ba6a7" stroke="#37474f" stroke-width=".6"/><rect x="370" y="626" width="10" height="161.5" fill="#9ba6a7" stroke="#37474f" stroke-width=".6"/><rect x="60" y="626" width="320" height="7.6" fill="#9ba6a7" stroke="#37474f" stroke-width=".6"/><rect x="55" y="622.2" width="20" height="3.8" fill="#8a735d" stroke="#37474f" stroke-width=".6"/><rect x="365" y="622.2" width="20" height="3.8" fill="#8a735d" stroke="#37474f" stroke-width=".6"/><rect x="40" y="616.5" width="360" height="5.7" fill="none" stroke="#37474f" stroke-width=".6"/><rect x="110" y="622.2" width="220" height="51.3" fill="none" stroke="#37474f" stroke-width=".6"/><rect x="170" y="668.75" width="10" height="28.5" fill="#90adad" stroke="#37474f" stroke-width=".6"/><rect x="220" y="668.75" width="10" height="28.5" fill="#90adad" stroke="#37474f" stroke-width=".6"/><rect x="280" y="668.75" width="10" height="28.5" fill="#90adad" stroke="#37474f" stroke-width=".6"/><text x="30" y="815" class="s">TOP900 /return870 /bowl600; retained B minimum575.</text><text x="30" y="833" class="s">Front rail removed; rear/sides/high braces retained independently.</text><text x="30" y="851" class="s">No hidden rear release, no captured diagonal-spigot inference.</text><text x="465" y="515" class="t">B · End/wing bearers; bowl passes BETWEEN</text><rect x="500" y="645" width="420" height="142.5" fill="#d8cfb8" stroke="#37474f" stroke-width=".6"/><rect x="515" y="588" width="65" height="57" fill="#b39e7d" stroke="#37474f" stroke-width=".6"/><rect x="840" y="588" width="65" height="57" fill="#b39e7d" stroke="#37474f" stroke-width=".6"/><rect x="505" y="582.3" width="410" height="5.7" fill="none" stroke="#37474f" stroke-width=".6"/><rect x="595" y="588" width="230" height="51.3" fill="none" stroke="#37474f" stroke-width=".6"/><line x1="505" y1="567.1" x2="915" y2="567.1" stroke="#267d8f" stroke-dasharray="5 4"/><text x="940" y="572.1" class="s">carry return1160</text><text x="940" y="593" class="s">seat1050; lower110</text><text x="940" y="644.3" class="s">bowl780</text><text x="940" y="665" class="s">table750 /30 clear</text><text x="465" y="815" class="s">Finite control only: body lower 9.44; reach upper 590.33; actual fit/force/grip/table admission unearned.</text><text x="465" y="833" class="s">Stop/rollback retains both controls: return to pads if release/control fails; no unsupported floor park credited.</text><text x="465" y="851" class="s">Reverse sequence, restore rail/retainers, renew union seals and test; restore furniture and ordinary tasks.</text></svg>