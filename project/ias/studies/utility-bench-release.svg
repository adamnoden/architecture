<text x="103.75" y="379.9" font-size="14">Washer</text>
<text x="260.725" y="416.95" font-size="14">Frame</text>
<text x="120.325" y="260.95" font-size="14">Head rest</text>
<text x="331.9" y="93.25" font-size="14">Radiator</text>
<text x="56" y="103" font-size="13">Brown: installed foot seats</text>
<text x="56" y="124" font-size="13">Rust: fixed services</text>
<text x="520" y="112" font-size="15">TRANSVERSE SECTION AT THE RECEIVER</text>
<rect x="533" y="186" width="354" height="5" fill="#296e66"/>
<rect x="538.9" y="191" width="8.85" height="35" fill="#9b7853"/>
<rect x="872.25" y="191" width="8.85" height="35" fill="#9b7853"/>
<text x="520" y="158" font-size="14">600 mm integral top, supported at two lands</text>
<text x="622" y="250" font-size="14">550 mm clear between rails</text>
<text x="520" y="293" font-size="14">Each bearing strip is 15 mm wide.</text>
<text x="520" y="321" font-size="14">530 mm maximum lower body at 10 mm each side.</text>
<text x="520" y="370" font-size="14">Before the last of four top screws comes out,</text>
<text x="520" y="393" font-size="14">capture the head against both fall and tipping.</text>
<text x="520" y="431" font-size="14">Verify underside contacts, actual feet and load;</text>
<text x="520" y="454" font-size="14">the supplier does not rate these receiving lands.</text>
<text x="35" y="533" font-size="13">Five millimetres of handling equipment per side. Mounted taps, pickup and projections must fit the measured package.</text>
</g></svg>
