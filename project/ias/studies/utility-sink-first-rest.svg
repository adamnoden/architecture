<text x="405" y="408" font-size="14" font-weight="normal">Receiver: 510 × 520. Pipe shown in brown.</text>
<text x="405" y="452" font-size="14" font-weight="normal">The bowl passes 225 mm above the radiator.</text>
<text x="405" y="474" font-size="14" font-weight="normal">Tap, pickup and crew access remain open.</text>
