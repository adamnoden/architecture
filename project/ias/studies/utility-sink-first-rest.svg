<text x="405" y="124" font-size="17" font-weight="bold">1   Lift clear of the top</text>
<text x="405" y="148" font-size="14" font-weight="normal">Shell underside at +925. Worktop at +900.</text>
<text x="405" y="203" font-size="17" font-weight="bold">2   Move 750 north</text>
<text x="405" y="227" font-size="14" font-weight="normal">Keep the fixed water pipe to the west.</text>
<text x="405" y="282" font-size="17" font-weight="bold">3   Move 745 west and lower</text>
<text x="405" y="306" font-size="14" font-weight="normal">The stand receives the rim at +700.</text>
<text x="405" y="363" font-size="15" font-weight="bold">Moving shell</text>
