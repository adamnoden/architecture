<text x="439" y="687" font-family="sans-serif" font-size="16" font-weight="normal" fill="#263b34">450 clear ceiling hatch. Its frame is independent of the Ø110 RC opening.</text>
<text x="439" y="722" font-family="sans-serif" font-size="15" font-weight="normal" fill="#263b34">Support the spool before releasing it. The worker retreats before the 470 mm descent.</text>
<text x="439" y="756" font-family="sans-serif" font-size="15" font-weight="normal" fill="#263b34">The 870 mm deck serves a supported extension at 2550 mm.</text>
<text x="439" y="790" font-family="sans-serif" font-size="15" font-weight="normal" fill="#263b34">Whole-stem retirement needs 690 mm of upward travel with the bath cleared.</text>
<text x="39" y="849" font-family="sans-serif" font-size="14" font-weight="normal" fill="#263b34">Development sections. Fixing, fire/acoustic restoration, working equipment, seals and material exceptions must match the actual assembly.</text>
