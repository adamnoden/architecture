<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="535" viewBox="0 0 1450 535" role="img" aria-labelledby="title desc"><title id="title">Provisional captured edges and mechanical service skirting</title><desc id="desc">Dimensioned dry floor retention and skirting sections. Trials require measured retention, clearances and service protections.</desc><style>.title{font:36px Georgia;fill:#332c27}.head{font:24px Georgia;fill:#332c27}.body{font:16px Arial;fill:#584636}.dim{font:15px Arial;fill:#584636;text-anchor:middle}.small{font:14px Arial;fill:#584636}</style><rect width="1450" height="535" fill="#f6f1e7"/><text x="52" y="54" class="title">Captured edges, accessible fixings</text><text x="52" y="85" class="body">Provisional millimetres. Enlarged schematic with separate horizontal and vertical graphic scales.</text><text x="52" y="139" class="head">Floor retention · local section at a dry seam</text><text x="833" y="139" class="head">Service skirting · independent cover</text><rect x="52" y="368" width="689" height="36" fill="#aaa99f" stroke="#6b5b4a" stroke-width="1"/><rect x="52" y="358" width="689" height="10" fill="#c7b08f" stroke="#6b5b4a" stroke-width="1"/><rect x="52" y="258" width="471" height="100" fill="#9d724f" stroke="#6b5b4a" stroke-width="1"/><rect x="538" y="258" width="203" height="100" fill="#9d724f" stroke="#6b5b4a" stroke-width="1"/><rect x="538" y="288" width="25" height="12" fill="#aaaaa2" stroke="#6b5b4a" stroke-width="1"/><rect x="548" y="247" width="14" height="41" fill="#807e73" stroke="#6b5b4a" stroke-width="1"/><path d="M555 210v57" stroke="#3f3e36" stroke-width="2" stroke-dasharray="5 4"/><path d="M523 237v12 M523 243H538 M538 237v12" stroke="#554f49"/><text x="530.5" y="235" class="dim">3 trial seam</text><text x="52" y="469" class="small">20 finish allocation · 2 mm bedding must replace, not add to, the support layer.</text><text x="52" y="495" class="small">Choose a short captive lock with independent support. Verify actual capture and tool envelopes.</text><rect x="853" y="180" width="65" height="210" fill="#9d9f94" stroke="#6b5b4a" stroke-width="1"/><rect x="918" y="180" width="46" height="210" fill="#d7c4a9" stroke="#6b5b4a" stroke-width="1"/><rect x="964" y="218" width="89" height="150" fill="#c2c8b8" stroke="#6b5b4a" stroke-width="1"/><rect x="1053" y="218" width="60" height="150" fill="#a07653" stroke="#6b5b4a" stroke-width="1"/><rect x="964" y="309" width="30" height="9" fill="#7c7568" stroke="#6b5b4a" stroke-width="1"/><circle cx="990" cy="253" r="10" fill="#9f6854"/><circle cx="1017" cy="289" r="10" fill="#9f6854"/><path d="M1122 269h42l-9-7m9 7-9 7" stroke="#443b32" stroke-width="2" fill="none"/><path d="M964 423v12 M964 429H1053 M1053 423v12" stroke="#554f49"/><text x="1008.5" y="421" class="dim">27 gross</text><path d="M1053 423v12 M1053 429H1113 M1113 423v12" stroke="#554f49"/><text x="1083" y="421" class="dim">18 face</text><text x="833" y="469" class="small">150 height · ends release first. Cable brackets and electrical enclosure stay in place.</text><text x="833" y="495" class="small">Check support and bend before adding a terminal or data branch.</text></svg>
