<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title desc"><title id="title">Fixed interfaces at actual size</title><desc id="desc">Representative enlarged 1:2 and 1:5 dimensions identify the boundaries to preserve.</desc><style>.title{font:7px Georgia;fill:#302a25}.head{font:4px Georgia;fill:#302a25}.body{font:3.25px Arial;fill:#504136}.small{font:2.75px Arial;fill:#504136}</style><rect x="0" y="0" width="297" height="210" fill="#f7f2e7" stroke="none" stroke-width="0.28"/><text x="12" y="15" class="title">Fixed interfaces at actual size</text><text x="12" y="24" class="body">Print actual size. Check each graphic bar. Heights stay on current source datums.</text><text x="12" y="42" class="head">A · 1:2 Study room-side reveal</text><rect x="12" y="82" width="62" height="24" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="74" y="82" width="13.5" height="24" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="43" y="72" width="44.5" height="10" fill="#8c6951" stroke="#302a25" stroke-width="0.28"/><rect x="61" y="54" width="5" height="18" fill="#bed0c6" stroke="#302a25" stroke-width="0.28"/><rect x="87.5" y="87" width="9" height="19" fill="#b89068" stroke="#302a25" stroke-width="0.28"/><path d="M98 92L121 92" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M117 89L121 92" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M121 92L117 95" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M74 55L87.5 55" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M74 54L74 56" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M87.5 54L87.5 56" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="74" y="53" class="small">27 complete existing face</text><path d="M87.5 115L96.5 115" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M87.5 114L87.5 116" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M96.5 114L96.5 116" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="87.5" y="113" class="small">18 refused as additive at protected reveal</text><rect x="12" y="130" width="25" height="1" fill="#302a25" stroke="#302a25" stroke-width="0.28"/><rect x="37" y="130" width="25" height="1" fill="#f7f2e7" stroke="#302a25" stroke-width="0.28"/><text x="12" y="134" class="small">100 mm at 1:2</text><text x="12" y="150" class="body">Room-side release may expose only independent trim.</text><text x="12" y="156" class="body">Keep frame bearing, air, weather and movement planes.</text><text x="12" y="163" class="body">Current Study door body reserve: 1.935 mm.</text><text x="12" y="170" class="body">An added face must rerun door and extraction geometry.</text><text x="154" y="42" class="head">B · 1:5 wet entry and protected floor</text><rect x="154" y="88" width="124" height="40" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="154" y="76" width="51" height="12" fill="#c9b288" stroke="#302a25" stroke-width="0.28"/><rect x="154" y="72" width="51" height="3.6" fill="#b89068" stroke="#302a25" stroke-width="0.28"/><rect x="154" y="75.6" width="51" height="0.4" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="205" y="72" width="73" height="16" fill="#c4bfad" stroke="#302a25" stroke-width="0.28"/><rect x="208" y="75" width="70" height="0.6" fill="#89a6a5" stroke="#302a25" stroke-width="0.28"/><rect x="203.8" y="72" width="2.4" height="16" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><path d="M202 61L202 72" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M208 59L208 75" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="154" y="63" class="body">dry 18 + 2</text><text x="210" y="63" class="body">separate wet control and end stop</text><rect x="154" y="130" width="20" height="1" fill="#302a25" stroke="#302a25" stroke-width="0.28"/><rect x="174" y="130" width="20" height="1" fill="#f7f2e7" stroke="#302a25" stroke-width="0.28"/><text x="154" y="134" class="small">200 mm at 1:5</text><text x="154" y="150" class="body">Retain 80 mm to RC and the permanent 200 mm slab.</text><text x="154" y="156" class="body">Terminate the modular finish at an independent support.</text><text x="154" y="163" class="body">Wet build-up graphic allocates its depth, not a specific seal.</text><text x="154" y="170" class="body">Actual threshold and sealed perimeter require coordination.</text><text x="12" y="193" class="small">Concept dimensions. This sheet combines separately scaled sections without selecting a cassette, doorset or membrane.</text></svg>
