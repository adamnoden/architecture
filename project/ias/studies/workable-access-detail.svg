<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="565" viewBox="0 0 1450 565" role="img" aria-labelledby="title desc"><title id="title">Replace a surface or open a nominated service cover</title><desc id="desc">Three plates show independent support, dry service grille caution, and a retained mineral wet floor.</desc><style>.title{font:36px Georgia;fill:#332c27}.head{font:24px Georgia;fill:#332c27}.body{font:17px Arial;fill:#584636}.small{font:14px Arial;fill:#584636}</style><rect width="1450" height="565" fill="#f6f1e7"/><text x="52" y="54" class="title">Opening one piece at a time</text><text x="52" y="85" class="body">Concept details, with continuous permanent support shown across the intervention.</text><text x="52" y="139" class="head">F1 · lift one sacrificial finish panel</text><text x="518" y="139" class="head">G1 · unscrew a retained dry cover</text><text x="982" y="139" class="head">Wet edge · keep the water plane</text><rect x="52" y="310" width="318" height="28" fill="#a8aa9c" stroke="#776351"/><rect x="52" y="299" width="318" height="11" fill="#c4af8c" stroke="#776351"/><rect x="518" y="310" width="318" height="28" fill="#a8aa9c" stroke="#776351"/><rect x="518" y="299" width="318" height="11" fill="#c4af8c" stroke="#776351"/><rect x="982" y="310" width="318" height="28" fill="#a8aa9c" stroke="#776351"/><rect x="982" y="299" width="318" height="11" fill="#c4af8c" stroke="#776351"/><rect x="52" y="282" width="113" height="17" fill="#8d6040" stroke="#776351"/><rect x="277" y="282" width="93" height="17" fill="#8d6040" stroke="#776351"/><rect x="166" y="222" width="110" height="17" fill="#8d6040" stroke="#776351"/><rect x="172" y="239" width="17" height="5" fill="#675341" stroke="#776351"/><rect x="252" y="239" width="17" height="5" fill="#675341" stroke="#776351"/><path d="M220 277v-25m-7 8 7-8 7 8" stroke="#665348" stroke-width="1.8" fill="none"/><rect x="518" y="282" width="83" height="17" fill="#8d6040" stroke="#776351"/><rect x="751" y="282" width="85" height="17" fill="#8d6040" stroke="#776351"/><rect x="590" y="255" width="8" height="44" fill="#8f8774" stroke="#776351"/><rect x="751" y="255" width="8" height="44" fill="#8f8774" stroke="#776351"/><rect x="599" y="232" width="150" height="16" fill="#a5aaa1" stroke="#776351"/><rect x="601" y="249" width="12" height="8" fill="#747b70" stroke="#776351"/><rect x="737" y="249" width="12" height="8" fill="#747b70" stroke="#776351"/><path d="M671 286v-25m-7 8 7-8 7 8" stroke="#665348" stroke-width="1.8" fill="none"/><path d="M633 234v12m17-12v12m17-12v12m17-12v12m17-12v12m17-12v12" stroke="#4d574f" stroke-width="3"/><rect x="982" y="282" width="152" height="17" fill="#8d6040" stroke="#776351"/><rect x="1136" y="282" width="164" height="17" fill="#bbbdad" stroke="#776351"/><path d="M1136 302h164v-75" fill="none" stroke="#427380" stroke-width="4"/><rect x="1303" y="213" width="20" height="120" fill="#888f84" stroke="#776351"/><text x="52" y="376" class="body">Releasable retainer at exposed joint.</text><text x="52" y="405" class="body">Lift onto a cleared neighbouring surface.</text><text x="52" y="434" class="body">No routine entry into a floor void.</text><text x="518" y="376" class="body">Put an independent frame beneath the lid.</text><text x="518" y="405" class="body">Locate it only where a service earns access.</text><text x="518" y="434" class="body">Any ventilating grille needs whole-device proof.</text><text x="982" y="376" class="body">End the dry panels at a visible threshold.</text><text x="982" y="405" class="body">Keep the mineral wet floor with its own seals.</text><text x="982" y="434" class="body">Use purpose-made local access from the dry side.</text><text x="52" y="507" class="small">Isolate and close off the work area, remove the one piece, then refit and confirm retention and any disturbed boundaries.</text></svg>
