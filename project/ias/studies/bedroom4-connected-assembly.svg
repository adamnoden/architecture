<text x="12" y="206" font-size="2.55">JT 45 profile + documented maximum 140 leg adjustment gives 185 rim comparison; pads and local moulding still need reconciliation.</text>
<text x="12" y="214" font-size="2.55">McAlpine 35 axis is below BODY TOP, not the tray wet face. The named 9.5/12.5 washers are alternatives, not a stack.</text>
<text x="12" y="222" font-size="2.55">Conditional 92.5 starting axis requires stated whole-tray and support assumptions; it is not an installed measured level.</text>
<text x="12" y="230" font-size="2.55">NE conditional 60-envelope bottom 21.46; NW 50.935 at 18/m. Socket/clip/tolerance and real bends remain unadmitted.</text>
<text x="12" y="238" font-size="2.55">Keep membrane under tray, boxing and cabinet. Ordinary inspection needs first-release covers; housing renewal is not top cleaning.</text>
<text x="12" y="246" font-size="2.55">Whole tray replacement can disturb its bonded wall seal: remove local tile/band, reinstate required overlaps and test before use.</text>
<text x="12" y="254" font-size="2.55">A blocked trap can spill over the enclosure; a supply leak persists until isolated. Lower damaged joints may fail before the saddle.</text>
