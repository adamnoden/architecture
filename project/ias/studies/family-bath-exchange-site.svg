<text x="156.4" y="373.0" class="s">Plant dock</text>
<text x="358.8" y="478.4" class="s">Mast base</text>
<text x="157.4" y="221.9" class="s">Soil</text>
<text x="365.4" y="659.9" class="s">Low rest</text>
<text x="637.0" y="123.0" class="b">An independent receiving stage</text>
<text x="639.0" y="166.0" class="b">1</text>
<text x="665.0" y="166.0" class="s">Pass the retained east sill at Y4600.</text>
<text x="639.0" y="198.0" class="b">2</text>
<text x="665.0" y="198.0" class="s">Arrest the cradle at X13670. Shift it 840 north.</text>
<text x="639.0" y="230.0" class="b">3</text>
<text x="665.0" y="230.0" class="s">Cross to X14770 on a supported deck.</text>
<text x="639.0" y="262.0" class="b">4</text>
<text x="665.0" y="262.0" class="s">Capture the long-wheelbase cart, then enter</text>
<text x="639.0" y="294.0" class="b"></text>
<text x="665.0" y="294.0" class="s">the cage from the north, with its gates open.</text>
<text x="639.0" y="326.0" class="b">5</text>
<text x="665.0" y="326.0" class="s">Lower 5890 to the bottom cage stop.</text>
<text x="639.0" y="358.0" class="b">6</text>
<text x="665.0" y="358.0" class="s">Use the south ramp and secured landing.</text>
<text x="639.0" y="390.0" class="b"></text>
<text x="665.0" y="390.0" class="s">Buy 2080 mm beyond the old site reservation.</text>
<text x="637.0" y="475.0" class="b">At ground level</text>
<text x="638.0" y="515.0" class="s">250-square pads are separate from the dock.</text>
<text x="638.0" y="541.0" class="s">The south-west pad clears the potable riser by 75.</text>
<text x="638.0" y="567.0" class="s">The next pad ends 25 west of the mast base.</text>
<text x="638.0" y="593.0" class="s">Dashed blue is the primary pipe crossing.</text>
<text x="638.0" y="619.0" class="s">Pale orange is the west edge of the R290 zone.</text>
<text x="638.0" y="645.0" class="s">Gate guide, mast ties, footings and weather</text>
<text x="638.0" y="671.0" class="s">protection require actual measured interfaces.</text>
<polyline points="41.5,686.5 136.5,686.5" fill="none" stroke="#233c46" stroke-width="3" stroke-dasharray=""/>
<text x="41.5" y="672.2" class="s">1 m</text>
<text x="29.0" y="764.0" class="s">Reference +4440 is the upper transfer plane. The dock, existing services and refrigerant zone must remain physically independent.</text>
</svg>
