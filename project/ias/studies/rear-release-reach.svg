<text x="804" y="579" class="small" text-anchor="start">With the board fitted, the upper mouth is at least Z3333.</text>
<text x="804" y="600" class="small" text-anchor="start">Even directly overhead, this is 33 mm beyond the arm limit.</text>
<text x="804" y="631" class="small muted" text-anchor="start">Axis reach does not establish a usable grip, tool clearance,</text>
<text x="804" y="651" class="small muted" text-anchor="start">verified engagement, safe posture or platform deployment.</text>
