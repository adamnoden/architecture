<rect x="690.0" y="260.5" width="22.0" height="129.1" fill="#c7e2df" stroke="#197883"/>
<rect x="768.0" y="260.5" width="22.0" height="159.5" fill="#efdbc5" stroke="#ae652f"/>
<text x="630.0" y="520.0" class="n">Green  ·  Geberit, 89 deep. Brown  ·  Viega Multiplex, 110 to trap bottom.</text>
<text x="630.0" y="545.0" class="n">With the rim at 545, the two bottoms fall to 46 and 25 respectively.</text>
<text x="630.0" y="568.0" class="n">Boxes show overall depths only. The native adapters and grips need gauging.</text>
<line x1="32.0" y1="603.0" x2="1166.0" y2="603.0" stroke="#567275" stroke-width="1" stroke-dasharray=""/>
<text x="33.0" y="635.0" class="m">The 240 mm straight outlet cannot turn directly down at the existing floor axis 100 mm from the waste.</text>
<text x="33.0" y="659.0" class="n">The diagonal trial retains the native connector. A compatible downturn, independently supported joints and a relocated lower hatch remain design duties.</text>
</svg>
