<line x1="657.0" y1="389.6" x2="850.0" y2="389.6" stroke="#197883" stroke-width="2" stroke-dasharray=""/>
<text x="865.0" y="394.6" class="m">Geberit bottom 61</text>
<line x1="657.0" y1="420.0" x2="850.0" y2="420.0" stroke="#98aaa9" stroke-width="1" stroke-dasharray=""/>
