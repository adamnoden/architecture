<text x="309.5" y="503.2" class="n">Existing floor axis</text>
<text x="34.0" y="545.0" class="n">New 110 hole and 200 seal zone in green. Existing 110 hole in orange.</text>
<text x="34.0" y="568.0" class="n">The new seal ends 10 before the front and 30 before the foot end.</text>
<line x1="605.0" y1="111.0" x2="605.0" y2="590.0" stroke="#b9c7c5" stroke-width="1" stroke-dasharray=""/>
