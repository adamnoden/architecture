<line x1="657.0" y1="449.0" x2="850.0" y2="449.0" stroke="#98aaa9" stroke-width="1" stroke-dasharray=""/>
<text x="865.0" y="454.0" class="m">Floor-seal top 20</text>
<line x1="657.0" y1="478.0" x2="850.0" y2="478.0" stroke="#98aaa9" stroke-width="1" stroke-dasharray=""/>
