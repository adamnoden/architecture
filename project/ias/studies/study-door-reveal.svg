<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img">
<title>Protected Study door, plan at the hinge jamb</title>
<rect width="980" height="460" fill="#faf9f5"/><g font-family="sans-serif" fill="#253a3c">
<text x="30" y="35" font-size="24">Protected Study door at the hinge jamb</text>
<text x="30" y="63" font-size="15">Plan. The hall is above the wall. Both details use the same 230 mm frame and hinge position.</text>
<text x="30" y="109" font-size="21">Centred blade</text>
<rect x="52.00" y="144.24" width="168.00" height="131.92" fill="#e3dfd1"/>
<rect x="220.00" y="132.00" width="28.00" height="156.40" fill="#9f9483"/>
<rect x="80.00" y="276.16" width="134.40" height="12.24" fill="#426867"/>
<rect x="234.56" y="210.20" width="49.28" height="116.96" fill="#85aaaf"/>
<rect x="234.56" y="210.20" width="13.44" height="78.20" fill="#bb5440"/>
<circle cx="259.20" cy="210.20" r="4.5" fill="#183a40"/>
<text x="30" y="358" font-size="17">12 mm overlap with the jamb</text>
<text x="30" y="387" font-size="15">Red marks the conflict at 90°.</text>
<text x="505" y="109" font-size="21">Hinge on Study face</text>
<rect x="527.00" y="144.24" width="168.00" height="131.92" fill="#e3dfd1"/>
<rect x="695.00" y="132.00" width="28.00" height="156.40" fill="#9f9483"/>
<rect x="555.00" y="276.16" width="134.40" height="12.24" fill="#426867"/>
<rect x="734.20" y="210.20" width="49.28" height="116.96" fill="#85aaaf"/>
<circle cx="734.20" cy="210.20" r="4.5" fill="#183a40"/>
<text x="505" y="358" font-size="17">10 mm between blade and jamb</text>
<text x="505" y="387" font-size="15">Dark green is the independently removable trim end.</text>
<text x="30" y="433" font-size="15">Nominal jamb, with the leaf shown open. Stops, seals and hinge hardware need the matched doorset.</text>
</g></svg>
