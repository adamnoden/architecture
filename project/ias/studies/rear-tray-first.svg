<title id="t">Rear shower tray-first exchange</title>
<desc id="d">The rear shower is raised with the fixed drain held, then moved north and west onto its own crib. The upper pipe socket has a finite sealing pocket. A full-depth push is stopped early by the waste shoulder.</desc>
