<text x="278" y="704" font-family="sans-serif" font-size="15" font-weight="normal" fill="#23332e">1. Isolate, drain and support the complete suite.</text>
<text x="278" y="729" font-family="sans-serif" font-size="15" font-weight="normal" fill="#23332e">2. Lift the two-ended water bridge 25 mm. The fixed feed stays on the wall bracket.</text>
<text x="278" y="754" font-family="sans-serif" font-size="15" font-weight="normal" fill="#23332e">3. Pull the braked carrier 150 mm against an independently held soil adaptor.</text>
<text x="278" y="779" font-family="sans-serif" font-size="15" font-weight="normal" fill="#23332e">4. Reconnect, flush and inspect the visible lip before closing the room.</text>
<text x="40" y="822" font-family="sans-serif" font-size="13" font-weight="normal" fill="#23332e">Blue represents the foul branch. Red marks the inspection lip and the revised family bath path. Fitting, bearing and seal performance remain to be verified.</text>
