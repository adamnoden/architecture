<text x="244" y="189" class="head">E  Fixed support; renewable face</text>
<text x="244" y="200" class="">1  Fixed chassis; complete floor boundary.</text>
<text x="244" y="208" class="small">    Exposed room floor stays flush at +3450.</text>
<text x="244" y="219" class="">2  Support and release the east face.</text>
<text x="244" y="227" class="small">    No cabinet load on that face or pipes.</text>
<text x="244" y="238" class="">3  Isolate and release the actual component.</text>
<text x="244" y="246" class="small">    Actual aperture, travel and seals unknown.</text>
<text x="244" y="257" class="">4  Restore boundaries before closing.</text>
<text x="244" y="265" class="small">    Retain trim and structural protection.</text>
<path d="M12,273L408,273" class="line"/>
<text x="12" y="282" class="small">HAD limits remain: 638 opening, 650 reach sensitivity, 5 basin margin. Develop A first; C needs actual access benefit; B needs redesign.</text>
