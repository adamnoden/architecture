<text x="226" y="224" font-family="sans-serif" font-size="3.3" fill="#20313b">The carrier lowers 50 mm and moves 265 mm east onto the receiver.</text>
<text x="226" y="233" font-family="sans-serif" font-size="3.3" fill="#20313b">The frame lifts 35 mm, traverses, then lowers 5 mm to its pads.</text>
<text x="15" y="254" font-family="sans-serif" font-size="3.3" fill="#20313b">Declared minima: carrier 30.0 mm, moving frame 25.0 mm.</text>
<text x="15" y="264" font-family="sans-serif" font-size="3.3" fill="#20313b">Original post 3.871 mm. Revised 40 mm post 1.652 mm in the same comparison.</text>
<text x="15" y="274" font-family="sans-serif" font-size="3.3" fill="#20313b">The 40 mm lift leaves only 20 mm at the receiving beam. The 35 mm lift retains 25 mm.</text>
<text x="15" y="284" font-family="sans-serif" font-size="3.3" fill="#20313b">Four local gravity seats preserve the floor datum. The separate proposed wall restraint carries uplift.</text>
