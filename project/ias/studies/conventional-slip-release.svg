<text x="14" y="26" font-size="3.3" fill="#24343a">Authored centred 103 mm coupling / 10 mm end gap. No actual socket, support, hand, fire or material admission.</text>
<text x="14" y="35" font-size="3" fill="#24343a">Both panels show d = 0 as a native-datum upper bound, not the actual tray seat. Vertical/known widths 1:2.5.</text>
