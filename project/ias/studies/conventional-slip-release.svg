<text x="366" y="151.4" font-size="3" fill="#925b84">103</text>
<text x="220" y="211" font-size="2.8" fill="#24343a">Purple interval is actual axial length only;</text>
<text x="220" y="217" font-size="2.8" fill="#24343a">coupling maximum OD and seal lands are unbound.</text>
<text x="14" y="228" font-size="3.1" fill="#24343a">Closed bottom 3256.5 - d; board top 3230 mm.</text>
<text x="14" y="236" font-size="3" fill="#24343a">Non-intersection needs d &lt;= 26.5 mm before tolerances.</text>
<text x="220" y="228" font-size="3.1" fill="#24343a">Downward stroke 81.5 mm; parked bottom 3175 - d.</text>
<text x="220" y="236" font-size="3" fill="#24343a">Coupling stays on independently restrained fixed pipe.</text>
<path d="M14 244L406 244" fill="none" stroke="#596c75" stroke-width=".5" />
<text x="14" y="255" font-size="3" fill="#24343a">Native body remains bolted to tray. Open the nonstructural closure for gripping/sliding; renew it after reconnection/testing. Do not pull on the flange.</text>
<text x="14" y="264" font-size="3" fill="#24343a">Upper overlap 46.5 mm is a trial, not a permitted insertion. Native 137 - 81 = 56 mm does not establish usable sealing land.</text>
<text x="14" y="273" font-size="3" fill="#24343a">Fixed-side restraint must take real release force independently of board/closure. Actual temporary isolation/restoration is mandatory.</text>
<text x="14" y="285" font-size="2.9" fill="#24343a">Source: native Geberit 2026 p114 / Hilti ETA 23/0267 + technical manual; owning result records exact domains and material holds.</text>
