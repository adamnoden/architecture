n">First release is a real gate: OEM1000 intact75stem/feet/independent captures unproved.</text><text x="535" y="134" class="n">Required lower100 void250×160; opaque body fails collar by100.</text><text x="535" y="158" class="n">1 Positive rig takes body. Lift650;52.5W/50N; controlled90° tilt.</text><text x="535" y="182" class="n">650 fulfils550 stem minimum; retain its500 extension through every turn.</text><text x="535" y="206" class="n">2 Edge250N;200W; turn90° to750composite across.</text><text x="535" y="230" class="n">3 Raise edge900 to base1175; retain1100 guard and struts.</text><text x="535" y="254" class="n">4 Through retained-frame requirement: ≤75 intrusion, no fixed post.</text><text x="535" y="278" class="n">5 Seat50DOWN on positively docked exterior receiver deck1125.</text><text x="535" y="302" class="n">Close/secure goods gate, verify support; only then release body lineA.</text><text x="535" y="326" class="n">6 Independent lineB/control takes full≤200kg cage+body before undock.</text><text x="535" y="350" class="n">Move1350N; lower to deckG−1000 / local−4450; restrained trolley.</text><text x="535" y="374" class="n">Both tray AND500tail travel: no flange split or missing tail.</text><text x="535" y="398" class="n">Strip>75 BEFORE650 axial lift; sleeve closure after exterior support.</text><text x="535" y="422" class="n">Window infill/guards/hardware supported to rack; qualified complete</text><text x="535" y="446" class="n">removal/edge protection/reinstatement remains an actual OAS gate.</text><text x="535" y="495" class="t">Ground rig: a substantial conditional burden</text><text x="535" y="522" class="n">35–50 kN whole rig/ballast;512 idealised corner cases.</text><text x="535" y="547" class="n">Pads 0.737…22.200 kN; nominal 88.801 kPa on500square.</text><text x="535" y="572" class="n">Actual boom, stiffness, pad/ground, wind, controls and capacity unqualified.</text><text x="535" y="639" class="s">HOLD: actual roof/eaves/gutter/purlin + full apparatus/window/receiver</text><text x="535" y="655" class="s">assembly clash survey OMITTED. Gross heights do not prove clearance.</text><line x1="535" y1="835" x2="1230" y2="835" stroke="#6f7c73"/><line x1="535" y1="740" x2="814" y2="740" stroke="#6f7c73"/><rect x="895" y="667" width="18" height="168" fill="#bcaaa4" stroke="#7a5f55"/><rect x="1165" y="667" width="18" height="168" fill="#bcaaa4" stroke="#7a5f55"/><rect x="571" y="687" width="634.5" height="4" fill="#b88f86"/><rect x="818.5" y="693.5" width="198" height="25.5" fill="none" stroke="#277c92" /><rect x="940" y="693.5" width="198" height="25.5" fill="none" stroke="#277c92" /><rect x="940" y="805" width="198" height="25.5" fill="none" stroke="#277c92" stroke-dasharray="4 3"/><rect x="775.345" y="721.5" width="38.655" height="18.5" fill="#dedbd1"/><text x="535" y="595" class="s">Section: FIRST FFL0 = G3450. Grade local−4750 = G−1300 authored.</text><text x="535" y="615" class="s">Rail under2450/top2650; frame-condition reserve22.867. No sill/house anchor credit.</text><text x="535" y="870" class="s">Modeled solids/prisms + abstract supports ONLY. No full route / actual-kit PASS.</text></svg>