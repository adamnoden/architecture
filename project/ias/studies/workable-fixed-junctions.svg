<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc"><title id="title">Three places to stop the removable finish</title><desc id="desc">A stair arrival, a family-bath front and a Study window reveal keep independently supported permanent duties.</desc><style>.title{font:36px Georgia;fill:#332c27}.head{font:24px Georgia;fill:#332c27}.body{font:17px Arial;fill:#584636}.small{font:14px Arial;fill:#584636}</style><rect width="1500" height="580" fill="#f6f1e7"/><text x="52" y="55" class="title">Stop the removable finish at the working boundary</text><text x="52" y="86" class="body">Representative sections · exact retained dimensions are named; relative graphic scales differ.</text><text x="52" y="146" class="head">Upper stair arrival</text><text x="539" y="146" class="head">Family bath front</text><text x="1014" y="146" class="head">Study window reveal</text><rect x="58" y="397" width="64" height="27" fill="#a4a59a" stroke="#6b5b4a"/><rect x="122" y="341.8" width="64" height="82.19999999999999" fill="#a4a59a" stroke="#6b5b4a"/><rect x="186" y="286.6" width="64" height="137.39999999999998" fill="#a4a59a" stroke="#6b5b4a"/><rect x="250" y="231.4" width="64" height="192.6" fill="#a4a59a" stroke="#6b5b4a"/><rect x="314" y="239.4" width="142" height="184.6" fill="#a4a59a" stroke="#6b5b4a"/><rect x="314" y="231.4" width="54" height="8" fill="#a4a59a" stroke="#6b5b4a"/><rect x="373" y="231.4" width="83" height="8" fill="#9b795b" stroke="#6b5b4a"/><rect x="368" y="231.4" width="5" height="8" fill="#7e7061" stroke="#6b5b4a"/><text x="52" y="461" class="small">172.5 rise, 300 going, 1004 between rails.</text><text x="52" y="493" class="small">Keep the original finished nosing and slab.</text><text x="52" y="522" class="small">Make the transition piece captive and flush.</text><rect x="539" y="359" width="360" height="53" fill="#a4a59a" stroke="#6b5b4a"/><rect x="539" y="353" width="360" height="6" fill="#b69772" stroke="#6b5b4a"/><path d="M553 353h348v-42" stroke="#4c7682" stroke-width="4" fill="none"/><path d="M555 220h271l-26 73h-220Z" stroke="#665d53" stroke-width="3" fill="#d8d7bd"/><rect x="817" y="224" width="17" height="122" fill="#9b795b" stroke="#6b5b4a"/><rect x="605" y="291" width="14" height="62" fill="#817c70" stroke="#6b5b4a"/><rect x="748" y="291" width="14" height="62" fill="#817c70" stroke="#6b5b4a"/><rect x="761" y="358" width="26" height="54" fill="#dde0c8" stroke="#6b5b4a"/><rect x="742" y="406" width="64" height="6" fill="#65796d" stroke="#6b5b4a"/><text x="539" y="461" class="small">Ø110 formed port at 11012 / 4366.</text><text x="539" y="493" class="small">500-wide front panel, 450 lower hatch.</text><text x="539" y="522" class="small">Keep the floor seal and independent bath feet.</text><rect x="1014" y="251" width="145" height="171" fill="#a4a59a" stroke="#6b5b4a"/><rect x="1159" y="254" width="36" height="168" fill="#dac4a4" stroke="#6b5b4a"/><rect x="1014" y="227" width="190" height="24" fill="#797c72" stroke="#6b5b4a"/><rect x="1037" y="192" width="53" height="35" fill="#aa8763" stroke="#6b5b4a"/><rect x="1060" y="165" width="7" height="28" fill="#87a8ab" stroke="#6b5b4a"/><rect x="1073" y="165" width="7" height="28" fill="#87a8ab" stroke="#6b5b4a"/><rect x="1159" y="251" width="45" height="5" fill="#445e5c" stroke="#6b5b4a"/><rect x="1195" y="297" width="18" height="125" fill="#8e7356" stroke="#6b5b4a"/><path d="M1215 312h47l-7-7m7 7-7 7" stroke="#5d5145" stroke-width="2" fill="none"/><text x="1014" y="461" class="small">Demount the room-side cover from its own anchors.</text><text x="1014" y="493" class="small">Keep the window support and sealing planes fixed.</text><text x="1014" y="522" class="small">Rehearse cassette and conventional frame courses.</text></svg>
