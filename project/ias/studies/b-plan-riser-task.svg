<text x="12" y="204" class="head">D  Connected first release and reinstatement</text>
<text x="12" y="214" class="">1  Isolate both sides, cool, drain, verify zero pressure; support catch vessel.</text>
<text x="12" y="223" class="">2  Body(10350,5300): support cover; release four screws;30 east then300 north.</text>
<text x="12" y="232" class="">3  Move to(10350,5050). Counterhold fixed body; release cap; withdraw into local void.</text>
<text x="12" y="241" class="">4  Move free screen/cap east. New identified gasket; verified tool/torque; inspect leak test.</text>
<text x="12" y="250" class="">5  Dry all affected surfaces; reverse cover/body paths. Floor, penetrations and frame stay fixed.</text>
<text x="12" y="263" class="small">Plan sensitivities: screw reach548.9; part reach502.5; cover/body reserve33.</text>
<text x="12" y="271" class="small warn">These omit articulated hands, force, balance, vertical reach and actual handling. Pocket angle/thread travel and actual tool need verification.</text>
<text x="12" y="280" class="small">Complete graphite-gasket recipe, pipe seals, supports/isolation, hydraulic duty, structural design and physical operation remain unaccepted.</text>
<text x="12" y="290" class="small">Reference design — not released for construction. This local witness does not discharge IAS-03 or the inherited whole-house riser obligation.</text>
