<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title desc"><title id="title">Landing, ceiling and air-terminal interfaces</title><desc id="desc">Three dimensioned sections show independent edges, stop and capture.</desc><style>.title{font:7px Georgia;fill:#302a25}.head{font:4px Georgia;fill:#302a25}.body{font:3.25px Arial;fill:#504136}.small{font:2.75px Arial;fill:#504136}</style><rect x="0" y="0" width="297" height="210" fill="#f7f2e7" stroke="none" stroke-width="0.28"/><text x="12" y="15" class="title">Landing, ceiling and air-terminal interfaces</text><text x="12" y="24" class="body">Print actual size. Bars support the feature dimensions. Local fixings and weak points remain sample targets.</text><text x="12" y="41" class="head">C · 1:5 upper arrival</text><text x="111" y="41" class="head">D · 1:2 dry wall to ceiling</text><text x="213" y="41" class="head">E · 1:2 grille edge</text><rect x="18" y="68" width="29.5" height="16" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="18" y="68" width="27" height="4" fill="#b89068" stroke="#302a25" stroke-width="0.28"/><rect x="18" y="84" width="29.5" height="22" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="45" y="68" width="2.5" height="10" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><path d="M47.5 68L47.5 102.5" stroke="#302a25" stroke-width="0.65" fill="none"/><path d="M47.5 102.5L107.5 102.5" stroke="#302a25" stroke-width="0.65" fill="none"/><path d="M107.5 102.5L107.5 112.5" stroke="#302a25" stroke-width="0.65" fill="none"/><path d="M50 71L50 99.5" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M48 71L52 71" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M48 99.5L52 99.5" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="52" y="86" class="small">172.5 rise</text><text x="56" y="109.5" class="small">300 going</text><rect x="12" y="127" width="17.25" height="1" fill="#302a25" stroke="#302a25" stroke-width="0.28"/><rect x="29.25" y="127" width="17.25" height="1" fill="#f7f2e7" stroke="#302a25" stroke-width="0.28"/><text x="12" y="132" class="small">172.5 mm at 1:5</text><text x="12" y="152" class="small">Solid edge stays independent of finish removal.</text><text x="12" y="157" class="small">Continuous guard and floor support stay.</text><text x="12" y="162" class="small">Arrival Y4432.5 / Z3450.</text><text x="12" y="167" class="small">A higher uncompensated landing changes rise.</text><rect x="111" y="51" width="29" height="75" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="140" y="56" width="56" height="27.5" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="140" y="83.5" width="56" height="7.5" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="140" y="93.5" width="3.5" height="33" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="144.5" y="93.5" width="9" height="33" fill="#b89068" stroke="#302a25" stroke-width="0.28"/><path d="M155.5 91L196 91" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M154.5 93.5L161.5 93.5" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="155" y="66" class="small">55 services</text><text x="155" y="88" class="small">15 ceiling</text><text x="153" y="101" class="small">5 trial stop</text><text x="155" y="115" class="small">18 finish / 9 back</text><rect x="111" y="134" width="15" height="1" fill="#302a25" stroke="#302a25" stroke-width="0.28"/><rect x="126" y="134" width="15" height="1" fill="#f7f2e7" stroke="#302a25" stroke-width="0.28"/><text x="111" y="139" class="small">60 mm at 1:2</text><text x="111" y="152" class="small">Ground finished ceiling Z3100.</text><text x="111" y="157" class="small">Sealing and lining stay independently fixed.</text><text x="111" y="162" class="small">The panel stops below the ceiling datum.</text><text x="111" y="167" class="small">A pierced or required full backing changes depth.</text><rect x="214" y="76" width="22" height="40" fill="#ded2be" stroke="#302a25" stroke-width="0.28"/><rect x="236" y="76" width="4" height="10" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="236" y="86" width="21" height="2" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="240" y="76" width="14" height="2" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="257" y="76" width="21" height="2" fill="#838b83" stroke="#302a25" stroke-width="0.28"/><rect x="240" y="84" width="38" height="2" fill="#8c6951" stroke="#302a25" stroke-width="0.28"/><path d="M266 73L266 60" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M263 63L266 60" stroke="#302a25" stroke-width="0.32" fill="none"/><path d="M269 63L266 60" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="216" y="63" class="small">Captured cover lifts clear</text><text x="271" y="70" class="small">4 plate</text><path d="M269 71L267 76" stroke="#302a25" stroke-width="0.32" fill="none"/><text x="242" y="103" class="small">Independent flange</text><text x="242" y="109" class="small">and trial bedding</text><rect x="213" y="134" width="15" height="1" fill="#302a25" stroke="#302a25" stroke-width="0.28"/><rect x="228" y="134" width="15" height="1" fill="#f7f2e7" stroke="#302a25" stroke-width="0.28"/><text x="213" y="139" class="small">60 mm at 1:2</text><text x="213" y="152" class="small">A face, flange and support are separable.</text><text x="213" y="157" class="small">Face geometry does not rate the terminal.</text><text x="213" y="162" class="small">Fixing, fingers, clogging, sound and flow remain.</text><text x="213" y="167" class="small">No walking duty at an offset wall terminal.</text><text x="12" y="190" class="small">F1 finish and retained edge · W1 removable face / permanent lining · G1 room-side air terminal and retained support.</text></svg>
