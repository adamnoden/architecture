<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title desc"><title id="title">Study lift bridge, retained bay and fixed first rest</title><desc id="desc">Plan comparison of a portable four-post guide, fixed rails and the verified transfer box, with calculations and critical clearances.</desc><style>.title{font:7px Georgia;fill:#362c25}.head{font:4px Georgia;fill:#362c25}.body{font:3.3px Arial;fill:#443830}.small{font:2.7px Arial;fill:#443830}</style><rect width="297" height="210" fill="#f8f4eb"/><text x="12" y="14" class="title">A guided lift for the Study tile</text><text x="12" y="22" class="body">Trial plan and load-path comparison · millimetres · fittings and restraint remain open</text><text x="12" y="37" class="head">Foot positions and guided travel</text><rect x="16" y="50.86" width="175.89000000000001" height="87.555" rx="0" fill="#ede4d6" stroke="#675949" stroke-width=".35"/><rect x="61.5" y="77.25" width="52" height="52" rx="0" fill="#d4bea0" stroke="#675949" stroke-width=".35"/><rect x="113.5" y="77.25" width="52" height="52" rx="0" fill="#d4bea0" stroke="#675949" stroke-width=".35"/><rect x="29" y="130.55" width="143" height="5.2" rx="0" fill="#8c9691" stroke="#675949" stroke-width=".35"/><rect x="29" y="69.45" width="143" height="5.2" rx="0" fill="#8c9691" stroke="#675949" stroke-width=".35"/><rect x="24.450000000000003" y="131.2" width="9.1" height="3.9000000000000004" rx="0" fill="#5b605d" stroke="#675949" stroke-width=".35"/><rect x="24.450000000000003" y="70.1" width="9.1" height="3.9000000000000004" rx="0" fill="#5b605d" stroke="#675949" stroke-width=".35"/><rect x="167.45000000000002" y="131.2" width="9.1" height="3.9000000000000004" rx="0" fill="#5b605d" stroke="#675949" stroke-width=".35"/><rect x="167.45000000000002" y="70.1" width="9.1" height="3.9000000000000004" rx="0" fill="#5b605d" stroke="#675949" stroke-width=".35"/><rect x="85.94" y="70.75" width="3.12" height="65" rx="0" fill="none" stroke="#5c4838" stroke-width=".35"/><rect x="137.94" y="70.75" width="3.12" height="65" rx="0" fill="none" stroke="#5c4838" stroke-width=".35"/><path d="M87.5 103.25 L139.5 103.25" stroke="#463e34" stroke-width=".45"/><path d="M134.3 106.24000000000001 L139.5 103.25" stroke="#463e34" stroke-width=".45"/><path d="M134.3 100.25999999999999 L139.5 103.25" stroke="#463e34" stroke-width=".45"/><text x="83" y="90" class="body">First lift</text><text x="137" y="90" class="body">First rest</text><text x="12" y="148" class="body">X3450 and X4550 feet straddle both travel states.</text><text x="12" y="155" class="body">Y470 and Y940 shoes leave 15 / 25 to moving tile edges.</text><text x="12" y="162" class="body">South shoe clears the 18 mm skirting by 7.5 nominal.</text><text x="204" y="37" class="head">Trial load screen</text><text x="204" y="51" class="head">147.4 N</text><text x="204" y="58" class="small">Factored load with 1 kg lifting hardware.</text><text x="204" y="72" class="head">21.46 MPa / 1.08 mm</text><text x="204" y="79" class="small">Ideal single rail stress and deflection.</text><text x="204" y="93" class="head">23.92 mm</text><text x="204" y="100" class="small">Available after setting and ideal rail bend.</text><text x="204" y="114" class="head">53.19 N</text><text x="204" y="121" class="small">Ideal restraint from the 100 N snag comparator.</text><text x="12" y="173" class="body">Close the room. Fit and positively restrain both rail frames before any extraction. Travelling cradle handles pitch and first rest.</text><text x="12" y="181" class="body">Show actual feet and under-rail clearances, wheel capture, operation sequence and parked assembly before qualifying the concept.</text><text x="12" y="199" class="small">An ideal rail screen compares options. It does not rate fabricated equipment or certify a handling method.</text></svg>
