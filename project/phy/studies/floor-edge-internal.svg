<text x="55" y="949" class="s bold">3  Selection consequences</text>
<text x="70" y="987" class="s">Direct bearing first; shared 140 mm tied/open-core construction is a separate supplier topology.</text>
<text x="70" y="1018" class="s">Untopped HC200 at authored top 3370 differs from the fixed-top 3320 case; no inherited hanger pass.</text>
<text x="70" y="1049" class="s">Entrance/stair/riser: design finite reactions and stages; RC200 is the separate solid-slab fallback.</text>
<text x="70" y="1080" class="s">Structural joints/ties remain permanent. Renewable ceiling/service closures do not sever them.</text>
<text x="70" y="1111" class="s">Representative assembly observation may earn access/closure evidence; no whole-floor or loaded-test pass.</text>
<text x="55" y="1163" class="tiny">Generated by floor-edge-internal.py • Numerical hypotheses and exact source fingerprints in accompanying JSON.</text>
