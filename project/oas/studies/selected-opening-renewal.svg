<text x="40" y="510" class="h">Retain</text>
<text x="220" y="510" class="n">Permanent structural opening/support, sound wall and independently terminated room finish.</text>
<text x="40" y="545" class="h">Renew deliberately</text>
<text x="220" y="545" class="n">Interrupted air/water/vapour/acoustic/fire transitions as the actual assembly requires; no universal retained seal.</text>
<text x="40" y="580" class="h">Check before closure</text>
<text x="220" y="580" class="n">Actual support, fixing, operation, drainage, seals, clear passage and every applicable boundary duty.</text>
<text x="40" y="630" class="n">Sash/glazing, hardware, leaf, complete frame and threshold renewal are distinct tasks. No generic inside-removal carrying pass.</text>
<text x="40" y="661" class="n">Not a 1:5 construction section. Masonry, frame and trim shapes indicate component roles only, not fabrication geometry.</text>
<text x="40" y="692" class="n">OS-01 to OS-08 retain actual dimension, threshold, performance, carrying and acceptance obligations for triad / MRA / BCR.</text>
