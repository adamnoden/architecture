        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run control:merge-check -- HAD-03 \
            --lease-id 5c4b89d9-ff6c-46d5-86d3-fe44774bc6df \
            --generation 18 \
            --branch work/mvb-chat-6558099791 \
            --head 6f5842330c9a4793b2fd987114a11aa60077ecf5 \
            --format text
