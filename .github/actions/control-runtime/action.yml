name: Install trusted control runtime
description: Reuse an exact installed dependency tree for trusted-main coordination jobs.
outputs:
  cache-hit:
    description: Whether the installed tree matched the complete cache key.
    value: ${{ steps.dependencies.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      id: node
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Restore exact installed dependencies
      id: dependencies
      uses: actions/cache/restore@v6
      with:
        path: node_modules
        key: control-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/actions/control-runtime/action.yml') }}
    - name: Install locked dependencies on a miss
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
    # Save now: a later fresh-source report may install a newer main lockfile.
    # A post-job save would then put the new tree under this earlier key.
    - name: Preserve the matching installed tree
      if: steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
