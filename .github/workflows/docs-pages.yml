name: Deploy documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Build Working Edition PDF
        run: npm run publication:build

      - name: Verify Working Edition PDF exists
        run: test -s publication/dist/house-systems-architecture.pdf

      - name: Build documentation
        run: npm run docs:build

      - name: Assemble Pages artifact
        run: |
          cp publication/dist/house-systems-architecture.pdf .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
