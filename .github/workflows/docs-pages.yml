name: Deploy documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check repository health
        run: npm run check

      - name: Ensure PDF metadata tooling
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Build Working Edition PDF
        run: npm run publication:build

      - name: Build Primer PDF
        run: npm run publication:build:primer

      - name: Verify publication PDFs exist
        run: |
          test -s publication/dist/ovids-house.pdf
          test -s publication/dist/ovids-house-primer.pdf

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Assemble Pages artifact
        run: |
          cp publication/dist/ovids-house.pdf .vitepress/dist/ovids-house.pdf
          cp publication/dist/ovids-house-primer.pdf .vitepress/dist/ovids-house-primer.pdf
          test -s .vitepress/dist/ovids-house.pdf
          test -s .vitepress/dist/ovids-house-primer.pdf
          test -s .vitepress/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
