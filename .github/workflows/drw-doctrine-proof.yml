name: Prove DRW drawing doctrine

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw01e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/drw-doctrine-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-doctrine-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate A4/B5 doctrine specimen
        run: npm run drw:01e:proof

      - name: Upload doctrine proof PDFs
        uses: actions/upload-artifact@v6
        with:
          name: drw-01e-doctrine-proof
          path: |
            publication/specimens/drw01e/dist/drw01e-a4.pdf
            publication/specimens/drw01e/dist/drw01e-b5.pdf
          if-no-files-found: error
          retention-days: 30
