# Temporary read-only native preflight for owner-directed ADE-SECTION-PARITY.
# Lives only on a disposal-bound helper branch, not on main or the work PR.
name: ADE current section-parity publication preflight
on:
  push:
    branches: [work/ade-section-preflight-1189]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@v5
        with:
          ref: work/ade-section-parity-1187
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Native current-main and exact-head ACO publication preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run control:merge-check -- ADE-SECTION-PARITY \
            --lease-id ab2cc511-c16c-4c94-90fa-ccac785aac21 \
            --generation 1 \
            --branch work/ade-section-parity-1187 \
            --head 265b61e711617c2a4709c34a3dd5b0171a315003 \
            --format text
