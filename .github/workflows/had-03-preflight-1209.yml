# CI succeeded; fresh preflight of exact reviewed head after full PR validation
name: HAD-03 publication preflight PR1209
on:
  push:
    branches: [work/had-03-preflight-1209]
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'adamnoden/architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6556750838
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact validated head
        run: test "$(git rev-parse HEAD)" = "35ac7d61cc6c16c06719dcbdf7c635491ea7d738"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Canonical fresh merge preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run control:merge-check -- HAD-03 \
            --lease-id cc21538d-3614-4fa3-8e93-314ed86fdf3b \
            --generation 16 \
            --branch work/mvb-chat-6556750838 \
            --head 35ac7d61cc6c16c06719dcbdf7c635491ea7d738 \
            --format text
