# One-shot read-only canonical RWT-06 generation-38 merge preflight; never merge into main.
name: RWT-06 generation-38 publication preflight
on:
  push:
    branches:
      - work/rwt38-preflight-20261103
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RWT-06 candidate
        uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6600109825
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh RWT-06 generation-38 canonical merge preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --import tsx scripts/project-claims.ts merge-check RWT-06 \
            --lease-id e2491cbb-6b56-4b1b-95d6-3c5b7ed7cae2 \
            --generation 38 \
            --branch work/mvb-chat-6600109825 \
            --head fc552d8cfcee7ddec06447a62cd3244169a1b1b6 \
            --format json
