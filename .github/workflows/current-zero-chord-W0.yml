name: Compare actual200 floor with zero extra chord

on:
  push:
    branches: [work/zerg-l200-node-recovery-20261126]
    paths:
      - '.github/workflows/current-zero-chord-W0.yml'
      - 'project/str/studies/current_zero_chord_control.py'
      - 'project/str/studies/current_zero_chord_control_test.py'
      - 'project/str/studies/distributed_floor_compatibility.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: zero-chord-W0-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install the original pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/zero-chord-runtime"
          "$RUNNER_TEMP/zero-chord-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/zero-chord-runtime/bin/python" >> "$GITHUB_ENV"
          echo "ZERO_CHORD_EVIDENCE_DIR=$RUNNER_TEMP/zero-chord-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
      - name: Recover only the exact retained summary and actual W0 capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B - <<'PY'
          import gzip,hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          folder=Path(os.environ['ZERO_CHORD_EVIDENCE_DIR']);folder.mkdir(parents=True,exist_ok=True)
          api=os.environ['GITHUB_API_URL'];repo=os.environ['GITHUB_REPOSITORY']
          expected_run=45814303861
          expected_head='867e8042e131a35407c4fe3be21807cdb6d23778'
          def sha(data):return hashlib.sha256(data).hexdigest()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url):return urllib.request.Request(url,headers=headers)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          records=[]
          def exact_artifact(identifier,name,filename):
              url=f'{api}/repos/{repo}/actions/artifacts/{identifier}'
              with urllib.request.urlopen(request(url),timeout=60) as response:metadata=json.load(response)
              if metadata['name']!=name or metadata['expired'] or metadata['workflow_run']['id']!=expected_run or metadata['workflow_run']['head_sha']!=expected_head:
                  raise ValueError('Actual retained artifact/run/head identity differs')
              opener=urllib.request.build_opener(NoRedirect())
              try:
                  with opener.open(request(url+'/zip'),timeout=60) as response:archive=response.read()
              except urllib.error.HTTPError as response:
                  if response.code not in (301,302,303,307,308):raise
                  location=response.headers['Location']
                  if not location.startswith('https://'):raise ValueError('HTTPS artifact redirect required')
                  # GitHub credentials are never forwarded to the storage host.
                  with urllib.request.urlopen(location,timeout=120) as body:archive=body.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  members=[n for n in zipped.namelist() if Path(n).name==filename and not n.endswith('/')]
                  if len(members)!=1:raise ValueError('Exactly one requested physical artifact member required')
                  data=zipped.read(members[0])
              (folder/filename).write_bytes(data)
              records.append({'artifactId':identifier,'name':name,'runId':expected_run,'headSHA':expected_head,
                              'archiveSHA256':sha(archive),'member':members[0],'memberSHA256':sha(data),'memberBytes':len(data)})
              return data
          summary_data=exact_artifact(15116237950,'finite-signed-summary','finite-signed-summary.json')
          if len(summary_data)!=115551 or sha(summary_data)!='bfeae934f0e3c16a522250dc7e835a7374a6627673ffbe25d1311358981ee7bf':
              raise ValueError('Exact original96 summary bytes required; no reconstruction')
          summary=json.loads(summary_data)
          zipped=exact_artifact(15115737897,'finite-signed-shard-0','case-00.json.gz')
          raw=gzip.decompress(zipped);identity=summary['captureIdentities']['0']
          if sha(zipped)!=identity['gzipSHA256'] or sha(raw)!=identity['rawSHA256']:
              raise ValueError('Full actual W0 raw/gzip hashes differ')
          capture=json.loads(raw)
          if capture['windIndex']!=0:raise ValueError('Actual source W0 required')
          (folder/'input-artifact-admission.json').write_text(json.dumps({'summarySHA256':sha(summary_data),'summaryBytes':len(summary_data),
              'W0RawSHA256':sha(raw),'W0GzipSHA256':sha(zipped),'sourceCommit':expected_head,'artifacts':records},indent=2)+'\n')
          print('PASS original96 summary bytes and full actual W0 raw/gzip identities')
          PY
      - name: Check exact zero and unchanged positive admission before house work
        run: |
          STR_ZERO_CHORD_PARENT="$ZERO_CHORD_EVIDENCE_DIR/case-00.json.gz" \
          STR_ZERO_CHORD_SUMMARY="$ZERO_CHORD_EVIDENCE_DIR/finite-signed-summary.json" \
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control_test.py > "$ZERO_CHORD_EVIDENCE_DIR/admission-tests.log" 2>&1
          cat "$ZERO_CHORD_EVIDENCE_DIR/admission-tests.log"
      - name: Derive new inputs from authenticated nativeCase controls and current sources
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control.py prepare \
            --parent "$ZERO_CHORD_EVIDENCE_DIR/case-00.json.gz" \
            --summary "$ZERO_CHORD_EVIDENCE_DIR/finite-signed-summary.json" \
            --out "$ZERO_CHORD_EVIDENCE_DIR/new-inputs.json"
      - name: Execute fresh actual200 positive-extra-chord W0 control
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control.py one \
            --input "$ZERO_CHORD_EVIDENCE_DIR/new-inputs.json" --name positive \
            --out "$ZERO_CHORD_EVIDENCE_DIR/positive.json.gz"
      - name: Execute fresh actual200 exact-zero-extra-chord W0 comparison
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control.py one \
            --input "$ZERO_CHORD_EVIDENCE_DIR/new-inputs.json" --name zero \
            --out "$ZERO_CHORD_EVIDENCE_DIR/zero.json.gz"
      - name: Replay actual house/joint/contact work and compare fresh paired responses
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control.py aggregate \
            --input "$ZERO_CHORD_EVIDENCE_DIR/new-inputs.json" \
            --parent "$ZERO_CHORD_EVIDENCE_DIR/case-00.json.gz" \
            --captures "$ZERO_CHORD_EVIDENCE_DIR" \
            --out "$ZERO_CHORD_EVIDENCE_DIR/zero-chord-W0-comparison.json"
          cp project/str/current-zero-chord-W0-development.md "$ZERO_CHORD_EVIDENCE_DIR/"
          git diff --exit-code
      - name: Preserve actual paired cases, exact inputs, tests and any failed-case receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zero-chord-W0-${{ github.sha }}
          path: ${{ runner.temp }}/zero-chord-evidence
          if-no-files-found: error
          retention-days: 90
