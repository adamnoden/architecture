           artifact_provenance.append({**spec,'runId':expected_run,'headSHA':expected_head})
          if len(controls)!=14 or load_source(Path('.'))['identities']!=identities:raise ValueError('Complete14 current-source native set required')
          def triple(key,stem):
           item=controls[key]
           return{stem+'.'+suffix+'.json':item[suffix] for suffix in ('request','full','capture')}
          def package(repository_path,files,manifest_name,extra,mode='w:gz'):
           manifest={'schema':'str-current-positive-native-capture-archive/1','nativeCaptureSourceCommit':expected_head,'assemblySourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'nativeSourceSHA256':identities,'actualNativeProducerRun':expected_run,'files':{name:{'bytes':len(data),'sha256':sha(data)} for name,data in files.items()},'nativeSolveExecutedByAssembly':False,'candidateAccepted':False,**extra}
           body=encode(manifest);target=folder/'archives'/repository_path;target.parent.mkdir(parents=True,exist_ok=True)
