            before=json.loads(zipped.read('source-before.json'));after=json.loads(zipped.read('source-after.json'));capture=json.loads(zipped.read('capture-group-manifest.json'))
            if before['sourceCommit']!=expected_head or after['sourceCommit']!=expected_head or before['native58SHA256']!=identities or set(after['changedTrackedPaths']) or after['outputs'] or any(after.get(k) is not True for k in ('native58UnchangedDuringExecution','allOtherTrackedSourcesUnchanged','accountAndCanonicalUnchanged')):raise ValueError('Native producer source protection failed')
            for name,digest in before['trackedSHA256'].items():
             if sha(Path(name).read_bytes())!=digest:raise ValueError('Protected capture producer source changed: '+name)
            if capture['sourceCommit']!=expected_head or capture['sourceSHA256']!=identities or capture['group']!=spec['group'] or capture['completeVerifiedCaseCount']!=len(spec['keys']) or capture['expectedCaseKeys']!=spec['keys'] or set(capture['controls'])!=set(spec['keys']) or capture['onlyFreshNativeSolves'] is not True or capture['candidateAccepted'] is not False:raise ValueError('Incomplete or altered actual native group')
            for key,entry in capture['controls'].items():
             if key in controls:raise ValueError('Duplicate native capture key')
             files={name:zipped.read(name) for name in entry['files']}
             for name,data in files.items():
              identity=entry['files'][name]
              if len(data)!=identity['bytes'] or sha(data)!=identity['sha256']:raise ValueError('Actual native capture member changed')
             request_bytes=next(data for name,data in files.items() if name.endswith('.request.json'));full=next(data for name,data in files.items() if name.endswith('.full.json'));receipt=next(data for name,data in files.items() if name.endswith('.capture.json'))
