name: Prove actual existing rear400 depth control
on:
  push:
    branches: [work/zerg-rear-bearing-recovery-20261126]
    paths:
      - '.github/workflows/rear-bearing-depth-control.yml'
      - 'project/str/studies/rear_bearing_depth_control.py'
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install identical pinned native and finite runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Fetch only exact passed4010 shared request and matched300-W31 comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rear400"
          gh api repos/adamnoden/architecture/actions/artifacts/15131108555/zip > "$RUNNER_TEMP/rear400/source-input.zip"
          gh api repos/adamnoden/architecture/actions/artifacts/15129761196/zip > "$RUNNER_TEMP/rear400/source300-W31.zip"
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_bearing_depth_control.py prepare --folder "$RUNNER_TEMP/rear400"
      - name: Fresh complete existing400-depth W31 with all independent replay and actual body adverse controls
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_bearing_depth_control.py one --folder "$RUNNER_TEMP/rear400" --index 31 > "$RUNNER_TEMP/rear400/actual400-31.log" 2>&1
      - name: Fresh complete existing400-depth gravity programme0 with all independent replay and body adverse controls
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_bearing_depth_control.py one --folder "$RUNNER_TEMP/rear400" --index 0 > "$RUNNER_TEMP/rear400/actual400-0.log" 2>&1
      - name: Independent charged material and all6 applied-wrench change against authenticated300 reference
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_bearing_depth_control.py compare --folder "$RUNNER_TEMP/rear400" > "$RUNNER_TEMP/rear400/comparison.log" 2>&1
      - name: Show actual bounded results and retained failures
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'rear400'
          for f in sorted(folder.glob('*.log')):
              print('REAR400_LOG '+f.name,flush=True)
              print(f.read_text(errors='replace')[-100000:],flush=True)
          for f in folder.glob('*failure.json'):print(f.read_text(),flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rear400-actual-saved-depth-comparison
          path: ${{ runner.temp }}/rear400/
          if-no-files-found: error
          retention-days: 90
