name: Prove ADE browser editor

on:
  pull_request:
    branches: [main]
    paths:
      - 'project/ade/browser-editor/**'
      - 'project/ade/browser-editor-result.md'
      - 'compiler/reference-house/current-design/**'
      - 'project/str/studies/**'
      - 'compiler/publication-drawing-v2/**'
      - 'scripts/proof-scope.mjs'
      - 'scripts/proof-scope.test.mjs'
      - '.github/workflows/proof-scope.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ade-browser-editor-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ade-browser-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/proof-scope.yml
  proof:
    needs: scope
    if: needs.scope.outputs.run != 'false'
    runs-on: ubuntu-latest
    # Real wet-cage/pad edits, CLI replay and both undo operations execute
    # additional coupled native solves. The former15-minute budget expired
    # on the expanded proof; retain every assertion within a bounded25 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Setup structural numerical runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            project/str/studies/cage-requirements.txt
            project/str/studies/vertical-floor-requirements.txt
      - name: Install pinned structural numerical dependencies
        run: python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up Chromium proof
        run: |
          python3 -m venv "$RUNNER_TEMP/ade-browser-proof"
          "$RUNNER_TEMP/ade-browser-proof/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/ade-browser-proof/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Build and exercise editor
        run: |
          mkdir -p "$RUNNER_TEMP/ade-browser-review"
          node node_modules/vite/bin/vite.js build --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/ade-editor-dist"
          "$RUNNER_TEMP/ade-browser-proof/bin/python" project/ade/browser-editor/browser_test.py --dist "$RUNNER_TEMP/ade-editor-dist" --screenshot "$RUNNER_TEMP/ade-browser-review/editor.png"
          node node_modules/vite/bin/vite.js preview --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/ade-editor-dist" --host 127.0.0.1 --port 4187 --strictPort > "$RUNNER_TEMP/ade-browser-review/server.log" 2>&1 &
          ADE_PREVIEW_PID=$!
          trap 'kill "$ADE_PREVIEW_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4187/engineering.html', timeout=2)
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY
          "$RUNNER_TEMP/ade-browser-proof/bin/python" project/ade/browser-editor/engineering_browser_test.py --screenshot "$RUNNER_TEMP/ade-browser-review/engineering-editor.png"
      - name: Retain browser evidence
        uses: actions/upload-artifact@v6
        with:
          name: ade-browser-editor-review
          path: ${{ runner.temp }}/ade-browser-review
          if-no-files-found: error
          retention-days: 7
