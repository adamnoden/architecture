name: Temporary read-only MAT RWT publication check 1101
on:
  push:
    branches: [work/mvb-chat-6532658645]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6532658645
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate the canonical public-route data plate for connector publication
        run: |
          npm run dataplate:write
          echo 'GENERATED_DATAPLATE_BEGIN'
          cat project/dataplate.json
          echo 'GENERATED_DATAPLATE_END'
          git diff --stat -- project/dataplate.json
      - name: Check new integration requirements
        run: node --import tsx --test project/control/material-direction.test.ts
  preflight:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Observe cleaned final head and exact-head validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 80); do
            if ! pr="$(gh api repos/adamnoden/architecture/pulls/1101)"; then sleep 15; continue; fi
            test "$(jq -r '.state' <<< "$pr")" = open
            test "$(jq -r '.head.ref' <<< "$pr")" = work/mvb-chat-6532658645
            test "$(jq -r '.head.repo.full_name' <<< "$pr")" = adamnoden/architecture
            test "$(jq -r '.base.ref' <<< "$pr")" = main
            grep -Fxq 'Work: MAT-00, RWT-06' <<< "$(jq -r '.body' <<< "$pr")"
            grep -Fxq 'Lease: MAT-00 / ad2d015c-a818-47bb-82dd-88d074725262 / generation 1' <<< "$(jq -r '.body' <<< "$pr")"
            grep -Fxq 'Lease: RWT-06 / 5bf0bbdb-e8db-4ad8-8d82-c3f34fbd26ca / generation 11' <<< "$(jq -r '.body' <<< "$pr")"
            head="$(jq -r '.head.sha' <<< "$pr")"
            git fetch origin main work/mvb-chat-6532658645 --quiet
            test "$(git rev-parse origin/work/mvb-chat-6532658645)" = "$head"
            if git cat-file -e "$head:.github/workflows/mat-rwt-preflight-1101.yml" 2>/dev/null; then sleep 15; continue; fi
            git diff --quiet origin/main "$head" -- scripts/project-claims.ts project/control/claims.ts project/control/claim-store.ts project/control/dispatch.ts project/control/publication-preflight.ts project/control/lease-health.ts project/control/github-claim-store.ts project/control/git-connector-claim-store.ts package.json package-lock.json .nvmrc .github/workflows
            if ! checks="$(gh api "repos/adamnoden/architecture/commits/$head/check-runs?per_page=100")"; then sleep 15; continue; fi
            latest="$(jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.name) | group_by(.name) | map(sort_by(.id) | last)' <<< "$checks")"
            validate="$(jq '[.[] | select(.name == "validate")] | last // {}' <<< "$latest")"
            bad="$(jq '[.[] | select(.name != "generate" and .name != "preflight") | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<< "$latest")"
            if (( bad > 0 )); then echo 'Final head has a failed check; no publication preflight'; exit 1; fi
            pending="$(jq '[.[] | select(.name != "generate" and .name != "preflight" and .status != "completed")] | length' <<< "$latest")"
            if test "$(jq -r '.conclusion' <<< "$validate")" = success && test "$pending" = 0; then
              echo "Validated final head: $head"
              jq -r '.[] | [.name,.status,.conclusion,.details_url] | @tsv' <<< "$latest"
              echo "TARGET_HEAD=$head" >> "$GITHUB_ENV"
              ready=true
              break
            fi
            sleep 15
          done
          test "$ready" = true
      - name: Verify cleaned source and generated public-route data
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          node --import tsx --test project/control/material-direction.test.ts
          npm run dataplate:check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Canonical publication preflight for both leases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --import tsx scripts/project-claims.ts merge-check MAT-00 \
            --lease-id ad2d015c-a818-47bb-82dd-88d074725262 --generation 1 \
            --branch work/mvb-chat-6532658645 --head "$TARGET_HEAD" --format text
          node --import tsx scripts/project-claims.ts merge-check RWT-06 \
            --lease-id 5bf0bbdb-e8db-4ad8-8d82-c3f34fbd26ca --generation 11 \
            --branch work/mvb-chat-6532658645 --head "$TARGET_HEAD" --format text
