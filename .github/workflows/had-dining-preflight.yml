name: HAD dining publication preflight (temporary)
on:
  push:
    branches: [work/mvb-chat-6535821509]
    paths: ['.github/workflows/had-dining-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6535821509
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh canonical publication preflight on current branch
        run: |
          node --import tsx scripts/project-claims.ts merge-check HAD-03 --transport connector --lease-id b64706fe-18d1-4f60-ad03-70c3a471ecd6 --generation 8 --branch work/mvb-chat-6535821509 --head "$(git rev-parse HEAD)" --format text
