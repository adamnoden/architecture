name: MVB three-command gateway
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# Duplicate delivery for one comment must not run concurrently.
# Different requests are coordinated by canonical ACO CAS, not Actions concurrency.
concurrency:
  group: mvb-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ github.repository == 'adamnoden/architecture' && github.event.issue.number == 1089 && !github.event.issue.pull_request && github.event.issue.locked && github.event.sender.id == github.event.repository.owner.id && github.event.comment.user.id == github.event.sender.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - name: Trusted main checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Install trusted control runtime
        uses: ./.github/actions/control-runtime
      - name: Dispatch one validated MVB request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/mvb-issue-gateway.ts
