# One-shot read-only canonical RWT-06 generation-34 merge preflight; never merge to main.
name: RWT-06 generation-34 publication preflight
on:
  push:
    branches:
      - work/rwt34-preflight-20261103
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RWT-06 candidate
        uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6598789898
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh canonical RWT-06 generation-34 merge preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --import tsx scripts/project-claims.ts merge-check RWT-06 \
            --lease-id c336dc3f-8659-4122-bd72-e67268b68de4 \
            --generation 34 \
            --branch work/mvb-chat-6598789898 \
            --head b7b769963bf337dcc01613612c0d908ea3f52ed9 \
            --format json
