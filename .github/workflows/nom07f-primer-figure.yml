name: NOM-07F Primer figure cleanup

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom07f-primer-figure.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - name: Remove machine-system narration from Primer caption
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('publication/adapters.ts')
          text = path.read_text()
          old = "*The Reference House is a compact two-storey ring around an open court, with a concentrated service flank and a legible front-to-court-to-garden sequence. The diagram communicates the architectural type without importing the machine identifiers used on technical inspection drawings.*"
          new = "*The Reference House is a compact two-storey ring around an open court, with a concentrated service flank and a legible front-to-court-to-garden sequence.*"
          if old not in text:
            raise SystemExit('Expected Primer caption residue not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication/adapters.ts
          git commit -m "PUB-NOM: keep Primer Reference House caption architectural"
          git push origin HEAD:pub-nom
