name: Prove recovered Utility station geometry

on:
  push:
    branches: [work/zerg-water-west-recovery-20261126]

permissions:
  contents: read

concurrency:
  group: had-utility-west-recovery
  cancel-in-progress: false

jobs:
  utility-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout this exact development commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup geometry-only Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/vertical-floor-requirements.txt
      - name: Install existing pinned geometry imports
        run: python -m pip install -r project/str/studies/vertical-floor-requirements.txt
      - name: Setup repository-pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record source identity and install locked dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/had-utility-west-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/had-utility-west-proof/head.txt"
          node --version | tee "$RUNNER_TEMP/had-utility-west-proof/node.txt"
          sha256sum .nvmrc package-lock.json compiler/reference-house/current-design/inlet-utility-proof-source.ts compiler/reference-house/current-design-inlet-utility-floor-context.test.ts project/str/studies/dry-side-ground-section.json project/mat/studies/conventional-ground-junction.json compiler/reference-house/current-design/inlet-utility-route.ts compiler/reference-house/current-design-inlet-utility-route.test.ts project/had/studies/inlet-utility-north-route.json compiler/reference-house/current-design-inlet-utility-west.test.ts project/had/studies/inlet-utility-west-route.json compiler/reference-house/current-design-inlet-utility-compact.test.ts project/had/studies/inlet-utility-compact-route.json project/had/studies/utility-corner-host.py compiler/reference-house/current-design/inlet-fixed-thermal.ts project/ias/studies/utility-host-revised-route.py project/had/studies/utility-potable-network.mjs project/mat/studies/whole-house-service-baseline.json project/had/studies/inlet-utility-compact-route.json project/had/studies/water-replan.json project/had/studies/current-house-services.json project/had/studies/south-inlet-under-sill.json project/ccr/studies/working-house-comparison.json | tee "$RUNNER_TEMP/had-utility-west-proof/source-sha256.txt"
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/had-utility-west-proof/npm-ci.log"
      - name: Typecheck recovered source
        id: types
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/had-utility-west-proof/typecheck.log"
      - name: Replay focused pure route geometry controls
        env:
          HAD_UTILITY_ROUTE_PROOF_DIR: ${{ runner.temp }}/had-utility-west-proof
        id: geometry
        if: always()
        continue-on-error: true
        run: |
          set +e
          node --import tsx --test compiler/reference-house/current-design-inlet-utility-route.test.ts compiler/reference-house/current-design-inlet-indoor-routes.test.ts compiler/reference-house/current-design-inlet-retained-services.test.ts compiler/reference-house/current-design-inlet-utility-west.test.ts compiler/reference-house/current-design-inlet-utility-compact.test.ts project/had/studies/utility-potable-network.test.mjs compiler/reference-house/current-design-inlet-utility-rear.test.ts compiler/reference-house/current-design-inlet-store-vessel.test.ts compiler/reference-house/current-design-inlet-utility-hot.test.ts compiler/reference-house/current-design-inlet-utility-rear-tree.test.ts compiler/reference-house/current-design-inlet-utility-floor-context.test.ts compiler/reference-house/current-design-inlet-plant-tanked.test.ts compiler/reference-house/current-design-inlet-plant-tanked-walk.test.ts compiler/reference-house/current-design-inlet-plant-normal-assembly.test.ts compiler/reference-house/current-design-inlet-plant-pan-compression.test.ts compiler/reference-house/current-design-inlet-plant-walking-foot-trade.test.ts compiler/reference-house/current-design-inlet-plant-appliance-platform.test.ts compiler/reference-house/current-design-inlet-plant-post-row-bridge.test.ts compiler/reference-house/current-design-inlet-plant-rc-over-f.test.ts > "$RUNNER_TEMP/had-utility-west-proof/geometry.log" 2>&1
          geometry_status=$?
          set -e
          node --input-type=module - "$RUNNER_TEMP/had-utility-west-proof/geometry.log" <<'NODE'
          import {readFileSync} from 'node:fs'
          const lines=readFileSync(process.argv[2],'utf8').split('\n')
          for(const line of lines){
            for(const marker of ['PLANT_TANK_CURRENT_CONTAINMENT ','PLANT_OWNER_REVIEW_SVG '])if(line.includes(marker))console.log(line)
            for(const marker of ['PLANT_POST_ROW_BRIDGE ','UTILITY_PORTAL_NORMAL ','UTILITY_PORTAL_FINITE ','PLANT_ACTUAL_RAISED_ROOM_JOIN ']){
              const at=line.indexOf(marker);if(at<0)continue
              try{
                const d=JSON.parse(line.slice(at+marker.length))
                const out=marker.startsWith('PLANT_POST')?{sourceDigest:d.sourceDigest,failedChecks:d.failedChecks,collisionPairs:d.collisionPairs,bridge:{memberFailures:d.bridge.memberChecks.filter(q=>!q.necessary),demandN:d.bridge.oneSharedPostDemandUpperN,normalFootWrenchBounds:d.bridge.normalFootWrenchBounds,renewal:d.bridge.necessaryRenewalGeometry},mass:d.normalMassUpperKg,solids:d.solidsIncrementUpperL}:marker.startsWith('UTILITY_PORTAL_NORMAL')?{geometryFailures:d.geometryFailures,coldFailures:d.coldFailures,mass:d.mass,headRelease:{reference:d.headRelease?.reference,toolFailures:d.headRelease?.toolFailures,necessaryTools:d.headRelease?.necessaryTools},duties:d.duties}:marker.startsWith('UTILITY_PORTAL_FINITE')?{geometryFailures:d.geometryFailures,toolFailures:d.toolFailures,open:d.open}: {frame:d.frame,normal:d.normal,bridge:d.bridge?{memberFailures:d.bridge.memberChecks?.filter(q=>!q.necessary),renewalFailures:d.bridge.renewal?.filter(q=>!q.necessaryGeometricSweeps).map(q=>({id:q.id,door:q.doorReserveMm,rest:q.externalRestReserveMm,head:q.headReserveMm,obstacles:q.obstacleChecks.filter(a=>a.reserveAfterSettingsMm<0)})),normalFootWrenchBounds:d.bridge.normalFootWrenchBounds}:null}
                console.log(marker.trim()+'_SUMMARY '+JSON.stringify(out))
              }catch(error){console.log('PROOF_SUMMARY_PARSE_ERROR '+marker+' '+String(error))}
            }
          }
          for(const line of lines.filter(line=>/ℹ (tests|pass|fail)|error TS|^✖ /.test(line)))console.log(line.slice(0,2000))
          const failure=lines.findLastIndex(line=>line.includes('failing tests:'))
          if(failure>=0)for(const line of lines.slice(failure,failure+180))console.log(line.slice(0,2500))
          NODE
          exit "$geometry_status"
      - name: Retain logs and source identities
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: had-utility-west-proof-${{ github.sha }}
          path: ${{ runner.temp }}/had-utility-west-proof
          retention-days: 90
          if-no-files-found: error
      - name: Preserve actual check outcomes
        if: always()
        env:
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          GEOMETRY_OUTCOME: ${{ steps.geometry.outcome }}
        run: |
          test "$TYPES_OUTCOME" = success
          test "$GEOMETRY_OUTCOME" = success
