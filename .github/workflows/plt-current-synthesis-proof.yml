name: Prove current PLT sectional synthesis
on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/architectural-drawing/spatial-visibility*'
      - 'compiler/reference-house/georgian/**'
      - 'compiler/reference-house/georgian-sectional-synthesis.test.ts'
      - 'compiler/publication-drawing/projection-3d.ts'
      - 'compiler/publication-drawing/visibility-3d.ts'
      - 'compiler/publication-drawing-v2/**'
      - 'compiler/publication-drawing/tokens.ts'
      - 'publication/fonts.ts'
      - 'publication/specimens/plt19/**'
      - '.github/workflows/plt-current-synthesis-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plt-current-synthesis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: node --import tsx --test compiler/architectural-drawing/spatial-visibility.test.ts compiler/reference-house/georgian-sectional-synthesis.test.ts
      - run: node --import tsx publication/specimens/plt19/prepare.ts
      - run: PLT19_FORMAT=b5 npx vivliostyle build -c publication/specimens/plt19/vivliostyle.config.js
      - run: PLT19_FORMAT=a4 npx vivliostyle build -c publication/specimens/plt19/vivliostyle.config.js
      - run: PLT19_FORMAT=a2 npx vivliostyle build -c publication/specimens/plt19/vivliostyle.config.js
      - run: PLT19_FORMAT=facing npx vivliostyle build -c publication/specimens/plt19/vivliostyle.config.js
      - run: node --import tsx publication/specimens/plt19/validate.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plt-current-synthesis-proof
          path: |
            publication/specimens/plt19/dist/*.pdf
            publication/specimens/plt19/.work/*.json
            publication/specimens/plt19/.work/*.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
