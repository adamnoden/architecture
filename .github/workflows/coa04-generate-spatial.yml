name: COA-04 generate spatial successors

on:
  push:
    branches:
      - coa-04-plan-section-successors

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: coa-04-plan-section-successors
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run outputs:spatial:generate
      - run: |
          rm .github/workflows/coa04-generate-spatial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference-house/generated/ground-floor-plan.svg docs/reference-house/generated/first-floor-plan.svg docs/reference-house/generated/principal-section.svg .github/workflows/coa04-generate-spatial.yml
          git commit -m "COA-04 generate plan and section successors"
          git push origin HEAD:coa-04-plan-section-successors
