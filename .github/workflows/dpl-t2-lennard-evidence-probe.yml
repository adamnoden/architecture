name: DPL-T2 Lennard evidence probe

on:
  push:
    branches:
      - dpl-t2-lennard-admission
    paths:
      - .github/workflows/dpl-t2-lennard-evidence-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install bounded geometry dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests shapely pyproj

      - name: Acquire and relate Lennard Road open physical geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/road
          python3 - <<'PY'
          import json, pathlib, hashlib
          import requests
          from shapely.geometry import LineString
          from shapely import wkt
          from shapely.ops import transform, nearest_points
          from pyproj import Transformer

          UA={'User-Agent':'Mozilla/5.0 DPL-T2 bounded road evidence probe'}
          q='[out:json][timeout:30];way(around:250,51.377028,0.051871)[highway][name="Lennard Road"];out tags geom;'
          endpoints=[
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass-api.de/api/interpreter',
            'https://overpass.nchc.org.tw/api/interpreter'
          ]
          attempts=[]; data=None; used=None
          for ep in endpoints:
              try:
                  r=requests.get(ep,params={'data':q},headers=UA,timeout=60)
                  rec={'endpoint':ep,'status':r.status_code,'bytes':len(r.content),'contentType':r.headers.get('content-type')}
                  attempts.append(rec)
                  if r.ok:
                      j=r.json()
                      if j.get('elements'):
                          data=j; used=ep
                          pathlib.Path('evidence/road/lennard-road-osm.json').write_bytes(r.content)
                          rec['sha256']=hashlib.sha256(r.content).hexdigest()
                          break
              except Exception as e:
                  attempts.append({'endpoint':ep,'error':repr(e)})

          out={'query':q,'attempts':attempts,'selectedEndpoint':used}
          if data:
              to_bng=Transformer.from_crs(4326,27700,always_xy=True).transform
              parcel=wkt.loads('MULTIPOLYGON (((0.052538 51.377265, 0.052473 51.377319, 0.052342 51.377267, 0.052269 51.377235, 0.051941 51.377083, 0.051889 51.377056, 0.051696 51.376963, 0.051797 51.376897, 0.052125 51.377017, 0.052236 51.377069, 0.052376 51.377151, 0.052375 51.377151, 0.052402 51.377169, 0.052444 51.37719, 0.052538 51.377265)))')
              parcel_bng=transform(to_bng,parcel)
              ways=[]
              for e in data['elements']:
                  geom=e.get('geometry') or []
                  if len(geom)<2: continue
                  line=LineString([(p['lon'],p['lat']) for p in geom])
                  lb=transform(to_bng,line)
                  p1,p2=nearest_points(parcel_bng,lb)
                  ways.append({
                    'osmWayId':e.get('id'),
                    'tags':e.get('tags',{}),
                    'distanceParcelToRoadCentrelineMetres':parcel_bng.distance(lb),
                    'nearestParcelPointBng':[p1.x,p1.y],
                    'nearestRoadPointBng':[p2.x,p2.y],
                    'roadBoundsBng':[lb.bounds[0],lb.bounds[1],lb.bounds[2],lb.bounds[3]]
                  })
              ways.sort(key=lambda x:x['distanceParcelToRoadCentrelineMetres'])
              out['wayCount']=len(ways)
              out['ways']=ways
              if ways:
                  out['nearestDistanceMetres']=ways[0]['distanceParcelToRoadCentrelineMetres']
                  out['nearestWayId']=ways[0]['osmWayId']
          pathlib.Path('evidence/road/road-relation.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          if not data:
              raise SystemExit('No Lennard Road geometry acquired from bounded open endpoints')
          PY

      - name: Upload bounded road evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpl-t2-lennard-road-probe
          path: evidence/
          if-no-files-found: error
          retention-days: 1
