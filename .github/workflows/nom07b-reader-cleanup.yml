name: NOM-07B reader cleanup

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom07b-reader-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - name: Apply bounded reader-facing cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/patterns/README.md': [
                  (
                      'The architectural name is the reader-facing identity. Stable machine IDs remain available to the computational and reference systems, but are not part of the ordinary pattern list.',
                      'Patterns are referred to by architectural name throughout the publication.'
                  ),
                  (
                      'The active list above is generated from pattern metadata; individual pattern records remain the source of pattern identity and evidence status.',
                      'The active list above reflects the current canonical set and evidence status.'
                  ),
              ],
              'docs/patterns/strategies/README.md': [
                  (
                      'They sit between governing doctrine and the pattern language, but they are **not pattern nodes** and do not receive `PAT-xxx` identities.',
                      'They sit between governing doctrine and the pattern language, but they are **not pattern nodes**.'
                  ),
              ],
              'docs/patterns/candidates/README.md': [
                  (
                      'They have no `PAT-*` identity and are excluded from the canonical pattern index until their stated admission gate is crossed.',
                      'They are excluded from the canonical pattern index until their stated admission gate is crossed.'
                  ),
              ],
              'docs/patterns/candidates/replaceable-architectural-lining.md': [
                  ('**Status:** held; no stable pattern ID  ', '**Status:** held  '),
              ],
              'docs/patterns/candidates/individually-isolatable-manifold-distribution.md': [
                  ('**Status:** held; no stable pattern ID  ', '**Status:** held  '),
              ],
              'docs/patterns/candidates/local-deep-service-zone.md': [
                  ('**Status:** held; no stable pattern ID  ', '**Status:** held  '),
              ],
              'docs/patterns/candidates/selective-floor-access.md': [
                  ('**Status:** held; no stable pattern ID  ', '**Status:** held  '),
              ],
              'docs/patterns/service-topology-sequence.md': [
                  ('**Sequence ID:** `service-topology`\n\n', ''),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Expected text missing in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          if grep -R -nE 'PAT-(xxx|\*)|no stable pattern ID|\*\*Sequence ID:\*\*' docs/patterns/README.md docs/patterns/strategies docs/patterns/candidates docs/patterns/service-topology-sequence.md; then
            echo 'Reader-facing machine-identity residue remains in bounded NOM-07B surfaces.' >&2
            exit 1
          fi

          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/patterns
          git commit -m "PUB-NOM: remove pattern machine narration from reader pages"
          git push origin HEAD:pub-nom
