name: DRW-12D Regenerate Proof

on:
  push:
    branches:
      - drw-12d-whole-book-physical-proof

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false
      - name: Regenerate affected controlled plates
        run: |
          npx tsx compiler/reference-house/generate-publication-first-floor-plan.ts
          npx tsx compiler/reference-house/generate-publication-service-maintenance-overlays.ts
          npx tsx compiler/reference-house/generate-publication-structural-span-overlay.ts
      - name: Prove regeneration scope
        run: |
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            docs/reference-house/publication-first-floor-plan.svg \
            docs/reference-house/publication-first-service-maintenance-overlay.svg \
            docs/reference-house/publication-structural-span-overlay.svg | sort)"
      - name: Commit exact generated plates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/reference-house/publication-first-floor-plan.svg \
            docs/reference-house/publication-first-service-maintenance-overlay.svg \
            docs/reference-house/publication-structural-span-overlay.svg
          git commit -m 'DRW-12D regenerate corrected first-floor plate family'
          git push origin HEAD:drw-12d-whole-book-physical-proof
      - uses: actions/upload-artifact@v4
        with:
          name: drw-12d-regenerated-controlled-plates
          path: |
            docs/reference-house/publication-first-floor-plan.svg
            docs/reference-house/publication-first-service-maintenance-overlay.svg
            docs/reference-house/publication-structural-span-overlay.svg
          if-no-files-found: error
          retention-days: 1
