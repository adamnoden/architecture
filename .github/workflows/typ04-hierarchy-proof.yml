name: TYP-04 hierarchy proof

on:
  pull_request:
    paths:
      - '.github/workflows/typ04-hierarchy-proof.yml'
      - 'publication/specimens/typ04/**'
      - 'publication/specimens/typ03/open-fonts.ts'
      - 'publication/publication.ts'
      - 'docs/manuscript/part-i.md'
      - 'docs/manuscript/part-ii.md'
      - 'docs/manuscript/part-v.md'
      - 'docs/manuscript/evidence-and-precedent-notes.md'
      - 'docs/patterns/controlled-utility-entry.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PDF font inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build exact A4 and B5 hierarchy proofs
        run: npx tsx publication/specimens/typ04/build.ts

      - name: Verify rendered Source font identities
        shell: bash
        run: |
          set -euo pipefail

          verify_pdf() {
            local pdf="$1"
            local report="${pdf}.fonts.txt"
            pdffonts "$pdf" | tee "$report"

            for required in SourceSerif4-Regular SourceSans3-Regular SourceSans3-Bold; do
              awk -v required="$required" '$1 ~ required && $(NF-4) == "yes" { found=1 } END { exit found ? 0 : 1 }' "$report" || {
                echo "Missing embedded required font $required in $pdf" >&2
                exit 1
              }
            done

            if grep -Eiq 'Liberation|Arial|Helvetica|Times|Georgia' "$report"; then
              echo "System-font fallback detected in $pdf" >&2
              exit 1
            fi
          }

          verify_pdf publication/.work/typ04/a4/typ04b-serif-led-a4.pdf
          verify_pdf publication/.work/typ04/b5/typ04b-serif-led-b5.pdf

      - name: Upload hierarchy proof family
        uses: actions/upload-artifact@v4
        with:
          name: typ04b-hierarchy-proof
          path: |
            publication/.work/typ04/a4/typ04b-serif-led-a4.pdf
            publication/.work/typ04/a4/manifest.json
            publication/.work/typ04/a4/typ04b-serif-led-a4.pdf.fonts.txt
            publication/.work/typ04/b5/typ04b-serif-led-b5.pdf
            publication/.work/typ04/b5/manifest.json
            publication/.work/typ04/b5/typ04b-serif-led-b5.pdf.fonts.txt
          if-no-files-found: error
          retention-days: 14
