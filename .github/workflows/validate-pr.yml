name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache verified publication fonts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ovids-house/publication-fonts
          key: ${{ runner.os }}-publication-fonts-v1-${{ hashFiles('publication/fonts.ts') }}
          restore-keys: ${{ runner.os }}-publication-fonts-v1-

      - name: Validate packet and lease declaration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts packet-check

      - name: Render project-control projections for validation
        run: npm run status:update

      # Catch presentation defects before the long canonical suite. This
      # preview build does not replace or weaken npm run check below.
      - name: Build and review homepage in browser
        run: |
          npm run docs:build
          node scripts/validate-homepage.mjs

      - name: Retain built website for rendered review
        if: always() && hashFiles('.vitepress/dist/index.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: website-preview
          path: .vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Retain homepage browser evidence
        if: always() && hashFiles('node_modules/.cache/ovids-house/homepage-proof/review.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: homepage-browser-review
          path: node_modules/.cache/ovids-house/homepage-proof
          if-no-files-found: error
          retention-days: 7

      - name: Check repository health
        run: npm run check

      - name: Validate project control
        run: npx tsx scripts/validate-project-control.ts

      - name: Validate public nomenclature source
        run: npx tsx scripts/validate-public-nomenclature.ts --source

      - name: Build publication PDFs
        run: |
          npm run publication:build
          npm run publication:build:primer

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Validate publication plate rhythm
        run: npx tsx publication/scripts/validate-plate-rhythm.ts

      - name: Validate rendered public nomenclature
        run: npx tsx scripts/validate-public-nomenclature.ts --rendered

      - name: Prove rendered nomenclature regressions
        run: npx tsx scripts/test-public-nomenclature-regressions.ts --rendered

      - name: Inventory reader-facing nomenclature
        run: |
          npm run nomenclature:inventory -- \
            --files=pattern.pat \
            --files=reference-house.compiler-gate \
            --files=compiler.p0 \
            --files=compiler.pattern-crosswalk \
            --files=compiler.cf \
            --files=compiler.ch \
            --files=compiler.h1
