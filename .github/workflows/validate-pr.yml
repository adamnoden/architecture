name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  floor-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Reproduce preserved finite-detail comparison
        run: python project/str/studies/floor_portal_detail.py --check

      - name: Prove native roof split and work equivalence
        run: python project/str/studies/floor_portal_roof.py

      - name: Check biaxial stress block and independent geometry controls
        run: python project/str/studies/floor_portal_sections.py

      - name: Check unilateral contact against independent direct solves
        run: python project/str/studies/floor_portal_movements.py --controls

      - name: Check jamb cap coupler stack and product envelopes
        run: python project/str/studies/floor_portal_cap_stack.py

      - name: Check finite roof-guide travel and reinforcement clearance
        run: python project/str/studies/floor_portal_guide_fit.py

      - name: Reproduce connected assembly and all-head equilibrium controls
        run: python project/str/studies/floor_portal_coupled.py --check --output /tmp/floor-portal-coupled.json

      - name: Exercise bounded 18 percent graphite-bronze guide friction on signed quick domain
        run: python project/str/studies/floor_portal_domain.py --candidate guided-t20 --guide-friction 0.18 --quick --output /tmp/floor-portal-friction-quick.json



  floor-portal-leading-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Solve all 579 correlated signed demand cases
        run: python project/str/studies/floor_portal_domain.py --candidate guided-t20 --output /tmp/floor-portal-leading-domain.json --matrix /tmp/floor-portal-leading-domain.npz

      - name: Screen actual square-corner end sections on the same cases
        run: python project/str/studies/floor_portal_section_review.py /tmp/floor-portal-leading-domain.npz --output /tmp/floor-portal-leading-section-review.json

      - name: Screen live radial-guide hardware force path
        run: python project/str/studies/floor_portal_guide_hardware.py /tmp/floor-portal-leading-domain.json --output /tmp/floor-portal-leading-guide-hardware.json


  floor-portal-friction-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Solve all 579 cases with 18 percent graphite-bronze guide-friction bound
        run: python project/str/studies/floor_portal_domain.py --candidate guided-t20 --guide-friction 0.18 --output /tmp/floor-portal-friction-domain.json --matrix /tmp/floor-portal-friction-domain.npz

      - name: Screen friction-domain square-corner sections
        run: python project/str/studies/floor_portal_section_review.py /tmp/floor-portal-friction-domain.npz --output /tmp/floor-portal-friction-sections.json

      - name: Screen friction-domain guide hardware
        run: python project/str/studies/floor_portal_guide_hardware.py /tmp/floor-portal-friction-domain.json --output /tmp/floor-portal-friction-hardware.json

  floor-portal-friction-movements:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Solve six strain comparisons and all 104 head motions with 18 percent graphite-bronze guide friction
        run: python project/str/studies/floor_portal_movements.py --candidate guided-t20 --guide-friction 0.18 --heads --output /tmp/floor-portal-friction-movements.json

  floor-portal-leading-movements:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Solve six strain comparisons and all 104 signed head motions
        run: python project/str/studies/floor_portal_movements.py --candidate guided-t20 --heads --output /tmp/floor-portal-leading-movements.json

  floor-portal-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [baseline, square, radial-guide-j50-t20, radial-guide-j45-stack]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout structural source
        uses: actions/checkout@v5

      - name: Setup calculation Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/floor-portal-requirements.txt

      - name: Install pinned calculation dependencies
        run: python -m pip install --requirement project/str/studies/floor-portal-requirements.txt

      - name: Solve bounded structural sensitivity
        run: python project/str/studies/floor_portal_recovery_probe.py --candidate ${{ matrix.candidate }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache verified publication fonts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ovids-house/publication-fonts
          key: ${{ runner.os }}-publication-fonts-v1-${{ hashFiles('publication/fonts.ts') }}
          restore-keys: ${{ runner.os }}-publication-fonts-v1-

      - name: Validate packet and lease declaration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts packet-check

      - name: Render project-control projections for validation
        run: npm run status:update

      - name: Check repository health
        run: npm run check

      - name: Validate project control
        run: npx tsx scripts/validate-project-control.ts

      - name: Validate public nomenclature source
        run: npx tsx scripts/validate-public-nomenclature.ts --source

      - name: Build publication PDFs
        run: |
          npm run publication:build
          npm run publication:build:primer

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Validate publication plate rhythm
        run: npx tsx publication/scripts/validate-plate-rhythm.ts

      - name: Validate rendered public nomenclature
        run: npx tsx scripts/validate-public-nomenclature.ts --rendered

      - name: Prove rendered nomenclature regressions
        run: npx tsx scripts/test-public-nomenclature-regressions.ts --rendered

      - name: Inventory reader-facing nomenclature
        run: |
          npm run nomenclature:inventory -- \
            --files=pattern.pat \
            --files=reference-house.compiler-gate \
            --files=compiler.p0 \
            --files=compiler.pattern-crosswalk \
            --files=compiler.cf \
            --files=compiler.ch \
            --files=compiler.h1
