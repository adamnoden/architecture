name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup structural numerical runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            project/str/studies/cage-requirements.txt
            project/str/studies/vertical-floor-requirements.txt

      - name: Install pinned structural numerical dependencies
        run: python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt

      - name: Verify fixed-normal and isolated finite-solid analytical controls
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B project/str/studies/fixed_normal_experiment_test.py
          finite_joint_runtime="$RUNNER_TEMP/str-finite-joint"
          python -m venv --system-site-packages "$finite_joint_runtime"
          "$finite_joint_runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_joint_solid_test.py
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_floor_contour_test.py
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_floor_contour_compare_test.py
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_floor_contour_compare.py project/str/studies/finite-floor-contour-captures/contour140.json project/str/studies/finite-floor-contour-captures/contour70.json project/str/studies/finite-floor-contour-captures/contour50.json project/str/studies/finite-floor-contour-captures/contour35.json --out project/str/studies/finite-floor-contour-captures/contour-comparison.json --check
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_floor_contour_ordering_control.py --root . --retained project/str/studies/finite-floor-contour-captures/contour140.json --out project/str/studies/finite-floor-contour-captures/ordering-control.json --check
          "$finite_joint_runtime/bin/python" -B project/str/studies/finite_floor_contour_residency_control_test.py
          echo "STR_FINITE_SOLID_PYTHON=$finite_joint_runtime/bin/python" >> "$GITHUB_ENV"

      - name: Verify cage geometry evidence before full validation
        run: |
          python -B project/str/studies/continuous_rc_closed_links_proof.py --check
          python -B project/str/studies/wet_pad_fan_recovery_proof.py --check
          python -B -m unittest discover -s project/str/studies -p portal_architectural_simplification_test.py
          if ! python -B project/str/studies/portal_architectural_simplification.py --check; then
            python -B project/str/studies/portal_architectural_simplification.py
            git --no-pager -c color.ui=false diff --no-ext-diff -- project/str/studies/portal-architectural-simplification.json project/str/studies/portal-architectural-simplification.svg
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate packet and lease declaration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts packet-check

      - name: Replay recovered wet-beam and masonry comparisons on current sources
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B project/str/studies/wet_beam_end_development_proof.py --check
          python -B -m unittest discover -s project/str/studies -p wet_beam_rectangular_return_test.py
          python -B project/str/studies/uniform_slab_law_test.py
          python -B project/str/studies/uniform_slab_law_proof.py --check
          python -B project/str/studies/uniform_slab_end_consequence_test.py
          python -B project/str/studies/uniform_slab_end_consequence.py --check
          python -B project/str/studies/uniform_slab_contact_refinement_test.py
          python -B project/str/studies/uniform_slab_contact_refinement.py --check
          python -B project/str/studies/uniform_slab_contact_end.py --check
          python -B project/str/studies/wet_masonry_arch_comparison_test.py
          python -B project/str/studies/wet_masonry_arch_comparison.py --check
          python -B project/str/studies/wet_masonry_arch_native_test.py
          python -B project/str/studies/wet_masonry_arch_native_proof.py --check
          python -B project/str/studies/wet_masonry_arch_released_test.py
          python -B project/str/studies/wet_masonry_arch_released_proof.py --check
          python -B project/str/studies/wet_masonry_arch_rise_test.py
          python -B project/str/studies/wet_masonry_arch_rise_proof.py --check
          python -B project/str/studies/wet_masonry_arch_bed_test.py
          python -B project/str/studies/wet_masonry_arch_bed_proof.py --check

      - name: Prove actual finite contour adapter with pinned runtime
        env:
          STR_FINITE_CONTOUR_SAVED_PROBE: project/str/studies/finite-floor-contour-captures/contour35.json
        run: |
          test -n "$STR_FINITE_SOLID_PYTHON"
          node --import tsx --test compiler/reference-house/current-design-finite-floor-contour.test.ts

      - name: Prove wet-beam end edits on the authenticated native case
        env:
          STR_WET_BEAM_END_NATIVE: ${{ runner.temp }}/wet-beam-end-native.json
        run: |
          python -B - <<'PY'
          import os, tarfile
          from pathlib import Path
          with tarfile.open('project/str/studies/wet-beam-end-native-captures.tar.xz', 'r:xz') as archive:
              Path(os.environ['STR_WET_BEAM_END_NATIVE']).write_bytes(archive.extractfile('south40-q64.full.json').read())
          PY
          node --import tsx --test compiler/reference-house/current-design-wet-beam-end.test.ts

      - name: Prove actual lower-masonry saved-stage admission and compute
        env:
          STR_LOWER_MASONRY_NATIVE: ${{ runner.temp }}/lower-masonry-native.json
        run: |
          python -B - <<'PYTHON'
          import os, tarfile
          from pathlib import Path
          with tarfile.open('project/str/studies/wet-masonry-arch-bed-captures.tar.xz','r:xz') as archive:
              Path(os.environ['STR_LOWER_MASONRY_NATIVE']).write_bytes(archive.extractfile('bed8.full.json').read())
          PYTHON
          node --import tsx --test compiler/reference-house/current-design-lower-masonry.test.ts

      - name: Verify fitted-room incident coordinates and unchanged storage duties
        run: node --import tsx --test --test-name-pattern="one saved fitted-width edit" compiler/reference-house/current-design-inlet-room-edit.test.ts

      - name: Prove current two-room ground loads and saved editor controls
        env:
          STR_GROUND_POCKET_NATIVE: '1'
          STR_GROUND_POCKET_SAVED_CAPTURE: ${{ runner.temp }}/ground-support-capture.json
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B project/str/studies/service_room_ground_test.py
          python -B project/str/studies/service_room_ground_receivers_test.py
          python -B project/str/studies/grid_origin_recovery_test.py
          python -B project/str/studies/service_room_ground_proof.py --check
          python -B project/str/studies/service_room_ground_receiver_proof.py --check
          node --import tsx --test compiler/reference-house/current-design-ground-pockets.test.ts
          python - <<'PY'
          import json, os
          from pathlib import Path
          capture=json.loads(Path(os.environ['STR_GROUND_POCKET_SAVED_CAPTURE']).read_text())
          Path(os.environ['RUNNER_TEMP'],'ground-support-document.json').write_text(json.dumps(capture['document']))
          PY
          python -m venv --system-site-packages "$RUNNER_TEMP/ground-support-browser"
          "$RUNNER_TEMP/ground-support-browser/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/ground-support-browser/bin/python" -m playwright install --with-deps --only-shell chromium
          node node_modules/vite/bin/vite.js build --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/ground-support-editor"
          node node_modules/vite/bin/vite.js preview --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/ground-support-editor" --host 127.0.0.1 --port 4189 --strictPort > "$RUNNER_TEMP/ground-support-server.log" 2>&1 &
          GROUND_SUPPORT_PREVIEW_PID=$!
          trap 'kill "$GROUND_SUPPORT_PREVIEW_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4189/engineering.html',timeout=2)
                  break
              except OSError:
                  if attempt==59: raise
                  time.sleep(1)
          PY
          "$RUNNER_TEMP/ground-support-browser/bin/python" project/ade/browser-editor/engineering_browser_test.py http://127.0.0.1:4189/engineering.html --ground-pocket-document "$RUNNER_TEMP/ground-support-document.json" --screenshot "$RUNNER_TEMP/ground-support-editor.png"

      - name: Prove saved finite joint and its actual structural room editor
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          node --import tsx scripts/compile-current-design.ts --bundle project/ccr/studies/working-house-comparison.json > "$RUNNER_TEMP/working-house-bundle.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          source=json.loads(Path('project/ccr/studies/working-house-comparison.json').read_text())
          bundle=json.loads(Path(os.environ['RUNNER_TEMP'],'working-house-bundle.json').read_text())
          result=bundle['engineering']['floorSection']['finiteJointComparison']
          assert source['stages']['distributedFloor']['cornerWidthsMm']==dict.fromkeys(['NW','NE','SW','SE'],200)
          assert result['status']=='computed-unselected-comparison', result['diagnostics']
          assert result['controls']==source['stages']['floorSection']['finiteJointComparison']
          assert not result['candidateAccepted'] and not result['resistanceAccepted'] and not result['completeHouseProof']
          assert len(result['result']['native']['nativeVertical']['native']['heads'])==52
          assert len(bundle['engineering']['studyRoomKit']['kit']['floor']['parts'])==136
          Path(os.environ['RUNNER_TEMP'],'working-house-finite-result.json').write_text(json.dumps(result['result']))
          print('PASS actual saved uniform200 house, finite SW solve and136-piece dependent Study')
          PYTHON
          STR_CURRENT_FINITE_CAPTURE="$RUNNER_TEMP/working-house-finite-result.json" python -B project/str/studies/current_finite_joint_replay_test.py
          node node_modules/vite/bin/vite.js preview --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/ground-support-editor" --host 127.0.0.1 --port 4190 --strictPort > "$RUNNER_TEMP/finite-joint-server.log" 2>&1 &
          FINITE_JOINT_PREVIEW_PID=$!
          trap 'kill "$FINITE_JOINT_PREVIEW_PID" 2>/dev/null || true' EXIT
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4190/engineering.html',timeout=2)
                  break
              except OSError:
                  if attempt==59: raise
                  time.sleep(1)
          PYTHON
          "$RUNNER_TEMP/ground-support-browser/bin/python" project/ade/browser-editor/engineering_browser_test.py http://127.0.0.1:4190/engineering.html --finite-joint-document project/ccr/studies/working-house-comparison.json --screenshot "$RUNNER_TEMP/finite-joint-editor.png"

      - name: Retain actual finite house and room proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finite-house-room-saved-proof
          path: |
            ${{ runner.temp }}/working-house-bundle.json
            ${{ runner.temp }}/finite-joint-editor.png
            ${{ runner.temp }}/finite-joint-server.log
          if-no-files-found: error
          retention-days: 7

      - name: Retain actual saved ground and browser proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ground-support-saved-proof
          path: |
            ${{ runner.temp }}/ground-support-capture.json
            ${{ runner.temp }}/ground-support-document.json
            ${{ runner.temp }}/ground-support-editor.png
            ${{ runner.temp }}/ground-support-server.log
          if-no-files-found: error
          retention-days: 7

      - name: Cache verified publication fonts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ovids-house/publication-fonts
          key: ${{ runner.os }}-publication-fonts-v1-${{ hashFiles('publication/fonts.ts') }}
          restore-keys: ${{ runner.os }}-publication-fonts-v1-

      - name: Render project-control projections for validation
        run: npm run status:update

      # Catch presentation defects before the long canonical suite. This
      # preview build does not replace or weaken npm run check below.
      - name: Build and review homepage in browser
        run: |
          npm run docs:build
          node scripts/validate-homepage.mjs

      - name: Retain built website for rendered review
        if: always() && hashFiles('.vitepress/dist/index.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: website-preview
          path: .vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Retain homepage browser evidence
        if: always() && hashFiles('node_modules/.cache/ovids-house/homepage-proof/review.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: homepage-browser-review
          path: node_modules/.cache/ovids-house/homepage-proof
          if-no-files-found: error
          retention-days: 7

      - name: Check repository health
        run: npm run check

      - name: Validate project control
        run: npx tsx scripts/validate-project-control.ts

      - name: Validate public nomenclature source
        run: npx tsx scripts/validate-public-nomenclature.ts --source


  publication:
    name: Validate publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup structural numerical runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            project/str/studies/cage-requirements.txt
            project/str/studies/vertical-floor-requirements.txt

      - name: Install pinned structural numerical dependencies
        run: python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache verified publication fonts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ovids-house/publication-fonts
          key: ${{ runner.os }}-publication-fonts-v1-${{ hashFiles('publication/fonts.ts') }}
          restore-keys: ${{ runner.os }}-publication-fonts-v1-

      - name: Verify publication text extraction regressions
        run: node --import tsx --test publication/pdf-text.test.ts

      - name: Render project-control projections for publication
        run: npm run status:update

      - name: Build documentation for publication checks
        run: npm run docs:build

      - name: Build publication PDFs
        run: |
          npm run publication:build
          npm run publication:build:primer

      # Candidate bytes remain inspectable even when a later metadata or
      # rendered-content check rejects them. This is not an acceptance receipt.
      - name: Retain candidate publication PDFs for visual review
        if: always() && hashFiles('publication/dist/*.pdf') != ''
        uses: actions/upload-artifact@v6
        with:
          name: publication-candidate-pdfs
          path: publication/dist/*.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Validate publication plate rhythm
        run: npx tsx publication/scripts/validate-plate-rhythm.ts

      - name: Validate rendered public nomenclature
        run: npx tsx scripts/validate-public-nomenclature.ts --rendered

      - name: Prove rendered nomenclature regressions
        run: npx tsx scripts/test-public-nomenclature-regressions.ts --rendered

      - name: Inventory reader-facing nomenclature
        run: |
          npm run nomenclature:inventory -- \
            --files=pattern.pat \
            --files=reference-house.compiler-gate \
            --files=compiler.p0 \
            --files=compiler.pattern-crosswalk \
            --files=compiler.cf \
            --files=compiler.ch \
            --files=compiler.h1

      - name: Fingerprint validated publication PDFs
        run: node scripts/publication-review-manifest.mjs "$RUNNER_TEMP/publication-review-manifest.json"

      - name: Retain publication review manifest
        uses: actions/upload-artifact@v6
        with:
          name: publication-review-manifest
          path: ${{ runner.temp }}/publication-review-manifest.json
          if-no-files-found: error
          retention-days: 7

  publication-preflight:
    name: Canonical publication preflight
    needs: [validate, publication]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/control-runtime
      - name: Verify exact submitted head and each canonical lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/project-pr-preflight.ts
