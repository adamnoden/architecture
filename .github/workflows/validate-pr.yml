name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check repository health
        run: npm run check

      - name: Build Working Edition proof
        run: npm run publication:build

      - name: Upload Working Edition proof
        uses: actions/upload-artifact@v4
        with:
          name: publication-figure-hardening-proof
          path: publication/dist/ovids-house.pdf
          if-no-files-found: error
          retention-days: 7
