name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: HFI-08B temporary regeneration probe
        run: |
          npm run rh-c1:generate
          npm run outputs:generate
          npm run dataplate:write
          echo '=== HFI-08B GENERATED DIFF ==='
          git diff --no-color --unified=2 -- \
            docs/reference-house/rhc1-ground-floor.svg \
            docs/reference-house/rhc1-first-floor.svg \
            docs/reference-house/rhc1-principal-section.svg \
            docs/reference-house/generated \
            project/dataplate.json
          echo '=== END HFI-08B GENERATED DIFF ==='
          git reset --hard HEAD

      - name: Check repository health
        run: npm run check

      - name: Validate public nomenclature source
        run: npx tsx scripts/validate-public-nomenclature.ts --source

      - name: Build publication PDFs
        run: |
          npm run publication:build
          npm run publication:build:primer

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Validate rendered public nomenclature
        run: npx tsx scripts/validate-public-nomenclature.ts --rendered

      - name: Prove rendered nomenclature regressions
        run: npx tsx scripts/test-public-nomenclature-regressions.ts --rendered

      - name: Inventory reader-facing nomenclature
        run: |
          npm run nomenclature:inventory -- \
            --files=pattern.pat \
            --files=reference-house.compiler-gate \
            --files=compiler.p0 \
            --files=compiler.pattern-crosswalk \
            --files=compiler.cf \
            --files=compiler.ch \
            --files=compiler.h1
