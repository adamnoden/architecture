name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check repository health
        run: npm run check

      - name: Validate public nomenclature source
        run: npx tsx scripts/validate-public-nomenclature.ts --source

      - name: Ensure PDF metadata tooling
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Build publication PDFs
        run: |
          npm run publication:build
          npm run publication:build:primer

      - name: Check publication PDF metadata
        run: npm run publication:metadata:check

      - name: Validate rendered public nomenclature
        run: npx tsx scripts/validate-public-nomenclature.ts --rendered

      - name: Inventory reader-facing nomenclature
        run: |
          for family in \
            pattern.pat \
            reference-house.compiler-gate \
            compiler.p0 \
            compiler.pattern-crosswalk \
            compiler.cf \
            compiler.ch \
            compiler.h1
          do
            npm run nomenclature:inventory -- --files="$family"
          done
