name: Reconcile project-control projections

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: project-control-projections-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Render canonical project-control projections
        run: npm run status:update

      - name: Commit projection delta only
        shell: bash
        run: |
          projection_paths=(STATUS.md project/workstream-codes.md project/control/graph.md)

          if git diff --quiet -- "${projection_paths[@]}" && [ -z "$(git ls-files --others --exclude-standard -- project/control/graph.md)" ]; then
            echo "Project-control projections already current."
            exit 0
          fi

          unexpected="$(git status --porcelain | grep -Ev '^( M|M |A |\?\?) (STATUS\.md|project/workstream-codes\.md|project/control/graph\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit unexpected projection-workflow changes:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${projection_paths[@]}"
          git commit -m "Reconcile generated project-control projections"
          git push origin HEAD:main
