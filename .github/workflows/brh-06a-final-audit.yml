name: BRH-06A final mechanical re-audit

on:
  push:
    branches:
      - brh-06a-final-mechanical-reaudit
    paths:
      - .github/workflows/brh-06a-final-audit.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch complete branch namespace
        run: |
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin --prune

      - name: Run canonical BRH audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/branch-hygiene-audit.mjs \
            --repo=adamnoden/architecture \
            --skip-fetch \
            --output=/tmp/brh-06a-audit.json

      - name: Prove final BRH state
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const audit = read('/tmp/brh-06a-audit.json')
          const expectedMain = 'ff50ca0e98419cc52338c0f3ff9d82b007100fe7'
          if (audit.mainSha !== expectedMain) throw new Error(`main moved: ${audit.mainSha}`)

          const expectedNames = [
            'brh-06a-final-mechanical-reaudit',
            'drw-05e-principal-section-spread-proof',
            'hfi-05c-cross-discipline-conflict-matrix',
          ].sort()
          const observedNames = audit.enumeration.branches.map((x) => x.name).sort()
          if (JSON.stringify(observedNames) !== JSON.stringify(expectedNames)) {
            throw new Error(`unexpected live namespace: ${observedNames.join(', ')}`)
          }

          const byName = new Map(audit.auditedBranches.map((x) => [x.name, x]))
          const drw = byName.get('drw-05e-principal-section-spread-proof')
          const hfi = byName.get('hfi-05c-cross-discipline-conflict-matrix')
          const brh = byName.get('brh-06a-final-mechanical-reaudit')
          if (drw.headSha !== '29c520b7c82f24880d168c3e117370dec7837b8f') throw new Error('DRW-05E head moved')
          if (hfi.headSha !== '932dd67c61ba10cbc154f68745cf8571430f3ada') throw new Error('HFI-05C head moved')
          if (!drw.pullRequests.some((pr) => pr.number === 235 && pr.state === 'open')) throw new Error('DRW-05E PR #235 is not open in audit evidence')

          const semanticPackets = ['02a','02b','02c','02d','02e','02f','02g'].map((suffix) =>
            read(`project/branch-hygiene-semantic-review-${suffix}.json`),
          )
          const semantic = new Map()
          for (const packet of semanticPackets) {
            for (const branch of packet.branches ?? []) semantic.set(branch.name, branch)
          }
          const semG = semanticPackets.at(-1)
          if (semG.semanticQueue?.originalCandidates !== 40 || semG.semanticQueue?.resolvedC !== 40 || semG.semanticQueue?.resolvedD !== 0 || semG.semanticQueue?.remainingCD !== 0) {
            throw new Error('semantic queue is not 40 C / 0 D / 0 remaining')
          }

          const x = read('project/branch-hygiene-x-reconciliation.json')
          if (x.summary?.remainingOriginalCD !== 0 || x.summary?.D !== 0 || x.summary?.salvageRequired !== 0) throw new Error('X reconciliation retains unresolved D/CD debt')

          const salvage = read('project/branch-hygiene-salvage-proof.json')
          if (salvage.summary?.DTopics !== 0 || salvage.summary?.salvagePacketsRequired !== 0 || (salvage.salvageQueue ?? []).length !== 0) throw new Error('salvage queue is not vacuously complete')

          const deleted = []
          for (const suffix of ['04a','04b','04c','04d','04e','04f']) {
            const packet = read(`project/branch-hygiene-deletion-${suffix}.json`)
            for (const candidate of packet.candidates ?? []) {
              deleted.push({name: candidate.name, headSha: candidate.expectedHeadSha, class: candidate.class, source: `BRH-${suffix.toUpperCase()}`})
            }
          }

          const f = read('project/branch-hygiene-deletion-04f.json')
          const g = read('project/branch-hygiene-deletion-04g.json')
          const remainingC = f.postDeleteProof?.remainingReviewedC ?? []
          if (remainingC.length !== 20 || g.execution?.candidateCount !== 20 || g.postDeleteProof?.historicalQueueRemaining !== 0) throw new Error('final C deletion queue proof mismatch')
          for (const name of remainingC) {
            const authority = semantic.get(name)
            if (!authority || authority.semanticDisposition !== 'C' || !authority.headSha) throw new Error(`missing C authority for ${name}`)
            deleted.push({name, headSha: authority.headSha, class: 'C', source: 'BRH-04G via semantic authority'})
          }

          const unique = new Map()
          for (const item of deleted) {
            if (unique.has(item.name)) throw new Error(`duplicate deleted branch record: ${item.name}`)
            if (!/^[0-9a-f]{40}$/.test(item.headSha)) throw new Error(`invalid former head SHA: ${item.name}`)
            if (!['A','B','C'].includes(item.class)) throw new Error(`invalid final deleted class: ${item.name} ${item.class}`)
            unique.set(item.name, item)
          }
          const classCounts = {A:0,B:0,C:0,D:0,X:0}
          for (const item of deleted) classCounts[item.class]++
          const expectedCounts = {A:115,B:5,C:41,D:0,X:0}
          if (deleted.length !== 161 || JSON.stringify(classCounts) !== JSON.stringify(expectedCounts)) {
            throw new Error(`deleted ledger mismatch: count=${deleted.length} classes=${JSON.stringify(classCounts)}`)
          }

          const orphanWorkflow = fs.existsSync('.github/workflows/branch-orphan-audit.yml')
          const orphanScript = fs.existsSync('scripts/branch-orphan-report.mjs')
          const lifecycle = fs.existsSync('project/branch-lifecycle.md')
          if (!orphanWorkflow || !orphanScript || !lifecycle) throw new Error('lifecycle prevention surface incomplete')

          const proof = {
            schemaVersion: 1,
            packet: 'BRH-06A',
            programmeIssue: 161,
            mainSha: audit.mainSha,
            enumeration: audit.enumeration,
            survivors: [
              {
                name: drw.name,
                headSha: drw.headSha,
                purpose: 'DRW-05E principal-section spread proof; protected by open draft PR #235',
                openPr: 235,
                aheadOfMain: drw.aheadOfMain,
                behindMain: drw.behindMain,
                uniquePatchCount: drw.patchEquivalence.uniquePatchCount,
              },
              {
                name: hfi.name,
                headSha: hfi.headSha,
                purpose: 'HFI-05C cross-discipline conflict matrix; current authorised HFI packet under issue #195',
                openPr: hfi.pullRequests.find((pr) => pr.state === 'open')?.number ?? null,
                aheadOfMain: hfi.aheadOfMain,
                behindMain: hfi.behindMain,
                uniquePatchCount: hfi.patchEquivalence.uniquePatchCount,
              },
              {
                name: brh.name,
                headSha: brh.headSha,
                purpose: 'BRH-06A current proof packet',
                openPr: brh.pullRequests.find((pr) => pr.state === 'open')?.number ?? null,
                aheadOfMain: brh.aheadOfMain,
                behindMain: brh.behindMain,
                uniquePatchCount: brh.patchEquivalence.uniquePatchCount,
              },
            ],
            historicalDeletion: {
              total: deleted.length,
              classCounts,
              records: deleted.sort((a,b) => a.name.localeCompare(b.name)),
              sourceFiles: ['project/branch-hygiene-deletion-04a.json','project/branch-hygiene-deletion-04b.json','project/branch-hygiene-deletion-04c.json','project/branch-hygiene-deletion-04d.json','project/branch-hygiene-deletion-04e.json','project/branch-hygiene-deletion-04f.json','project/branch-hygiene-deletion-04g.json','project/branch-hygiene-semantic-review-02a.json','project/branch-hygiene-semantic-review-02b.json','project/branch-hygiene-semantic-review-02c.json','project/branch-hygiene-semantic-review-02d.json','project/branch-hygiene-semantic-review-02e.json','project/branch-hygiene-semantic-review-02f.json','project/branch-hygiene-semantic-review-02g.json'],
            },
            unresolved: {originalSemanticCandidates: 40, resolvedC: 40, resolvedD: 0, remainingCD: 0, DTopics: 0, salvageQueue: 0},
            prevention: {orphanWorkflow, orphanScript, lifecycleDoctrine: lifecycle, automaticOrphanDeletion: false},
          }
          const canonical = JSON.stringify(proof)
          proof.sha256 = crypto.createHash('sha256').update(canonical).digest('hex')
          fs.writeFileSync('/tmp/brh-06a-proof.json', `${JSON.stringify(proof, null, 2)}\n`)
          console.log(`BRH-06A PASS main=${proof.mainSha} live_non_main=${observedNames.length} deleted_ledger=${deleted.length} classes=${JSON.stringify(classCounts)} audit_sha=${audit.enumeration.sha256} proof_sha=${proof.sha256}`)
          for (const survivor of proof.survivors) console.log(`SURVIVOR ${survivor.name} ${survivor.headSha} open_pr=${survivor.openPr ?? 'none'} ahead=${survivor.aheadOfMain} behind=${survivor.behindMain} unique_patch=${survivor.uniquePatchCount}`)
          NODE

      - name: Upload final audit proof
        uses: actions/upload-artifact@v4
        with:
          name: brh-06a-final-audit-proof
          path: |
            /tmp/brh-06a-audit.json
            /tmp/brh-06a-proof.json
          if-no-files-found: error
