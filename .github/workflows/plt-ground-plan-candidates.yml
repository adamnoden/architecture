name: Prove PLT ground-plan candidates

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/publication-drawing/svg.ts'
      - 'compiler/reference-house/plt03-ground-plan.ts'
      - 'publication/specimens/plt03/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/plt-ground-plan-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plt-ground-plan-candidates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove protected baseline and candidate authority boundary
        run: npm run plt:03a:proof

      - name: Upload PLT-03A candidate SVGs and manifest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plt-03a-ground-plan-candidates
          path: |
            publication/specimens/plt03/.work/baseline.svg
            publication/specimens/plt03/.work/hierarchy.svg
            publication/specimens/plt03/.work/articulation.svg
            publication/specimens/plt03/.work/combined.svg
            publication/specimens/plt03/.work/manifest.json
          if-no-files-found: error
          retention-days: 30
