name: Temporary STR 1391 publication preflight
on:
  push:
    branches: [work/str-1391-preflight]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4b4aa04cb4f50ef4fd38be5e904e1d91cb618c07
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wait for the reviewed head to pass full validation
        shell: bash
        run: |
          set -eu
          while true; do
            run="$(gh api repos/adamnoden/architecture/actions/runs/42483873875 --jq '[.head_sha, .status, (.conclusion // "pending")] | @tsv')"
            read -r sha status result <<< "$run"
            test "$sha" = "4b4aa04cb4f50ef4fd38be5e904e1d91cb618c07"
            if test "$status" = completed; then
              test "$result" = success
              break
            fi
            sleep 20
          done
      - name: Verify publication lease, head and current main
        run: node --import tsx scripts/project-claims.ts merge-check STR-HOUSE --transport github --lease-id 6c34004d-fbde-471e-870a-684b2ec423ae --generation 30 --branch work/swarm-str-20261108-1240 --head 4b4aa04cb4f50ef4fd38be5e904e1d91cb618c07 --format text
