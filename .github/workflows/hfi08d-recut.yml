name: HFI-08D exact-main recut
on:
  push:
    branches: [hfi/hfi-08d-external-review-handoff-r1]
jobs:
  recut:
    if: ${{ !contains(github.event.head_commit.message, 'HFI-08D recut on integrated main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hfi/hfi-08d-external-review-handoff-r1
          fetch-depth: 1
      - name: Transplant validated HFI-08D delta
        run: |
          git fetch origin hfi/hfi-08d-external-review-handoff
          git show FETCH_HEAD:docs/reference-house/external-review-human-factors-inclusive-design-rh11.md > docs/reference-house/external-review-human-factors-inclusive-design-rh11.md
          git show FETCH_HEAD:docs/reference-house/external-review-brief.md > docs/reference-house/external-review-brief.md
          git show FETCH_HEAD:project/hfi/hfi-08d-external-review-handoff.md > project/hfi/hfi-08d-external-review-handoff.md
          python - <<'PY'
          from pathlib import Path
          p=Path('project/hfi/hfi-08d-external-review-handoff.md')
          s=p.read_text().replace('50aaf2ffadec7f48cdf319c7c5c004c51aa7d4df','d22de1966ea1285a8ccd93b8edc3003182db1d0c')
          p.write_text(s)
          p=Path('.vitepress/navigation.ts')
          s=p.read_text()
          old="      page('Fire & Building Control', '/docs/reference-house/external-review-fire-building-control-rh11'),\n      page('MEP & acoustic', '/docs/reference-house/external-review-mep-acoustic-rh11'),"
          new="      page('Fire & Building Control', '/docs/reference-house/external-review-fire-building-control-rh11'),\n      page('Human factors & inclusive design', '/docs/reference-house/external-review-human-factors-inclusive-design-rh11'),\n      page('MEP & acoustic', '/docs/reference-house/external-review-mep-acoustic-rh11'),"
          if old not in s: raise SystemExit('RH-11 navigation anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/hfi08d-recut.yml
          git config user.name "Adam Noden"
          git config user.email "107278274+adamnoden@users.noreply.github.com"
          git add docs/reference-house/external-review-human-factors-inclusive-design-rh11.md docs/reference-house/external-review-brief.md project/hfi/hfi-08d-external-review-handoff.md .vitepress/navigation.ts .github/workflows/hfi08d-recut.yml
          git commit -m "HFI-08D recut on integrated main"
          git push origin HEAD:hfi/hfi-08d-external-review-handoff-r1
