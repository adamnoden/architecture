name: Prove selected PLT A1 principal section
on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/reference-house/georgian/**'
      - 'compiler/reference-house/georgian-a1-section.test.ts'
      - 'compiler/architectural-drawing/section-assemblies.ts'
      - 'compiler/architectural-drawing/aperture-drawing.ts'
      - 'compiler/publication-drawing-v2/**'
      - 'publication/fonts.ts'
      - 'publication/specimens/plt20/**'
      - '.github/workflows/plt-a1-section-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plt-a1-section-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: node --import tsx --test compiler/reference-house/georgian-a1-section.test.ts compiler/reference-house/georgian-layout-family.test.ts compiler/drw-freeze/*.test.ts
      - run: node --import tsx publication/specimens/plt20/prepare.ts
      - run: npx vivliostyle build -c publication/specimens/plt20/vivliostyle.config.js
      - run: node --import tsx publication/specimens/plt20/validate.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plt-a1-section-proof
          path: |
            publication/specimens/plt20/dist/*.pdf
            publication/specimens/plt20/.work/*.json
            publication/specimens/plt20/.work/*.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
