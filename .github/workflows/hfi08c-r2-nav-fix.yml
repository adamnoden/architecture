name: HFI-08C r2 navigation fix
on:
  push:
    branches: [hfi/hfi-08c-delivery-prototype-consequences-r2]
jobs:
  fix-navigation:
    if: ${{ !contains(github.event.head_commit.message, 'HFI-08C register delivery navigation') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hfi/hfi-08c-delivery-prototype-consequences-r2
      - name: Register delivery page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.vitepress/navigation.ts')
          s=p.read_text()
          old="    page('RIBA implementation brief', '/docs/delivery/riba-implementation-brief-template'),\n    page('External maintenance access requirements', '/docs/delivery/external-maintenance-access-requirements')"
          new="    page('RIBA implementation brief', '/docs/delivery/riba-implementation-brief-template'),\n    page('Human-factors verification requirements', '/docs/delivery/human-factors-verification-requirements'),\n    page('External maintenance access requirements', '/docs/delivery/external-maintenance-access-requirements')"
          if old not in s: raise SystemExit('delivery navigation anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/hfi08c-r2-nav-fix.yml
          git config user.name "Adam Noden"
          git config user.email "107278274+adamnoden@users.noreply.github.com"
          git add .vitepress/navigation.ts .github/workflows/hfi08c-r2-nav-fix.yml
          git commit -m "HFI-08C register delivery navigation"
          git push origin HEAD:hfi/hfi-08c-delivery-prototype-consequences-r2
