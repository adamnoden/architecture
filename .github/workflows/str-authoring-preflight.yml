name: STR authoring publication preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.pull_request.head.ref == 'work/str-architecture-ac1bbd7c'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current task branch
        uses: actions/checkout@v5
        with:
          ref: work/str-architecture-ac1bbd7c
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify current head and live structural lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          STR_VALIDATED_HEAD=$(git rev-parse HEAD)
          node --import tsx scripts/project-claims.ts merge-check STR-00 \
            --lease-id ac1bbd7c-52f5-4c39-b6af-1a7bd5757ebf \
            --generation 1 \
            --branch work/str-architecture-ac1bbd7c \
            --head "$STR_VALIDATED_HEAD"
