name: Publication pipeline

on:
  push:
    branches:
      - print-publication-pipeline
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - '.vitepress/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  pull_request:
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - '.vitepress/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Build publication smoke PDF
        run: npm run publication:build:smoke

      - name: Verify smoke PDF exists
        run: test -s publication/dist/house-systems-architecture-smoke.pdf

      - name: Build full Working Edition PDF
        run: npm run publication:build

      - name: Verify Working Edition PDF exists
        run: test -s publication/dist/house-systems-architecture.pdf

      - name: Build documentation
        run: npm run docs:build

      - name: Assemble Pages artifact
        run: |
          cp publication/dist/house-systems-architecture.pdf .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/index.html

      - name: Upload combined site preview
        uses: actions/upload-artifact@v4
        with:
          name: combined-site-preview
          path: .vitepress/dist
          if-no-files-found: error
