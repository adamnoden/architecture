name: Publication pipeline

on:
  push:
    branches:
      - print-publication-pipeline
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  pull_request:
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock once
        if: github.event_name == 'push'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already tracked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock npm dependency closure'
          git push origin HEAD:print-publication-pipeline

      - name: Run repository tests
        run: npm test

      - name: Build publication smoke PDF
        run: npm run publication:build:smoke

      - name: Verify smoke PDF exists
        run: test -s publication/dist/house-systems-architecture-smoke.pdf

      - name: Upload smoke PDF
        uses: actions/upload-artifact@v4
        with:
          name: publication-smoke-pdf
          path: publication/dist/house-systems-architecture-smoke.pdf
          if-no-files-found: error

      - name: Build full Working Edition PDF
        run: npm run publication:build

      - name: Verify Working Edition PDF exists
        run: test -s publication/dist/house-systems-architecture.pdf

      - name: Upload Working Edition PDF
        uses: actions/upload-artifact@v4
        with:
          name: publication-working-edition
          path: publication/dist/house-systems-architecture.pdf
          if-no-files-found: error
