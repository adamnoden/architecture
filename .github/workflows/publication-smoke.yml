name: Publication pipeline

on:
  push:
    branches:
      - print-publication-pipeline
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - 'docs/development/**'
      - '.vitepress/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  pull_request:
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - 'docs/development/**'
      - '.vitepress/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Classify publication pages in navigation once
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = '.vitepress/navigation.ts'
          let source = fs.readFileSync(path, 'utf8')

          if (!source.includes("/docs/manuscript/readers-guide")) {
            const anchor = "    page('Preface', '/docs/manuscript/preface'),"
            if (!source.includes(anchor)) throw new Error('Manuscript navigation anchor changed.')
            source = source.replace(
              anchor,
              `${anchor}\n    page("Reader's Guide", '/docs/manuscript/readers-guide'),`
            )
          }

          if (!source.includes("/docs/development/print-publication-pipeline")) {
            const anchor = "    page('Manufacturing strategy', '/docs/development/manufacturing-strategy')\n  ], false),"
            if (!source.includes(anchor)) throw new Error('Development navigation anchor changed.')
            source = source.replace(
              anchor,
              `${anchor}\n  group('Print publication', [\n    page('Pipeline & recovery record', '/docs/development/print-publication-pipeline'),\n    page('Publication scope crosswalk', '/docs/development/print-publication-scope-crosswalk'),\n    page('Editorial proof ledger', '/docs/development/print-publication-editorial-proof')\n  ]),`
            )
          }

          fs.writeFileSync(path, source)
          NODE

          if git diff --quiet -- .vitepress/navigation.ts; then
            echo 'Publication pages are already classified.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .vitepress/navigation.ts
          git commit -m 'docs: classify print publication pages in navigation'
          git push origin HEAD:print-publication-pipeline

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Build publication smoke PDF
        run: npm run publication:build:smoke

      - name: Verify smoke PDF exists
        run: test -s publication/dist/house-systems-architecture-smoke.pdf

      - name: Build full Working Edition PDF
        run: npm run publication:build

      - name: Verify Working Edition PDF exists
        run: test -s publication/dist/house-systems-architecture.pdf

      - name: Build documentation
        run: npm run docs:build

      - name: Assemble Pages artifact
        run: |
          cp publication/dist/house-systems-architecture.pdf .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/house-systems-architecture.pdf
          test -s .vitepress/dist/index.html

      - name: Upload combined site preview
        uses: actions/upload-artifact@v4
        with:
          name: combined-site-preview
          path: .vitepress/dist
          if-no-files-found: error
