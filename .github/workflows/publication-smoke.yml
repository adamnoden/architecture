name: Publication smoke

on:
  pull_request:
    paths:
      - 'publication/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/controlled-utility-entry.md'
      - 'README.md'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/publication-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Build publication smoke PDF
        run: npm run publication:build:smoke

      - name: Verify PDF exists
        run: test -s publication/dist/house-systems-architecture-smoke.pdf

      - name: Upload smoke PDF
        uses: actions/upload-artifact@v4
        with:
          name: publication-smoke-pdf
          path: publication/dist/house-systems-architecture-smoke.pdf
          if-no-files-found: error
