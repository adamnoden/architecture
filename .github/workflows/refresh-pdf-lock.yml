name: Refresh PDF dependency lock

on:
  push:
    branches: [pub-nom]

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message != 'chore: lock PDF.js inspector dependency' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: pub-nom

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact unpdf@1.8.1

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock PDF.js inspector dependency"
          git push origin HEAD:pub-nom
