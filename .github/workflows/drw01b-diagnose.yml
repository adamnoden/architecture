name: DRW-01B rendered nomenclature diagnostic

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/drw01b-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Replay PR pre-render sequence
        run: |
          npm run check
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          npm run publication:build
          npm run publication:build:primer
      - name: Extract nomenclature failures
        run: |
          set +e
          npx tsx scripts/validate-public-nomenclature.ts --rendered > /tmp/nom.log 2>&1
          code=$?
          set -e
          echo "validator_exit=$code"
          grep -E '^\[(SITE|BOOK)_' /tmp/nom.log | tee /tmp/nom-failures.log || true
          echo "failure_lines=$(wc -l < /tmp/nom-failures.log)"
          echo '--- family counts ---'
          sed -E 's/^\[[^]]+\] [^:]+: ([^ ]+) .*/\1/' /tmp/nom-failures.log | sort | uniq -c | sort -nr || true
          echo '--- source counts ---'
          sed -E 's/^\[[^]]+\] ([^:]+):.*/\1/' /tmp/nom-failures.log | sort | uniq -c | sort -nr | head -40 || true
          echo '--- git diff after PR sequence ---'
          git status --short
          git diff -- . ':!publication/dist' ':!.vitepress/dist' || true
          if [ "$code" -eq 0 ]; then
            echo 'Rendered validator unexpectedly passed after exact PR sequence.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drw01b-nomenclature-diagnostic
          path: /tmp/nom*.log
          retention-days: 7
