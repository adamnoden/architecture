name: Inspect the exact submitted crafted Study artwork
on:
  push:
    branches: [work/zerg-finite-editor-diagnostic-20261126]
permissions:
  contents: read
jobs:
  exact-room-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b1987fb72769f5b6f5f877e801679c3ca9bc53cd
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the existing pinned browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Render the actual current producer SVG without redrawing geometry
        run: |
          mkdir -p "$RUNNER_TEMP/study-review"
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          path=Path('project/ias/studies/crafted-study-eye-level-day.svg')
          data=path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          assert blob=='7fa1d900aad07915cd13f24f07a21b8213cbf17f'
          out=Path(os.environ['RUNNER_TEMP'],'study-review')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':877},device_scale_factor=1)
              page.set_content('<html><body style="margin:0"><img style="display:block;width:1440px;height:auto" src="data:image/svg+xml;base64,'+base64.b64encode(data).decode()+'"></body></html>')
              page.wait_for_function('document.images[0].complete && document.images[0].naturalWidth > 0')
              page.screenshot(path=str(out/'current-study-day.png'),full_page=True)
              browser.close()
          record={'testedHead':'b1987fb72769f5b6f5f877e801679c3ca9bc53cd','source':str(path),'sourceGitBlob':blob,'sourceSHA256':hashlib.sha256(data).hexdigest(),'presentation':'1440px proportional browser rendering of unchanged2160x1315 SVG; no photometric or owner acceptance'}
          (out/'review-source.json').write_text(json.dumps(record,indent=2))
          raw=(out/'current-study-day.png').read_bytes()
          print('STUDY_REVIEW_IMAGE_JSON '+json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'base64':base64.b64encode(raw).decode()},separators=(',',':')))
          print('PASS exact submitted source SVG rendered',json.dumps(record))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: current-submitted-study-artwork
          path: ${{ runner.temp }}/study-review
          if-no-files-found: error
          retention-days: 90
