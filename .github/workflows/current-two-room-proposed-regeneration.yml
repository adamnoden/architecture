name: Execute honest current-native two-room captures without saved-document admission
on:
  push:
    branches: [work/current-two-room-proposed-regeneration-20261126]
    paths:
      - '.github/workflows/current-two-room-proposed-regeneration.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  pure-owning-source-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
      - name: Install existing pinned native runtime
        run: python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
      - name: Compare unchanged full inventory against the authenticated original pure method
        run: |
          set -euo pipefail
          export REGEN_DIR="$RUNNER_TEMP/current-two-room-preparation"
          mkdir -p "$REGEN_DIR"
          git show 011e90a9cbe30bbe959c5f5b497a8e9421a02c3c:compiler/reference-house/current-design/inlet-known-gravity.ts > compiler/reference-house/current-design/inlet-known-gravity.before-current-ground-proof.ts
          export CURRENT_GROUND_BEFORE_METHOD="$GITHUB_WORKSPACE/compiler/reference-house/current-design/inlet-known-gravity.before-current-ground-proof.ts"
          node --import tsx --test project/str/studies/current_two_room_pure_source_test.mjs
          rm compiler/reference-house/current-design/inlet-known-gravity.before-current-ground-proof.ts
          npm run typecheck
          node --import tsx project/str/studies/current_two_room_proposed.mjs "$REGEN_DIR" --capture
      - name: Retain exact actual native bytes in explicitly proposed-input archives
        run: |
          python -B - <<'PY'
          import hashlib,io,json,os,tarfile
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'current-two-room-preparation'
          manifest=json.loads((folder/'actual-two-room-capture-manifest.json').read_text())
          if manifest['nativeSolvesExecuted']!=3 or manifest['currentSavedDocumentAdmitted'] is not False or manifest['allResponseIdentityGuardsPassed'] is not True:raise ValueError('Three actual authenticated unadmitted solves required')
          current=json.loads((folder/'current.wrapper.json').read_text());baseline=json.loads((folder/'baseline.wrapper.json').read_text())
          encode=lambda v:(json.dumps(v,indent=2,allow_nan=False)+'\n').encode()
          common={'proposed-current-ground-preparation.json':(folder/'proposed-current-ground-preparation.json').read_bytes(),'actual-two-room-capture-manifest.json':(folder/'actual-two-room-capture-manifest.json').read_bytes()}
          for path in manifest['method']['sourceSHA256']:common['methods/'+path]=Path(path).read_bytes()
          for path in manifest['source']['actualSourceSHA256']:common['proposed-methods/'+path]=Path(path).read_bytes()
          sets={
           'service-room-ground-receiver-captures-20261126.tar.xz':{**common,
            'proposed-input-and-result.json':encode({'schema':'str-proposed-input-ground-native-capture/1','currentSavedDocumentAdmitted':False,'groundPocketLoads':current}),
            'current.request.json':(folder/'current.request.json').read_bytes(),'current.full.json':(folder/'current.full.json').read_bytes(),
            'contact125.request.json':(folder/'contact125.request.json').read_bytes(),'contact125.json':(folder/'contact125.full.json').read_bytes()},
           'service-room-ground-observed-two-room-20261126.tar.xz':{**common,
            'proposed-input-and-ground-result.json':encode({'schema':'str-proposed-input-ground-native-capture/1','currentSavedDocumentAdmitted':False,'groundPocketLoads':baseline}),
            'baseline.request.json':(folder/'baseline.request.json').read_bytes(),'baseline.full.json':(folder/'baseline.full.json').read_bytes()}}
          for name,files in sets.items():
           record={'schema':'str-proposed-current-two-room-native-archive/1','sourceCommit':manifest['sourceCommit'],'currentSavedDocumentAdmitted':False,'nativeSourceSHA256':manifest['request']['nativeCase']['sourceSHA256'],'candidateAccepted':False,'files':{n:{'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()} for n,data in files.items()}}
           path=Path('project/str/studies')/name
           with tarfile.open(path,'w:xz',preset=1) as tar:
            for member,data in [*files.items(),('archive-manifest.json',encode(record))]:
             m=tarfile.TarInfo(member);m.size=len(data);tar.addfile(m,io.BytesIO(data))
           print('ACTUAL_CURRENT_TWO_ROOM_ARCHIVE '+json.dumps({'path':str(path),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'currentSavedDocumentAdmitted':False}),flush=True)
          
          PY
      - name: Regenerate owning independent receiver proof and adverse controls
        run: |
          python -B project/str/studies/service_room_ground_receiver_proof.py --write
          python -B project/str/studies/service_room_ground_receiver_proof.py --check
          python -B project/str/studies/service_room_ground_test.py
          python -B project/str/studies/service_room_ground_receivers_test.py
          python -B project/str/studies/service_room_ground_proposed_test.py
          node --import tsx --test compiler/reference-house/current-design-ground-pockets.test.ts
          python -B - <<'PY'
          import hashlib,json,os,subprocess,shutil
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'current-two-room-preparation'
          allow=['project/str/studies/service-room-ground-receiver-captures-20261126.tar.xz','project/str/studies/service-room-ground-observed-two-room-20261126.tar.xz','project/str/studies/service-room-ground-receiver-proof.json']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if set(changed)-set(allow):raise ValueError('Unexpected source or canonical change: '+str(changed))
          records={}
          for p in allow:
           data=Path(p).read_bytes();target=folder/'generated'/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);records[p]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (folder/'actual-generated-manifest.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'currentSavedDocumentAdmitted':False,'outputs':records,'candidateAccepted':False},indent=2)+'\n')
          print('ACTUAL_CURRENT_TWO_ROOM_GENERATED '+json.dumps(records),flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-two-room-actual-native-${{ github.sha }}
          path: ${{ runner.temp }}/current-two-room-preparation/
          if-no-files-found: error
          retention-days: 90
