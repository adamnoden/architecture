name: COA-04 widen annotation panel

on:
  push:
    branches:
      - coa-04-plan-section-successors

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: coa-04-plan-section-successors
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sed -i 's/rightWidth: 3900/rightWidth: 4700/' compiler/output/conventions.ts
      - run: npm run typecheck
      - run: npm run outputs:spatial:generate
      - run: npm run test:coa03
      - run: npm run test:coa04
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y -qq librsvg2-bin
      - run: rsvg-convert -w 1800 docs/reference-house/generated/ground-floor-plan.svg -o /tmp/ground-floor-plan.png
      - uses: actions/upload-artifact@v4
        with:
          name: coa04-panel-qa
          path: /tmp/ground-floor-plan.png
      - run: rm .github/workflows/coa04-panel-width.yml
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add -A
      - run: git commit -m 'COA-04 widen spatial annotation panel'
      - run: git push origin HEAD:coa-04-plan-section-successors
