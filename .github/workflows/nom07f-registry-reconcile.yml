name: NOM-07F registry reconciliation

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom07f-registry-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - name: Reconcile registry with audited public semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('project/nomenclature.ts')
          text = path.read_text()

          changes = [
            (
              "    id: 'grammar.g01-version',\n    meaning: 'Versioned Georgian-derived grammar specification identity',\n    owner: 'grammar',\n    examples: ['G-01 v0.1'],\n    pattern: '\\\\bG-01 v\\\\d+\\\\.\\\\d+\\\\b',\n    classification: 'PUBLIC_TECHNICAL',\n    allowedSurfaces: TECHNICAL_SURFACES,\n    roles: ['IDENTITY_ONLY', 'VERSIONED'],\n    stability: 'VERSIONED',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT'",
              "    id: 'grammar.g01-version',\n    meaning: 'Versioned Georgian-derived grammar specification identity',\n    owner: 'grammar',\n    examples: ['G-01 v0.1'],\n    pattern: '\\\\bG-01 v\\\\d+\\\\.\\\\d+\\\\b',\n    classification: 'PUBLIC_TECHNICAL',\n    allowedSurfaces: ALL_READER_SURFACES,\n    roles: ['IDENTITY_ONLY', 'VERSIONED'],\n    stability: 'VERSIONED',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT',\n    exception: 'Currently used as an explicit reader-facing specification version; NOM-08 owns whether that visible version treatment should remain.'"
            ),
            (
              "    pattern: '\\\\bM[1-5]\\\\b',\n    classification: 'PUBLIC_TECHNICAL',",
              "    pattern: '(?<!Guide )(?<!Guide M/)\\\\bM[1-5]\\\\b(?!\\\\s*\\\\()',\n    classification: 'PUBLIC_TECHNICAL',"
            ),
            (
              "    id: 'reference-house.fact',\n    meaning: 'Reference House canonical source-fact identity',\n    owner: 'reference-house-machine',\n    examples: ['RHCF-*'],\n    pattern: '\\\\bRHCF-[A-Z0-9-]+\\\\b',\n    classification: 'INTERNAL_STABLE',\n    allowedSurfaces: INTERNAL_MACHINE_SURFACES,\n    roles: ['IDENTITY_ONLY'],\n    stability: 'DURABLE',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT'",
              "    id: 'reference-house.fact',\n    meaning: 'Reference House canonical source-fact identity',\n    owner: 'reference-house-machine',\n    examples: ['RHCF-*'],\n    pattern: '\\\\bRHCF-[A-Z0-9-]+\\\\b',\n    classification: 'INTERNAL_STABLE',\n    allowedSurfaces: MACHINE_SURFACES,\n    roles: ['IDENTITY_ONLY'],\n    stability: 'DURABLE',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT',\n    exception: 'May appear on explicitly generated technical inspection surfaces where exact source-fact identity is the subject.'"
            )
          ]

          for old, new in changes:
            if old not in text:
              raise SystemExit(f'Expected registry block not found: {old[:80]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          npx tsx scripts/validate-public-nomenclature.ts --source
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/nomenclature.ts
          git commit -m "PUB-NOM: reconcile registry with cold-reader audit"
          git push origin HEAD:pub-nom
