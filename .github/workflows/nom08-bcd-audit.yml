name: NOM-08 semantic diagnostics

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom08-bcd-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Maturity family inventory
        run: npx tsx scripts/nomenclature-inventory.ts --files=maturity.level
      - name: Reader-number semantic scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Public-primary files are the surfaces where project maturity/version
          # tokens must not masquerade as ordinary prose. The canonical validator
          # remains authoritative; this diagnostic prints the residual shape.
          primary_roots = [Path('README.md'), Path('docs/manuscript'), Path('docs/patterns'), Path('docs/reference-house')]
          maturity = re.compile(r'(?<!Guide )(?<!Guide M/)\bM[1-5]\b(?!\s*\()')
          figure = re.compile(r'\b(?:Figure|Fig\.?|Table)\s+[A-Z]?\d+(?:\.\d+)?\b', re.I)
          legacy_figure = re.compile(r'\bD-F\d+\b')
          pat = re.compile(r'\bPAT-\d{3}\b')

          def files():
              seen = set()
              for root in primary_roots:
                  if root.is_file():
                      candidates = [root]
                  elif root.exists():
                      candidates = root.rglob('*.md')
                  else:
                      continue
                  for p in candidates:
                      s = str(p)
                      if s in seen: continue
                      seen.add(s)
                      # These are known internal/provenance branches, not ordinary reader surfaces.
                      if any(x in s for x in ['/retired/', '/pilot/', 'core-12.md', 'reversible-assembly-candidates.md']):
                          continue
                      yield p

          for label, regex in [('MATURITY', maturity), ('FIGURE_TABLE', figure), ('LEGACY_FIGURE', legacy_figure), ('PATTERN_ID', pat)]:
              print(f'\n=== {label} PRIMARY-SOURCE MATCHES ===')
              total = 0
              for p in files():
                  text = p.read_text()
                  for lineno, line in enumerate(text.splitlines(), 1):
                      matches = [m.group(0) for m in regex.finditer(line)]
                      if matches:
                          total += len(matches)
                          print(f'{p}:{lineno}: {matches} :: {line.strip()[:220]}')
              print(f'TOTAL {label}: {total}')

          seq = Path('docs/patterns/service-topology-sequence.md').read_text()
          steps = re.findall(r'^## (S\d+) — ', seq, re.M)
          print('\n=== SERVICE SEQUENCE ===')
          print('steps:', steps)
          assert steps == [f'S{i}' for i in range(1, 11)], steps

          publication = Path('publication/publication.ts').read_text()
          print('\n=== PUBLICATION ORDER TOKENS ===')
          for token in ['Part I', 'Part II', 'Part III', 'Part IV', 'Part V', 'Appendix A', 'Appendix B', 'Appendix C', 'Appendix D', 'Appendix E']:
              print(token, publication.count(token))
              assert publication.count(token) >= 1

          validate = Path('publication/scripts/validate.ts').read_text()
          assert 'numericPatternOrder' in validate or 'localeCompare' in validate
          assert 'PAT-' in validate and 'reader-facing pattern title' in validate
          print('\nPattern-order/title regression guards present in publication validator.')
          PY
