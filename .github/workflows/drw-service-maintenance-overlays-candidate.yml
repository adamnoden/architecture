name: Freeze reviewed DRW service maintenance overlays

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/reference-house/publication-service-maintenance*.ts'
      - 'compiler/reference-house/generate-publication-service-maintenance-overlays.ts'
      - 'docs/publication/architectural-drawing-drw10b-service-maintenance-overlays.md'
      - '.github/workflows/drw-service-maintenance-overlays-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drw-service-maintenance-overlay-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate reviewed SVG pair
        run: npx tsx compiler/reference-house/generate-publication-service-maintenance-overlays.ts
      - name: Verify reviewed semantics
        run: |
          test -s docs/reference-house/publication-ground-service-maintenance-overlay.svg
          test -s docs/reference-house/publication-first-service-maintenance-overlay.svg
          grep -q 'host-space-field-not-service-route' docs/reference-house/publication-ground-service-maintenance-overlay.svg
          grep -q 'REMOVED_RATHER_THAN_ADD_SECOND_PERMANENT_STACK' docs/reference-house/publication-first-service-maintenance-overlay.svg
      - name: Freeze reviewed bytes
        if: github.event_name == 'pull_request'
        run: |
          git add -f docs/reference-house/publication-ground-service-maintenance-overlay.svg docs/reference-house/publication-first-service-maintenance-overlay.svg
          if git diff --cached --quiet -- docs/reference-house/publication-ground-service-maintenance-overlay.svg docs/reference-house/publication-first-service-maintenance-overlay.svg; then
            echo 'Controlled SVG pair already matches canonical generation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DRW-10F: recover reviewed service maintenance artifacts'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload reviewed SVG pair
        uses: actions/upload-artifact@v6
        with:
          name: drw-10b-service-maintenance-overlay-candidates
          path: |
            docs/reference-house/publication-ground-service-maintenance-overlay.svg
            docs/reference-house/publication-first-service-maintenance-overlay.svg
          if-no-files-found: error
          retention-days: 30
