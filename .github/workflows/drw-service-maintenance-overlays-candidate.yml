name: Generate DRW service maintenance overlay candidates

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/reference-house/publication-service-maintenance*.ts'
      - 'compiler/reference-house/generate-publication-service-maintenance-overlays.ts'
      - 'docs/publication/architectural-drawing-drw10b-service-maintenance-overlays.md'
      - '.github/workflows/drw-service-maintenance-overlays-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drw-service-maintenance-overlay-candidates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate candidate SVG pair
        run: npx tsx compiler/reference-house/generate-publication-service-maintenance-overlays.ts
      - name: Verify candidate semantics
        run: |
          test -s docs/reference-house/publication-ground-service-maintenance-overlay.svg
          test -s docs/reference-house/publication-first-service-maintenance-overlay.svg
          grep -q 'data-view-id="REFERENCE-HOUSE-GROUND-SERVICE-MAINTENANCE-OVERLAY"' docs/reference-house/publication-ground-service-maintenance-overlay.svg
          grep -q 'data-view-id="REFERENCE-HOUSE-FIRST-SERVICE-MAINTENANCE-OVERLAY"' docs/reference-house/publication-first-service-maintenance-overlay.svg
          grep -q 'host-space-field-not-service-route' docs/reference-house/publication-ground-service-maintenance-overlay.svg
          grep -q 'host-space-field-not-service-route' docs/reference-house/publication-first-service-maintenance-overlay.svg
          grep -q 'ABSENT_TECHNICAL' docs/reference-house/publication-ground-service-maintenance-overlay.svg
          grep -q 'REMOVED_RATHER_THAN_ADD_SECOND_PERMANENT_STACK' docs/reference-house/publication-first-service-maintenance-overlay.svg
      - name: Upload candidate SVG pair
        uses: actions/upload-artifact@v6
        with:
          name: drw-10b-service-maintenance-overlay-candidates
          path: |
            docs/reference-house/publication-ground-service-maintenance-overlay.svg
            docs/reference-house/publication-first-service-maintenance-overlay.svg
          if-no-files-found: error
          retention-days: 30
