name: Regenerate actual current floor cuts and named interfaces
on:
  push:
    branches: [work/current-positive-source-regeneration-20261126]
    paths: ['.github/workflows/current-positive-cuts-interfaces.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  actual-sixteen-cuts-interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install existing Node compiler runtime
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          echo "REGEN_DIR=$RUNNER_TEMP/current-positive-source-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
      - name: Protect exact production sources and record actual native58 identities
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          expected={"project/str/studies/distributed_floor_compatibility.py":"7a8eb302813e8a509a1fac16ee29e7359d2c0bf9","project/str/studies/perforated_floor_condensation.py":"fbdea8993c4c00d863f2105c0a83f6ac0bf78c03","project/str/studies/current_zero_chord_control.py":"abff63ca41c5bfa01082a3443ed0900412e893f4","project/str/studies/current_zero_chord_control_test.py":"d09edced886fe556f4e0768def8a29301fb847f8","project/str/studies/wet_pad_fan_recovery_proof.py":"f3d6a3b4646ef6f41ad3f4ab48d2b7be542ba3e4","project/str/studies/uniform_slab_law_proof.py":"746cb407265b7d2e395d94d259bc8d73e423aec8","project/str/studies/uniform-slab-law-inputs.json":"1cc9682b87e12b967290e93e28d95736721bf337","project/str/studies/floor-section-cuts.ts":"f5e058d4cc5ea964ff06cd1713e47f464860fb8b"}
          def sha(data):return hashlib.sha256(data).hexdigest()
          for name,digest in expected.items():
           data=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           if actual!=digest:raise ValueError('Unreviewed source blob: '+name)
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          identities=load_source(Path('.'))['identities']
          if len(identities)!=58:raise ValueError('Exact current58-source native inventory required')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          snapshot={name:sha(Path(name).read_bytes()) for name in files}
          (folder/'source-before.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exactProductionBlobs':expected,'native58SHA256':identities,'trackedSHA256':snapshot,'currentSavedEngineeringDocumentAdmitted':False},indent=2)+'\n')
          for name in ["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/floor-section-cuts-proof.json","project/str/studies/floor-interface-proof.json"]:
           p=Path(name)
           if p.exists():
            q=folder/'before'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
          print('PASS exact reviewed protected blobs and actual58-source inventory; canonical/account untouched',flush=True)
          PY
      - name: Restore actual sixteen complete captures into unchanged source-addressed caches
        run: |
          python -B - <<'PY'
          import hashlib,io,json,os,tarfile,tempfile,zipfile
          from pathlib import Path
          from floor_section_model import load_source
          sha=lambda b:hashlib.sha256(b).hexdigest()
          source=load_source(Path('.'))['identities']
          base=Path(tempfile.gettempdir())/'ovid-seated-wet-controls';base.mkdir(parents=True,exist_ok=True)
          path=Path('project/str/studies/captures/current-positive-floor-full-captures-20261126.tar.gz');raw=path.read_bytes()
          if len(raw)!=22919280 or sha(raw)!='22f9ab985d0bc528dc6fb8d6092dbb59c8f204d0486d1ccef42c08491e0e0ae0':raise ValueError('Observed exact eleven full captures changed')
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
           m=json.load(tar.extractfile('floor-eleven-native-capture-manifest.json'))
           if m['sourceSHA256']!=source or m['completeVerifiedControlCount']!=11 or m['candidateAccepted'] is not False:raise ValueError('Actual11current captures required')
           for name,r in m['files'].items():
            if name.startswith('/') or '..' in name.split('/') or len(name.split('/'))!=3:raise ValueError('Exact existing source/input addressing required')
            data=tar.extractfile(name).read()
            if len(data)!=r['bytes'] or sha(data)!=r['sha256']:raise ValueError('Original full capture bytes changed')
            target=base/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          # The manifest is deliberately NOT placed in base: the unchanged producer
          # enumerates only original source/input directories there.
          mesh=Path(tempfile.gettempdir())/'ovid-floor-mesh';count=0
          expected={'coarse':('f50e25ae1dd03048e5f8df9cca96ae4853ea42b43ef326d60b03fc82339b87c6',4190458,2),'refined':('87010af73625036d4c6edce2e389c2bdda4d0c39e9a842c0438abe0dd04a31af',3232558,1),'mixed':('3561db369c623381826df6cec77f335691b8d00bafd15c706d6ef20db3b78b4f',5301873,2)}
          for group,(identity,size,n) in expected.items():
           raw=Path('project/str/studies/captures/current-positive-mesh-'+group+'-20261126.zip').read_bytes()
           if len(raw)!=size or sha(raw)!=identity:raise ValueError('Observed complete mesh ZIP changed')
           with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            m=json.loads(archive.read('mesh-capture-manifest.json'))
            if m['sourceSHA256']!=source or m['group']!=group or m['completeVerifiedCaseCount']!=n or m['nativeSolvesExecuted']!=n or m['candidateAccepted'] is not False:raise ValueError('Actual complete current mesh group lost')
            for row in m['controls'].values():
             for name,r in row['files'].items():
              if not name.startswith('mesh/'+m['meshDirectoryId']+'/') or '..' in name.split('/'):raise ValueError('Exact mesh cache path required')
              data=archive.read(name)
              if len(data)!=r['bytes'] or sha(data)!=r['sha256']:raise ValueError('Actual full mesh capture bytes changed')
              target=mesh/name.removeprefix('mesh/');target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
             count+=1
          if count!=5:raise ValueError('Exactly5 fresh additional captures required')
          print('PASS restored exact33basefiles +15meshfiles; all16realcontrols, no new native execution',flush=True)
          
          PY
      - name: Regenerate owning fixed cuts and named floor interfaces from actual full captures
        run: |
          node --import tsx project/str/studies/floor-section-cuts.ts --write > "$REGEN_DIR/cuts-write.log" 2>&1
          node --import tsx project/str/studies/floor-section-cuts.ts --check > "$REGEN_DIR/cuts-check.log" 2>&1
          node --import tsx project/str/studies/floor-interface-proof.ts --write > "$REGEN_DIR/interfaces-write.log" 2>&1
          node --import tsx project/str/studies/floor-interface-proof.ts --check > "$REGEN_DIR/interfaces-check.log" 2>&1
          node --import tsx --test compiler/reference-house/current-design-floor-cuts.test.ts compiler/reference-house/current-design-floor-transverse.test.ts compiler/reference-house/current-design-floor-interfaces.test.ts > "$REGEN_DIR/owning-cut-controls.log" 2>&1
      - name: Protect all source bytes and retain actual outputs
        run: |
          python -B - <<'PY'
          import hashlib,json,os,shutil,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);before=json.loads((folder/'source-before.json').read_text())
          allow=["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/floor-section-cuts-proof.json","project/str/studies/floor-interface-proof.json"]
          sha=lambda data:hashlib.sha256(data).hexdigest()
          actual={name:sha(Path(name).read_bytes()) for name in before['trackedSHA256']}
          changed=[name for name,value in actual.items() if value!=before['trackedSHA256'][name]]
          if set(changed)-set(allow):raise ValueError('Unexpected tracked source/request change: '+str(changed))
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          if load_source(Path('.'))['identities']!=before['native58SHA256']:raise ValueError('Actual native58 source changed during proof')
          outputs={}
          for name in allow:
           p=Path(name)
           if not p.is_file():raise ValueError('Missing actual generated output: '+name)
           q=folder/'generated'/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
           outputs[name]={'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())}
           if p.suffix=='.json':
            value=json.loads(p.read_text())
            def verify_sources(node):
             if isinstance(node,dict):
              sources=node.get('sourceSHA256')
              if isinstance(sources,dict):
               for path,identity in sources.items():
                if not Path(path).is_file() or sha(Path(path).read_bytes())!=identity:raise ValueError('Generated result contains stale native source: '+path)
              for child in node.values():verify_sources(child)
             elif isinstance(node,list):
              for child in node:verify_sources(child)
            verify_sources(value)
            key={'floor-section-proof.json':None}.get(p.name)
            if key:
             previous=json.loads((folder/'before'/p).read_text())
             def authored(node):
              if isinstance(node,dict):return{k:authored(v) for k,v in node.items() if k!='sourceSHA256'}
              if isinstance(node,list):return[authored(v) for v in node]
              return node
             if authored(previous[key])!=authored(value[key]):raise ValueError('Positive reference authored inputs changed: '+key)
             outputs[name]['authoredInputsUnchangedExceptFreshIdentities']=True
            previous=json.loads((folder/'before'/p).read_text())
            def without_identities(node):
             if isinstance(node,dict):return{k:without_identities(v) for k,v in node.items() if k!='sourceSHA256'}
             if isinstance(node,list):return[without_identities(v) for v in node]
             return node
            for catalogue in ('cases','controls'):
             rows=value.get(catalogue)
             if not isinstance(rows,list):continue
             before_rows=previous.get(catalogue)
             if not isinstance(before_rows,list) or len(rows)!=len(before_rows):raise ValueError('Changed authored control count: '+catalogue)
             for old_row,new_row in zip(before_rows,rows):
              if old_row.get('caseId')!=new_row.get('caseId'):raise ValueError('Changed actual control ID')
              for request_key in ('executedRequest','request'):
               if request_key in old_row or request_key in new_row:
                if request_key not in old_row or request_key not in new_row or without_identities(old_row[request_key])!=without_identities(new_row[request_key]):raise ValueError('Authored parent comparison changed beyond fresh identities')
            outputs[name]['allAuthoredControlInputsUnchangedExceptFreshIdentities']=True
          (folder/'source-after.json').write_text(json.dumps({'sourceCommit':before['sourceCommit'],'changedTrackedPaths':changed,'allowedGeneratedPaths':allow,'outputs':outputs,'native58UnchangedDuringExecution':True,'allOtherTrackedSourcesUnchanged':True,'accountAndCanonicalUnchanged':True,'candidateAccepted':False},indent=2)+'\n')
          print('PASS generated outputs only; all native methods, requests, source account and canonical input protected',flush=True)
          PY
      - name: Preserve exact current-source execution logs
        if: always()
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          for p in sorted(Path(os.environ['REGEN_DIR']).glob('*.log')):
           print('CURRENT_DEPENDENT_PROOF_LOG '+p.name,flush=True);print(p.read_text(errors='replace')[-40000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-positive-cuts-and-interfaces-${{ github.sha }}
          path: ${{ runner.temp }}/current-positive-source-evidence/
          if-no-files-found: error
          retention-days: 90
