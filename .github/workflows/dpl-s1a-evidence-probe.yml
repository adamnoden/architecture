name: DPL-S1A evidence probe

on:
  push:
    branches:
      - dpl-s1a-chesterfield-parcel
    paths:
      - .github/workflows/dpl-s1a-evidence-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire exact public source material
        shell: bash
        run: |
          set -u
          mkdir -p evidence

          UPRN='100021580413'
          LAT='51.485949'
          LON='-0.267437'

          curl --fail --location --retry 3 --silent --show-error \
            "https://www.planning.data.gov.uk/entity.json?q=${UPRN}&dataset=title-boundary&limit=50" \
            -o evidence/planning-data-title-boundary-uprn.json || true

          curl --fail --location --retry 3 --silent --show-error \
            "https://www.planning.data.gov.uk/entity.json?dataset=title-boundary&latitude=${LAT}&longitude=${LON}&limit=50" \
            -o evidence/planning-data-title-boundary-point.json || true

          curl --fail --location --retry 3 --silent --show-error \
            'https://use-land-property-data.service.gov.uk/datasets/inspire/download?back=true' \
            -o evidence/hmlr-inspire-download.html || true

          if [ -f evidence/hmlr-inspire-download.html ]; then
            python3 - <<'PY' || true
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_row = False
                  self.row_text = []
                  self.links = []
                  self.match = None
              def handle_starttag(self, tag, attrs):
                  if tag == 'tr':
                      self.in_row = True
                      self.row_text = []
                      self.links = []
                  if self.in_row and tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.links.append(href)
              def handle_data(self, data):
                  if self.in_row:
                      self.row_text.append(data)
              def handle_endtag(self, tag):
                  if tag == 'tr' and self.in_row:
                      text = ' '.join(' '.join(self.row_text).split())
                      if 'London Borough of Hounslow' in text and self.links:
                          self.match = self.links[-1]
                      self.in_row = False

          html = open('evidence/hmlr-inspire-download.html', encoding='utf-8').read()
          p = P(); p.feed(html)
          if not p.match:
              raise SystemExit('Hounslow GML link not found in HMLR download page')
          url = urljoin('https://use-land-property-data.service.gov.uk/', p.match)
          open('evidence/hounslow-gml-url.txt', 'w').write(url + '\n')
          print(url)
          PY
          fi

          if [ -f evidence/hounslow-gml-url.txt ]; then
            HMLR_URL="$(cat evidence/hounslow-gml-url.txt)"
            curl --silent --show-error --max-redirs 0 -D evidence/hmlr-first-response-headers.txt \
              "$HMLR_URL" -o evidence/hmlr-first-response-body.bin || true
            curl --fail --location --max-redirs 8 --silent --show-error \
              -D evidence/hmlr-follow-headers.txt "$HMLR_URL" -o evidence/hounslow.gml || true
          else
            HMLR_URL='UNRESOLVED'
          fi

          {
            echo "UPRN=${UPRN}"
            echo "point_wgs84=${LAT},${LON}"
            echo "hmlr_url=${HMLR_URL}"
            if [ -f evidence/hounslow.gml ]; then
              echo "hmlr_bytes=$(wc -c < evidence/hounslow.gml)"
              echo "hmlr_sha256=$(sha256sum evidence/hounslow.gml | awk '{print $1}')"
            else
              echo "hmlr_bytes=NOT_ACQUIRED"
            fi
            for f in evidence/planning-data-title-boundary-*.json; do
              if [ -f "$f" ]; then
                echo "$(basename "$f")_bytes=$(wc -c < "$f")"
                echo "$(basename "$f")_sha256=$(sha256sum "$f" | awk '{print $1}')"
                python3 - "$f" <<'PY' || true
          import json, sys
          p = sys.argv[1]
          try:
              d = json.load(open(p))
              print(f"{p}_keys={sorted(d.keys())}")
              print(f"{p}_entities={len(d.get('entities', []))}")
          except Exception as e:
              print(f"{p}_json_error={e}")
          PY
              fi
            done
          } | tee evidence/probe-summary.txt

      - name: Upload evidence probe
        uses: actions/upload-artifact@v4
        with:
          name: dpl-s1a-chesterfield-source-probe
          path: evidence/
          if-no-files-found: error
          retention-days: 1
