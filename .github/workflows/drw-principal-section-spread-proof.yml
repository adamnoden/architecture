name: Prove DRW principal-section spread

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw05e/**'
      - 'docs/publication/architectural-drawing-drw05e-principal-section-spread-proof.md'
      - 'docs/reference-house/publication-principal-section.svg'
      - 'compiler/reference-house/publication-principal-section*.ts'
      - 'compiler/reference-house/generate-publication-principal-section.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/drw-principal-section-spread-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-principal-section-spread-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare controlled section spread
        run: npx tsx publication/specimens/drw05e/prepare.ts

      - name: Build A4 section-spread proof
        run: DRW05E_FORMAT=a4 npx vivliostyle build -c publication/specimens/drw05e/vivliostyle.config.js

      - name: Build B5 section-spread proof
        run: DRW05E_FORMAT=b5 npx vivliostyle build -c publication/specimens/drw05e/vivliostyle.config.js

      - name: Validate section-spread proof
        run: npx tsx publication/specimens/drw05e/validate.ts

      - name: Upload section-spread proof PDFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drw-05e-principal-section-spread-proof
          path: |
            publication/specimens/drw05e/dist/drw05e-a4.pdf
            publication/specimens/drw05e/dist/drw05e-b5.pdf
          if-no-files-found: error
          retention-days: 30
