name: RWT segmented access preflight (temporary)
on:
  push:
    branches: [work/mvb-chat-6535667492]
    paths: ['.github/workflows/rwt-segmented-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6535667492
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh canonical publication preflight on current branch
        run: |
          node --import tsx scripts/project-claims.ts merge-check RWT-METALS --transport connector --lease-id 834b5455-21ea-4ef4-ba75-0933aeb68c53 --generation 4 --branch work/mvb-chat-6535667492 --head "$(git rev-parse HEAD)" --format text
