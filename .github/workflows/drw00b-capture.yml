name: DRW-00B before-state capture

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/drw00b-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: pub-nom

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure PDF tooling
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Build current publications
        run: |
          npm run publication:build
          npm run publication:build:primer
          npm run publication:metadata:check

      - name: Export active figure placements
        run: |
          npx tsx -e "import { publicationFigurePlacements } from './publication/figures.ts'; console.log(JSON.stringify(publicationFigurePlacements(), null, 2))" > /tmp/drw00b-placements.json

      - name: Capture PDF and figure before-state
        run: |
          pdftotext -layout publication/dist/ovids-house.pdf /tmp/drw00b-full.txt
          pdftotext -layout publication/dist/ovids-house-primer.pdf /tmp/drw00b-primer.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, unicodedata

          root = Path.cwd()
          full_pdf = root / 'publication/dist/ovids-house.pdf'
          primer_pdf = root / 'publication/dist/ovids-house-primer.pdf'
          placements = json.loads(Path('/tmp/drw00b-placements.json').read_text())

          if len(placements) != 11:
              raise SystemExit(f'Expected exactly 11 active figure placements, found {len(placements)}')

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          def pdfinfo(path):
              out = subprocess.check_output(['pdfinfo', str(path)], text=True)
              data = {}
              for line in out.splitlines():
                  if ':' in line:
                      k, v = line.split(':', 1)
                      data[k.strip()] = v.strip()
              return data

          def norm(value):
              value = unicodedata.normalize('NFKC', value)
              value = value.replace('’', "'").replace('–', '-').replace('—', '-')
              return re.sub(r'\s+', ' ', value).strip().lower()

          pages = Path('/tmp/drw00b-full.txt').read_text(errors='replace').split('\f')
          if pages and not pages[-1].strip():
              pages.pop()
          norm_pages = [norm(page) for page in pages]

          rows = []
          page_numbers = []
          seen_images = set()
          for index, placement in enumerate(placements, start=1):
              image = placement['image']
              basename = Path(image).name
              asset = root / 'docs/manuscript/figures' / basename
              if not asset.exists():
                  raise SystemExit(f'Missing active figure asset: {asset.relative_to(root)}')
              rel = asset.relative_to(root).as_posix()
              if rel in seen_images:
                  raise SystemExit(f'Duplicate active figure asset in placement map: {rel}')
              seen_images.add(rel)

              blob = subprocess.check_output(['git', 'rev-parse', f'HEAD:{rel}'], text=True).strip()
              caption = norm(placement['caption'])
              probe = caption[:100]
              matches = [i + 1 for i, page in enumerate(norm_pages) if probe in page]
              if len(matches) != 1:
                  probe = caption[:64]
                  matches = [i + 1 for i, page in enumerate(norm_pages) if probe in page]
              if len(matches) != 1:
                  raise SystemExit(f'Caption for {rel} resolved to pages {matches}; expected exactly one')
              page = matches[0]
              page_numbers.append(page)
              rows.append({
                  'n': index,
                  'entryId': placement['entryId'],
                  'asset': rel,
                  'blob': blob,
                  'bytes': asset.stat().st_size,
                  'alt': placement['alt'],
                  'page': page,
              })

          if len(rows) != 11 or len(seen_images) != 11:
              raise SystemExit('Active placement/asset cardinality is not 11/11')

          full_info = pdfinfo(full_pdf)
          primer_info = pdfinfo(primer_pdf)
          capture_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          out = []
          out += [
              '<!-- nav-exclude: redirect -->',
              '# DRW-00B — current figure / publication before-state',
              '',
              '**Programme:** DRW — Architectural Drawing Programme  ',
              '**Packet:** DRW-00B  ',
              '**Status:** CAPTURED — close after CI/artifact verification  ',
              '**Issue:** #154  ',
              f'**Capture head:** `{capture_head}`',
              '',
              '## 1. Purpose',
              '',
              'This record freezes the publication visual state that DRW inherits before it classifies or redraws anything. It is descriptive, not an endorsement of the current figures.',
              '',
              'The active source of publication placement truth is `publication/figures.ts`. Historical `D-F*` identities are not revived here.',
              '',
              '## 2. Active Working Edition figure inventory',
              '',
              '| # | Entry | Current asset | Git blob | Bytes | Working Edition page | Current alt text |',
              '|---:|---|---|---|---:|---:|---|',
          ]
          for row in rows:
              alt = row['alt'].replace('|', '\\|')
              out.append(f"| {row['n']} | `{row['entryId']}` | `{row['asset']}` | `{row['blob']}` | {row['bytes']} | {row['page']} | {alt} |")

          out += [
              '',
              'All 11 placements resolve to 11 distinct tracked SVG assets and all 11 authored captions occur exactly once in the generated Working Edition text layer.',
              '',
              '## 3. Generated publication evidence',
              '',
              '| Product | SHA-256 | Pages | Page size | File bytes |',
              '|---|---|---:|---|---:|',
              f"| Working Edition | `{sha256(full_pdf)}` | {full_info.get('Pages', '?')} | {full_info.get('Page size', '?')} | {full_pdf.stat().st_size} |",
              f"| Primer | `{sha256(primer_pdf)}` | {primer_info.get('Pages', '?')} | {primer_info.get('Page size', '?')} | {primer_pdf.stat().st_size} |",
              '',
              'The PDFs are generated products, not committed source. Their hashes bind this record to the exact captured output at the capture head. The ordinary publication build and metadata check passed before this record was written.',
              '',
              '## 4. Visual evidence capture',
              '',
              'The capture workflow rasterises every unique Working Edition page containing a current figure at 120 dpi and uploads those PNGs together with both generated PDFs and the extracted text/placement data as the `drw00b-before-state` workflow artifact.',
              '',
              'The workflow artifact is inspection evidence, not the durable source of truth. Durable evidence is the Git history for the SVG blobs, the placement registry, this manifest, and the deterministic publication build.',
              '',
              '## 5. What this packet does not decide',
              '',
              '- no figure has yet been classified `RETAIN`, `REPLACE`, `DEMOTE` or `REMOVE`;',
              '- no final drawing list, scale, page class or public figure numbering is implied;',
              '- current page positions are before-state facts, not targets;',
              '- current hand-authored SVG geometry is not promoted to architectural source authority;',
              '- no Reference House source or renderer capability changes in this packet.',
              '',
              '## 6. Handoff',
              '',
              '**Next packet: DRW-00C — freeze physical publication-format assumptions that the drawing programme must target.**',
              '',
              'DRW-00D, not this packet, will judge the disposition of the current figures.',
          ]
          dest = root / 'docs/publication/architectural-drawing-drw00b-before-state.md'
          dest.write_text('\n'.join(out) + '\n')

          raster_dir = Path('/tmp/drw00b-pages')
          raster_dir.mkdir(exist_ok=True)
          for page in sorted(set(page_numbers)):
              subprocess.run([
                  'pdftoppm', '-f', str(page), '-singlefile', '-png', '-r', '120',
                  str(full_pdf), str(raster_dir / f'working-edition-page-{page:03d}')
              ], check=True)

          evidence = Path('/tmp/drw00b-evidence')
          evidence.mkdir(exist_ok=True)
          for src, name in [
              (full_pdf, 'ovids-house.pdf'),
              (primer_pdf, 'ovids-house-primer.pdf'),
              (Path('/tmp/drw00b-full.txt'), 'working-edition.txt'),
              (Path('/tmp/drw00b-primer.txt'), 'primer.txt'),
              (Path('/tmp/drw00b-placements.json'), 'placements.json'),
          ]:
              (evidence / name).write_bytes(src.read_bytes())
          for png in raster_dir.glob('*.png'):
              (evidence / png.name).write_bytes(png.read_bytes())
          (evidence / 'manifest.md').write_text(dest.read_text())
          PY
          git diff --check

      - name: Upload before-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: drw00b-before-state
          path: /tmp/drw00b-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit durable manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publication/architectural-drawing-drw00b-before-state.md
          git commit -m "DRW: freeze DRW-00B publication before-state"
          git push origin HEAD:pub-nom
