name: Select specialised proof scope
on:
  workflow_call:
    inputs:
      compiler-review-only:
        description: Allow the PLT historical proof to skip its compiler test and README-only changes.
        type: boolean
        required: false
        default: false
    outputs:
      run:
        description: Whether this specialised proof must run
        value: ${{ jobs.scope.outputs.run }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: scope
        name: Explain specialised proof selection
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha }}
          SCOPE_COMPILER_REVIEW: ${{ inputs.compiler-review-only }}
        run: node scripts/proof-scope.mjs
