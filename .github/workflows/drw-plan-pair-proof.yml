name: Prove DRW paired floor-plan plate

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw04d/**'
      - 'docs/reference-house/publication-ground-floor-plan.svg'
      - 'docs/reference-house/publication-first-floor-plan.svg'
      - 'compiler/reference-house/publication-ground-plan*.ts'
      - 'compiler/reference-house/publication-first-floor-plan*.ts'
      - 'compiler/reference-house/generate-publication-ground-plan.ts'
      - 'compiler/reference-house/generate-publication-first-floor-plan.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/drw-plan-pair-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-plan-pair-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare paired controlled plans
        run: npx tsx publication/specimens/drw04d/prepare.ts

      - name: Build A4 paired-plan proof
        run: DRW04D_FORMAT=a4 npx vivliostyle build -c publication/specimens/drw04d/vivliostyle.config.js

      - name: Build B5 paired-plan proof
        run: DRW04D_FORMAT=b5 npx vivliostyle build -c publication/specimens/drw04d/vivliostyle.config.js

      - name: Validate paired-plan proof
        run: npx tsx publication/specimens/drw04d/validate.ts

      - name: Upload paired-plan proof PDFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drw-04d-paired-plan-proof
          path: |
            publication/specimens/drw04d/dist/drw04d-a4.pdf
            publication/specimens/drw04d/dist/drw04d-b5.pdf
          if-no-files-found: error
          retention-days: 30
