name: Regenerate positive-chord proofs on corrected current sources

on:
  push:
    branches: [work/current-positive-source-regeneration-20261126]
    paths:
      - '.github/workflows/current-positive-source-regeneration.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: current-positive-source-regeneration-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          echo "REGEN_DIR=$RUNNER_TEMP/current-positive-source-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
          python -m venv --system-site-packages "$RUNNER_TEMP/positive-source-runtime"
          "$RUNNER_TEMP/positive-source-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/positive-source-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Protect exact production sources and record actual native58 identities
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          expected={"project/str/studies/distributed_floor_compatibility.py":"7a8eb302813e8a509a1fac16ee29e7359d2c0bf9","project/str/studies/perforated_floor_condensation.py":"fbdea8993c4c00d863f2105c0a83f6ac0bf78c03","project/str/studies/current_zero_chord_control.py":"abff63ca41c5bfa01082a3443ed0900412e893f4","project/str/studies/current_zero_chord_control_test.py":"d09edced886fe556f4e0768def8a29301fb847f8"}
          def sha(data):return hashlib.sha256(data).hexdigest()
          for name,digest in expected.items():
           data=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           if actual!=digest:raise ValueError('Unreviewed source blob: '+name)
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          identities=load_source(Path('.'))['identities']
          if len(identities)!=58:raise ValueError('Exact current58-source native inventory required')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          snapshot={name:sha(Path(name).read_bytes()) for name in files}
          (folder/'source-before.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exactProductionBlobs':expected,'native58SHA256':identities,'trackedSHA256':snapshot,'currentSavedEngineeringDocumentAdmitted':False},indent=2)+'\n')
          for name in ["project/str/studies/distributed-floor-compatibility-proof.json","project/str/studies/distributed-floor-compatibility.svg","project/str/studies/monolithic-rc-native96-proof.json","project/str/studies/monolithic-rc-native96-floor.svg","project/str/studies/monolithic-rc-native96-barrier.svg","project/str/studies/monolithic-rc-governing-replay.json","project/str/studies/monolithic-rc-governing-actions.json","project/str/studies/monolithic-rc-translation-replay.json","project/str/studies/monolithic-rc-translation-actions.json"]:
           p=Path(name)
           if p.exists():
            q=folder/'before'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
          print('PASS exact four protected blobs and actual58-source inventory; canonical/account untouched',flush=True)
          PY
      - name: Recover only the exact retained summary and actual W0 capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B - <<'PY'
          import gzip,hashlib,io,json,os,urllib.error,urllib.request,zipfile
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          api=os.environ['GITHUB_API_URL'];repo=os.environ['GITHUB_REPOSITORY']
          expected_run=45814303861
          expected_head='867e8042e131a35407c4fe3be21807cdb6d23778'
          def sha(data):return hashlib.sha256(data).hexdigest()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url):return urllib.request.Request(url,headers=headers)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          records=[]
          def exact_artifact(identifier,name,filename):
              url=f'{api}/repos/{repo}/actions/artifacts/{identifier}'
              with urllib.request.urlopen(request(url),timeout=60) as response:metadata=json.load(response)
              if metadata['name']!=name or metadata['expired'] or metadata['workflow_run']['id']!=expected_run or metadata['workflow_run']['head_sha']!=expected_head:
                  raise ValueError('Actual retained artifact/run/head identity differs')
              opener=urllib.request.build_opener(NoRedirect())
              try:
                  with opener.open(request(url+'/zip'),timeout=60) as response:archive=response.read()
              except urllib.error.HTTPError as response:
                  if response.code not in (301,302,303,307,308):raise
                  location=response.headers['Location']
                  if not location.startswith('https://'):raise ValueError('HTTPS artifact redirect required')
                  # GitHub credentials are never forwarded to the storage host.
                  with urllib.request.urlopen(location,timeout=120) as body:archive=body.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  members=[n for n in zipped.namelist() if Path(n).name==filename and not n.endswith('/')]
                  if len(members)!=1:raise ValueError('Exactly one requested physical artifact member required')
                  data=zipped.read(members[0])
              (folder/filename).write_bytes(data)
              records.append({'artifactId':identifier,'name':name,'runId':expected_run,'headSHA':expected_head,
                              'archiveSHA256':sha(archive),'member':members[0],'memberSHA256':sha(data),'memberBytes':len(data)})
              return data
          summary_data=exact_artifact(15116237950,'finite-signed-summary','finite-signed-summary.json')
          if len(summary_data)!=115551 or sha(summary_data)!='bfeae934f0e3c16a522250dc7e835a7374a6627673ffbe25d1311358981ee7bf':
              raise ValueError('Exact original96 summary bytes required; no reconstruction')
          summary=json.loads(summary_data)
          zipped=exact_artifact(15115737897,'finite-signed-shard-0','case-00.json.gz')
          raw=gzip.decompress(zipped);identity=summary['captureIdentities']['0']
          if sha(zipped)!=identity['gzipSHA256'] or sha(raw)!=identity['rawSHA256']:
              raise ValueError('Full actual W0 raw/gzip hashes differ')
          capture=json.loads(raw)
          if capture['windIndex']!=0:raise ValueError('Actual source W0 required')
          (folder/'input-artifact-admission.json').write_text(json.dumps({'summarySHA256':sha(summary_data),'summaryBytes':len(summary_data),
              'W0RawSHA256':sha(raw),'W0GzipSHA256':sha(zipped),'sourceCommit':expected_head,'artifacts':records},indent=2)+'\n')
          print('PASS original96 summary bytes and full actual W0 raw/gzip identities')
          PY
      - name: Run unchanged eleven exact admission, Schur and provenance controls
        run: |
          STR_ZERO_CHORD_PARENT="$REGEN_DIR/case-00.json.gz" \
          STR_ZERO_CHORD_SUMMARY="$REGEN_DIR/finite-signed-summary.json" \
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/current_zero_chord_control_test.py > "$REGEN_DIR/eleven-controls.log" 2>&1
      - name: Protect all source bytes and retain actual outputs
        run: |
          python -B - <<'PY'
          import hashlib,json,os,shutil,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);before=json.loads((folder/'source-before.json').read_text())
          allow=[]
          sha=lambda data:hashlib.sha256(data).hexdigest()
          actual={name:sha(Path(name).read_bytes()) for name in before['trackedSHA256']}
          changed=[name for name,value in actual.items() if value!=before['trackedSHA256'][name]]
          if set(changed)-set(allow):raise ValueError('Unexpected tracked source/request change: '+str(changed))
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          if load_source(Path('.'))['identities']!=before['native58SHA256']:raise ValueError('Actual native58 source changed during proof')
          outputs={}
          for name in allow:
           p=Path(name)
           if not p.is_file():raise ValueError('Missing actual generated output: '+name)
           q=folder/'generated'/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
           outputs[name]={'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())}
           if p.suffix=='.json':
            value=json.loads(p.read_text())
            def verify_sources(node):
             if isinstance(node,dict):
              sources=node.get('sourceSHA256')
              if isinstance(sources,dict):
               for path,identity in sources.items():
                if not Path(path).is_file() or sha(Path(path).read_bytes())!=identity:raise ValueError('Generated result contains stale native source: '+path)
              for child in node.values():verify_sources(child)
             elif isinstance(node,list):
              for child in node:verify_sources(child)
            verify_sources(value)
            key={'distributed-floor-compatibility-proof.json':'authoredNumericalCase','monolithic-rc-native96-proof.json':'authoredBaseCase'}.get(p.name)
            if key:
             previous=json.loads((folder/'before'/p).read_text())
             def authored(node):
              if isinstance(node,dict):return{k:authored(v) for k,v in node.items() if k!='sourceSHA256'}
              if isinstance(node,list):return[authored(v) for v in node]
              return node
             if authored(previous[key])!=authored(value[key]):raise ValueError('Positive reference authored inputs changed: '+key)
             outputs[name]['authoredInputsUnchangedExceptFreshIdentities']=True
          (folder/'source-after.json').write_text(json.dumps({'sourceCommit':before['sourceCommit'],'changedTrackedPaths':changed,'allowedGeneratedPaths':allow,'outputs':outputs,'native58UnchangedDuringExecution':True,'allOtherTrackedSourcesUnchanged':True,'accountAndCanonicalUnchanged':True,'candidateAccepted':False},indent=2)+'\n')
          print('PASS generated outputs only; all native methods, requests, source account and canonical input protected',flush=True)
          PY
      - name: Show actual bounded logs
        if: always()
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR'])
          for p in sorted(folder.glob('*.log')):
              print('CURRENT_POSITIVE_REGEN_LOG '+p.name,flush=True)
              print(p.read_text(errors='replace')[-30000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-positive-controls-${{ github.sha }}
          path: ${{ runner.temp }}/current-positive-source-evidence/
          if-no-files-found: error
          retention-days: 90

