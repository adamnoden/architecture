name: NOM-08A grammar version semantics

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom08a-version-semantics.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply NOM-08A semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'project/nomenclature.ts',
              "    classification: 'PUBLIC_TECHNICAL',\n    allowedSurfaces: ALL_READER_SURFACES,\n    roles: ['IDENTITY_ONLY', 'VERSIONED'],\n    stability: 'VERSIONED',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT',\n    exception: 'Currently used as an explicit reader-facing specification version; NOM-08 owns whether that visible version treatment should remain.'",
              "    classification: 'PUBLIC_TECHNICAL',\n    allowedSurfaces: TECHNICAL_SURFACES,\n    roles: ['IDENTITY_ONLY', 'VERSIONED'],\n    stability: 'VERSIONED',\n    brandCoupling: 'NOT_APPLICABLE',\n    migration: 'CURRENT',\n    exception: 'Exact grammar-specification revision identity; ordinary primary prose uses G-01 or the human grammar name.'"
          )

          replace_once(
              'scripts/validate-public-nomenclature.ts',
              "  if (path.startsWith('docs/reference-house/generated/')) return 'SITE_TECHNICAL'\n",
              "  if (path.startsWith('docs/reference-house/generated/')) return 'SITE_TECHNICAL'\n  if (path === 'docs/reference-house/g01-v0.1-conformance-d12.md') return 'SITE_TECHNICAL'\n"
          )

          replace_once(
              'project/public-surface.ts',
              "  'G-01 v0.1 — frozen grammar': 'G-01 v0.1 — specification',\n  'G-01 v0.1 conformance — D12': 'G-01 v0.1 conformance',",
              "  'G-01 v0.1 — frozen grammar': 'G-01 — specification',\n  'G-01 v0.1 conformance — D12': 'G-01 conformance',"
          )

          primary = [
              'docs/grammar/README.md',
              'docs/grammar/g01-cases/README.md',
              'docs/manuscript/part-iv.md',
              'docs/manuscript/readers-guide.md',
              'docs/manuscript/reference-house-implementation-schedule.md',
              'docs/manuscript/research-agenda.md',
              'docs/reference-house/README.md',
          ]
          changed = 0
          for path in primary:
              p = Path(path)
              text = p.read_text()
              count = text.count('G-01 v0.1')
              if count:
                  p.write_text(text.replace('G-01 v0.1', 'G-01'))
                  changed += count
          if changed == 0:
              raise SystemExit('Expected at least one primary G-01 version occurrence to remove')
          print(f'Removed {changed} primary-surface G-01 version occurrence(s).')
          PY
          git diff --check
          npx tsx scripts/validate-public-nomenclature.ts --source
      - name: Commit NOM-08A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/nomenclature.ts project/public-surface.ts scripts/validate-public-nomenclature.ts docs/grammar/README.md docs/grammar/g01-cases/README.md docs/manuscript/part-iv.md docs/manuscript/readers-guide.md docs/manuscript/reference-house-implementation-schedule.md docs/manuscript/research-agenda.md docs/reference-house/README.md
          git commit -m "PUB-NOM: align grammar version with technical surfaces"
          git push origin HEAD:pub-nom
