name: IAS sink publication preflight (temporary)
on:
  push:
    branches: [work/mvb-chat-6535452701]
    paths: ['.github/workflows/ias-sink-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6535452701
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh canonical publication preflight on current branch
        run: |
          node --import tsx scripts/project-claims.ts merge-check IAS-03 --transport connector --lease-id 4fe6938b-652a-4723-977d-c0195b751a97 --generation 6 --branch work/mvb-chat-6535452701 --head "$(git rev-parse HEAD)" --format text
