name: Derive exact fixed-normal input from actual current500 capture
on:
  push:
    branches: [work/current-positive-source-regeneration-20261126]
    paths: ['.github/workflows/current-positive-fixed-normal-input.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  actual500-reference-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install existing Node compiler runtime
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          echo "REGEN_DIR=$RUNNER_TEMP/current-positive-source-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
      - name: Protect exact production sources and record actual native58 identities
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          expected={"project/str/studies/distributed_floor_compatibility.py":"7a8eb302813e8a509a1fac16ee29e7359d2c0bf9","project/str/studies/perforated_floor_condensation.py":"fbdea8993c4c00d863f2105c0a83f6ac0bf78c03","project/str/studies/current_zero_chord_control.py":"abff63ca41c5bfa01082a3443ed0900412e893f4","project/str/studies/current_zero_chord_control_test.py":"d09edced886fe556f4e0768def8a29301fb847f8","project/str/studies/wet_pad_fan_recovery_proof.py":"f3d6a3b4646ef6f41ad3f4ab48d2b7be542ba3e4","project/str/studies/uniform_slab_law_proof.py":"746cb407265b7d2e395d94d259bc8d73e423aec8","project/str/studies/uniform-slab-law-inputs.json":"1cc9682b87e12b967290e93e28d95736721bf337","project/str/studies/floor-section-cuts.ts":"f5e058d4cc5ea964ff06cd1713e47f464860fb8b"}
          def sha(data):return hashlib.sha256(data).hexdigest()
          for name,digest in expected.items():
           data=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           if actual!=digest:raise ValueError('Unreviewed source blob: '+name)
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          identities=load_source(Path('.'))['identities']
          if len(identities)!=58:raise ValueError('Exact current58-source native inventory required')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          snapshot={name:sha(Path(name).read_bytes()) for name in files}
          (folder/'source-before.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exactProductionBlobs':expected,'native58SHA256':identities,'trackedSHA256':snapshot,'currentSavedEngineeringDocumentAdmitted':False},indent=2)+'\n')
          for name in []:
           p=Path(name)
           if p.exists():
            q=folder/'before'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
          print('PASS exact reviewed protected blobs and actual58-source inventory; canonical/account untouched',flush=True)
          PY
      - name: Authenticate actual source-current500 full capture
        run: |
          python -B - <<'PY'
          import hashlib,io,json,os,zipfile
          from pathlib import Path
          from floor_section_model import load_source
          from floor_section_proof import validate_full
          folder=Path(os.environ['REGEN_DIR']);raw=Path('project/str/studies/captures/current-positive-mesh-coarse-20261126.zip').read_bytes()
          if len(raw)!=4190458 or hashlib.sha256(raw).hexdigest()!='f50e25ae1dd03048e5f8df9cca96ae4853ea42b43ef326d60b03fc82339b87c6':raise ValueError('Observed exact current coarse capture ZIP required')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
           m=json.loads(archive.read('mesh-capture-manifest.json'));source=load_source(Path('.'));name='wet-floor-mesh-500'
           if m['sourceSHA256']!=source['identities'] or m['candidateAccepted'] is not False:raise ValueError('Actual current58 coarse source lost')
           row=m['controls'][name];base='mesh/'+m['meshDirectoryId']+'/'+name
           for suffix in ['.request.json','.full.json','.capture.json']:
            member=base+suffix;data=archive.read(member);record=row['files'][member]
            if len(data)!=record['bytes'] or hashlib.sha256(data).hexdigest()!=record['sha256']:raise ValueError('Actual full500 native bytes changed')
            (folder/('ordinary500'+suffix)).write_bytes(data)
           request=json.loads((folder/'ordinary500.request.json').read_text());native=json.loads((folder/'ordinary500.full.json').read_text());capture=json.loads((folder/'ordinary500.capture.json').read_text())
           if validate_full(native,request,source,name)!=capture['summary'] or capture['fullResultSHA256']!='621d8bb2f5636d4cc9b6279fb8c976048226ebd5d12aa73a2a285891ea288702':raise ValueError('Actual full500 physical validation changed')
          print('PASS exact actual fresh500 source/request/full/summary verified',flush=True)
          
          PY
      - name: Derive sole owning input without changing authored physical choices
        run: |
          node --import tsx --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          import {recoverFloorSectionCuts} from './compiler/reference-house/current-design/structural-floor-cuts.ts'
          const folder=process.env.REGEN_DIR,read=p=>JSON.parse(readFileSync(p,'utf8')),path='project/str/studies/fixed-normal-experiment-inputs.json'
          const before=read(path),native=read(folder+'/ordinary500.full.json'),request=read(folder+'/ordinary500.request.json'),authored=read('project/str/studies/floor-section-cuts-inputs.json')
          const physical=v=>Array.isArray(v)?v.map(physical):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='sourceSHA256').map(([k,c])=>[k,physical(c)])):v
          assert.deepEqual(physical(before.baseNativeRequest),physical(request),'Authored physical request changed beyond actual source identities')
          assert.deepEqual(before.stabilityComparison,authored.stabilityComparison)
          const after={...before,baseNativeRequest:request,ordinary500Control:{caseId:'wet-floor-mesh-500',fullResultSHA256:createHash('sha256').update(readFileSync(folder+'/ordinary500.full.json')).digest('hex'),heads:native.nativeVertical.native.heads,sectionCuts:recoverFloorSectionCuts(native.plateBending,authored.cuts)}}
          assert.deepEqual(after.commonWetBeamStationsYMm,before.commonWetBeamStationsYMm)
          const target=folder+'/generated/'+path;mkdirSync(target.slice(0,target.lastIndexOf('/')),{recursive:true})
          const bytes=JSON.stringify(after,null,2)+'\n';writeFileSync(target,bytes)
          const record={path,bytes:Buffer.byteLength(bytes),sha256:createHash('sha256').update(bytes).digest('hex'),gitBlob:createHash('sha1').update('blob '+Buffer.byteLength(bytes)+'\0').update(bytes).digest('hex'),actual500FullSHA256:after.ordinary500Control.fullResultSHA256,allAuthoredPhysicalInputsAndCriteriaUnchanged:true,onlySourceIdentitiesAndActual500ReferenceRecomputed:true,candidateAccepted:false}
          writeFileSync(folder+'/fixed-normal-input-refresh.json',JSON.stringify(record,null,2)+'\n')
          console.log('ACTUAL_FIXED_NORMAL_INPUT_REFRESH '+JSON.stringify(record))
          console.log('ACTUAL_FIXED_NORMAL_INPUT_BASE64 '+Buffer.from(bytes).toString('base64'))
          
          JS
          git diff --exit-code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-positive-fixed-normal-input-${{ github.sha }}
          path: ${{ runner.temp }}/current-positive-source-evidence/
          if-no-files-found: error
          retention-days: 90
