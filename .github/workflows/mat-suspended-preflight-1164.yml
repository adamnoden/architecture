name: Temporary read-only MAT suspended-floor publication check 1164
on:
  push:
    branches: [work/mvb-chat-6546969637]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Observe cleaned final head and exact-head validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 80); do
            if ! pr="$(gh api repos/adamnoden/architecture/pulls/1164)"; then sleep 10; continue; fi
            test "$(jq -r '.state' <<< "$pr")" = open
            test "$(jq -r '.head.ref' <<< "$pr")" = work/mvb-chat-6546969637
            test "$(jq -r '.head.repo.full_name' <<< "$pr")" = adamnoden/architecture
            test "$(jq -r '.base.ref' <<< "$pr")" = main
            grep -Fxq 'Work: MAT-ENVELOPE' <<< "$(jq -r '.body' <<< "$pr")"
            grep -Fxq 'Lease: MAT-ENVELOPE / d599fb57-c857-41b2-bdbc-8c4f1b90d8aa / generation 9' <<< "$(jq -r '.body' <<< "$pr")"
            head="$(jq -r '.head.sha' <<< "$pr")"
            git fetch origin main work/mvb-chat-6546969637 --quiet
            if test "$(git rev-parse origin/work/mvb-chat-6546969637)" != "$head"; then sleep 10; continue; fi
            if git cat-file -e "$head:.github/workflows/mat-suspended-preflight-1164.yml" 2>/dev/null; then sleep 10; continue; fi
            git diff --quiet origin/main "$head" -- project/control scripts/project-claims.ts package.json package-lock.json .nvmrc .github/workflows
            if ! checks="$(gh api "repos/adamnoden/architecture/commits/$head/check-runs?per_page=100")"; then sleep 10; continue; fi
            latest="$(jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.name) | group_by(.name) | map(sort_by(.id) | last)' <<< "$checks")"
            validate="$(jq '[.[] | select(.name == "validate")] | last // {}' <<< "$latest")"
            bad="$(jq '[.[] | select(.name != "preflight") | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<< "$latest")"
            if (( bad > 0 )); then echo 'Failed final-head validation; no publication'; exit 1; fi
            pending="$(jq '[.[] | select(.name != "preflight" and .status != "completed")] | length' <<< "$latest")"
            if test "$(jq -r '.conclusion' <<< "$validate")" = success && test "$pending" = 0; then
              echo "Validated final head: $head"
              jq -r '.[] | [.name,.status,.conclusion,.details_url] | @tsv' <<< "$latest"
              echo "TARGET_HEAD=$head" >> "$GITHUB_ENV"
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
      - name: Reproduce source-pinned section and verify reviewed blobs
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git hash-object project/mat/suspended-mineral-ground-floor.md)" = 1d35ba561e2a838283f99d5cd4a718a65f02a2f0
          test "$(git hash-object project/mat/studies/suspended-ground-section.mjs)" = d7fcbe55079487cf79d017977d65957c166f3902
          test "$(git hash-object project/mat/studies/suspended-ground-section.test.mjs)" = 07d796224d9917d44fb20414c1def64af7621620
          test "$(git hash-object project/mat/studies/suspended-ground-section.json)" = 48289c4ac6c26c0ba81f1c703b617f3b3189739d
          test "$(git hash-object project/mat/studies/suspended-ground-section.svg)" = 21f7f010c16a93401e4c981a2d00be0678324086
          node --test project/mat/studies/suspended-ground-section.test.mjs
          node project/mat/studies/suspended-ground-section.mjs --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Canonical publication preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --import tsx scripts/project-claims.ts merge-check MAT-ENVELOPE \
            --lease-id d599fb57-c857-41b2-bdbc-8c4f1b90d8aa --generation 9 \
            --branch work/mvb-chat-6546969637 --head "$TARGET_HEAD" --format text
