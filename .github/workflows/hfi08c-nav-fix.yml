name: HFI-08C navigation fix

on:
  push:
    branches:
      - hfi/hfi-08c-delivery-prototype-consequences

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: hfi/hfi-08c-delivery-prototype-consequences
          fetch-depth: 0

      - name: Add delivery module to curated navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.vitepress/navigation.ts')
          s = p.read_text()
          old = "    page('RIBA implementation brief', '/docs/delivery/riba-implementation-brief-template'),\n    page('External maintenance access requirements', '/docs/delivery/external-maintenance-access-requirements')"
          new = "    page('RIBA implementation brief', '/docs/delivery/riba-implementation-brief-template'),\n    page('External maintenance access requirements', '/docs/delivery/external-maintenance-access-requirements'),\n    page('Human-factors verification requirements', '/docs/delivery/human-factors-verification-requirements')"
          if old not in s:
            raise SystemExit('delivery navigation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/hfi08c-nav-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vitepress/navigation.ts .github/workflows/hfi08c-nav-fix.yml
          git commit -m "HFI-08C register delivery navigation"
          git push origin HEAD:hfi/hfi-08c-delivery-prototype-consequences
