name: Prove north lighting owner evidence
on:
  push:
    branches: [work/zerg-lighting-north-view-20261126]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing pinned structural runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
          echo "IAS_RECOVERY_PROOF_DIR=$RUNNER_TEMP/combined-lighting-proof" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Authenticate exactly the three-way combined authored sources
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto'
          const expected={"compiler/reference-house/current-design/assemblies/study-structural-renewal.ts":"9685f289dde9d6a122d746659ffe3bfec4302320","compiler/reference-house/current-design/assemblies/study-room-kit.ts":"90863f05b741b54c20fbc6edd1e4c8cc2d2e629d","project/ias/studies/study-structural-renewal.py":"b55eca4df7e7a929dd5e7c4d716ba6c120e60e73","project/ias/studies/study-floor-handling.py":"99f909611ae0f1d1df9dcec6b7516a775b6b1b4b","compiler/reference-house/current-design/assemblies/study-lighting.ts":"d44c852a7c5d71f80c47b0e5bfa2e682376b4610","compiler/reference-house/current-design/assemblies/study-lighting-corner.ts":"f3b22497c99cdc0059b6be119b4bd5f7a57fd36b","compiler/reference-house/current-design-study-lighting.test.ts":"4d8a47d03240b9839b8c9c77ea72d6d5a59608c5","compiler/reference-house/current-design/assemblies/study-furniture-motion.ts":"93aa13c887624fae405ee78aada387ff46984a12","project/ias/studies/adaptable-study-lighting.mjs":"d31032661fd7d19cac1a4f76e5d608377f355c12","compiler/reference-house/current-design/assemblies/study-lighting-views.ts":"a38d59a52350d2addda35407200ddf407b1c28bf","compiler/reference-house/current-design-study-lighting-circuit.test.ts":"8e82eab6b5cbaa626e423a44d9e7f84de643d76e","compiler/reference-house/current-design/assemblies/study-lighting-circuit.ts":"27e73086b825f596f58f32a8914928f78e396140","project/ias/studies/lighting-component-references.json":"16bd75c2b82ba928bc0c77af522c8965136a450c","compiler/reference-house/current-design/assemblies/study-ordinary-handling.ts":"9f429c29f558d0870ad93dd8d34f99429399a05c","project/ias/adaptable-room-lighting-result.md":"ad12f6668e5c78136bb508e16b602260b3010217","project/ccr/studies/working-house-comparison.json":"dc709da7c4bb2f9f8b7f9133ce58ba4c71e361bd","compiler/reference-house/current-design/assemblies/study-room-perspective.ts":"f51b56556974ab1fb8c8fb25996c3a53360b889b","project/ias/studies/crafted-study-eye-level.mjs":"33db3ae634c8e61daf6248b671fec1035c9fdbf3","compiler/reference-house/current-design-study-room-perspective.test.ts":"2e6a3b49ba2000f4dc5d829400de587b7f27a292"}
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex')
          const files=Object.entries(expected).map(([path,gitBlob])=>{const bytes=fs.readFileSync(path);const observed=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');if(observed!==gitBlob)throw Error('Unexpected combined author '+path);return{path,gitBlob,sha256:digest(bytes)}})
          fs.writeFileSync('project/ias/studies/lighting-circuit-recovery-20261126.json',JSON.stringify({status:'WIP_FOLLOWON_SOURCE_NOT_VERIFIED',sourceCommit:process.env.GITHUB_SHA,sourceBase:'5fa4d076ad0252808b7011c9851e1d8310acabec',files},null,2)+'\n')
          JS
      - name: Regenerate and prove the real circuit and closed136 room
        run: node --import tsx project/ias/studies/prove-zerg-circuit-integration.mjs
      - name: Preserve only tested regenerated file blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import{execFileSync}from'node:child_process'
          const outcome=JSON.parse(fs.readFileSync(process.env.IAS_RECOVERY_PROOF_DIR+'/outcome.json','utf8'));if(!outcome.success)throw Error('Combined owning proof failed')
          const paths=["project/ccr/studies/source-coverage.json","project/ccr/studies/working-house-comparison.json","project/ias/studies/adaptable-study-lighting-comparison.svg","project/ias/studies/adaptable-study-lighting-corner.svg","project/ias/studies/adaptable-kitchen-lighting.svg","project/ias/studies/adaptable-study-lighting-routes.svg","project/ias/studies/adaptable-study-lighting-construction.svg","project/ias/studies/adaptable-study-lighting-common-depth.svg","project/ias/studies/adaptable-study-lighting.results.json","project/ias/studies/working-study-lighting-circuit.svg","project/ias/studies/working-study-lighting.results.json","project/ias/studies/crafted-study-eye-level-day.svg","project/ias/studies/crafted-study-eye-level-evening.svg","project/ias/studies/working-study-floor.svg","project/ias/studies/working-study-wall-kit.svg","project/ias/studies/working-study-tile-eye-level.svg","project/ias/studies/working-study-north-lighting.svg"]
          for(const path of paths){const b=fs.readFileSync(path),sha=crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex')
          const r=await fetch('https://api.github.com/repos/adamnoden/architecture/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({content:b.toString('base64'),encoding:'base64'})});if(!r.ok)throw Error('Preserve failed '+path+':'+r.status);const v=await r.json();if(v.sha!==sha)throw Error('Blob mismatch '+path);console.log('FOLLOWON_IAS_BLOB '+JSON.stringify({path,sha,size:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')}))}

          const meta=JSON.parse(fs.readFileSync(process.env.IAS_RECOVERY_PROOF_DIR+'/north-preview.json','utf8')),png=fs.readFileSync(process.env.IAS_RECOVERY_PROOF_DIR+'/north-preview.png'),svg=fs.readFileSync(meta.svgPath)
          if(crypto.createHash('sha256').update(svg).digest('hex')!==meta.svgSHA256||crypto.createHash('sha256').update(png).digest('hex')!==meta.pngSHA256||png.readUInt32BE(16)!==meta.width||png.readUInt32BE(20)!==meta.height)throw Error('North preview provenance mismatch')
          const imageSha=crypto.createHash('sha1').update('blob '+png.length+'\0').update(png).digest('hex')
          const imageResponse=await fetch('https://api.github.com/repos/adamnoden/architecture/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({content:png.toString('base64'),encoding:'base64'})})
          if(!imageResponse.ok)throw Error('North preview preservation failed');const imageObject=await imageResponse.json();if(imageObject.sha!==imageSha)throw Error('North preview blob mismatch');console.log('NORTH_PREVIEW_BLOB '+JSON.stringify({sha:imageSha,sourceSvgSHA256:meta.svgSHA256,pngSHA256:meta.pngSHA256,width:meta.width,height:meta.height,ownerAcceptance:false}))

          execFileSync('git',['read-tree','HEAD']);execFileSync('git',['update-index','--force-remove','--','.github/workflows/zerg-circuit-integration-proof.yml','project/ias/studies/prove-zerg-circuit-integration.mjs','project/ias/studies/lighting-circuit-recovery-20261126.json']);execFileSync('git',['add','--',...paths]);console.log('FOLLOWON_IAS_TARGET_TREE '+execFileSync('git',['write-tree'],{encoding:'utf8'}).trim())
          JS
      - name: Show bounded failure diagnostics
        if: failure()
        run: |
          if [ -d "$IAS_RECOVERY_PROOF_DIR" ]; then
            for proof_log in "$IAS_RECOVERY_PROOF_DIR"/*.log; do
              if [ -f "$proof_log" ]; then
                echo "Diagnostic: $proof_log"
                tail -n 200 "$proof_log"
              fi
            done
          fi
      - name: Retain actual combined source proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: north-lighting-owner-proof
          path: ${{ runner.temp }}/combined-lighting-proof
          retention-days: 90
          if-no-files-found: error
