name: Audit House Kernel naming migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/house-kernel-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refine identifier and prose terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/reference-house/README.md': [
                  ('an House Kernel preference', 'a House Kernel preference'),
                  ('an House Kernel movement-interface principle', 'a House Kernel movement-interface principle'),
                  ('an House Kernel requirement', 'a House Kernel requirement'),
              ],
              'docs/patterns/candidates/accessible-vertical-service-zone.md': [
                  ('no House Kernel ID assigned', 'no HSA ID assigned'),
                  ('permanent House Kernel ID', 'permanent HSA ID'),
              ],
              'docs/delivery/riba-implementation-brief-template.md': [
                  ('| House Kernel ID / strategy |', '| Pattern ID / strategy |'),
              ],
          }

          for path in Path('docs/patterns/candidates').glob('*.md'):
              replacements.setdefault(str(path), []).append(
                  ('no House Kernel pattern ID', 'no stable pattern ID')
              )

          for filename, pairs in replacements.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in pairs:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'refined {filename}')
          PY

      - name: Audit identity residue
        shell: bash
        run: |
          echo '--- malformed / misleading current terminology (must be empty) ---'
          if rg -n 'an House Kernel|House Kernel ID|House Kernel pattern ID' . --glob '!node_modules/**' --glob '!.vitepress/cache/**'; then
            echo 'Unexpected current terminology remains.'
            exit 1
          fi

          echo '--- deliberate old full-name provenance ---'
          rg -n 'House Systems Architecture' . --glob '!node_modules/**' --glob '!.vitepress/cache/**' || true

          echo '--- deliberate standalone HSA provenance (HSA-P IDs excluded) ---'
          rg -n -P '\bHSA\b(?!-P)' . --glob '!node_modules/**' --glob '!.vitepress/cache/**' || true

          echo '--- older Long-Life House provenance ---'
          rg -n 'Long-Life House|Long Life House' . --glob '!node_modules/**' --glob '!.vitepress/cache/**' || true

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate repository
        run: |
          npm test
          npm run docs:build
          npm run publication:prepare:primer
          npm run publication:prepare

      - name: Remove one-shot workflow and commit refinements
        shell: bash
        run: |
          rm .github/workflows/house-kernel-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine House Kernel naming migration [skip ci]"
          git push
