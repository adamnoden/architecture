name: Compare exact failed rear membrane backends
on:
  push:
    branches: [work/zerg-rear-bearing-recovery-20261126]
    paths:
      - '.github/workflows/rear-bearing-exact-backend.yml'
      - 'project/str/studies/rear_bearing_membrane_backend.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: rear-bearing-exact-backend
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  exact-component:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Recover exact rejected operator raw data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rear-exact-backend"
          gh api repos/adamnoden/architecture/actions/artifacts/15124951816/zip > "$RUNNER_TEMP/rear-exact-backend/retained-zero-W31.zip"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install identical pinned runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Reconstruct exact actual component before any solid or global solve and compare existing backends
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B -m py_compile project/str/studies/rear_bearing_membrane_backend.py
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_bearing_membrane_backend.py --folder "$RUNNER_TEMP/rear-exact-backend" > "$RUNNER_TEMP/rear-exact-backend/comparison.log" 2>&1
      - name: Independent existing dense sparse passivity work and singularity controls
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B -m unittest discover -s project/str/studies -p perforated_floor_sparse_test.py -v > "$RUNNER_TEMP/rear-exact-backend/backend-tests.log" 2>&1
      - name: Show actual component evidence
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'rear-exact-backend'
          for p in sorted(folder.glob('*.log')):
              print('REAR_BACKEND_LOG '+p.name,flush=True)
              print(p.read_text(errors='replace')[-36000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rear-exact-backend-${{ github.sha }}
          path: ${{ runner.temp }}/rear-exact-backend/
          if-no-files-found: error
          retention-days: 90
