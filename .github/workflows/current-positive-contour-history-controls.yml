name: Authenticate unchanged historical contour numerical control at exact source
on:
  push:
    branches: [work/current-positive-source-regeneration-20261126]
    paths: ['.github/workflows/current-positive-contour-history-controls.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  frozen-source-and-physical-domain-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install unchanged pinned native runtime and isolated hashed finite package
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
      - name: Exact original archive58source method and physical-domain rejection controls
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/project/str/studies"
          python -B -m unittest -v finite_floor_contour_residency_control_test.HistoricalContourSourceControls
          git diff --exit-code
