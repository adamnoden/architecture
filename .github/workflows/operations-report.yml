name: Operations report implementation
on:
  workflow_call:
    inputs:
      reconciliation-result:
        type: string
        required: false
        default: skipped
permissions:
  contents: read
  pull-requests: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/control-runtime
      - name: Snapshot current canonical sources and live occupancy
        env:
          RECONCILE_RESULT: ${{ inputs.reconciliation-result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts brief --json operations.json --markdown operations.md
      - name: Preserve machine and human briefing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-operations
          path: |
            operations.json
            operations.md
          if-no-files-found: error
          retention-days: 14
