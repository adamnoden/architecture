name: Project operations
on:
  push:
    branches: [runtime/claims]
  workflow_run:
    workflows: [Reconcile project-control projections]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: project-operations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Release only provenance-matched completed leases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts reconcile
  report:
    needs: reconcile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Snapshot current canonical sources and live occupancy
        env:
          RECONCILE_RESULT: ${{ needs.reconcile.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts brief --json operations.json --markdown operations.md
      - name: Preserve machine and human briefing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-operations
          path: |
            operations.json
            operations.md
          if-no-files-found: error
          retention-days: 14
