name: Project operations
on:
  push:
    branches: [runtime/claims]
  workflow_run:
    workflows: [Reconcile project-control projections]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: project-operations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/control-runtime
      - name: Release only provenance-matched completed leases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/control-operations.ts reconcile
  report:
    needs: reconcile
    if: always()
    uses: ./.github/workflows/operations-report.yml
    with:
      reconciliation-result: ${{ needs.reconcile.result }}
