name: Freeze reviewed DRW roof water failure overlay

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/reference-house/publication-roof-water-failure*.ts'
      - 'compiler/reference-house/generate-publication-roof-water-failure-overlay.ts'
      - 'docs/publication/architectural-drawing-drw10c-roof-water-failure-overlay.md'
      - '.github/workflows/drw-roof-water-failure-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drw-roof-water-failure-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate reviewed SVG
        run: npx tsx compiler/reference-house/generate-publication-roof-water-failure-overlay.ts
      - name: Verify reviewed semantics
        run: |
          test -s docs/reference-house/publication-roof-water-failure-overlay.svg
          grep -q 'data-view-id="REFERENCE-HOUSE-ROOF-WATER-FAILURE-OVERLAY"' docs/reference-house/publication-roof-water-failure-overlay.svg
          grep -q 'data-overlay="roof-water-failure"' docs/reference-house/publication-roof-water-failure-overlay.svg
          grep -q 'discharge-before-occupied-threshold-flooding' docs/reference-house/publication-roof-water-failure-overlay.svg
          grep -q 'ABSENT_TECHNICAL' docs/reference-house/publication-roof-water-failure-overlay.svg
      - name: Freeze reviewed bytes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- docs/reference-house/publication-roof-water-failure-overlay.svg; then
            echo 'Controlled SVG already matches canonical generation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference-house/publication-roof-water-failure-overlay.svg
          git commit -m 'DRW-10C: freeze reviewed roof water failure overlay'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload reviewed SVG
        uses: actions/upload-artifact@v6
        with:
          name: drw-10c-roof-water-failure-candidate
          path: docs/reference-house/publication-roof-water-failure-overlay.svg
          if-no-files-found: error
          retention-days: 30
