name: NOM-09 permanent regression wiring

on:
  push:
    branches: [pub-nom]
    paths:
      - .github/workflows/nom09-wire-regressions.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pub-nom
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tighten rendered corpus and wire permanent source regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-public-nomenclature.ts')
          text = validator.read_text()
          old_import = "import { primerPublicationEntries, publicationEntries } from '../publication/publication.js'\n"
          new_import = old_import + "import { projectIdentity } from '../project/identity.js'\n"
          if old_import not in text or "from '../project/identity.js'" in text:
              raise SystemExit('Validator import anchor missing or already patched')
          text = text.replace(old_import, new_import, 1)
          old_fn = (
              "function renderedPublicationPdfs(): string[] {\n"
              "  const dist = resolve(repoRoot, 'publication/dist')\n"
              "  const files = walk(dist).filter((file) => file.endsWith('.pdf'))\n"
              "  if (!files.length) {\n"
              "    throw new Error(`Rendered publication nomenclature validation found no PDFs under ${dist}.`)\n"
              "  }\n"
              "  return files\n"
              "}\n"
          )
          new_fn = (
              "function renderedPublicationPdfs(): string[] {\n"
              "  const dist = resolve(repoRoot, 'publication/dist')\n"
              "  const files = [\n"
              "    resolve(dist, `${projectIdentity.slug}.pdf`),\n"
              "    resolve(dist, `${projectIdentity.slug}-primer.pdf`)\n"
              "  ]\n"
              "  const missing = files.filter((file) => !existsSync(file))\n"
              "  if (missing.length) {\n"
              "    throw new Error(\n"
              "      `Missing required rendered publication PDF(s): ${missing.map((file) => sourcePath(file)).join(', ')}`\n"
              "    )\n"
              "  }\n"
              "  return files\n"
              "}\n"
          )
          if old_fn not in text:
              raise SystemExit('Rendered PDF function anchor missing')
          validator.write_text(text.replace(old_fn, new_fn, 1))

          harness = Path('scripts/test-public-nomenclature-regressions.ts')
          text = harness.read_text()
          old_callback = "    () => publicationValidatorFailure('reader pattern order collapsed to machine-ID order', 'collapsed to machine-ID order')\n"
          new_callback = (
              "    () => {\n"
              "      const scopePath = absolute('docs/development/print-publication-scope-crosswalk.md')\n"
              "      const originalScope = readFileSync(scopePath, 'utf8')\n"
              "      try {\n"
              "        expectSuccess(\n"
              "          'regenerate scope under deliberately broken pattern order',\n"
              "          'npm',\n"
              "          ['run', 'publication:scope:update', '--silent']\n"
              "        )\n"
              "        publicationValidatorFailure(\n"
              "          'reader pattern order collapsed to machine-ID order',\n"
              "          'collapsed to machine-ID order'\n"
              "        )\n"
              "      } finally {\n"
              "        writeFileSync(scopePath, originalScope)\n"
              "      }\n"
              "    }\n"
          )
          if old_callback not in text:
              raise SystemExit('Machine-order regression callback anchor missing')
          harness.write_text(text.replace(old_callback, new_callback, 1))

          package = Path('package.json')
          text = package.read_text()
          script_anchor = '    "test:sanitation": "tsx scripts/validate-resolved-public-surface.ts",\n'
          script_insert = script_anchor + '    "test:nomenclature-regressions": "tsx scripts/test-public-nomenclature-regressions.ts --source",\n'
          if script_anchor not in text or '"test:nomenclature-regressions"' in text:
              raise SystemExit('package script anchor missing or already patched')
          text = text.replace(script_anchor, script_insert, 1)
          chain_anchor = 'npm run test:sanitation && npm run test:dataplate'
          chain_replacement = 'npm run test:sanitation && npm run test:nomenclature-regressions && npm run test:dataplate'
          if chain_anchor not in text:
              raise SystemExit('package test-chain anchor missing')
          package.write_text(text.replace(chain_anchor, chain_replacement, 1))
          PY
          git diff --check
      - name: Typecheck regression harness
        run: npm run typecheck
      - name: Prove source and publication regressions
        run: npm run test:nomenclature-regressions
      - name: Commit permanent source regression system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-public-nomenclature.ts scripts/test-public-nomenclature-regressions.ts package.json
          git commit -m "PUB-NOM: make nomenclature regressions adversarial"
          git push origin HEAD:pub-nom
