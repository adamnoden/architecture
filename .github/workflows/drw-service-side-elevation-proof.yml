name: Prove DRW service-side elevation

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw08e2/**'
      - 'docs/publication/architectural-drawing-drw08e2-service-side-proof.md'
      - 'docs/reference-house/publication-service-side-elevation.svg'
      - 'compiler/reference-house/publication-service-side-elevation*.ts'
      - 'compiler/reference-house/generate-publication-service-side-elevation.ts'
      - '.github/workflows/drw-service-side-elevation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-service-side-elevation-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate controlled service-side elevation SVG
        run: npx tsx compiler/reference-house/generate-publication-service-side-elevation.ts
      - name: Prove committed SVG bytes
        run: git diff --exit-code -- docs/reference-house/publication-service-side-elevation.svg
      - name: Prepare plate
        run: npx tsx publication/specimens/drw08e2/prepare.ts
      - name: Build A4 proof
        run: DRW08E2_FORMAT=a4 npx vivliostyle build -c publication/specimens/drw08e2/vivliostyle.config.js
      - name: Build B5 proof
        run: DRW08E2_FORMAT=b5 npx vivliostyle build -c publication/specimens/drw08e2/vivliostyle.config.js
      - name: Validate service-side elevation proof
        run: npx tsx publication/specimens/drw08e2/validate.ts
      - name: Upload controlled drawing and proof PDFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drw-08e2-service-side-elevation-proof
          path: |
            docs/reference-house/publication-service-side-elevation.svg
            publication/specimens/drw08e2/dist/drw08e2-a4.pdf
            publication/specimens/drw08e2/dist/drw08e2-b5.pdf
          if-no-files-found: error
          retention-days: 30
