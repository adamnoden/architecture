name: Finish ordinary current named-interface producer from actual rebuilt manifests
on:
  push:
    branches: [work/current-positive-cut-recovery-20261126]
    paths: ['.github/workflows/current-positive-named-interface-closeout.yml']
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  actual-ordinary-producer-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install existing Node compiler runtime
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          echo "REGEN_DIR=$RUNNER_TEMP/current-positive-source-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
      - name: Protect exact production sources and record actual native58 identities
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          expected={"project/str/studies/distributed_floor_compatibility.py":"7a8eb302813e8a509a1fac16ee29e7359d2c0bf9","project/str/studies/perforated_floor_condensation.py":"fbdea8993c4c00d863f2105c0a83f6ac0bf78c03","project/str/studies/current_zero_chord_control.py":"abff63ca41c5bfa01082a3443ed0900412e893f4","project/str/studies/current_zero_chord_control_test.py":"d09edced886fe556f4e0768def8a29301fb847f8","project/str/studies/wet_pad_fan_recovery_proof.py":"f3d6a3b4646ef6f41ad3f4ab48d2b7be542ba3e4","project/str/studies/uniform_slab_law_proof.py":"746cb407265b7d2e395d94d259bc8d73e423aec8","project/str/studies/uniform-slab-law-inputs.json":"1cc9682b87e12b967290e93e28d95736721bf337","project/str/studies/floor-section-cuts.ts":"f5e058d4cc5ea964ff06cd1713e47f464860fb8b"}
          def sha(data):return hashlib.sha256(data).hexdigest()
          for name,digest in expected.items():
           data=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           if actual!=digest:raise ValueError('Unreviewed source blob: '+name)
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          identities=load_source(Path('.'))['identities']
          if len(identities)!=58:raise ValueError('Exact current58-source native inventory required')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          snapshot={name:sha(Path(name).read_bytes()) for name in files}
          (folder/'source-before.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exactProductionBlobs':expected,'native58SHA256':identities,'trackedSHA256':snapshot,'currentSavedEngineeringDocumentAdmitted':False},indent=2)+'\n')
          for name in ["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/floor-section-cuts-proof.json","project/str/studies/floor-interface-proof.json","project/str/studies/captures/current-positive-named-interface-manifests-20261126.tar.gz"]:
           p=Path(name)
           if p.exists():
            q=folder/'before'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
          print('PASS exact reviewed protected blobs and actual58-source inventory; canonical/account untouched',flush=True)
          PY
      - name: Recover original cut bytes and exact sixteen actual metadata manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import base64,hashlib,io,json,os,re,subprocess,tarfile,urllib.error,urllib.request,zipfile
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          api=os.environ['GITHUB_API_URL'];repo=os.environ['GITHUB_REPOSITORY']
          if repo!='adamnoden/architecture':raise ValueError('Exact repository required')
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          specs=[{"id":15138190102,"name":"current-cut-recovery-reconstruct-actual-metadata-3-bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","bytes":256596,"sha256":"0082dd68c2226411b9243cdec81561d1e18dc883c512a16f4b366eaa1c6690bd","run":45857466025,"head":"bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","job":140039491528},{"id":15136559296,"name":"current-cut-recovery-reconstruct-actual-metadata-1-bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","bytes":255983,"sha256":"223c5987328bba3c9b28c2dad6fb118b843f10c8a8f0a20e257a55f8c606a1ce","run":45857466025,"head":"bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","job":140039491819},{"id":15136189632,"name":"current-cut-recovery-reconstruct-actual-metadata-2-bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","bytes":255820,"sha256":"669c81d24456e573da2da14c15bcb8629b9b0ddabd1486fb26b2c12f6bf94b84","run":45857466025,"head":"bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","job":140039491658},{"id":15136189318,"name":"current-cut-recovery-reconstruct-actual-metadata-0-bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","bytes":255609,"sha256":"51e068ddba0bd705de0baf1f8413c7654cb8907a814c8de4d8dd57a3e813abd0","run":45857466025,"head":"bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","job":140039492003},{"id":15135873780,"name":"current-cut-recovery-recover-original-four-outputs--bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","bytes":2429546,"sha256":"ed89cd43d040a6b00d88c6dbd2cb85bcde46e56b6976fc3d7e1782f08effa5bb","run":45857466025,"head":"bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2","job":140039491113}]
          sha=lambda b:hashlib.sha256(b).hexdigest()
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def get(url):
           with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          def fetch(spec):
           run=get(f'{api}/repos/{repo}/actions/runs/{spec["run"]}')
           job=get(f'{api}/repos/{repo}/actions/jobs/{spec["job"]}')
           if run['head_sha']!=spec['head'] or run['status']!='completed' or job['run_id']!=spec['run'] or job['status']!='completed' or job['conclusion']!='success':raise ValueError('Exact selected producer job must have actually passed; failed siblings are not credited')
           metadata=get(f'{api}/repos/{repo}/actions/artifacts/{spec["id"]}')
           if metadata['name']!=spec['name'] or metadata['expired'] or metadata['size_in_bytes']!=spec['bytes'] or metadata['digest']!='sha256:'+spec['sha256'] or metadata['workflow_run']['id']!=spec['run'] or metadata['workflow_run']['head_sha']!=spec['head']:raise ValueError('Observed artifact metadata changed')
           class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return None
           try:
            with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(f'{api}/repos/{repo}/actions/artifacts/{spec["id"]}/zip',headers=headers),timeout=60) as r:raw=r.read()
           except urllib.error.HTTPError as r:
            if r.code not in (301,302,303,307,308):raise
            location=r.headers['Location']
            if not location.startswith('https://'):raise ValueError('HTTPS artifact required')
            with urllib.request.urlopen(location,timeout=120) as response:raw=response.read()
           if len(raw)!=spec['bytes'] or sha(raw)!=spec['sha256']:raise ValueError('Original observed ZIP changed')
           return raw
          if subprocess.check_output(['git','status','--porcelain'],text=True):raise ValueError('Clean source checkout required')
          
          metadata_folder=Path('/tmp/ovid-floor-interface-manifests');metadata_folder.mkdir(parents=True,exist_ok=True)
          records=[];originals={};actual58=None
          for spec in specs:
           raw=fetch(spec)
           with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            names=archive.namelist()
            if len(names)!=len(set(names)) or any(n.startswith('/') or '..' in n.split('/') or '\\' in n for n in names):raise ValueError('Unsafe original recovery artifact')
            before=json.loads(archive.read('source-before.json'));after=json.loads(archive.read('source-after.json'))
            if before['sourceCommit']!=spec['head'] or after['sourceCommit']!=spec['head'] or any(after[k] is not True for k in ['native58UnchangedDuringExecution','allOtherTrackedSourcesUnchanged','accountAndCanonicalUnchanged']) or after['candidateAccepted'] is not False:raise ValueError('Executed current source/scope lost')
            if actual58 is not None and actual58!=before['native58SHA256']:raise ValueError('Mixed native methods')
            actual58=before['native58SHA256']
            for p,h in before['trackedSHA256'].items():
             if sha(Path(p).read_bytes())!=h:raise ValueError('Protected recovered source changed: '+p)
            if 'recover-original-four-outputs' in spec['name']:
             restored=json.loads(archive.read('recovered-cut-outputs.json'))
             if restored['originalOwningProducersAndControlsPassed'] is not True or restored['historicalRecordAuthenticatedSeparately'] is not True or restored['candidateAccepted'] is not False or restored['outputs']!=after['outputs']:raise ValueError('Original validated output provenance lost')
             for p,identity in after['outputs'].items():
              data=archive.read('generated/'+p)
              if len(data)!=identity['bytes'] or sha(data)!=identity['sha256']:raise ValueError('Original cut output bytes changed')
              Path(p).write_bytes(data);originals[p]=identity
            else:
             shard=json.loads(archive.read('interface-shard-manifest.json'))
             if shard['sourceCommit']!=spec['head'] or shard['nativeSourceSHA256']!=actual58 or shard['actualMetadataReconstruction'] is not True or shard['nativeForceSolvesExecuted']!=0 or shard['candidateAccepted'] is not False or len(shard['records'])!=4:raise ValueError('Actual rebuilt metadata scope lost')
             for row in shard['records']:
              if not re.fullmatch(r'[a-f0-9]{64}',row['cacheKey']) or row['manifestFile']!=row['cacheKey']+'.json' or row['metadataMethodSHA256']!=sha(Path('project/str/studies/floor_interface_manifest.py').read_bytes()):raise ValueError('Exact owning cache/method identity lost')
              data=archive.read('interface-manifests/'+row['manifestFile'])
              if len(data)!=row['manifestBytes'] or sha(data)!=row['manifestSHA256']:raise ValueError('Actual reconstructed manifest bytes changed')
              (metadata_folder/row['manifestFile']).write_bytes(data);records.append(row)
          if len(records)!=16 or len({r['caseId'] for r in records})!=16 or len(originals)!=4:raise ValueError('All16 current cases plus4 original passed outputs required')
          manifest={'schema':'str-current-reconstructed-named-interface-cache/1','assemblySourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'metadataSourceCommit':'bfaed3b66ebbe5a8eb6e226419eca9bbd03298d2','nativeSourceSHA256':actual58,'sourceArtifacts':specs,'records':records,'all16ActuallyReconstructed':True,'nativeForceSolvesExecuted':0,'candidateAccepted':False}
          target=Path('project/str/studies/captures/current-positive-named-interface-manifests-20261126.tar.gz')
          with tarfile.open(target,'w:gz',compresslevel=1) as tar:
           for row in records:
            data=(metadata_folder/row['manifestFile']).read_bytes();m=tarfile.TarInfo(row['manifestFile']);m.size=len(data);tar.addfile(m,io.BytesIO(data))
           data=(json.dumps(manifest,indent=2)+'\n').encode();m=tarfile.TarInfo('manifest.json');m.size=len(data);tar.addfile(m,io.BytesIO(data))
          (folder/'original-recovered-output-identities.json').write_text(json.dumps(originals,indent=2)+'\n')
          print('ACTUAL_RECONSTRUCTED_INTERFACE_CACHE '+json.dumps({'bytes':target.stat().st_size,'sha256':sha(target.read_bytes()),'caseCount':16,'nativeForceSolvesExecuted':0}),flush=True)
          
          PY
      - name: Restore actual sixteen complete captures into unchanged source-addressed caches
        run: |
          python -B - <<'PY'
          import hashlib,io,json,os,tarfile,tempfile,zipfile
          from pathlib import Path
          from floor_section_model import load_source
          sha=lambda b:hashlib.sha256(b).hexdigest()
          source=load_source(Path('.'))['identities']
          base=Path(tempfile.gettempdir())/'ovid-seated-wet-controls';base.mkdir(parents=True,exist_ok=True)
          path=Path('project/str/studies/captures/current-positive-floor-full-captures-20261126.tar.gz');raw=path.read_bytes()
          if len(raw)!=22919280 or sha(raw)!='22f9ab985d0bc528dc6fb8d6092dbb59c8f204d0486d1ccef42c08491e0e0ae0':raise ValueError('Observed exact eleven full captures changed')
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
           m=json.load(tar.extractfile('floor-eleven-native-capture-manifest.json'))
           if m['sourceSHA256']!=source or m['completeVerifiedControlCount']!=11 or m['candidateAccepted'] is not False:raise ValueError('Actual11current captures required')
           for name,r in m['files'].items():
            if name.startswith('/') or '..' in name.split('/') or len(name.split('/'))!=3:raise ValueError('Exact existing source/input addressing required')
            data=tar.extractfile(name).read()
            if len(data)!=r['bytes'] or sha(data)!=r['sha256']:raise ValueError('Original full capture bytes changed')
            target=base/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          # The manifest is deliberately NOT placed in base: the unchanged producer
          # enumerates only original source/input directories there.
          mesh=Path(tempfile.gettempdir())/'ovid-floor-mesh';count=0
          expected={'coarse':('f50e25ae1dd03048e5f8df9cca96ae4853ea42b43ef326d60b03fc82339b87c6',4190458,2),'refined':('87010af73625036d4c6edce2e389c2bdda4d0c39e9a842c0438abe0dd04a31af',3232558,1),'mixed':('3561db369c623381826df6cec77f335691b8d00bafd15c706d6ef20db3b78b4f',5301873,2)}
          for group,(identity,size,n) in expected.items():
           raw=Path('project/str/studies/captures/current-positive-mesh-'+group+'-20261126.zip').read_bytes()
           if len(raw)!=size or sha(raw)!=identity:raise ValueError('Observed complete mesh ZIP changed')
           with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            m=json.loads(archive.read('mesh-capture-manifest.json'))
            if m['sourceSHA256']!=source or m['group']!=group or m['completeVerifiedCaseCount']!=n or m['nativeSolvesExecuted']!=n or m['candidateAccepted'] is not False:raise ValueError('Actual complete current mesh group lost')
            for row in m['controls'].values():
             for name,r in row['files'].items():
              if not name.startswith('mesh/'+m['meshDirectoryId']+'/') or '..' in name.split('/'):raise ValueError('Exact mesh cache path required')
              data=archive.read(name)
              if len(data)!=r['bytes'] or sha(data)!=r['sha256']:raise ValueError('Actual full mesh capture bytes changed')
              target=mesh/name.removeprefix('mesh/');target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
             count+=1
          if count!=5:raise ValueError('Exactly5 fresh additional captures required')
          print('PASS restored exact33basefiles +15meshfiles; all16realcontrols, no new native execution',flush=True)
          
          PY
      - name: Execute unchanged ordinary producer using actually reconstructed source-bound cache
        run: |
          python -B project/str/studies/floor_section_proof.py --check > "$REGEN_DIR/floor-check.log" 2>&1
          node --import tsx project/str/studies/floor-section-cuts.ts --check > "$REGEN_DIR/cuts-check.log" 2>&1
          node --import tsx project/str/studies/floor-interface-proof.ts --write > "$REGEN_DIR/interfaces-write.log" 2>&1
          node --import tsx project/str/studies/floor-interface-proof.ts --check > "$REGEN_DIR/interfaces-check.log" 2>&1
          node --import tsx --test compiler/reference-house/current-design-floor-cuts.test.ts compiler/reference-house/current-design-floor-transverse.test.ts compiler/reference-house/current-design-floor-interfaces.test.ts > "$REGEN_DIR/owning-controls.log" 2>&1
      - name: Protect all source bytes and retain every verified output
        run: |
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);before=json.loads((folder/'source-before.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          allow=["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/floor-section-cuts-proof.json","project/str/studies/floor-interface-proof.json","project/str/studies/captures/current-positive-named-interface-manifests-20261126.tar.gz"]
          actual={p:sha(Path(p).read_bytes()) for p in before['trackedSHA256']};changed=[p for p,h in actual.items() if h!=before['trackedSHA256'][p]]
          if set(changed)-set(allow):raise ValueError('Protected source/request/account changed')
          original=json.loads((folder/'original-recovered-output-identities.json').read_text())
          for p,r in original.items():
           data=Path(p).read_bytes()
           if len(data)!=r['bytes'] or sha(data)!=r['sha256']:raise ValueError('Original recovered output altered')
          outputs={}
          for p in allow:
           data=Path(p).read_bytes();q=folder/'generated'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(data);outputs[p]={'bytes':len(data),'sha256':sha(data)}
          proof=json.loads(Path('project/str/studies/floor-section-cuts-proof.json').read_text());history=proof['historicalExecutionFailures']
          if history['state']!='historical-source-only' or history['currentExecutionEvidence'] is not False or history['record']!=json.loads(Path('project/str/studies/floor-refinement-execution-limit.json').read_text()):raise ValueError('Historical execution record changed scope')
          if any(c['executedRequest']['sourceSHA256']!=before['native58SHA256'] for c in proof['controls']):raise ValueError('A current control contains stale source')
          if any(sha(Path(p).read_bytes())!=h for p,h in before['native58SHA256'].items()):raise ValueError('Native58 changed')
          (folder/'source-after.json').write_text(json.dumps({'sourceCommit':before['sourceCommit'],'outputs':outputs,'allowedGeneratedPaths':allow,'changedTrackedPaths':changed,'native58UnchangedDuringExecution':True,'allOtherTrackedSourcesUnchanged':True,'accountAndCanonicalUnchanged':True,'historicalFailureRecordAuthenticatedSeparately':True,'candidateAccepted':False},indent=2)+'\n')
          print('ACTUAL_FINAL_CUT_INTERFACE_OUTPUTS '+json.dumps(outputs),flush=True)
          PY
      - name: Preserve actual owning producer logs
        if: always()
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          for p in sorted(Path(os.environ['REGEN_DIR']).glob('*.log')):
           print('ACTUAL_NAMED_INTERFACE_CLOSEOUT_LOG '+p.name,flush=True);print(p.read_text(errors='replace')[-40000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-named-interface-closeout-${{ github.sha }}
          path: ${{ runner.temp }}/current-positive-source-evidence/
          if-no-files-found: error
          retention-days: 90
