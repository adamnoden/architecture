name: BRH-04G controlled deletion

on:
  push:
    branches: [brh-04g-controlled-deletion-7]
    paths:
      - .github/workflows/brh-04g-controlled-delete.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: brh-04g-controlled-delete
  cancel-in-progress: false

jobs:
  delete:
    if: github.repository == 'adamnoden/architecture' && github.ref == 'refs/heads/brh-04g-controlled-deletion-7'
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN: 552bc8fb84379287a032cd7f7e18cef74c03bcc9
      EXPECTED_SET_HASH: 992e7e4703f69c8ff34e5053d1408c2f39ddb509fd657b8081f25b905a7f2e27
      PACKET_BRANCH: brh-04g-controlled-deletion-7
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout guarded packet
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prove lease and delete exact candidate refs atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          cat > proof/candidates.tsv <<'EOF'
          C	pr00b-part-iv-synthesis	4907af4556e2c546721fcfba6b7f29853014f935
          C	pr00d-d3-reference-house-architecture	1789943590256278cd6152cb414c137634b8a7b7
          C	pr00d-d3-reference-house-figures	53097a2a42faa8488b7d528388ef45903c93e138
          C	pr00d-d4-reference-house-systems	064bdce830ea76c4ffa49737ee72d7092470619b
          C	pr00d-d5-visual-integration	d377665ae095b604979956d61dd36803ae7b3f6f
          C	pr00e-editorial-hardening	3e16b1cecde03dbdaa21becc6f8a02eaa4306d40
          C	pr00f-integrity	ebd9d34497e83c3158915e98cd120e1fb296675f
          C	project-integrity-refactor	5f3ddadab402daaf9f01a3ea99531fc65734302d
          C	prototype-p03-engineer-review-brief	1fe68d1f4da1531cc273573ea098709e3d6a1302
          C	pub-san-computational-surface	fd527ace394db25b6ddb1c6c6de65728ce48cf0c
          C	pub-san-research-evidence	3090a7ed89f5e0a84d54eecedebf8ad82b5ca42f
          C	pub-san-rh-technical	023094149a998126ae8bf1389be8fc0ecd9fdd79
          C	public-url-phase-1	45fcb14128ae055a8b0724cbfbbc31bbc8758ceb
          C	reference-house-phase5	456edac937e0de604f3983a6344902b8862fa761
          C	rh-c1	330e7bc0d0eda6a0ec33b51afed09c733c2dd4bd
          C	rh-c2-structural-view	9be3155dd8ff34dd21ae5ea80c7ec8f94e8e6d20
          C	rh-c3-service-view	3226aa325190aa94803c18535d49b5951afe5458
          C	rh-c4-boundary-view	b3740c8196ad2a7ba969e27b89f304841fc94f8f
          C	rh-c5-target-calculations	bc219a9060316f023e90a06709999254bda6766a
          C	workmanship-robustness	a049e8da6cd9133dcbbb654e2fc703a1c5baf712
          EOF

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git ls-remote --heads origin | LC_ALL=C sort -k2 > proof/before.refs.tsv
          cut -f2 proof/before.refs.tsv | sed 's#refs/heads/##' | LC_ALL=C sort > proof/before.names.txt

          remote_main="$(awk '$2=="refs/heads/main" {print $1}' proof/before.refs.tsv)"
          remote_packet="$(awk -v ref="refs/heads/$PACKET_BRANCH" '$2==ref {print $1}' proof/before.refs.tsv)"
          test "$remote_main" = "$EXPECTED_MAIN" || { echo "Refusing: main moved" >&2; exit 21; }
          test "$remote_packet" = "$GITHUB_SHA" || { echo "Refusing: packet branch moved" >&2; exit 22; }

          python - <<'PY'
          import csv, hashlib, json, os
          rows=[]
          with open('proof/candidates.tsv', newline='') as f:
              for cls,name,sha in csv.reader(f, delimiter='\t'):
                  rows.append({'name':name,'expectedHeadSha':sha,'class':cls})
          actual=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('proof/candidate-set-sha256.txt','w').write(actual+'\n')
          if actual != os.environ['EXPECTED_SET_HASH']: raise SystemExit('candidate hash mismatch')
          if len(rows) != 20 or any(r['class'] != 'C' for r in rows): raise SystemExit('candidate class/count mismatch')
          PY

          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName,headRefOid,isCrossRepository > proof/open-prs.json
          python - <<'PY'
          import csv,json
          candidates={r[1] for r in csv.reader(open('proof/candidates.tsv'),delimiter='\t')}
          conflicts=[]
          for pr in json.load(open('proof/open-prs.json')):
              if not pr.get('isCrossRepository') and pr.get('headRefName') in candidates:
                  conflicts.append({'pr':pr.get('number'),'branch':pr.get('headRefName'),'sha':pr.get('headRefOid')})
          json.dump(conflicts,open('proof/open-pr-candidate-conflicts.json','w'),indent=2)
          if conflicts: raise SystemExit(f'candidate ref has open PR: {conflicts}')
          PY

          python - <<'PY'
          import csv
          before={}
          for line in open('proof/before.refs.tsv'):
              sha,ref=line.rstrip().split('\t',1); before[ref.removeprefix('refs/heads/')]=sha
          bad=[]
          for cls,name,expected in csv.reader(open('proof/candidates.tsv'),delimiter='\t'):
              if before.get(name) != expected: bad.append((name,expected,before.get(name)))
          if bad: raise SystemExit(f'candidate lease failed: {bad}')
          PY

          push_args=(--atomic)
          push_args+=(--force-with-lease="refs/heads/main:$EXPECTED_MAIN")
          push_args+=(--force-with-lease="refs/heads/$PACKET_BRANCH:$GITHUB_SHA")
          push_specs=("$EXPECTED_MAIN:refs/heads/main" "$GITHUB_SHA:refs/heads/$PACKET_BRANCH")
          while IFS=$'\t' read -r cls name sha; do
            test "$name" != "main"; test "$name" != "$PACKET_BRANCH"
            push_args+=(--force-with-lease="refs/heads/$name:$sha")
            push_specs+=(":refs/heads/$name")
          done < proof/candidates.tsv
          git push "${push_args[@]}" origin "${push_specs[@]}"

          git ls-remote --heads origin | LC_ALL=C sort -k2 > proof/after.refs.tsv
          cut -f2 proof/after.refs.tsv | sed 's#refs/heads/##' | LC_ALL=C sort > proof/after.names.txt
          cut -f2 proof/candidates.tsv | LC_ALL=C sort > proof/candidate.names.txt
          comm -23 proof/before.names.txt proof/after.names.txt > proof/removed.names.txt
          comm -13 proof/before.names.txt proof/after.names.txt > proof/added.names.txt
          diff -u proof/candidate.names.txt proof/removed.names.txt

          after_main="$(awk '$2=="refs/heads/main" {print $1}' proof/after.refs.tsv)"
          after_packet="$(awk -v ref="refs/heads/$PACKET_BRANCH" '$2==ref {print $1}' proof/after.refs.tsv)"
          test "$after_main" = "$EXPECTED_MAIN"; test "$after_packet" = "$GITHUB_SHA"

          {
            echo "status=success"
            echo "workflow_head=$GITHUB_SHA"
            echo "main=$after_main"
            echo "candidate_set_sha256=$EXPECTED_SET_HASH"
            echo "before_count=$(wc -l < proof/before.names.txt | tr -d ' ')"
            echo "after_count=$(wc -l < proof/after.names.txt | tr -d ' ')"
            echo "removed_count=$(wc -l < proof/removed.names.txt | tr -d ' ')"
            echo "concurrent_added_count=$(wc -l < proof/added.names.txt | tr -d ' ')"
          } > proof/result.txt
          cat proof/result.txt

      - name: Upload deletion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brh-04g-deletion-proof
          path: proof/
          if-no-files-found: warn
