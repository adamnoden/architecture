# One-shot read-only canonical RWT-06 generation-40 preflight on a temporary branch.
name: RWT-06 generation-40 publication preflight
on:
  push:
    branches:
      - work/rwt40-preflight-20261103
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6601488674
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical RWT-06 generation-40 merge preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --import tsx scripts/project-claims.ts merge-check RWT-06 \
            --lease-id 38370b96-0d62-47ff-ac38-3b5b0faf080c \
            --generation 40 \
            --branch work/mvb-chat-6601488674 \
            --head 49224ed5bfb189b5129bdb0657d6b823b4398fa2 \
            --format json
