name: Finalize publication typography v1

on:
  push:
    branches:
      - main
    paths:
      - 'docs/publication/publication-typography-v1-release.md'
      - '.github/workflows/finalize-publication-typography-v1.yml'

permissions:
  contents: write

jobs:
  tag-release:
    name: tag publication-typography-v1
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create immutable typography release tag
        shell: bash
        run: |
          set -euo pipefail
          tag='publication-typography-v1'
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            existing="$(git rev-list -n 1 "${tag}")"
            if [ "${existing}" != "${GITHUB_SHA}" ]; then
              echo "${tag} already exists at ${existing}; refusing to move it to ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "${tag} already exists at the exact release commit ${GITHUB_SHA}."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "Created ${tag} at ${GITHUB_SHA}."
