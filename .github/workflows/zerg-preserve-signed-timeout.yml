name: Preserve timed-out signed evidence before exact job retry
on:
  push:
    branches: [work/zerg-finite-editor-diagnostic-20261126]
permissions:
  contents: read
  actions: write
jobs:
  preserve-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate and preserve the cancelled partial artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/preserved-timeout"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root='https://api.github.com/repos/adamnoden/architecture/actions/artifacts/15126951710'
          class PublicBlobRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  redirected.remove_header('Authorization')
                  return redirected
          opener=urllib.request.build_opener(PublicBlobRedirect())
          def get(url):
              return opener.open(urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}))
          meta=json.load(get(root))
          assert meta['id']==15126951710 and meta['name']=='finite-signed-shard-10'
          assert meta['workflow_run']['id']==45826903921
          assert meta['workflow_run']['head_sha']=='5ab92bc0cf8e88a0f5ea700ba065c2552348c4f3'
          data=get(root+'/zip').read()
          assert hashlib.sha256(data).hexdigest()=='384fc6050c8e8d3a4c29d044061b243af59587e650a9d90870f4c6c9d7206c0b'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'],'preserved-timeout')
          (dest/'original-partial-shard10.zip').write_bytes(data)
          (dest/'original-metadata.json').write_text(json.dumps(meta,indent=2))
          print('Authenticated original cancelled partial artifact; no result changed')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: preserved-original-timeout-shard10-run45826903921
          path: ${{ runner.temp }}/preserved-timeout
          if-no-files-found: error
          retention-days: 90
      - name: Release only the superseded attempt artifact name for exact rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/adamnoden/architecture/actions/artifacts/15126951710
