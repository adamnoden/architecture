name: DPL-T1 geometry preflight

on:
  push:
    branches:
      - dpl-t1-geometry-preflight
    paths:
      - .github/workflows/dpl-t1-geometry-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install bounded geometry dependencies
        run: python -m pip install --disable-pip-version-check --quiet shapely pyproj

      - name: Acquire and test 41 Lennard Road
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          from pyproj import Transformer
          from shapely import wkt
          from shapely.geometry import Polygon
          from shapely.ops import transform

          UPRN='100020404537'
          ADDRESS='41 Lennard Road, Bromley, BR2 8LN'
          PLANNING_REF='26/02618/FPA'
          PLANNING_COORD_BNG=[542903,166217]
          RH=(12.0,10.8)
          url='https://www.planning.data.gov.uk/entity.json?q='+UPRN+'&dataset=title-boundary&limit=20'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DPL-T1 evidence probe'})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read()
          open('evidence/lennard-title-query.json','wb').write(raw)
          j=json.loads(raw)
          ents=j.get('entities',j.get('entity',[]))
          if isinstance(ents,dict): ents=[ents]
          if len(ents)!=1:
              raise SystemExit(f'expected exactly one title entity for {UPRN}, got {len(ents)}')
          e=ents[0]
          geom_wkt=e.get('geometry') or e.get('wkt')
          if not geom_wkt:
              raise SystemExit('title entity has no geometry/wkt')
          g=wkt.loads(geom_wkt)
          to_bng=Transformer.from_crs(4326,27700,always_xy=True).transform
          gb=transform(to_bng,g)
          rect=gb.minimum_rotated_rectangle
          coords=list(rect.exterior.coords)
          lengths=[]
          for a,b in zip(coords[:-1],coords[1:]):
              lengths.append(((b[0]-a[0])**2+(b[1]-a[1])**2)**0.5)
          dims=sorted(lengths)[:2]
          # rectangle has duplicate side lengths; unique by tolerance
          uniq=[]
          for x in sorted(lengths):
              if not uniq or abs(x-uniq[-1])>1e-6: uniq.append(x)
          width,length=uniq[0],uniq[-1]
          minimum_projection=min(RH)
          no_fit=width < minimum_projection
          out={
              'address':ADDRESS,
              'planningRef':PLANNING_REF,
              'uprn':UPRN,
              'planningCoordinateBng':PLANNING_COORD_BNG,
              'sourceUrl':url,
              'sourceSha256':hashlib.sha256(raw).hexdigest(),
              'entityCount':len(ents),
              'entity':e.get('entity'),
              'reference':e.get('reference'),
              'quality':e.get('quality'),
              'sourceCrs':'EPSG:4326',
              'analysisCrs':'EPSG:27700',
              'wkt':geom_wkt,
              'areaSquareMetres':gb.area,
              'minimumRotatedEnvelopeWidthMetres':width,
              'minimumRotatedEnvelopeLengthMetres':length,
              'referenceHouseMetres':RH,
              'minimumRhProjectionMetres':minimum_projection,
              'widthMarginMetres':width-minimum_projection,
              'screeningResult':'CONTROL_SITE_SCREENING_GEOMETRY_NO_UNCHANGED_RH_PLACEMENT' if no_fit else 'CONTROLLED_SCREENING_GEOMETRY_DOES_NOT_DISPROVE_PLACEMENT'
          }
          open('evidence/lennard-preflight.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpl-t1-geometry-preflight
          path: evidence/
          if-no-files-found: error
          retention-days: 1
