name: Rear bearing exact-source recovery

on:
  push:
    branches:
      - work/zerg-rear-bearing-recovery-20261126
    paths:
      - .github/workflows/rear-bearing-recovery.yml
      - project/str/studies/rear_*.py
      - compiler/reference-house/current-design/structural-rear-bearing.ts
      - compiler/reference-house/current-design-rear-bearing.test.ts

permissions:
  contents: read

concurrency:
  group: rear-bearing-exact-recovery
  cancel-in-progress: true

jobs:
  actual-w0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - run: npm ci --no-audit --no-fund
      - name: Install the existing pinned native and finite runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rear-bearing-capture"
      - name: Verify exact reconstructed source and bounded geometry controls
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_direct_bearing_recovery.py prepare --folder "$RUNNER_TEMP/rear-bearing-capture"
          "$STR_FINITE_SOLID_PYTHON" -B -m unittest discover -s project/str/studies -p rear_bearing_plan_test.py -v > "$RUNNER_TEMP/rear-bearing-capture/plan-tests.log" 2>&1
          "$STR_FINITE_SOLID_PYTHON" -B -m unittest discover -s project/str/studies -p rear_direct_bearing_test.py -v > "$RUNNER_TEMP/rear-bearing-capture/physical-tests.log" 2>&1
          node --import tsx --test compiler/reference-house/current-design-rear-bearing.test.ts > "$RUNNER_TEMP/rear-bearing-capture/typescript-test.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/rear-bearing-capture/typecheck.log" 2>&1
      - name: Compile the actual current saved parent with only admitted W0 perturbation
        run: |
          node --import tsx scripts/compile-current-design.ts --bundle "$RUNNER_TEMP/rear-bearing-capture/parent-W0-document.json" > "$RUNNER_TEMP/rear-bearing-capture/parent-W0-bundle.json" 2> "$RUNNER_TEMP/rear-bearing-capture/parent-W0-compiler.log"
      - name: Execute fresh complete rear house and independently replay raw forces
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_direct_bearing_recovery.py execute --folder "$RUNNER_TEMP/rear-bearing-capture" > "$RUNNER_TEMP/rear-bearing-capture/execution.log" 2>&1
      - name: Reject adverse actual candidate and parent evidence edits
        env:
          STR_REAR_BEARING_CAPTURE: ${{ runner.temp }}/rear-bearing-capture/rear-W0-native.json
          STR_REAR_BEARING_CHECKPOINT: ${{ runner.temp }}/rear-bearing-capture/rear-W0-raw-checkpoint.json
          STR_REAR_BEARING_CONTROL: ${{ runner.temp }}/rear-bearing-capture/parent-W0-native.json
          STR_CURRENT_FINITE_CAPTURE: ${{ runner.temp }}/rear-bearing-capture/parent-W0-native.json
        run: |
          "$STR_FINITE_SOLID_PYTHON" -B -m unittest discover -s project/str/studies -p rear_direct_bearing_replay_test.py -v > "$RUNNER_TEMP/rear-bearing-capture/adverse-tests.log" 2>&1
          "$STR_FINITE_SOLID_PYTHON" -B -m unittest discover -s project/str/studies -p current_finite_joint_replay_test.py -v > "$RUNNER_TEMP/rear-bearing-capture/parent-replay-tests.log" 2>&1
          "$STR_FINITE_SOLID_PYTHON" -B project/str/studies/rear_direct_bearing_recovery.py finalize --folder "$RUNNER_TEMP/rear-bearing-capture"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rear-bearing-recovered-W0-${{ github.sha }}
          path: ${{ runner.temp }}/rear-bearing-capture/
          if-no-files-found: error
          retention-days: 90
