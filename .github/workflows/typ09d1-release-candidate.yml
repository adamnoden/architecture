name: TYP-09D.1 RC2 proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/typ09d1-release-candidate.yml'
      - 'publication/release-candidates/typ09d1.json'
      - 'publication/scripts/verify-typ09d1-release-candidate.ts'
      - 'publication/fonts.ts'
      - 'publication/scripts/typography.ts'
      - 'publication/typ09d1-emphasis.css'
      - 'publication/vivliostyle.config.js'
      - 'publication/scripts/build-typography-proof.ts'
      - 'publication/scripts/normalize-pdf-destinations.ts'
      - 'publication/scripts/verify-typography.ts'
      - 'publication/scripts/verify-typography-ledger.ts'
      - 'publication/typography-metadata.json'
      - 'publication/typography.css'
      - 'publication/page-furniture.css'
      - 'publication/formats/**'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'

jobs:
  release-candidate:
    name: rc2 replica ${{ matrix.replica }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PDF inspectors
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Build paired production proof
        run: npx tsx publication/scripts/build-typography-proof.ts

      - name: Verify production typography
        run: npx tsx publication/scripts/verify-typography.ts

      - name: Verify paired pagination ledger
        run: npx tsx publication/scripts/verify-typography-ledger.ts

      - name: Verify TYP-09D.1 RC2
        run: npx tsx publication/scripts/verify-typ09d1-release-candidate.ts

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-typography-v1-rc2-replica-${{ matrix.replica }}-evidence
          path: |
            publication/release-candidates/typ09d1.json
            publication/.proof/typ09b/typ09d1-calibration.json
            publication/.proof/typ09b/verification.json
            publication/.proof/typ09b/font-upstream-evidence.json
            publication/.proof/typ09b/diagnostics/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload exact RC2 physical-review candidate
        if: matrix.replica == 1 && success()
        uses: actions/upload-artifact@v4
        with:
          name: publication-typography-v1-rc2
          path: |
            publication/.proof/typ09b/a4/publication-typography-production-a4.pdf
            publication/.proof/typ09b/b5/publication-typography-production-b5.pdf
          if-no-files-found: error
          retention-days: 90
