name: Ovid’s House one-shot master-brand migration

on:
  push:
    branches: [ovids-house-migration]

permissions:
  contents: write

concurrency:
  group: ovids-house-one-shot-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: ovids-house-migration

      - name: Migrate canonical master-brand references
        run: node scripts/migrate-ovids-house-brand.mjs

      - name: Check patch
        run: git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs publication
          git commit -m "OH-03 — migrate canonical master-brand references"
          git push origin HEAD:ovids-house-migration
