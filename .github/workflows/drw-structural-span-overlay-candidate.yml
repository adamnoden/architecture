name: Generate DRW structural span overlay candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiler/reference-house/publication-structural-span*.ts'
      - 'compiler/reference-house/generate-publication-structural-span-overlay.ts'
      - 'docs/publication/architectural-drawing-drw10a-structural-span-overlay.md'
      - '.github/workflows/drw-structural-span-overlay-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drw-structural-span-overlay-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate candidate SVG
        run: npx tsx compiler/reference-house/generate-publication-structural-span-overlay.ts
      - name: Verify candidate semantics
        run: |
          test -s docs/reference-house/publication-structural-span-overlay.svg
          grep -q 'data-view-id="REFERENCE-HOUSE-STRUCTURAL-SPAN-OVERLAY"' docs/reference-house/publication-structural-span-overlay.svg
          grep -q 'gross-span-direction-not-joist-centreline' docs/reference-house/publication-structural-span-overlay.svg
          grep -q 'ABSENT_STRUCTURAL_ENGINEERING' docs/reference-house/publication-structural-span-overlay.svg
      - name: Freeze reviewed candidate bytes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- docs/reference-house/publication-structural-span-overlay.svg; then
            echo 'Controlled SVG already matches canonical generation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference-house/publication-structural-span-overlay.svg
          git commit -m 'DRW-10A: freeze reviewed structural span overlay'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload candidate SVG
        uses: actions/upload-artifact@v6
        with:
          name: drw-10a-structural-span-overlay-candidate
          path: docs/reference-house/publication-structural-span-overlay.svg
          if-no-files-found: error
          retention-days: 30
