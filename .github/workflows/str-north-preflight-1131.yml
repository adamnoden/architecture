name: Temporary read-only STR north support preflight 1131
on:
  push:
    branches: [work/mvb-chat-6541491670]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Observe cleaned head and exact-head validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 64); do
            if ! pr="$(gh api repos/adamnoden/architecture/pulls/1131)"; then sleep 15; continue; fi
            test "$(jq -r '.state' <<< "$pr")" = open
            test "$(jq -r '.head.ref' <<< "$pr")" = work/mvb-chat-6541491670
            test "$(jq -r '.head.repo.full_name' <<< "$pr")" = adamnoden/architecture
            test "$(jq -r '.base.ref' <<< "$pr")" = main
            grep -Fxq 'Work: STR-HOUSE' <<< "$(jq -r '.body' <<< "$pr")"
            grep -Fxq 'Lease: STR-HOUSE / 44f12563-59a9-4117-aa66-8bf547550f46 / generation 3' <<< "$(jq -r '.body' <<< "$pr")"
            head="$(jq -r '.head.sha' <<< "$pr")"
            git fetch origin main work/mvb-chat-6541491670 --quiet
            test "$(git rev-parse origin/work/mvb-chat-6541491670)" = "$head"
            if git cat-file -e "$head:.github/workflows/str-north-preflight-1131.yml" 2>/dev/null; then sleep 15; continue; fi
            git diff --quiet origin/main "$head" -- project/control scripts/project-claims.ts package.json package-lock.json .nvmrc .github/workflows
            if ! checks="$(gh api "repos/adamnoden/architecture/commits/$head/check-runs?per_page=100")"; then sleep 15; continue; fi
            latest="$(jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.name) | group_by(.name) | map(sort_by(.id) | last)' <<< "$checks")"
            validate="$(jq '[.[] | select(.name == "validate")] | last // {}' <<< "$latest")"
            bad="$(jq '[.[] | select(.name != "preflight") | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<< "$latest")"
            if (( bad > 0 )); then echo 'Failed check on target head; publication prohibited'; exit 1; fi
            pending="$(jq '[.[] | select(.name != "preflight" and .status != "completed")] | length' <<< "$latest")"
            if test "$(jq -r '.conclusion' <<< "$validate")" = success && test "$pending" = 0; then
              echo "Validated final head: $head"
              jq -r '.[] | [.name,.status,.conclusion,.details_url] | @tsv' <<< "$latest"
              echo "TARGET_HEAD=$head" >> "$GITHUB_ENV"
              ready=true
              break
            fi
            sleep 15
          done
          test "$ready" = true
      - name: Verify reviewed blobs and reproduce support comparison
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git hash-object project/str/north-drainage-support-result.md)" = 38800517ee49cbec4cb3f2c558ba5449a3ab5712
          test "$(git hash-object project/str/studies/north-drainage-support.mjs)" = 1f818317a9c336307a3508fe071d1eaf0489806d
          test "$(git hash-object project/str/studies/north-drainage-support.test.mjs)" = 8846422c364a7581e37fb78872a097b86dfff43f
          test "$(git hash-object project/str/studies/north-drainage-support.svg)" = 6be39e6ba6d3046aaaa9adb83a0dc1152a19aaa6
          node --test project/str/studies/north-drainage-support.test.mjs
          node project/str/studies/north-drainage-support.mjs --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Canonical publication preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/project-claims.ts merge-check STR-HOUSE \
            --lease-id 44f12563-59a9-4117-aa66-8bf547550f46 --generation 3 \
            --branch work/mvb-chat-6541491670 --head "$TARGET_HEAD" --format text
