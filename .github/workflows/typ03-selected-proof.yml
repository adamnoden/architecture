name: TYP-03F selected Source proof

on:
  pull_request:
    paths:
      - '.github/workflows/typ03-selected-proof.yml'
      - 'publication/specimens/typ03/**'
      - 'docs/manuscript/part-i.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact selected Source proof
        env:
          TYP03_PACK_ID: typ03f-source-confirmation
        run: npx tsx publication/specimens/typ03/proof-pack.ts --selected

      - name: Upload selected Source proof
        uses: actions/upload-artifact@v4
        with:
          name: typ03f-source-confirmation
          path: publication/.work/typ03-proof-packs/typ03f-source-confirmation/
          if-no-files-found: error
          retention-days: 14
