    branches:
      - work/rwt42-preflight-20261103
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: work/mvb-chat-6613543285
          fetch-depth: 0
          persist-credentials: false
