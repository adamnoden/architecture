          node --import tsx scripts/project-claims.ts merge-check RWT-06 \
            --lease-id 256bbb04-3558-4739-afe3-37f41e45be35 \
            --generation 42 \
            --branch work/mvb-chat-6613543285 \
            --head c82b494388e1298d888a19fb2135effcf205cff7 \
            --format json

