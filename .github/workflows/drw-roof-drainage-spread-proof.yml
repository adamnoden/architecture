name: Prove DRW roof/drainage spread

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw07d/**'
      - 'docs/publication/architectural-drawing-drw07d-roof-drainage-plate-proof.md'
      - 'docs/reference-house/publication-roof-drainage.svg'
      - 'compiler/reference-house/publication-roof-drainage*.ts'
      - 'compiler/reference-house/generate-publication-roof-drainage.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/drw-roof-drainage-spread-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-roof-drainage-spread-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare controlled roof/drainage spread
        run: npx tsx publication/specimens/drw07d/prepare.ts

      - name: Build A4 roof/drainage proof
        run: DRW07D_FORMAT=a4 npx vivliostyle build -c publication/specimens/drw07d/vivliostyle.config.js

      - name: Build B5 roof/drainage proof
        run: DRW07D_FORMAT=b5 npx vivliostyle build -c publication/specimens/drw07d/vivliostyle.config.js

      - name: Validate roof/drainage spread proof
        run: npx tsx publication/specimens/drw07d/validate.ts

      - name: Upload roof/drainage proof PDFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drw-07d-roof-drainage-spread-proof
          path: |
            publication/specimens/drw07d/dist/drw07d-a4.pdf
            publication/specimens/drw07d/dist/drw07d-b5.pdf
          if-no-files-found: error
          retention-days: 30
