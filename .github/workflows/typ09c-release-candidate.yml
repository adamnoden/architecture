name: TYP-09C release candidate (historical RC1)

# RC1 is immutable historical evidence. It was superseded by an explicit
# TYP-09D owner-review freeze break; current production changes are proved by
# the TYP-09D RC2 workflow instead of silently rewriting RC1.
on:
  workflow_dispatch:

jobs:
  release-candidate:
    name: historical RC1 verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Explain historical boundary
        run: |
          echo "TYP-09C RC1 is preserved as historical evidence."
          echo "Do not rebuild current production and relabel it RC1."
          echo "Use TYP-09D RC2 for the owner-review freeze break."
