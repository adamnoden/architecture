name: TYP-09C release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/typ09c-release-candidate.yml'
      - 'publication/release-candidates/typ09c.json'
      - 'publication/scripts/verify-typ09c-release-candidate.ts'
      - 'publication/scripts/build-typography-proof.ts'
      - 'publication/scripts/normalize-pdf-destinations.ts'
      - 'publication/scripts/verify-typography.ts'
      - 'publication/scripts/verify-typography-ledger.ts'
      - 'publication/typography-metadata.json'
      - 'publication/typography.css'
      - 'publication/a4.css'
      - 'publication/b5.css'
      - 'publication/page-furniture.css'
      - 'publication/vivliostyle.config.js'
      - 'publication/scripts/prepare.ts'
      - 'docs/publication/publication-typography-typ06c-sans-drawing-interface-freeze.md'
      - 'docs/manuscript/**'
      - 'docs/patterns/**'
      - 'docs/reference-house/**'
      - 'compiler/publication-drawing/**'

jobs:
  release-candidate:
    name: release-candidate replica ${{ matrix.replica }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PDF inspectors
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Build paired production proof
        run: npx tsx publication/scripts/build-typography-proof.ts

      - name: Verify production typography
        run: npx tsx publication/scripts/verify-typography.ts

      - name: Verify paired pagination ledger
        run: npx tsx publication/scripts/verify-typography-ledger.ts

      - name: Verify frozen TYP-09C rebuild equivalence
        run: npx tsx publication/scripts/verify-typ09c-release-candidate.ts

      - name: Upload exact physical-review candidate
        if: matrix.replica == 1
        uses: actions/upload-artifact@v4
        with:
          name: publication-typography-v1-rc1
          path: |
            publication/.proof/typ09b/a4/publication-typography-production-a4.pdf
            publication/.proof/typ09b/b5/publication-typography-production-b5.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload release-candidate evidence
        if: matrix.replica == 1
        uses: actions/upload-artifact@v4
        with:
          name: publication-typography-v1-rc1-evidence
          path: |
            publication/release-candidates/typ09c.json
            publication/typography-metadata.json
            publication/.proof/typ09b/verification.json
            publication/.proof/typ09b/build.json
            publication/.proof/typ09b/typography-integration.json
            publication/.proof/typ09b/font-upstream-evidence.json
            publication/.proof/typ09b/a4/*.destination-normalization.json
            publication/.proof/typ09b/b5/*.destination-normalization.json
            publication/.proof/typ09b/diagnostics/*
          if-no-files-found: error
          retention-days: 90
