name: BRH-01B patch-equivalent classification

on:
  push:
    branches:
      - brh-01b-patch-equivalent

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh remote refs
        run: git fetch --all --prune

      - name: Run full read-only branch audit
        run: node scripts/branch-hygiene-audit.mjs --output=/tmp/brh-01b-audit.json

      - name: Capture live open PRs
        run: gh pr list --state open --limit 200 --json number,headRefName,headRefOid,isDraft,url > /tmp/brh-01b-open-prs.json

      - name: Classify defensible B candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const packetBranch = 'brh-01b-patch-equivalent';
          const audit = JSON.parse(fs.readFileSync('/tmp/brh-01b-audit.json', 'utf8'));
          const prior = JSON.parse(fs.readFileSync('project/branch-hygiene-classification.json', 'utf8'));
          const openPrs = JSON.parse(fs.readFileSync('/tmp/brh-01b-open-prs.json', 'utf8'));

          if (prior.packet !== 'BRH-01A') throw new Error(`Expected BRH-01A classification input, got ${prior.packet}`);

          const priorAByName = new Map(prior.aCandidates.map(b => [b.name, b]));
          const priorHeads = new Map(prior.enumeration.branches.map(b => [b.name, b.headSha]));
          const currentByName = new Map(audit.auditedBranches.map(b => [b.name, b]));
          const openByBranch = new Map(openPrs.map(pr => [pr.headRefName, pr]));

          const newSince01A = audit.auditedBranches
            .filter(b => !priorHeads.has(b.name))
            .map(b => b.name)
            .sort();
          const changedSince01A = audit.auditedBranches
            .filter(b => priorHeads.has(b.name) && priorHeads.get(b.name) !== b.headSha)
            .map(b => ({ name: b.name, priorHeadSha: priorHeads.get(b.name), currentHeadSha: b.headSha }))
            .sort((a,b) => a.name.localeCompare(b.name));
          const changedNames = new Set(changedSince01A.map(x => x.name));
          const newNames = new Set(newSince01A);

          const carriedA = [];
          const invalidatedPriorA = [];
          for (const [name, priorA] of priorAByName) {
            const current = currentByName.get(name);
            if (!current) {
              invalidatedPriorA.push({ name, reason: 'ref-missing', priorHeadSha: priorA.headSha, currentHeadSha: null });
            } else if (current.headSha !== priorA.headSha) {
              invalidatedPriorA.push({ name, reason: 'head-changed', priorHeadSha: priorA.headSha, currentHeadSha: current.headSha });
            } else if (!current.headIsAncestorOfMain || current.branchOnlyCommits.length !== 0) {
              invalidatedPriorA.push({ name, reason: 'current-A-proof-failed', priorHeadSha: priorA.headSha, currentHeadSha: current.headSha });
            } else {
              carriedA.push(priorA);
            }
          }
          carriedA.sort((a,b) => a.name.localeCompare(b.name));
          invalidatedPriorA.sort((a,b) => a.name.localeCompare(b.name));
          const carriedANames = new Set(carriedA.map(b => b.name));

          const bCandidates = [];
          const unresolved = [];
          const post01AIntegratedSignal = [];

          for (const b of audit.auditedBranches) {
            if (carriedANames.has(b.name)) continue;

            const reasons = [];
            if (b.name === packetBranch) reasons.push('active-packet-branch');
            if (openByBranch.has(b.name)) reasons.push('open-pr');
            if (newNames.has(b.name)) reasons.push('post-BRH-01A-ref');
            if (changedNames.has(b.name)) reasons.push('head-changed-since-BRH-01A');

            if (b.headIsAncestorOfMain && b.branchOnlyCommits.length === 0) {
              post01AIntegratedSignal.push({
                name: b.name,
                headSha: b.headSha,
                priorHeadSha: priorHeads.get(b.name) ?? null,
                reasons: [...reasons, 'currently-A-shaped-but-outside-BRH-01B'],
              });
            }

            const meaningful = b.nonMergeBranchOnlyCommits;
            const cherry = b.patchEquivalence.gitCherry;
            const allStablePatchIdsPresent = meaningful.length > 0 && meaningful.every(c => Boolean(c.stablePatchId));
            const allCherryEquivalent = cherry.length > 0 &&
              b.patchEquivalence.uniquePatchCount === 0 &&
              cherry.every(e => e.equivalence === 'patch-equivalent');
            const cherryCoversMeaningfulHistory = cherry.length === meaningful.length;
            const bMechanical =
              !b.headIsAncestorOfMain &&
              b.branchOnlyCommits.length > 0 &&
              meaningful.length > 0 &&
              allStablePatchIdsPresent &&
              allCherryEquivalent &&
              cherryCoversMeaningfulHistory;

            const safetyBlocked = reasons.length > 0;
            if (bMechanical && !safetyBlocked) {
              bCandidates.push({
                name: b.name,
                headSha: b.headSha,
                mergeBase: b.mergeBase,
                behindMain: b.behindMain,
                aheadOfMain: b.aheadOfMain,
                branchOnlyCommitCount: b.branchOnlyCommits.length,
                nonMergeBranchOnlyCommits: meaningful,
                patchEquivalence: b.patchEquivalence,
                pullRequests: b.pullRequests,
                classification: 'B',
                rationale: 'Current head is non-ancestral, but every non-merge branch-only patch has a stable patch id and git cherry proves every meaningful patch equivalent to current main; branch head is unchanged from BRH-01A and no active/open/recent protection applies.'
              });
            } else {
              if (!b.headIsAncestorOfMain && b.branchOnlyCommits.length > 0) {
                if (meaningful.length === 0) reasons.push('no-nonmerge-branch-only-history');
                if (!allStablePatchIdsPresent && meaningful.length > 0) reasons.push('missing-stable-patch-id');
                if (b.patchEquivalence.uniquePatchCount > 0) reasons.push('unique-patch-signal');
                if (cherry.length === 0 && meaningful.length > 0) reasons.push('empty-git-cherry-proof');
                if (cherry.length > 0 && !allCherryEquivalent) reasons.push('mixed-or-unique-git-cherry');
                if (!cherryCoversMeaningfulHistory) reasons.push('git-cherry-count-does-not-cover-nonmerge-history');
              }
              if (b.headIsAncestorOfMain) reasons.push('head-ancestor-of-main-not-B');
              else if (b.branchOnlyCommits.length === 0) reasons.push('no-branch-only-commits-not-B');

              unresolved.push({
                name: b.name,
                headSha: b.headSha,
                reasons: [...new Set(reasons)],
                mechanical: {
                  headIsAncestorOfMain: b.headIsAncestorOfMain,
                  branchOnlyCommitCount: b.branchOnlyCommits.length,
                  nonMergeBranchOnlyCommitCount: meaningful.length,
                  uniquePatchCount: b.patchEquivalence.uniquePatchCount,
                  equivalentPatchCount: b.patchEquivalence.equivalentPatchCount,
                  allCherryPatchesEquivalent: b.patchEquivalence.allCherryPatchesEquivalent,
                },
                provisionalClassification: safetyBlocked ? 'X' : null,
              });
            }
          }

          bCandidates.sort((a,b) => a.name.localeCompare(b.name));
          unresolved.sort((a,b) => a.name.localeCompare(b.name));
          post01AIntegratedSignal.sort((a,b) => a.name.localeCompare(b.name));

          const record = {
            schemaVersion: 3,
            packet: 'BRH-01B',
            generatedAt: new Date().toISOString(),
            repository: audit.repository,
            baselineMainSha: audit.mainSha,
            priorClassification: {
              packet: prior.packet,
              baselineMainSha: prior.baselineMainSha,
              generatedAt: prior.generatedAt,
            },
            enumeration: audit.enumeration,
            counts: {
              currentNonMainBranches: audit.auditedBranchCount,
              openPrs: openPrs.length,
              carriedA: carriedA.length,
              invalidatedPriorA: invalidatedPriorA.length,
              bCandidates: bCandidates.length,
              unresolvedAfterAB: unresolved.length,
              newSinceBRH01A: newSince01A.length,
              changedSinceBRH01A: changedSince01A.length,
              post01AIntegratedSignal: post01AIntegratedSignal.length,
            },
            rule: {
              classification: 'B — patch-equivalent',
              requires: [
                'headIsAncestorOfMain === false',
                'branchOnlyCommits.length > 0',
                'nonMergeBranchOnlyCommits.length > 0',
                'every non-merge branch-only commit has a stable patch id',
                'git cherry result is non-empty',
                'git cherry uniquePatchCount === 0',
                'every git cherry entry is patch-equivalent',
                'git cherry entry count equals non-merge branch-only commit count',
                'branch head unchanged since BRH-01A',
                'not a post-BRH-01A ref',
                'no open PR',
                'not the active BRH-01B packet branch'
              ],
              excludesFilenameOrBranchNameInference: true,
              excludesSemanticSupersession: true,
              authorisesDeletion: false,
            },
            newSinceBRH01A: newSince01A,
            changedSinceBRH01A: changedSince01A,
            openPrs,
            aCandidates: carriedA,
            invalidatedPriorA,
            bCandidates,
            post01AIntegratedSignal,
            unresolvedAfterAB: unresolved,
          };

          const json = JSON.stringify(record, null, 2) + '\n';
          fs.writeFileSync('project/branch-hygiene-classification.json', json);
          const digest = crypto.createHash('sha256').update(json).digest('hex');

          const md = [];
          md.push('# BRH-01B — patch-equivalent branches');
          md.push('');
          md.push('Mechanical classification only. BRH-01B proves patch equivalence; it does not make semantic supersession decisions and authorises no branch deletion.');
          md.push('');
          md.push('## Baseline');
          md.push('');
          md.push(`- current main: \`${record.baselineMainSha}\``);
          md.push(`- current non-main branches: **${record.counts.currentNonMainBranches}**`);
          md.push(`- open PRs at classification time: **${record.counts.openPrs}**`);
          md.push(`- A classifications carried with unchanged heads: **${record.counts.carriedA}**`);
          md.push(`- prior A classifications invalidated by ref/proof movement: **${record.counts.invalidatedPriorA}**`);
          md.push(`- B — patch-equivalent: **${record.counts.bCandidates}**`);
          md.push(`- unresolved after A/B: **${record.counts.unresolvedAfterAB}**`);
          md.push(`- new refs since BRH-01A: **${record.counts.newSinceBRH01A}**`);
          md.push(`- changed heads since BRH-01A: **${record.counts.changedSinceBRH01A}**`);
          md.push(`- enumeration SHA-256: \`${record.enumeration.sha256}\``);
          md.push(`- classification JSON SHA-256: \`${digest}\``);
          md.push('');
          md.push('## B classification rule');
          md.push('');
          md.push('A branch is classified **B — patch-equivalent** only when it has meaningful non-merge branch-only history, its head is not ancestral to current `main`, every such commit has a stable patch id, and `git cherry` proves every meaningful patch equivalent to `main`. The branch head must also be unchanged since BRH-01A and free of open/live/recent protection. Similar names or filenames are never evidence.');
          md.push('');
          md.push(`## B — patch-equivalent (${bCandidates.length})`);
          md.push('');
          md.push('| Branch | Head | Non-merge patches | git cherry equivalent | Unique | Evidence |');
          md.push('| --- | --- | ---: | ---: | ---: | --- |');
          for (const b of bCandidates) {
            md.push(`| \`${b.name}\` | \`${b.headSha}\` | ${b.nonMergeBranchOnlyCommits.length} | ${b.patchEquivalence.equivalentPatchCount} | ${b.patchEquivalence.uniquePatchCount} | stable patch ids present; all cherry patches equivalent |`);
          }
          md.push('');
          md.push(`## Post-01A integrated signal (${post01AIntegratedSignal.length})`);
          md.push('');
          md.push('These branches now look mechanically A-shaped but are **not classified in BRH-01B**; they remain explicit for BRH-01C reconciliation.');
          md.push('');
          for (const b of post01AIntegratedSignal) md.push(`- \`${b.name}\` @ \`${b.headSha}\``);
          md.push('');
          md.push(`## Unresolved after A/B (${unresolved.length})`);
          md.push('');
          md.push('Everything below remains unclassified by BRH-01B. BRH-01C owns the bounded unresolved register.');
          md.push('');
          md.push('| Branch | Head | Reason(s) |');
          md.push('| --- | --- | --- |');
          for (const b of unresolved) md.push(`| \`${b.name}\` | \`${b.headSha}\` | ${b.reasons.join(', ')} |`);
          md.push('');
          md.push('## Safety boundary');
          md.push('');
          md.push('- No remote branch was deleted, rewritten or salvaged.');
          md.push('- No C/D semantic supersession or value judgement is made here.');
          md.push('- A changed/new/open/active branch cannot become B in this packet.');
          md.push('- Deletion remains gated to BRH-04 after semantic gates where required.');
          md.push('');
          fs.writeFileSync('project/branch-hygiene-classification.md', md.join('\n'));
          fs.writeFileSync('/tmp/brh-01b-classification-sha.txt', digest + '\n');
          NODE

      - name: Upload BRH-01B proof
        uses: actions/upload-artifact@v4
        with:
          name: brh-01b-patch-equivalence-proof
          path: |
            /tmp/brh-01b-audit.json
            /tmp/brh-01b-open-prs.json
            /tmp/brh-01b-classification-sha.txt
            project/branch-hygiene-classification.json
            project/branch-hygiene-classification.md

      - name: Commit durable classification and remove temporary workflow
        run: |
          git config user.name "Adam Noden"
          git config user.email "107278274+adamnoden@users.noreply.github.com"
          git rm .github/workflows/brh-01b-classify.yml
          git add project/branch-hygiene-classification.json project/branch-hygiene-classification.md
          git commit -m "BRH-01B: classify patch-equivalent branches"
          git push origin HEAD:brh-01b-patch-equivalent
