name: Preserve verified Study lighting outputs
on:
  push:
    branches: [work/zerg-lighting-circuit-20261126]
    paths:
      - '.github/workflows/study-lighting-circuit-recovery.yml'
      - 'project/ias/studies/prove-lighting-circuit-recovery.mjs'
permissions:
  contents: read
jobs:
  preserve:
    if: github.repository == 'adamnoden/architecture' && github.ref == 'refs/heads/work/zerg-lighting-circuit-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact successful artifact and preserve only allowed Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node project/ias/studies/prove-lighting-circuit-recovery.mjs
      - name: Retain compact preserved-object map
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: study-lighting-preserved-map-${{ github.sha }}
          path: ${{ runner.temp }}/study-lighting-preservation/preservation-map.json
          if-no-files-found: error
          retention-days: 90
