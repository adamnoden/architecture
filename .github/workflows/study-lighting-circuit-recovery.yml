name: Prove recovered Study lighting and closed room

on:
  push:
    branches: [work/zerg-lighting-circuit-20261126]
    paths:
      - '.github/workflows/study-lighting-circuit-recovery.yml'
      - 'project/ias/studies/prove-lighting-circuit-recovery.mjs'
      - 'project/ias/studies/lighting-circuit-recovery-20261126.json'
      - 'compiler/reference-house/current-design/assemblies/study-*.ts'
      - 'compiler/reference-house/current-design-study-lighting*.test.ts'
      - 'project/ias/studies/study-*.py'
      - 'project/ias/studies/lighting-component-references.json'
      - 'project/ias/studies/adaptable-study-lighting.mjs'
      - 'project/ccr/studies/working-house-comparison.json'

permissions:
  contents: read

concurrency:
  group: study-lighting-circuit-recovery
  cancel-in-progress: true

jobs:
  prove:
    if: github.repository == 'adamnoden/architecture' && github.ref == 'refs/heads/work/zerg-lighting-circuit-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      IAS_RECOVERY_PROOF_DIR: ${{ runner.temp }}/study-lighting-recovery
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install the existing pinned runtime
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Regenerate and prove the exact recovered source
        run: node --import tsx project/ias/studies/prove-lighting-circuit-recovery.mjs
      - name: Retain actual outputs, diff and proof logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: study-lighting-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/study-lighting-recovery
          if-no-files-found: error
          retention-days: 90
