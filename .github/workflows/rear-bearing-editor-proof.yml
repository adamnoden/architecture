name: Prove saved rear bearing editor on the actual W31 house

on:
  push:
    branches: [work/rear-bearing-editor-proof-20261126]

permissions:
  contents: read

concurrency:
  group: rear-bearing-editor-exact
  cancel-in-progress: true

jobs:
  actual-rear-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - run: npm ci --no-audit --no-fund
      - name: Install existing pinned structural and finite numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Prepare only the explicitly reviewed source account and saved W31 browser workcopy
        run: |
          python - <<'PY'
          import copy,hashlib,json,os,runpy,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'project/str/studies')
          m=runpy.run_path('project/str/studies/rear_bearing_saved_proof.py')
          m['guard']()
          blob=m['blob'];node=m['node'];read=m['read']
          folder=Path(os.environ['RUNNER_TEMP'])/'rear-browser-proof';folder.mkdir(parents=True,exist_ok=True)
          account_path=Path('project/ccr/studies/source-coverage.json');document_path=Path('project/ccr/studies/working-house-comparison.json')
          old=read(account_path);original=read(document_path);canonical_sha=hashlib.sha256(document_path.read_bytes()).hexdigest()
          if blob(account_path.read_bytes())!='766942ba380d2c3a14d2d6dbe330d1b0ca9db8e6':raise ValueError('Reviewed baseline account changed')
          UI_BEFORE=json.loads("{\"compiler/reference-house/current-design/engineering-edit.ts\":\"c4df1791fa65a6abe6972a76dd6f632f63e0f8ff\",\"project/ade/browser-editor/engineering-api.ts\":\"e166de04fe6451d153f6e9af94e477a423c0ffcf\",\"project/ade/browser-editor/engineering-editor.ts\":\"998c0c39cce46a93204fa44b9e97ab96f209a4b6\",\"project/ade/browser-editor/engineering.html\":\"090a42cabecb11322204413d72889b747e7b4c8f\",\"compiler/reference-house/current-design-rear-bearing-edit.test.ts\":null,\"project/ade/browser-editor/engineering_browser_test.py\":\"c2cd6caee93eb311fedf6e4f532fdb084468f57d\"}")
          UI_AFTER=json.loads("{\"compiler/reference-house/current-design/engineering-edit.ts\":\"d7a32a35bee73cfa7ed6c91b999bc32d79669c93\",\"project/ade/browser-editor/engineering-api.ts\":\"48551d951f4fc1aa2c7b72d76ce9f9533e22a9e0\",\"project/ade/browser-editor/engineering-editor.ts\":\"75bfbc4f699cf3b917ef9101a012aa6df499033a\",\"project/ade/browser-editor/engineering.html\":\"b799c77baeacc1d1cdd2cdcd5ee9642286229999\",\"compiler/reference-house/current-design-rear-bearing-edit.test.ts\":\"6c476bf667bf1d8f28a1191e27366432c52df5a7\",\"project/ade/browser-editor/engineering_browser_test.py\":\"35b167dab0e0cb657253cbf7d59e974af13f418f\"}")
          owned={**m['OWNED'],**UI_BEFORE};review=[]
          account=copy.deepcopy(old);family=next(f for f in account['families'] if f['id']=='str-masonry-frame-comparison')
          additions={'authorRoots':m['AUTHORS'],'inputReceipts':[m['FIXTURE']],'consumers':list(dict.fromkeys(m['CONSUMERS']+['compiler/reference-house/current-design-rear-bearing-edit.test.ts','project/ade/browser-editor/engineering_browser_test.py','project/ade/browser-editor/engineering.html'])),'decisions':['project/str/rear-direct-bearing-comparison.md']}
          for role,paths in additions.items():
              for path in paths:
                  if path not in family[role]:family[role].append(path)
          for path,expected in owned.items():
              if old['gitBlobs'].get(path)!=expected:raise ValueError('Unreviewed previous identity: '+path)
              actual=blob(Path(path).read_bytes())
              if path in UI_AFTER and actual!=UI_AFTER[path]:raise ValueError('Protected UI source changed: '+path)
              account['gitBlobs'][path]=actual;review.append({'path':path,'before':expected,'after':actual})
          if account['receiptEdges']!=old['receiptEdges'] or any(account['gitBlobs'].get(p)!=v for p,v in old['gitBlobs'].items() if p not in owned):raise ValueError('Unowned or historical source identity changed')
          account_path.write_text(json.dumps(account,indent=2)+'\n')
          audit=node("import{auditSourceCoverage}from'./project/ccr/studies/source-coverage.ts';console.log(JSON.stringify(auditSourceCoverage()))")
          if audit['findings']:raise ValueError(json.dumps(audit['findings']))
          bindings=node("import{readFileSync}from'node:fs';import{readEngineeringDocument}from'./compiler/reference-house/current-design/engineering-document.ts';const d=JSON.parse(readFileSync(process.argv[1],'utf8'));console.log(JSON.stringify((await readEngineeringDocument(d.design)).bindings))",document_path)
          allowed={'str-masonry-frame-comparison','str-finite-joint-development','mat-roof-pitch-reference','had-fixed-inlet-arrangement','ias-study-lighting','ias-study-room-perspective'}
          changes=[]
          for category in ('disciplines','implementations','authoredDefaults'):
              before=original['bindings'][category];after=bindings[category]
              for key in sorted(set(before)|set(after)):
                  if before.get(key)!=after.get(key):
                      if category=='authoredDefaults' or (category=='disciplines' and key not in allowed) or (category=='implementations' and key not in set(owned)|{str(account_path)}):raise ValueError('Unreviewed binding '+category+'/'+key)
                      changes.append({'category':category,'path':key,'before':before.get(key),'after':after.get(key)})
          from rear_bearing_plan import choices_defaults
          case=copy.deepcopy(original);case['bindings']=bindings
          if case['stages']['distributedFloor']['boundaryCase']['windIndex']!=31:raise ValueError('Actual W31 parent required')
          if case['stages']['floorSection']['finiteJointComparison']['enabled'] is not True:raise ValueError('Explicit enabled finite house required')
          case['stages']['floorSection']['finiteJointComparison']['execution']='deferred'
          case['stages']['floorSection']['rearBearingComparison']={**choices_defaults(),'execution':'deferred'}
          unchanged=copy.deepcopy(case);unchanged['bindings']=original['bindings'];del unchanged['stages']['floorSection']['rearBearingComparison']
          unchanged['stages']['floorSection']['finiteJointComparison']['execution']=original['stages']['floorSection']['finiteJointComparison']['execution']
          if unchanged!=original:raise ValueError('Unexpected authored house change')
          (folder/'rear-browser-document.json').write_text(json.dumps(case,indent=2)+'\n')
          (folder/'source-account-workcopy.json').write_text(json.dumps(account,indent=2)+'\n')
          review={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'canonicalDocumentSHA256':canonical_sha,'sourceAccountBefore':'766942ba380d2c3a14d2d6dbe330d1b0ca9db8e6','reviewedChanges':review,'familyResourceAdditions':additions,'bindingChanges':changes,'allOtherHashesAndReceiptEdgesUnchanged':True,'strictAuditFindings':0,'candidateAccepted':False}
          (folder/'source-and-binding-review.json').write_text(json.dumps(review,indent=2)+'\n')
          print('PASS strict owned19 workcopy/source audit0, existing bindings refreshed, actual W31 rear deferred case only',flush=True)
          PY
      - name: Check types and actual atomic editing controls
        run: |
          npm run typecheck > "$RUNNER_TEMP/rear-browser-proof/typecheck.log" 2>&1
          node --import tsx --test compiler/reference-house/current-design-rear-bearing-edit.test.ts > "$RUNNER_TEMP/rear-browser-proof/atomic-edit-tests.log" 2>&1
      - name: Install the existing pinned real browser runtime
        run: |
          python -m venv "$RUNNER_TEMP/ade-browser-proof"
          "$RUNNER_TEMP/ade-browser-proof/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/ade-browser-proof/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Prove actual rear opening edit, current reference52heads, ordinary CLI and exact undo
        run: |
          node node_modules/vite/bin/vite.js build --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/rear-editor-dist" > "$RUNNER_TEMP/rear-browser-proof/build.log" 2>&1
          node node_modules/vite/bin/vite.js preview --config project/ade/browser-editor/vite.config.ts --outDir "$RUNNER_TEMP/rear-editor-dist" --host 127.0.0.1 --port 4187 --strictPort > "$RUNNER_TEMP/rear-browser-proof/server.log" 2>&1 &
          REAR_EDITOR_PID=$!
          trap 'kill "$REAR_EDITOR_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4187/engineering.html',timeout=2)
                  break
              except OSError:
                  if attempt==59:raise
                  time.sleep(1)
          PY
          "$RUNNER_TEMP/ade-browser-proof/bin/python" project/ade/browser-editor/engineering_browser_test.py --rear-bearing-document "$RUNNER_TEMP/rear-browser-proof/rear-browser-document.json" --screenshot "$RUNNER_TEMP/rear-browser-proof/rear-editor.png" > "$RUNNER_TEMP/rear-browser-proof/browser.log" 2>&1
      - name: Confirm the canonical input and all tracked source blobs remained protected
        if: success()
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'rear-browser-proof';review=json.loads((folder/'source-and-binding-review.json').read_text())
          canonical=Path('project/ccr/studies/working-house-comparison.json')
          assert hashlib.sha256(canonical.read_bytes()).hexdigest()==review['canonicalDocumentSHA256']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed==['project/ccr/studies/source-coverage.json'],changed
          print('PASS canonical and all tracked source blobs protected; only reviewed disposable source-account workcopy differs',flush=True)
          PY
      - name: Show bounded failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'rear-browser-proof'
          for p in sorted(folder.glob('*.log')):
              print('REAR_EDITOR_FAILURE_LOG '+p.name,flush=True)
              print(p.read_text(errors='replace')[-25000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rear-bearing-editor-${{ github.sha }}
          path: ${{ runner.temp }}/rear-browser-proof/
          if-no-files-found: error
          retention-days: 90
