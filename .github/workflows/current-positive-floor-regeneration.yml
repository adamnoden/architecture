name: Regenerate actual eleven floor controls, cage and vertical profile

on:
  push:
    branches: [work/current-positive-source-regeneration-20261126]
    paths:
      - '.github/workflows/current-positive-floor-regeneration.yml'

permissions:
  contents: read

concurrency:
  group: current-positive-floor-regeneration-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  floor-eleven-cage-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          echo "REGEN_DIR=$RUNNER_TEMP/current-positive-source-evidence" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/project/str/studies" >> "$GITHUB_ENV"
      - name: Protect exact production sources and record actual native58 identities
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          expected={"project/str/studies/distributed_floor_compatibility.py":"7a8eb302813e8a509a1fac16ee29e7359d2c0bf9","project/str/studies/perforated_floor_condensation.py":"fbdea8993c4c00d863f2105c0a83f6ac0bf78c03","project/str/studies/current_zero_chord_control.py":"abff63ca41c5bfa01082a3443ed0900412e893f4","project/str/studies/current_zero_chord_control_test.py":"d09edced886fe556f4e0768def8a29301fb847f8"}
          def sha(data):return hashlib.sha256(data).hexdigest()
          for name,digest in expected.items():
           data=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           if actual!=digest:raise ValueError('Unreviewed source blob: '+name)
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          identities=load_source(Path('.'))['identities']
          if len(identities)!=58:raise ValueError('Exact current58-source native inventory required')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          snapshot={name:sha(Path(name).read_bytes()) for name in files}
          (folder/'source-before.json').write_text(json.dumps({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'exactProductionBlobs':expected,'native58SHA256':identities,'trackedSHA256':snapshot,'currentSavedEngineeringDocumentAdmitted':False},indent=2)+'\n')
          for name in ["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/wet-support-cage-comparison-proof.json","project/had/studies/house-vertical-profile.results.json","project/had/studies/house-vertical-profile.svg"]:
           p=Path(name)
           if p.exists():
            q=folder/'before'/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
          print('PASS exact four protected blobs and actual58-source inventory; canonical/account untouched',flush=True)
          PY
      - name: Require exact observed current-source upper parent bytes
        run: |
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'project/str/studies/upper-roof-bearing-proof.json':('89d75d165bf3b5615ee26898a709faf8d1d7f415','eae66e5a9a5f55271e37ac9e9aaa950ea51a590f6ca210061c5d941085ce4b28'),'project/str/studies/upper-roof-bearing.svg':('0c0ceb017c21ff713f7d9dfb879062c30d97b534','a83fc9d7ed7ac6f3e5759b8e056a3e131378930ceec7a5ffc6e660bcbb77f401')}
          for name,(blob,sha) in expected.items():
           data=Path(name).read_bytes()
           if hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()!=blob or hashlib.sha256(data).hexdigest()!=sha:raise ValueError('Fresh observed upper producer bytes changed: '+name)
          print('PASS exact observed successful six-state upper proof and SVG are installed',flush=True)
          PY
      - name: Execute all actual eleven source-bound floor states
        run: |
          python -B project/str/studies/floor_section_proof.py --write > "$REGEN_DIR/floor-eleven.log" 2>&1
          python -B - <<'PY'
          import os
          from pathlib import Path
          text=(Path(os.environ['REGEN_DIR'])/'floor-eleven.log').read_text()
          if text.count('executed-new-full-capture')!=11 or 'reused-verified-full-capture' in text:raise ValueError('Exactly eleven genuinely fresh full native solves required')
          print('PASS actual eleven newly executed floor captures, no old result reuse',flush=True)
          PY
          python -B project/str/studies/floor_section_proof.py --check > "$REGEN_DIR/floor-proof-check.log" 2>&1
          python -B project/str/studies/floor_section_capture_test.py > "$REGEN_DIR/floor-capture-controls.log" 2>&1
      - name: Regenerate exact-case cage projections from the actual fresh eleven full captures
        run: |
          python -B project/str/studies/wet_support_cage_comparison_proof.py --write --captures-root /tmp/ovid-seated-wet-controls > "$REGEN_DIR/cage-regeneration.log" 2>&1
          python -B project/str/studies/wet_support_cage_comparison_proof.py --check > "$REGEN_DIR/cage-parent-check.log" 2>&1
          python -B project/str/studies/wet_support_cage_comparison_proof.py --check-captures --captures-root /tmp/ovid-seated-wet-controls > "$REGEN_DIR/cage-full-capture-check.log" 2>&1
          python -B project/str/studies/wet_support_cage_comparison_test.py > "$REGEN_DIR/cage-geometry-controls.log" 2>&1
          python -B project/str/studies/wet_support_cage_comparison_proof_test.py > "$REGEN_DIR/cage-binding-controls.log" 2>&1
      - name: Regenerate the source-bound unselected common geometry profile and existing perturbations
        run: |
          python -B project/had/studies/house_vertical_profile.py --write > "$REGEN_DIR/profile-regeneration.log" 2>&1
          python -B project/had/studies/house_vertical_profile.py --check > "$REGEN_DIR/profile-check.log" 2>&1
          python -B -m unittest discover -s project/had/studies -p house_vertical_profile_test.py > "$REGEN_DIR/profile-controls.log" 2>&1
      - name: Preserve complete eleven-case full native request and capture bytes
        run: |
          python -B - > "$REGEN_DIR/floor-full-capture-retention.log" 2>&1 <<'PY'
          import hashlib,json,os,tarfile,sys
          from pathlib import Path
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          from floor_section_proof import cases,capture
          from wet_support_cage_comparison_proof import capture_relative_directory
          folder=Path(os.environ['REGEN_DIR']);source=load_source(Path('.'))
          proof_path=Path('project/str/studies/floor-section-proof.json');proof=json.loads(proof_path.read_text())
          controls=cases(source)
          if len(controls)!=11 or proof['sourceSHA256']!=source['identities']:raise ValueError('Exact eleven current actual floor controls required')
          members={};paths=[]
          for name,request in controls:
           relative=capture_relative_directory(source,name,request)
           directory=Path('/tmp/ovid-seated-wet-controls')/relative
           request_path=directory/'request.json';full=directory/'result.full.json';manifest=directory/'capture.json'
           capture(name,request_path,full,manifest,verify=True)
           if hashlib.sha256(full.read_bytes()).hexdigest()!=proof['fullResultCaptureSHA256ByCase'][name]:raise ValueError('Complete actual floor capture differs from fresh eleven-case proof')
           for q in (request_path,full,manifest):
            target=str(relative/q.name)
            members[target]={'bytes':q.stat().st_size,'sha256':hashlib.sha256(q.read_bytes()).hexdigest()}
            paths.append((q,target))
          manifest_path=folder/'floor-eleven-native-capture-manifest.json'
          manifest_path.write_text(json.dumps({'schema':'str-current-positive-floor-full-captures/1','sourceCommit':json.loads((folder/'source-before.json').read_text())['sourceCommit'],'sourceSHA256':source['identities'],'proofSHA256':hashlib.sha256(proof_path.read_bytes()).hexdigest(),'completeVerifiedControlCount':11,'existingCaptureAddressingRetained':True,'files':members,'candidateAccepted':False},indent=2)+'\n')
          archive=folder/'floor-eleven-actual-full-captures.tar.gz'
          with tarfile.open(archive,'w:gz',compresslevel=1) as tar:
           for q,target in paths:tar.add(q,arcname=target)
           tar.add(manifest_path,arcname=manifest_path.name)
          print('PASS11 verified actual native request/full/manifest controls archived; bytes='+str(archive.stat().st_size)+' sha256='+hashlib.sha256(archive.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Protect all source bytes and retain actual outputs
        run: |
          python -B - <<'PY'
          import hashlib,json,os,shutil,subprocess,sys
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);before=json.loads((folder/'source-before.json').read_text())
          allow=["project/str/studies/floor-section-proof.json","project/str/studies/floor-section-250.svg","project/str/studies/seated-wet-support-floor.svg","project/str/studies/wet-support-cage-comparison-proof.json","project/had/studies/house-vertical-profile.results.json","project/had/studies/house-vertical-profile.svg"]
          sha=lambda data:hashlib.sha256(data).hexdigest()
          actual={name:sha(Path(name).read_bytes()) for name in before['trackedSHA256']}
          changed=[name for name,value in actual.items() if value!=before['trackedSHA256'][name]]
          if set(changed)-set(allow):raise ValueError('Unexpected tracked source/request change: '+str(changed))
          sys.path.insert(0,'project/str/studies')
          from floor_section_model import load_source
          if load_source(Path('.'))['identities']!=before['native58SHA256']:raise ValueError('Actual native58 source changed during proof')
          outputs={}
          for name in allow:
           p=Path(name)
           if not p.is_file():raise ValueError('Missing actual generated output: '+name)
           q=folder/'generated'/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
           outputs[name]={'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())}
           if p.suffix=='.json':
            value=json.loads(p.read_text())
            def verify_sources(node):
             if isinstance(node,dict):
              sources=node.get('sourceSHA256')
              if isinstance(sources,dict):
               for path,identity in sources.items():
                if not Path(path).is_file() or sha(Path(path).read_bytes())!=identity:raise ValueError('Generated result contains stale native source: '+path)
              for child in node.values():verify_sources(child)
             elif isinstance(node,list):
              for child in node:verify_sources(child)
            verify_sources(value)
            key={'floor-section-proof.json':None}.get(p.name)
            if key:
             previous=json.loads((folder/'before'/p).read_text())
             def authored(node):
              if isinstance(node,dict):return{k:authored(v) for k,v in node.items() if k!='sourceSHA256'}
              if isinstance(node,list):return[authored(v) for v in node]
              return node
             if authored(previous[key])!=authored(value[key]):raise ValueError('Positive reference authored inputs changed: '+key)
             outputs[name]['authoredInputsUnchangedExceptFreshIdentities']=True
            previous=json.loads((folder/'before'/p).read_text())
            def without_identities(node):
             if isinstance(node,dict):return{k:without_identities(v) for k,v in node.items() if k!='sourceSHA256'}
             if isinstance(node,list):return[without_identities(v) for v in node]
             return node
            for catalogue in ('cases','controls'):
             rows=value.get(catalogue)
             if not isinstance(rows,list):continue
             before_rows=previous.get(catalogue)
             if not isinstance(before_rows,list) or len(rows)!=len(before_rows):raise ValueError('Changed authored control count: '+catalogue)
             for old_row,new_row in zip(before_rows,rows):
              if old_row.get('caseId')!=new_row.get('caseId'):raise ValueError('Changed actual control ID')
              for request_key in ('executedRequest','request'):
               if request_key in old_row or request_key in new_row:
                if request_key not in old_row or request_key not in new_row or without_identities(old_row[request_key])!=without_identities(new_row[request_key]):raise ValueError('Authored parent comparison changed beyond fresh identities')
            outputs[name]['allAuthoredControlInputsUnchangedExceptFreshIdentities']=True
          (folder/'source-after.json').write_text(json.dumps({'sourceCommit':before['sourceCommit'],'changedTrackedPaths':changed,'allowedGeneratedPaths':allow,'outputs':outputs,'native58UnchangedDuringExecution':True,'allOtherTrackedSourcesUnchanged':True,'accountAndCanonicalUnchanged':True,'candidateAccepted':False},indent=2)+'\n')
          print('PASS generated outputs only; all native methods, requests, source account and canonical input protected',flush=True)
          PY
      - name: Preserve any actual incomplete floor-worker bytes without promoting evidence
        if: failure()
        run: |
          python -B - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR']);folder.mkdir(parents=True,exist_ok=True)
          before=folder/'source-before.json'
          if before.is_file():
           sources=json.loads(before.read_text())['native58SHA256']
           identifier=hashlib.sha256(json.dumps(sources,sort_keys=True).encode()).hexdigest()
           cache=Path('/tmp/ovid-seated-wet-controls')/identifier
           if cache.is_dir():
            records={str(q.relative_to(cache)):{'bytes':q.stat().st_size,'sha256':hashlib.sha256(q.read_bytes()).hexdigest()} for q in cache.rglob('*') if q.is_file()}
            manifest=folder/'failed-floor-worker-inventory.json'
            manifest.write_text(json.dumps({'sourceSHA256':sources,'completeProofAvailable':False,'retainedUnverifiedWorkerBytes':True,'files':records,'candidateAccepted':False},indent=2)+'\n')
            with tarfile.open(folder/'failed-floor-worker-bytes.tar.gz','w:gz',compresslevel=1) as archive:
             archive.add(cache,arcname='unverified-worker-bytes')
             archive.add(manifest,arcname=manifest.name)
          PY
      - name: Show actual bounded logs
        if: always()
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['REGEN_DIR'])
          for p in sorted(folder.glob('*.log')):
              print('CURRENT_POSITIVE_REGEN_LOG '+p.name,flush=True)
              print(p.read_text(errors='replace')[-30000:],flush=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-positive-floor-eleven-${{ github.sha }}
          path: ${{ runner.temp }}/current-positive-source-evidence/
          if-no-files-found: error
          retention-days: 90


