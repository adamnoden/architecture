name: BRH-00C completeness verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Refresh remote refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Verify BRH-00B snapshot completeness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKET_BRANCH: ${{ github.head_ref }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const cp = require('node:child_process')

          const ledger = JSON.parse(fs.readFileSync('project/branch-hygiene-ledger.json', 'utf8'))
          const git = (...args) => cp.execFileSync('git', args, { encoding: 'utf8' }).trim()
          const lines = git('for-each-ref', '--format=%(refname) %(objectname)', 'refs/remotes/origin/').split('\n').filter(Boolean)
          const prefix = 'refs/remotes/origin/'
          const current = lines
            .map(line => {
              const space = line.indexOf(' ')
              const ref = line.slice(0, space)
              const headSha = line.slice(space + 1)
              if (!ref.startsWith(prefix)) throw new Error(`unexpected remote ref ${ref}`)
              return { ref, name: ref.slice(prefix.length), headSha }
            })
            .filter(x => x.name !== 'HEAD' && x.name !== 'main')
            .sort((a, b) => a.name.localeCompare(b.name))

          const duplicateNames = arr => [...new Set(arr.filter((x, i) => arr.indexOf(x) !== i))].sort()
          const ledgerEnum = ledger.enumeration.branches
          const ledgerAudited = ledger.auditedBranches
          const ledgerEnumDuplicates = duplicateNames(ledgerEnum.map(x => x.name))
          const ledgerAuditDuplicates = duplicateNames(ledgerAudited.map(x => x.name))
          const currentDuplicates = duplicateNames(current.map(x => x.name))
          const enumMap = new Map(ledgerEnum.map(x => [x.name, x]))
          const auditMap = new Map(ledgerAudited.map(x => [x.name, x]))
          const currentMap = new Map(current.map(x => [x.name, x]))

          const enumOnly = [...enumMap.keys()].filter(name => !auditMap.has(name)).sort()
          const auditOnly = [...auditMap.keys()].filter(name => !enumMap.has(name)).sort()
          const snapshotMissingNow = [...enumMap.keys()].filter(name => !currentMap.has(name)).sort()
          const newSinceSnapshot = [...currentMap.keys()].filter(name => !enumMap.has(name)).sort()
          const changedHeads = [...enumMap.keys()]
            .filter(name => currentMap.has(name) && currentMap.get(name).headSha !== enumMap.get(name).headSha)
            .map(name => ({ name, inventoriedHeadSha: enumMap.get(name).headSha, currentHeadSha: currentMap.get(name).headSha }))
            .sort((a, b) => a.name.localeCompare(b.name))
          const unchangedSnapshotBranches = [...enumMap.keys()].filter(name => currentMap.has(name) && currentMap.get(name).headSha === enumMap.get(name).headSha).sort()

          const integratedSignal = ledgerAudited
            .filter(b => b.headIsAncestorOfMain && b.branchOnlyCommits.length === 0)
            .map(b => b.name).sort()
          const patchEquivalentSignal = ledgerAudited
            .filter(b => !b.headIsAncestorOfMain && b.patchEquivalence.uniquePatchCount === 0 && b.patchEquivalence.equivalentPatchCount > 0 && b.patchEquivalence.allCherryPatchesEquivalent)
            .map(b => b.name).sort()
          const uniquePatchSignal = ledgerAudited
            .filter(b => b.patchEquivalence.uniquePatchCount > 0)
            .map(b => b.name).sort()
          const mechanicallyUnbucketed = ledgerAudited
            .filter(b => !integratedSignal.includes(b.name) && !patchEquivalentSignal.includes(b.name) && !uniquePatchSignal.includes(b.name))
            .map(b => b.name).sort()

          const provisionalX = [...new Set([
            ...newSinceSnapshot,
            ...changedHeads.map(x => x.name)
          ])].sort()

          const currentMainSha = git('rev-parse', 'origin/main')
          const currentDigestInput = current.map(x => `${x.name}\t${x.headSha}`).join('\n') + '\n'
          const currentEnumerationSha256 = crypto.createHash('sha256').update(currentDigestInput).digest('hex')

          async function openPulls() {
            const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls?state=open&per_page=100`
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            })
            if (!response.ok) throw new Error(`GitHub open-PR lookup failed: ${response.status}`)
            return response.json()
          }

          ;(async () => {
            const pulls = await openPulls()
            const openPrAssociations = pulls.map(pr => ({
              number: pr.number,
              headBranch: pr.head.ref,
              headSha: pr.head.sha,
              draft: pr.draft,
              url: pr.html_url,
              branchPresent: currentMap.has(pr.head.ref),
              branchHeadMatches: currentMap.has(pr.head.ref) && currentMap.get(pr.head.ref).headSha === pr.head.sha
            })).sort((a, b) => a.number - b.number)

            const snapshotOpenPrAssociations = ledgerAudited.flatMap(b => b.pullRequests
              .filter(pr => pr.state === 'open')
              .map(pr => ({ branch: b.name, number: pr.number, snapshotHeadSha: pr.headSha })))

            const errors = []
            if (ledger.enumeration.branchCount !== ledgerEnum.length) errors.push('ledger enumeration count does not equal enumeration rows')
            if (ledger.auditedBranchCount !== ledgerAudited.length) errors.push('ledger audited count does not equal audited rows')
            if (ledgerEnumDuplicates.length) errors.push(`duplicate ledger enumeration names: ${ledgerEnumDuplicates.join(', ')}`)
            if (ledgerAuditDuplicates.length) errors.push(`duplicate ledger audited names: ${ledgerAuditDuplicates.join(', ')}`)
            if (currentDuplicates.length) errors.push(`duplicate current remote names: ${currentDuplicates.join(', ')}`)
            if (enumOnly.length || auditOnly.length) errors.push(`ledger enumeration/audit mismatch: enumOnly=${enumOnly.length} auditOnly=${auditOnly.length}`)
            if (snapshotMissingNow.length) errors.push(`snapshot branches missing now: ${snapshotMissingNow.join(', ')}`)
            const badOpenPr = openPrAssociations.filter(x => !x.branchPresent || !x.branchHeadMatches)
            if (badOpenPr.length) errors.push(`open PR association mismatch: ${badOpenPr.map(x => `#${x.number}:${x.headBranch}`).join(', ')}`)
            if (integratedSignal.length + patchEquivalentSignal.length + uniquePatchSignal.length + mechanicallyUnbucketed.length !== ledgerAudited.length) errors.push('raw BRH-01 candidate partition does not cover every audited branch exactly once')

            const report = {
              schemaVersion: 1,
              packet: 'BRH-00C',
              generatedAt: new Date().toISOString(),
              repository: process.env.GITHUB_REPOSITORY,
              packetBranch: process.env.PACKET_BRANCH,
              snapshot: {
                baselineMainSha: ledger.mainSha,
                enumeratedBranchCount: ledger.enumeration.branchCount,
                enumerationSha256: ledger.enumeration.sha256
              },
              verificationBaseline: {
                currentMainSha,
                currentNonMainBranchCount: current.length,
                currentEnumerationSha256
              },
              coherence: {
                ledgerEnumerationRows: ledgerEnum.length,
                ledgerAuditedRows: ledgerAudited.length,
                ledgerEnumerationDuplicates: ledgerEnumDuplicates,
                ledgerAuditDuplicates,
                currentDuplicates,
                enumOnly,
                auditOnly
              },
              drift: {
                unchangedSnapshotBranchCount: unchangedSnapshotBranches.length,
                snapshotMissingNow,
                newSinceSnapshot,
                changedHeads,
                provisionalX
              },
              pullRequests: {
                currentOpenPrCount: openPrAssociations.length,
                currentOpenPrAssociations: openPrAssociations,
                snapshotOpenPrAssociations
              },
              brh01RawCandidateSet: {
                integratedSignal,
                patchEquivalentSignal,
                uniquePatchSignal,
                mechanicallyUnbucketed,
                provisionalX,
                note: 'These are BRH-00C mechanical inputs only, not final A/B/C/D/X classifications. BRH-01 must recompute against its then-current main before assigning A/B candidates.'
              },
              noDeletionProof: {
                snapshotBranchCount: ledgerEnum.length,
                snapshotBranchesStillPresent: ledgerEnum.length - snapshotMissingNow.length,
                missingSnapshotBranches: snapshotMissingNow,
                passed: snapshotMissingNow.length === 0
              },
              passed: errors.length === 0,
              errors
            }

            fs.writeFileSync('project/branch-hygiene-completeness-verification.json', JSON.stringify(report, null, 2) + '\n')

            const list = xs => xs.length ? xs.map(x => `- \`${typeof x === 'string' ? x : x.name}\``).join('\n') : '- none'
            const md = `# BRH-00C inventory completeness verification\n\n` +
              `Independent verification of the committed BRH-00B snapshot. This record performs no branch deletion and no semantic salvage. Mechanical signal buckets below are inputs to BRH-01, not final branch classes.\n\n` +
              `## Result\n\n` +
              `- verification: **${report.passed ? 'PASS' : 'FAIL'}**\n` +
              `- BRH-00B snapshot baseline: \`${ledger.mainSha}\`\n` +
              `- verification baseline main: \`${currentMainSha}\`\n` +
              `- snapshot branches: **${ledgerEnum.length}**\n` +
              `- current non-main branches: **${current.length}**\n` +
              `- unchanged snapshot heads: **${unchangedSnapshotBranches.length}**\n` +
              `- missing snapshot branches: **${snapshotMissingNow.length}**\n` +
              `- new since snapshot: **${newSinceSnapshot.length}**\n` +
              `- changed snapshot heads: **${changedHeads.length}**\n` +
              `- current open PRs: **${openPrAssociations.length}**\n` +
              `- current enumeration SHA-256: \`${currentEnumerationSha256}\`\n\n` +
              `## Post-snapshot X inputs\n\n${list(provisionalX)}\n\n` +
              `These refs were created or changed after the 00B snapshot and are therefore retained as provisional X inputs until a later packet re-audits them. The packet branch itself is expected to appear here while BRH-00C is active.\n\n` +
              `## Raw BRH-01 candidate set\n\n` +
              `### Ancestral / no-branch-only signal (${integratedSignal.length})\n\n${list(integratedSignal)}\n\n` +
              `### Patch-equivalent signal (${patchEquivalentSignal.length})\n\n${list(patchEquivalentSignal)}\n\n` +
              `### Unique-patch signal (${uniquePatchSignal.length})\n\n${list(uniquePatchSignal)}\n\n` +
              `### Mechanically unbucketed (${mechanicallyUnbucketed.length})\n\n${list(mechanicallyUnbucketed)}\n\n` +
              `## Open PR associations\n\n` +
              (openPrAssociations.length ? openPrAssociations.map(x => `- #${x.number} — \`${x.headBranch}\` @ \`${x.headSha}\`; branch present=${x.branchPresent}; head matches=${x.branchHeadMatches}`).join('\n') : '- none') + '\n\n' +
              `## No-deletion proof\n\nAll **${ledgerEnum.length - snapshotMissingNow.length}/${ledgerEnum.length}** branches recorded by BRH-00B are still present. No BRH-00 snapshot ref has disappeared.\n\n` +
              `## Gate errors\n\n${errors.length ? errors.map(x => `- ${x}`).join('\n') : '- none'}\n`
            fs.writeFileSync('project/branch-hygiene-completeness-verification.md', md)

            console.log(JSON.stringify({
              passed: report.passed,
              snapshotCount: ledgerEnum.length,
              currentCount: current.length,
              missingSnapshotBranches: snapshotMissingNow,
              newSinceSnapshot,
              changedHeads,
              provisionalX,
              openPrAssociations,
              rawCandidateCounts: {
                integratedSignal: integratedSignal.length,
                patchEquivalentSignal: patchEquivalentSignal.length,
                uniquePatchSignal: uniquePatchSignal.length,
                mechanicallyUnbucketed: mechanicallyUnbucketed.length
              },
              errors
            }, null, 2))

            if (!report.passed) process.exitCode = 1
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: Upload completeness proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brh-00c-completeness-proof
          path: |
            project/branch-hygiene-completeness-verification.json
            project/branch-hygiene-completeness-verification.md
          retention-days: 30

      - name: Commit durable verification and remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/branch-hygiene-completeness-verification.json project/branch-hygiene-completeness-verification.md
          git rm .github/workflows/brh-00c-verify.yml
          git commit -m 'BRH-00C: record inventory completeness verification'
          git push origin HEAD:${{ github.head_ref }}
