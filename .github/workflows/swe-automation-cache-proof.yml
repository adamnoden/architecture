name: Temporary SWE installed dependency cache measurement
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/control-runtime/**'
      - '.github/workflows/swe-automation-cache-proof.yml'
permissions:
  contents: read
concurrency:
  group: swe-cache-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cold installed dependency cache
        id: runtime
        uses: ./.github/actions/control-runtime
      - name: Verify actual control runtime
        env:
          CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
        run: |
          echo "Exact installed cache hit: $CACHE_HIT"
          node --import tsx -e "import('./project/control/nodes/index.ts').then(m => console.log('Canonical nodes loaded:', m.controlNodes.length))"
  warm:
    needs: cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Warm installed dependency cache
        id: runtime
        uses: ./.github/actions/control-runtime
      - name: Verify restored runtime and exact cache hit
        env:
          CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          node --import tsx -e "import('./project/control/nodes/index.ts').then(m => console.log('Canonical nodes loaded:', m.controlNodes.length))"
