name: Refresh actual compiler witnesses and prove complete repository health
on:
  push:
    branches: [work/zerg-finite-editor-diagnostic-20261126]
permissions:
  contents: write
jobs:
  actual-witness-regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Keep the fixed proof driver and check out the exact submitted source
        run: |
          cp project/ccr/studies/zerg-current-projection-recovery.py "$RUNNER_TEMP/current-projection-recovery.py"
          cp project/str/studies/continuous_rc_cage_proof.py "$RUNNER_TEMP/updated-cage-proof.py"
          git fetch --no-tags origin b1987fb72769f5b6f5f877e801679c3ca9bc53cd
          git switch --detach b1987fb72769f5b6f5f877e801679c3ca9bc53cd
          cp "$RUNNER_TEMP/updated-cage-proof.py" project/str/studies/continuous_rc_cage_proof.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/str/studies/*requirements.txt
      - name: Install the existing pinned numerical runtime
        run: |
          python -m pip install -r project/str/studies/cage-requirements.txt -r project/str/studies/vertical-floor-requirements.txt
          python -m venv --system-site-packages "$RUNNER_TEMP/finite-runtime"
          "$RUNNER_TEMP/finite-runtime/bin/python" -m pip install --no-deps --require-hashes -r project/str/studies/finite-joint-solid-requirements.txt
          echo "STR_FINITE_SOLID_PYTHON=$RUNNER_TEMP/finite-runtime/bin/python" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate owning witnesses, run complete health, preserve only verified original output blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B "$RUNNER_TEMP/current-projection-recovery.py"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: current-projection-full-health
          path: ${{ runner.temp }}/projection-review
          if-no-files-found: error
          retention-days: 90
