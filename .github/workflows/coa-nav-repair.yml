name: COA navigation repair

on:
  push:
    branches:
      - coa-00-output-audit-final

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: coa-00-output-audit-final
      - name: Add missing curated navigation entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.vitepress/navigation.ts')
          s = p.read_text()
          manuscript = "      page('PR-00 candidate-book ledger', '/docs/manuscript/pr00-candidate-book-ledger')"
          manuscript_replacement = manuscript + ",\n      page('PR-00C authority / claim / evidence reconciliation', '/docs/manuscript/pr00c-authority-claim-evidence-reconciliation')"
          computational = "    page('Compiler hardening programme', '/docs/computational/compiler-hardening-programme')"
          computational_replacement = computational + ",\n    page('Compiler output architecture programme', '/docs/computational/compiler-output-architecture-programme')"
          if manuscript_replacement not in s:
              if manuscript not in s:
                  raise SystemExit('manuscript navigation anchor not found')
              s = s.replace(manuscript, manuscript_replacement, 1)
          if computational_replacement not in s:
              if computational not in s:
                  raise SystemExit('computational navigation anchor not found')
              s = s.replace(computational, computational_replacement, 1)
          p.write_text(s)
          PY
          rm .github/workflows/coa-nav-repair.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vitepress/navigation.ts .github/workflows/coa-nav-repair.yml
          git commit -m "COA-00 restore curated navigation coverage"
          git push origin HEAD:coa-00-output-audit-final
