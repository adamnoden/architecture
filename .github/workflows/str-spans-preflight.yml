name: STR spans publication preflight (temporary)
on:
  push:
    branches: [work/str-spans-20261030]
    paths: ['.github/workflows/str-spans-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/str-spans-20261030
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fresh canonical publication preflight on current branch
        run: |
          node --import tsx scripts/project-claims.ts merge-check STR-SPANS --transport connector --lease-id 092799c9-0392-4774-8f00-8d77440fa2f3 --generation 1 --branch work/str-spans-20261030 --head "$(git rev-parse HEAD)" --format text
