name: Prove DRW ground-plan plate

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication/specimens/drw03f/**'
      - 'docs/reference-house/publication-ground-floor-plan.svg'
      - 'compiler/reference-house/publication-ground-plan*.ts'
      - 'compiler/reference-house/generate-publication-ground-plan.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/drw-ground-plan-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drw-ground-plan-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate A4/B5 ground-plan plate
        run: npm run drw:03f:proof

      - name: Upload ground-plan proof PDFs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drw-03f-ground-plan-proof
          path: |
            publication/specimens/drw03f/dist/drw03f-a4.pdf
            publication/specimens/drw03f/dist/drw03f-b5.pdf
          if-no-files-found: error
          retention-days: 30
