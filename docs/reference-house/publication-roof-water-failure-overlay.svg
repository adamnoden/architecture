<title id="title">Reference House roof water and failure reading</title>
<desc id="desc">Removable analytical overlay on the controlled DRW-07 roof/drainage plan. External collection and overflow failure are read as inspectable, visible and outward; courtyard primary collection and independent emergency overflow remain distinct. Analytical notation does not assert gutter profiles, RWP coordinates, drain centrelines, overflow levels or hydraulic sizing.</desc>
