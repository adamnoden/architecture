<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-C0 current first-floor visual comparator</title>
  <desc id="desc">Static planning-level projection of the RH-C0 upper-floor baseline. The baseline document controls; this SVG is a visual comparator only and is not source geometry.</desc>
  <style>
    .bg{fill:#fbfaf7}.outer{fill:#fff;stroke:#171717;stroke-width:3}.room{fill:#f4f3ef;stroke:#555;stroke-width:1.4}.cir{fill:#efefeb;stroke:#555;stroke-width:1.4}.svc{fill:#e5e3dd;stroke:#444;stroke-width:1.4}.court{fill:#fff;stroke:#222;stroke-width:2;stroke-dasharray:7 5}.prov{fill:none;stroke:#777;stroke-width:1.3;stroke-dasharray:6 4}.axis{stroke:#999;stroke-width:1;stroke-dasharray:5 5}.openprov{stroke:#666;stroke-width:5;stroke-dasharray:5 3}.txt{font:14px system-ui,sans-serif;fill:#222}.small{font:12px system-ui,sans-serif;fill:#444}.head{font:600 24px system-ui,sans-serif;fill:#171717}.label{font:600 12px system-ui,sans-serif;fill:#222}.dim{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#333}
  </style>
  <rect class="bg" width="1180" height="790"/>
  <text x="55" y="45" class="head">RH-C0 — current first-floor comparator</text>
  <text x="55" y="70" class="small">STATIC VISUAL COMPARATOR · model-baseline-rhc0.md controls · RH-06 dry-space correction applied · front/street surrogate south</text>

  <g transform="translate(70 125)">
    <rect x="0" y="0" width="600" height="540" class="outer"/>

    <rect x="0" y="0" width="210" height="290" class="room"/>
    <text x="105" y="130" text-anchor="middle" class="label">U-BED-P01</text>
    <text x="105" y="149" text-anchor="middle" class="small">principal bedroom</text>

    <polygon points="0,290 210,290 210,370 200,370 200,540 0,540" class="room"/>
    <text x="98" y="438" text-anchor="middle" class="label">U-BED-02</text>
    <text x="98" y="457" text-anchor="middle" class="small">west-front double</text>

    <rect x="200" y="370" width="190" height="170" class="cir"/>
    <text x="295" y="515" text-anchor="middle" class="label">U-STAIR-01</text>

    <rect x="390" y="370" width="210" height="170" class="room"/>
    <text x="495" y="455" text-anchor="middle" class="label">U-BED-03</text>

    <rect x="390" y="170" width="65" height="200" class="cir"/>
    <text x="422.5" y="270" text-anchor="middle" transform="rotate(-90 422.5 270)" class="label">U-GAL-02</text>

    <rect x="455" y="170" width="145" height="200" class="svc"/>
    <text x="527.5" y="262" text-anchor="middle" class="label">U-BATH-01</text>
    <rect x="457.5" y="177.5" width="45" height="35" class="prov"/>
    <text x="480" y="201" text-anchor="middle" class="small">SV-01</text>

    <rect x="390" y="0" width="210" height="170" class="room"/>
    <text x="495" y="78" text-anchor="middle" class="label">U-BED-04</text>

    <rect x="210" y="110" width="180" height="60" class="cir"/>
    <text x="300" y="145" text-anchor="middle" class="label">U-LAND-N01</text>

    <rect x="210" y="0" width="110" height="110" class="room"/>
    <text x="265" y="50" text-anchor="middle" class="label">U-DRESS-01</text>
    <text x="265" y="69" text-anchor="middle" class="small">dry dressing/storage</text>

    <rect x="320" y="0" width="70" height="110" class="room"/>
    <text x="355" y="51" text-anchor="middle" class="label">U-LIN-01</text>
    <text x="355" y="70" text-anchor="middle" class="small">linen</text>

    <rect x="210" y="170" width="180" height="200" class="court"/>
    <text x="300" y="260" text-anchor="middle" class="label">C-01</text>
    <text x="300" y="279" text-anchor="middle" class="dim">3.6 × 4.0 m · open to sky</text>

    <rect x="208" y="386" width="123" height="123" class="prov"/>
    <text x="269.5" y="435" text-anchor="middle" class="small">stair reservation</text>
    <text x="269.5" y="453" text-anchor="middle" class="small">18 rises · 3 × 6</text>

    <!-- front upper openings: centres controlled, sizes provisional -->
    <line x1="97.5" y1="540" x2="97.5" y2="568" class="axis"/><line x1="232.5" y1="540" x2="232.5" y2="568" class="axis"/><line x1="367.5" y1="540" x2="367.5" y2="568" class="axis"/><line x1="502.5" y1="540" x2="502.5" y2="568" class="axis"/>
    <line x1="74.4" y1="540" x2="120.6" y2="540" class="openprov"/><line x1="209.4" y1="540" x2="255.6" y2="540" class="openprov"/><line x1="344.4" y1="540" x2="390.6" y2="540" class="openprov"/><line x1="479.4" y1="540" x2="525.6" y2="540" class="openprov"/>
    <text x="300" y="590" text-anchor="middle" class="small">front axes X=1.95 / 4.65 / 7.35 / 10.05 m · upper widths ≈0.90–0.95 m</text>

    <!-- garden three-axis order; centre host corrected to dry space -->
    <line x1="105" y1="-28" x2="105" y2="0" class="axis"/><line x1="300" y1="-28" x2="300" y2="0" class="axis"/><line x1="495" y1="-28" x2="495" y2="0" class="axis"/>
    <line x1="88" y1="0" x2="122" y2="0" class="openprov"/><line x1="287" y1="0" x2="313" y2="0" class="openprov"/><line x1="478" y1="0" x2="512" y2="0" class="openprov"/>
    <text x="300" y="-42" text-anchor="middle" class="small">garden axes ≈2.1 / 6.0 / 9.9 m · centre upper opening serves dry dressing/storage field</text>

    <!-- court north/south upper opening order -->
    <line x1="282" y1="170" x2="318" y2="170" class="openprov"/>
    <line x1="282" y1="370" x2="318" y2="370" class="openprov"/>
    <text x="300" y="394" text-anchor="middle" class="small">N/S court openings centred X=6.0 m; north one serves cross-landing</text>
    <text x="300" y="419" text-anchor="middle" class="small">E/W court opening centres intentionally un-authored</text>

    <text x="300" y="622" text-anchor="middle" class="dim">12,000 mm</text>
    <text x="623" y="270" transform="rotate(90 623 270)" text-anchor="middle" class="dim">10,800 mm</text>
  </g>

  <g transform="translate(735 125)">
    <text class="head" x="0" y="0">Authority notes</text>
    <text class="txt" x="0" y="42">Controlled here</text>
    <text class="small" x="0" y="68">• same shell/court as ground floor</text>
    <text class="small" x="0" y="90">• four-bedroom + three-sided circulation topology</text>
    <text class="small" x="0" y="112">• RH-06 deletion of U-ENS-01</text>
    <text class="small" x="0" y="134">• family-bath/service stack relationship</text>

    <text class="txt" x="0" y="184">Provisional / not source truth</text>
    <text class="small" x="0" y="210">• Y≈5.0 m west split; Y≈8.6 m / X≈6.4 m dry split</text>
    <text class="small" x="0" y="232">• stair box, SV-01 and exact opening widths</text>
    <text class="small" x="0" y="254">• no wall-face, door-leaf, wardrobe or product geometry</text>

    <text class="txt" x="0" y="304">Cross-view correction</text>
    <text class="small" x="0" y="330">The north cross-landing stops at Y≈8.6 m and does not</text>
    <text class="small" x="0" y="352">reach the north façade. The RH-10 central garden opening</text>
    <text class="small" x="0" y="374">therefore belongs to the dry dressing/storage field.</text>
  </g>
</svg>