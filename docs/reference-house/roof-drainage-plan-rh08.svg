<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-08 roof and drainage plan</title>
  <desc id="desc">Plan of four low-slope roof fields falling outward from the central courtyard to external gutters, four corner-return rainwater pipes, courtyard primary drain and independent overflow route to the east service side, and sparse service terminal geography.</desc>
  <defs>
    <style>
      .head{font:700 28px system-ui,sans-serif;fill:#111}.sub{font:15px system-ui,sans-serif;fill:#333}.label{font:600 14px system-ui,sans-serif;fill:#111}.small{font:12px system-ui,sans-serif;fill:#444}.dim{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#333}
      .roof{fill:#f5f5f5;stroke:#777;stroke-width:1.5}.court{fill:#fff;stroke:#111;stroke-width:3}.wall{fill:none;stroke:#111;stroke-width:4}.watershed{stroke:#555;stroke-width:2;stroke-dasharray:7 5}.fall{stroke:#555;stroke-width:2;marker-end:url(#arr)}.gutter{stroke:#111;stroke-width:7}.pipe{fill:#fff;stroke:#111;stroke-width:3}.drain{fill:#e9edf0;stroke:#333;stroke-width:2}.primary{stroke:#333;stroke-width:5;fill:none}.overflow{stroke:#777;stroke-width:4;stroke-dasharray:7 5;fill:none}.terminal{fill:#ddd;stroke:#222;stroke-width:2}.note{fill:#fafafa;stroke:#bbb;stroke-width:1}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker>
  </defs>

  <text x="55" y="52" class="head">Reference House — RH-08 Roof / Drainage Plan</text>
  <text x="55" y="80" class="sub">Four low-slope outward-draining fields · no courtyard roof gutter · no internal roof outlet · pre-technical coordination</text>

  <!-- 55 px/m: outer 660 x 594 -->
  <g transform="translate(90,150)">
    <!-- Four roof fields partitioned by outer-corner to court-corner watersheds -->
    <!-- south -->
    <polygon points="0,594 660,594 429,407 231,407" class="roof"/>
    <!-- north -->
    <polygon points="0,0 660,0 429,187 231,187" class="roof"/>
    <!-- west -->
    <polygon points="0,0 231,187 231,407 0,594" class="roof"/>
    <!-- east -->
    <polygon points="660,0 429,187 429,407 660,594" class="roof"/>

    <rect x="0" y="0" width="660" height="594" class="wall"/>
    <rect x="231" y="187" width="198" height="220" class="court"/>

    <!-- diagonal watershed lines -->
    <line x1="0" y1="0" x2="231" y2="187" class="watershed"/>
    <line x1="660" y1="0" x2="429" y2="187" class="watershed"/>
    <line x1="0" y1="594" x2="231" y2="407" class="watershed"/>
    <line x1="660" y1="594" x2="429" y2="407" class="watershed"/>

    <!-- outer gutters -->
    <line x1="0" y1="0" x2="660" y2="0" class="gutter"/>
    <line x1="660" y1="0" x2="660" y2="594" class="gutter"/>
    <line x1="0" y1="594" x2="660" y2="594" class="gutter"/>
    <line x1="0" y1="0" x2="0" y2="594" class="gutter"/>

    <!-- outward fall arrows -->
    <line x1="330" y1="390" x2="330" y2="545" class="fall"/>
    <line x1="330" y1="204" x2="330" y2="50" class="fall"/>
    <line x1="214" y1="297" x2="50" y2="297" class="fall"/>
    <line x1="446" y1="297" x2="610" y2="297" class="fall"/>

    <text x="330" y="500" text-anchor="middle" class="label">S · ≈26.5 m²</text>
    <text x="330" y="96" text-anchor="middle" class="label">N · ≈26.5 m²</text>
    <text x="108" y="280" text-anchor="middle" class="label">W · ≈31.1 m²</text>
    <text x="552" y="280" text-anchor="middle" class="label">E · ≈31.1 m²</text>

    <!-- corner-return downpipes, shown slightly inboard on side/rear returns -->
    <circle cx="10" cy="575" r="11" class="pipe"/><text x="25" y="570" class="small">RWP-SW</text>
    <circle cx="650" cy="575" r="11" class="pipe"/><text x="570" y="570" class="small">RWP-SE</text>
    <circle cx="10" cy="19" r="11" class="pipe"/><text x="25" y="35" class="small">RWP-NW</text>
    <circle cx="650" cy="19" r="11" class="pipe"/><text x="570" y="35" class="small">RWP-NE</text>

    <!-- courtyard -->
    <text x="330" y="270" text-anchor="middle" class="label">C-01</text>
    <text x="330" y="292" text-anchor="middle" class="small">3.6 × 4.0 m open light court</text>
    <text x="330" y="312" text-anchor="middle" class="small">roof catchment deliberately excluded</text>

    <!-- court collector at east side -->
    <rect x="400" y="205" width="16" height="184" class="drain"/>
    <text x="392" y="300" text-anchor="end" class="small">removable linear collector / silt access</text>

    <!-- primary and overflow routes beneath east service strip -->
    <path d="M416 305 L620 305" class="primary"/>
    <path d="M416 330 L620 330" class="overflow"/>
    <text x="500" y="295" class="small">primary straight drain</text>
    <text x="500" y="350" class="small">independent high-level overflow</text>
    <circle cx="625" cy="305" r="8" class="drain"/>
    <circle cx="625" cy="330" r="8" class="drain"/>
    <text x="635" y="310" class="small">external inspection</text>
    <text x="635" y="335" class="small">visible overflow outlet</text>

    <!-- service terminals: wall preferred, roof soil vent -->
    <rect x="632" y="245" width="18" height="18" class="terminal"/>
    <rect x="632" y="270" width="18" height="18" class="terminal"/>
    <text x="655" y="258" class="small">MVHR OA/EA preferred high-level east wall</text>
    <text x="655" y="283" class="small">KX-01 remains east wall</text>

    <circle cx="575" cy="210" r="9" class="terminal"/>
    <text x="588" y="214" class="small">soil vent roof terminal</text>

    <text x="330" y="-22" text-anchor="middle" class="small">NORTH / GARDEN SURROGATE</text>
    <text x="330" y="625" text-anchor="middle" class="small">SOUTH / PRINCIPAL FRONT</text>
  </g>

  <g transform="translate(830,145)">
    <rect x="0" y="0" width="600" height="690" class="note"/>
    <text x="22" y="38" class="head">RH-08 roof logic</text>

    <text x="22" y="88" class="label">Water moves away from the court</text>
    <text x="22" y="116" class="small">Four trapezoidal roof fields fall outward.</text>
    <text x="22" y="138" class="small">Diagonal lines are watersheds, not valleys.</text>
    <text x="22" y="160" class="small">No primary inner gutter or internal roof outlet.</text>

    <text x="22" y="210" class="label">Outer route</text>
    <text x="22" y="238" class="small">Open/inspectable external collection edge.</text>
    <text x="22" y="260" class="small">Four corner-return downpipes, ≈28.8 m² plan catchment each</text>
    <text x="22" y="282" class="small">under symmetric split; final hydraulic sizing remains technical.</text>

    <text x="22" y="332" class="label">Courtyard</text>
    <text x="22" y="360" class="small">Only ≈14.4 m² court surface + local wall runoff.</text>
    <text x="22" y="382" class="small">Primary drain is accessible at court and external ends.</text>
    <text x="22" y="404" class="small">Independent higher overflow discharges visibly outside.</text>

    <text x="22" y="454" class="label">Roof clutter minimised</text>
    <text x="22" y="482" class="small">MVHR intake/exhaust preferred on east service wall.</text>
    <text x="22" y="504" class="small">Cooker extract remains wall-mounted.</text>
    <text x="22" y="526" class="small">Only current roof service penetration: soil/vent stack.</text>

    <text x="22" y="576" class="label">Access</text>
    <text x="22" y="604" class="small">No permanent roof hatch in baseline.</text>
    <text x="22" y="626" class="small">Scaffold/tower supplies roof access + edge protection.</text>
    <text x="22" y="648" class="small">Court tower used for rare inner-edge/courtyard work.</text>
  </g>

  <text x="55" y="935" class="small">Coordination drawing only. Roof falls, waterproofing, gutter/downpipe sizes, outlets and site discharge require technical design.</text>
</svg>