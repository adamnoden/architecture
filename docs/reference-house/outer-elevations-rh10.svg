<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-10 rear and east service elevations</title>
  <desc id="desc">Architectural coordination elevations showing the north garden three-axis composition and the east service elevation with plant, ventilation, heat pump and rainwater elements subordinated to room openings.</desc>
  <style>
    .bg{fill:#fbfaf7}.wall{fill:#f0ece2;stroke:#202020;stroke-width:2}.line{stroke:#202020;fill:none;stroke-width:2}.thin{stroke:#666;fill:none;stroke-width:1}.axis{stroke:#aaa;stroke-dasharray:5 5;stroke-width:1}.open{fill:#e2e6e5;stroke:#202020;stroke-width:1.7}.door{fill:#ddd5c7;stroke:#202020;stroke-width:1.7}.tech{fill:#d8d3c8;stroke:#444;stroke-width:1.3}.txt{font:15px system-ui,sans-serif;fill:#202020}.small{font:12px system-ui,sans-serif;fill:#333}.head{font:600 23px system-ui,sans-serif;fill:#202020}.sub{font:600 17px system-ui,sans-serif;fill:#202020}.note{font:12px system-ui,sans-serif;fill:#555}
  </style>
  <rect class="bg" width="1240" height="760"/>
  <text x="50" y="42" class="head">RH-10 — outer elevation coordination</text>
  <text x="50" y="67" class="small">Garden and service elevations; coordination only, not final window/detail schedule</text>

  <!-- NORTH / GARDEN -->
  <g transform="translate(55 120)">
    <text x="0" y="0" class="sub">NORTH / GARDEN — three-axis order</text>
    <rect x="0" y="35" width="540" height="280" class="wall"/>
    <line x1="0" y1="185" x2="540" y2="185" class="thin"/>
    <line x1="0" y1="35" x2="540" y2="35" class="line"/>

    <!-- axes -->
    <line x1="94.5" y1="20" x2="94.5" y2="330" class="axis"/>
    <line x1="270" y1="20" x2="270" y2="330" class="axis"/>
    <line x1="445.5" y1="20" x2="445.5" y2="330" class="axis"/>
    <text x="75" y="350" class="note">X≈2.1</text>
    <text x="252" y="350" class="note">X=6.0</text>
    <text x="423" y="350" class="note">X≈9.9</text>

    <!-- upper -->
    <rect x="73" y="68" width="43" height="82" class="open"/>
    <rect x="252" y="80" width="36" height="70" class="open"/>
    <rect x="424" y="68" width="43" height="82" class="open"/>
    <text x="38" y="165" class="small">principal bed</text>
    <text x="229" y="165" class="small">landing</text>
    <text x="404" y="165" class="small">bed 04</text>

    <!-- ground -->
    <rect x="69" y="216" width="51" height="72" class="open"/>
    <rect x="235" y="205" width="70" height="110" class="door"/>
    <rect x="420" y="216" width="51" height="72" class="open"/>
    <text x="48" y="303" class="small">family</text>
    <text x="220" y="335" class="small">garden / logistics door</text>
    <text x="420" y="303" class="small">kitchen</text>

    <text x="0" y="385" class="txt">No undifferentiated glazed rear wall. Central garden threshold retains ≥1200 mm clear coordination target.</text>
  </g>

  <!-- EAST / SERVICE -->
  <g transform="translate(650 120)">
    <text x="0" y="0" class="sub">EAST / SERVICE — three room/service fields</text>
    <rect x="0" y="35" width="486" height="280" class="wall"/>
    <line x1="0" y1="185" x2="486" y2="185" class="thin"/>
    <line x1="0" y1="35" x2="486" y2="35" class="line"/>

    <!-- broad field boundaries -->
    <line x1="153" y1="35" x2="153" y2="315" class="axis"/>
    <line x1="333" y1="35" x2="333" y2="315" class="axis"/>
    <text x="45" y="335" class="note">study / front</text>
    <text x="195" y="335" class="note">plant / bathroom</text>
    <text x="380" y="335" class="note">kitchen / rear</text>

    <!-- upper openings -->
    <rect x="52" y="70" width="42" height="80" class="open"/>
    <rect x="221" y="78" width="42" height="72" class="open"/>
    <rect x="394" y="70" width="42" height="80" class="open"/>
    <text x="198" y="165" class="small">family bath</text>

    <!-- ground occupied openings -->
    <rect x="48" y="216" width="50" height="72" class="open"/>
    <rect x="389" y="216" width="50" height="72" class="open"/>

    <!-- plant door -->
    <rect x="204" y="205" width="66" height="110" class="door"/>
    <text x="193" y="303" class="small">plant door</text>

    <!-- MVHR terminals -->
    <circle cx="187" cy="230" r="8" class="tech"/>
    <circle cx="187" cy="255" r="8" class="tech"/>
    <text x="157" y="278" class="note">MVHR pair</text>

    <!-- HP -->
    <rect x="283" y="260" width="42" height="55" rx="3" class="tech"/>
    <text x="276" y="335" class="note">ASHP-01</text>

    <!-- cooker extract -->
    <circle cx="364" cy="240" r="7" class="tech"/>
    <text x="346" y="257" class="note">KX</text>

    <!-- RWPs -->
    <rect x="12" y="60" width="9" height="255" class="tech"/>
    <rect x="465" y="60" width="9" height="255" class="tech"/>
    <text x="1" y="45" class="note">RWP</text>
    <text x="453" y="45" class="note">RWP</text>

    <text x="0" y="385" class="txt">Technical expression is concentrated in the middle service field, not scattered across the elevation.</text>
  </g>

  <!-- lower notes -->
  <g transform="translate(55 585)">
    <text x="0" y="0" class="sub">Whole-envelope consequences</text>
    <text x="0" y="34" class="txt">• Front remains RH-04 four-bay order; courtyard keeps its separate internal order.</text>
    <text x="0" y="64" class="txt">• Rear bedroom windows and front bedroom windows carry first-floor emergency-egress duty subject to final sash/opening geometry.</text>
    <text x="0" y="94" class="txt">• West elevation stays technically quiet; service equipment does not migrate west merely to tidy the east side.</text>
    <text x="0" y="124" class="txt">• RH-08 low-slope outward-draining roof explicitly supersedes RH-04's earlier pitched-roof preference.</text>
  </g>
</svg>