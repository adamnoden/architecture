<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="0 0 1260 900" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-10 whole-house coordination map</title>
  <desc id="desc">Summary of the coordinated Reference House showing architectural layers, service side, courtyard, heating, ventilation, roof/PV, drainage, escape windows and remaining external-review dependencies.</desc>
  <style>
    .bg{fill:#fbfaf7}.box{fill:#f2efe7;stroke:#252525;stroke-width:1.6}.court{fill:#ece8dd;stroke:#666;stroke-width:1.3}.svc{fill:#dedbd2;stroke:#333;stroke-width:1.3}.route{stroke:#80543e;stroke-width:4;fill:none}.air{stroke:#536f78;stroke-width:3;fill:none}.water{stroke:#56748a;stroke-width:3;fill:none}.maint{stroke:#68714a;stroke-width:3;fill:none;stroke-dasharray:8 5}.pv{fill:#d8d2c1;stroke:#555;stroke-width:1.1}.egress{stroke:#9a4a37;stroke-width:3;fill:none}.axis{stroke:#999;stroke-dasharray:5 5}.txt{font:15px system-ui,sans-serif;fill:#222}.small{font:12px system-ui,sans-serif;fill:#444}.head{font:600 24px system-ui,sans-serif;fill:#222}.sub{font:600 17px system-ui,sans-serif;fill:#222}.label{font:600 13px system-ui,sans-serif;fill:#222}
  </style>
  <rect class="bg" width="1260" height="900"/>
  <text x="45" y="42" class="head">RH-10 — coordinated virtual house</text>
  <text x="45" y="68" class="small">M3 coordination map: architecture, structure, services, environment, maintenance and failure geography reconciled at pre-specialist resolution</text>

  <!-- Ground floor -->
  <g transform="translate(45 115)">
    <text x="0" y="0" class="sub">GROUND FLOOR</text>
    <rect x="0" y="28" width="430" height="360" class="box"/>
    <rect x="150" y="142" width="130" height="135" class="court"/>
    <text x="188" y="212" class="label">COURT</text>
    <line x1="215" y1="28" x2="215" y2="388" class="axis"/>

    <text x="30" y="88" class="label">DRAWING</text>
    <text x="28" y="330" class="label">FAMILY</text>
    <text x="174" y="80" class="label">HALL + STAIR</text>
    <text x="160" y="350" class="label">GARDEN DINING</text>
    <text x="330" y="83" class="label">STUDY</text>
    <text x="322" y="334" class="label">KITCHEN</text>
    <rect x="320" y="154" width="110" height="112" class="svc"/>
    <text x="333" y="183" class="label">PLANT /</text>
    <text x="333" y="201" class="label">UTILITY / WC</text>
    <text x="333" y="223" class="small">MVHR + DHW</text>
    <text x="333" y="239" class="small">SV-01 + controls</text>

    <path d="M430 205 H475" class="route"/>
    <rect x="475" y="178" width="38" height="62" rx="3" class="svc"/>
    <text x="468" y="260" class="small">ASHP-01</text>

    <path d="M375 240 C315 300 260 345 70 345" class="route"/>
    <text x="56" y="374" class="small">HYD-G-01</text>

    <path d="M206 28 V142" class="maint"/>
    <path d="M215 277 V388" class="maint"/>
    <text x="100" y="410" class="small">front → court → garden architectural sequence</text>
    <path d="M280 80 H320 V330" class="maint"/>
    <text x="296" y="120" class="small">all-weather service/gallery route</text>
  </g>

  <!-- Upper -->
  <g transform="translate(620 115)">
    <text x="0" y="0" class="sub">UPPER FLOOR</text>
    <rect x="0" y="28" width="430" height="360" class="box"/>
    <rect x="150" y="142" width="130" height="135" class="court"/>
    <text x="188" y="212" class="label">COURT</text>
    <text x="28" y="92" class="label">BED 02</text>
    <text x="22" y="335" class="label">PRINCIPAL BED</text>
    <text x="338" y="92" class="label">BED 03</text>
    <text x="338" y="335" class="label">BED 04</text>
    <text x="177" y="82" class="label">STAIR</text>
    <rect x="320" y="154" width="110" height="112" class="svc"/>
    <text x="340" y="185" class="label">BATH</text>
    <text x="332" y="205" class="small">dry-side access</text>
    <text x="330" y="224" class="small">SV-01 / MVHR</text>
    <text x="178" y="338" class="label">LANDING + LINEN</text>

    <path d="M370 225 C320 280 260 320 60 335" class="route"/>
    <path d="M370 225 C395 270 395 320 390 335" class="route"/>
    <text x="55" y="370" class="small">HYD-U-01 via landing/gallery territory</text>

    <rect x="18" y="43" width="38" height="65" class="egress"/>
    <rect x="374" y="43" width="38" height="65" class="egress"/>
    <rect x="18" y="308" width="38" height="65" class="egress"/>
    <rect x="374" y="308" width="38" height="65" class="egress"/>
    <text x="93" y="410" class="small">all four bedrooms retain outer-façade emergency-egress window duty</text>
  </g>

  <!-- Roof / envelope -->
  <g transform="translate(45 565)">
    <text x="0" y="0" class="sub">ROOF + ENVELOPE</text>
    <rect x="0" y="28" width="430" height="245" class="box"/>
    <rect x="150" y="100" width="130" height="105" class="court"/>
    <line x1="0" y1="28" x2="150" y2="100" class="axis"/>
    <line x1="430" y1="28" x2="280" y2="100" class="axis"/>
    <line x1="0" y1="273" x2="150" y2="205" class="axis"/>
    <line x1="430" y1="273" x2="280" y2="205" class="axis"/>

    <rect x="25" y="50" width="105" height="38" class="pv"/>
    <rect x="163" y="50" width="105" height="38" class="pv"/>
    <rect x="300" y="50" width="105" height="38" class="pv"/>
    <rect x="25" y="220" width="105" height="32" class="pv"/>
    <rect x="300" y="220" width="105" height="32" class="pv"/>
    <text x="145" y="260" class="small">≈50 m² PV-capable reserve distributed across outward-draining fields</text>
    <text x="148" y="154" class="label">OPEN COURT</text>
    <path d="M150 105 L35 35" class="water"/>
    <path d="M280 105 L395 35" class="water"/>
    <path d="M150 200 L35 265" class="water"/>
    <path d="M280 200 L395 265" class="water"/>
  </g>

  <g transform="translate(620 565)">
    <text x="0" y="0" class="sub">RH-10 CONTROLLED BOUNDARIES</text>
    <rect x="0" y="28" width="555" height="245" class="box"/>
    <text x="24" y="67" class="txt">Envelope</text>
    <text x="155" y="67" class="small">400–425 mm working masonry family; 450 mm stress limit</text>
    <text x="24" y="100" class="txt">Roof</text>
    <text x="155" y="100" class="small">RH-08 low-slope outward drainage explicitly supersedes RH-04 pitched preference</text>
    <text x="24" y="133" class="txt">Plant</text>
    <text x="155" y="133" class="small">MVHR + DHW + hydraulics + controls in G-PLANT-01; packing attacked at RH-11</text>
    <text x="24" y="166" class="txt">Interfaces</text>
    <text x="155" y="166" class="small">W0 direct finish baseline; W1 selective; W2/P02 not required for house success</text>
    <text x="24" y="199" class="txt">Access</text>
    <text x="155" y="199" class="small">no roof hatch; external scaffold/tower; service-side plant/ASHP route; court tower retained</text>
    <text x="24" y="232" class="txt">Next</text>
    <text x="155" y="232" class="small">engineer + fire/building-control + MEP/acoustic + building-physics attack package</text>
  </g>
</svg>