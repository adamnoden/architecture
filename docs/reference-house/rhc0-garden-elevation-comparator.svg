<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">RH-C0 garden elevation comparator</title>
<desc id="desc">Current north garden elevation order after RH-C0.6 correction: principal bedroom, dry dressing/storage field, and bedroom 04 on the upper floor.</desc>
<style>.bg{fill:#fbfaf7}.wall{fill:#f0eee8;stroke:#222;stroke-width:2}.axis{stroke:#999;stroke-dasharray:5 5}.opening{fill:#fff;stroke:#555;stroke-width:1.5;stroke-dasharray:5 3}.door{fill:#ece7dd;stroke:#444;stroke-width:1.8;stroke-dasharray:5 3}.floor{stroke:#aaa;stroke-dasharray:5 5}.head{font:600 24px system-ui,sans-serif;fill:#171717}.small{font:12px system-ui,sans-serif;fill:#444}.label{font:600 12px system-ui,sans-serif;fill:#222}.dim{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#333}</style>
<rect class="bg" width="980" height="650"/>
<text x="50" y="45" class="head">RH-C0 — garden elevation comparator</text>
<text x="50" y="70" class="small">STATIC VISUAL COMPARATOR · RH-10 three-axis order · centre upper host corrected by RH-C0.6</text>
<g transform="translate(70 120)">
  <rect x="0" y="0" width="600" height="312.5" class="wall"/>
  <line x1="0" y1="147.5" x2="600" y2="147.5" class="floor"/>
  <line x1="105" y1="-20" x2="105" y2="330" class="axis"/>
  <line x1="300" y1="-20" x2="300" y2="330" class="axis"/>
  <line x1="495" y1="-20" x2="495" y2="330" class="axis"/>
  <rect x="80" y="38" width="50" height="78" class="opening"/>
  <rect x="282" y="52" width="36" height="64" class="opening"/>
  <rect x="470" y="38" width="50" height="78" class="opening"/>
  <text x="105" y="136" text-anchor="middle" class="small">principal bed</text>
  <text x="300" y="136" text-anchor="middle" class="small">dry dress/storage</text>
  <text x="495" y="136" text-anchor="middle" class="small">bed 04</text>
  <rect x="78" y="198" width="54" height="72" class="opening"/>
  <rect x="270" y="185" width="60" height="127.5" class="door"/>
  <rect x="468" y="198" width="54" height="72" class="opening"/>
  <text x="105" y="290" text-anchor="middle" class="small">family</text>
  <text x="300" y="336" text-anchor="middle" class="small">garden dining / ≥1200 clear target</text>
  <text x="495" y="290" text-anchor="middle" class="small">kitchen</text>
  <text x="105" y="365" text-anchor="middle" class="dim">X≈2.1 m</text>
  <text x="300" y="365" text-anchor="middle" class="dim">X=6.0 m</text>
  <text x="495" y="365" text-anchor="middle" class="dim">X≈9.9 m</text>
</g>
<g transform="translate(720 140)">
  <text class="label" x="0" y="0">RH-C0.6 correction</text>
  <text class="small" x="0" y="28">The north cross-landing</text>
  <text class="small" x="0" y="48">does not reach the outer wall.</text>
  <text class="small" x="0" y="78">Its outer centre opening is</text>
  <text class="small" x="0" y="98">therefore hosted by the dry</text>
  <text class="small" x="0" y="118">dressing/storage field.</text>
  <text class="small" x="0" y="158">Exact widths remain provisional.</text>
</g>
</svg>