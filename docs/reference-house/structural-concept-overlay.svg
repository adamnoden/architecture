<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-05 structural concept overlay</title>
  <desc id="desc">Schematic first-floor structural concept showing loadbearing outer and courtyard masonry, short-span engineered timber joist zones, four short edge beams continuing courtyard support lines through the front and rear wings, the stair opening and a reserved service opening zone.</desc>
  <defs>
    <style>
      .head{font:700 28px system-ui,sans-serif;fill:#111}.sub{font:15px system-ui,sans-serif;fill:#333}.label{font:600 14px system-ui,sans-serif;fill:#111}.small{font:12px system-ui,sans-serif;fill:#444}.dim{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#333}
      .wall{fill:#ececec;stroke:#111;stroke-width:5}.court{fill:#fff;stroke:#111;stroke-width:5}.zone{fill:#fafafa;stroke:#bbb;stroke-width:1.3}.beam{stroke:#111;stroke-width:10}.joist{stroke:#666;stroke-width:1.4}.arrow{stroke:#555;stroke-width:2;marker-end:url(#arr)}.opening{fill:#fff;stroke:#333;stroke-width:2;stroke-dasharray:7 5}.reserve{fill:#f0f2f3;stroke:#333;stroke-width:2;stroke-dasharray:5 4}.node{fill:#111}.note{fill:#fafafa;stroke:#bbb;stroke-width:1}.axis{stroke:#aaa;stroke-width:1;stroke-dasharray:5 5}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker>
  </defs>

  <text x="55" y="52" class="head">Reference House — RH-05 Structural Concept</text>
  <text x="55" y="80" class="sub">Pre-engineering load-path overlay · short-span courtyard ring · no member sizes or structural adequacy claimed</text>

  <!-- scale 55 px/m: outer 660 x 594 -->
  <g transform="translate(85,150)">
    <!-- structural zones -->
    <rect x="0" y="0" width="231" height="594" class="zone"/>
    <rect x="429" y="0" width="231" height="594" class="zone"/>
    <rect x="231" y="0" width="198" height="187" class="zone"/>
    <rect x="231" y="407" width="198" height="187" class="zone"/>

    <!-- outer loadbearing inner-leaf line shown as thick perimeter -->
    <rect x="0" y="0" width="660" height="594" fill="none" class="wall"/>

    <!-- courtyard loadbearing ring -->
    <rect x="231" y="187" width="198" height="220" class="court"/>
    <text x="330" y="290" text-anchor="middle" class="label">OPEN COURTYARD</text>
    <text x="330" y="311" text-anchor="middle" class="small">loadbearing inner leaf around court</text>

    <!-- beam extensions x=4.2,7.8 front/rear -->
    <line x1="231" y1="0" x2="231" y2="187" class="beam"/>
    <line x1="429" y1="0" x2="429" y2="187" class="beam"/>
    <line x1="231" y1="407" x2="231" y2="594" class="beam"/>
    <line x1="429" y1="407" x2="429" y2="594" class="beam"/>

    <text x="214" y="92" text-anchor="end" class="small">EB-W-N</text>
    <text x="446" y="92" class="small">EB-E-N</text>
    <text x="214" y="510" text-anchor="end" class="small">EB-W-S</text>
    <text x="446" y="510" class="small">EB-E-S</text>

    <!-- reaction nodes at courtyard corners -->
    <circle cx="231" cy="187" r="7" class="node"/><circle cx="429" cy="187" r="7" class="node"/><circle cx="231" cy="407" r="7" class="node"/><circle cx="429" cy="407" r="7" class="node"/>
    <text x="330" y="432" text-anchor="middle" class="small">courtyard corners = protected reaction nodes</text>

    <!-- west joists east-west -->
    <g>
      <line x1="25" y1="45" x2="205" y2="45" class="joist"/><line x1="25" y1="85" x2="205" y2="85" class="joist"/><line x1="25" y1="125" x2="205" y2="125" class="joist"/><line x1="25" y1="165" x2="205" y2="165" class="joist"/>
      <line x1="25" y1="215" x2="205" y2="215" class="joist"/><line x1="25" y1="255" x2="205" y2="255" class="joist"/><line x1="25" y1="295" x2="205" y2="295" class="joist"/><line x1="25" y1="335" x2="205" y2="335" class="joist"/><line x1="25" y1="375" x2="205" y2="375" class="joist"/>
      <line x1="25" y1="445" x2="205" y2="445" class="joist"/><line x1="25" y1="485" x2="205" y2="485" class="joist"/><line x1="25" y1="525" x2="205" y2="525" class="joist"/><line x1="25" y1="565" x2="205" y2="565" class="joist"/>
      <line x1="50" y1="110" x2="185" y2="110" class="arrow"/><line x1="50" y1="300" x2="185" y2="300" class="arrow"/><line x1="50" y1="510" x2="185" y2="510" class="arrow"/>
      <text x="116" y="590" text-anchor="middle" class="dim">F-W · ≈4.2 m gross span</text>
    </g>

    <!-- east joists east-west -->
    <g>
      <line x1="455" y1="45" x2="635" y2="45" class="joist"/><line x1="455" y1="85" x2="635" y2="85" class="joist"/><line x1="455" y1="125" x2="635" y2="125" class="joist"/><line x1="455" y1="165" x2="635" y2="165" class="joist"/>
      <line x1="455" y1="215" x2="635" y2="215" class="joist"/><line x1="455" y1="255" x2="635" y2="255" class="joist"/><line x1="455" y1="295" x2="635" y2="295" class="joist"/><line x1="455" y1="335" x2="635" y2="335" class="joist"/><line x1="455" y1="375" x2="635" y2="375" class="joist"/>
      <line x1="455" y1="445" x2="635" y2="445" class="joist"/><line x1="455" y1="485" x2="635" y2="485" class="joist"/><line x1="455" y1="525" x2="635" y2="525" class="joist"/><line x1="455" y1="565" x2="635" y2="565" class="joist"/>
      <line x1="475" y1="110" x2="610" y2="110" class="arrow"/><line x1="475" y1="300" x2="610" y2="300" class="arrow"/><line x1="475" y1="510" x2="610" y2="510" class="arrow"/>
      <text x="545" y="590" text-anchor="middle" class="dim">F-E · ≈4.2 m gross span</text>
    </g>

    <!-- north centre joists north-south -->
    <g>
      <line x1="258" y1="20" x2="258" y2="160" class="joist"/><line x1="292" y1="20" x2="292" y2="160" class="joist"/><line x1="326" y1="20" x2="326" y2="160" class="joist"/><line x1="360" y1="20" x2="360" y2="160" class="joist"/><line x1="394" y1="20" x2="394" y2="160" class="joist"/>
      <line x1="326" y1="145" x2="326" y2="35" class="arrow"/>
      <text x="330" y="180" text-anchor="middle" class="dim">F-N · ≈3.4 m gross span</text>
    </g>

    <!-- south centre stair + residual floor -->
    <g>
      <rect x="243" y="427" width="122" height="132" class="opening"/>
      <text x="304" y="485" text-anchor="middle" class="label">ST-01</text>
      <text x="304" y="505" text-anchor="middle" class="small">stair opening</text>
      <line x1="390" y1="427" x2="390" y2="570" class="joist"/><line x1="410" y1="427" x2="410" y2="570" class="joist"/>
      <line x1="400" y1="550" x2="400" y2="445" class="arrow"/>
      <text x="330" y="585" text-anchor="middle" class="dim">F-S · ≈3.4 m gross support depth</text>
    </g>

    <!-- service opening reservation -->
    <rect x="500" y="260" width="78" height="88" class="reserve"/>
    <text x="539" y="292" text-anchor="middle" class="label">SV-RES</text>
    <text x="539" y="310" text-anchor="middle" class="small">framed opening</text>
    <text x="539" y="327" text-anchor="middle" class="small">size RH-06</text>

    <text x="330" y="-20" text-anchor="middle" class="small">NORTH / GARDEN SURROGATE</text>
    <text x="330" y="625" text-anchor="middle" class="small">SOUTH / FRONT</text>
  </g>

  <g transform="translate(820,145)">
    <rect x="0" y="0" width="610" height="690" class="note"/>
    <text x="22" y="38" class="head">Load-path logic</text>

    <text x="22" y="88" class="label">Permanent vertical structure</text>
    <text x="22" y="116" class="small">Outer masonry inner leaf + courtyard masonry inner leaf.</text>
    <text x="22" y="138" class="small">Upper room partitions are not needed as primary bearing lines.</text>

    <text x="22" y="188" class="label">Floor</text>
    <text x="22" y="216" class="small">West/east strips span across the 4.2 m ring thickness.</text>
    <text x="22" y="238" class="small">North/south centre strips span across the 3.4 m ring thickness.</text>
    <text x="22" y="260" class="small">Structural deck remains the diaphragm.</text>

    <text x="22" y="310" class="label">Four repeated edge beams</text>
    <text x="22" y="338" class="small">Continue the court-side support lines through front/rear wings.</text>
    <text x="22" y="360" class="small">≈3.4 m each; engineered timber/LVL first comparator.</text>
    <text x="22" y="382" class="small">Protected steel only if engineering earns it.</text>

    <text x="22" y="432" class="label">Protected structural zones</text>
    <text x="22" y="460" class="small">Court corners · edge beams · stair trimmers · lintel bearings.</text>
    <text x="22" y="482" class="small">Do not treat these as convenient future service chases.</text>

    <text x="22" y="532" class="label">RH-04 floor zone</text>
    <text x="22" y="560" class="small">350 mm architectural reservation survives provisionally.</text>
    <text x="22" y="582" class="small">300 mm-class engineered joist is first engineering test,</text>
    <text x="22" y="604" class="small">not a selected or sized member.</text>

    <text x="22" y="654" class="label">Not claimed</text>
    <text x="22" y="678" class="small">Capacity · vibration · deflection · fire · acoustics · bearings · foundations.</text>
  </g>

  <text x="55" y="930" class="small">RH-05 coordination overlay only. Member lines and joist spacing are schematic; a structural engineer must size and detail the system.</text>
</svg>