<svg xmlns="http://www.w3.org/2000/svg" width="166mm" height="108mm" viewBox="0 0 166 108" role="img" aria-labelledby="title desc" data-view-id="REFERENCE-HOUSE-SYNTHETIC-SETTING-PLAN" data-source-id="REFERENCE-HOUSE-SYNTHETIC-SETTING-PLAN" data-scale-denominator="200">
<title id="title">Reference House synthetic setting and type plan</title>
<desc id="desc">Synthetic 1:200 setting stress-test showing controlled house geometry inside the documented approximate 15.5 metre surrogate width. Lateral working capacity is explicit while plot depth, legal boundaries, highway, neighbours and real-site orientation remain absent.</desc>
<style>.line-cut{stroke:#000000;stroke-width:0.5;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.line-profile{stroke:#000000;stroke-width:0.35;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.line-primary{stroke:#000000;stroke-width:0.25;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.line-secondary{stroke:#000000;stroke-width:0.18;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.text-label{font-family:Arial, Helvetica, sans-serif;font-size:2.646px;font-weight:400;fill:#000000}.text-note{font-family:Arial, Helvetica, sans-serif;font-size:2.293px;font-weight:400;fill:#000000}.text-marker{font-family:Arial, Helvetica, sans-serif;font-size:2.293px;font-weight:700;fill:#000000}.dash-overhead{stroke-dasharray:3 1.5}.dash-datum{stroke-dasharray:6 1.5 1 1.5}.dash-provisional{stroke-dasharray:1 1}.fill-paper{fill:#ffffff;stroke:none}.fill-ink{fill:#000000;stroke:none}.fill-context{fill:#666666;stroke:none}.fill-faint{fill:#a6a6a6;stroke:none}</style>
