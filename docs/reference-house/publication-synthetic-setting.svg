<rect x="74" y="39" width="18" height="20" class="line-secondary" data-entity="setting-court" data-authority="CONTROLLED" data-role="controlled-open-courtyard"/>
<line x1="44.25" y1="17" x2="44.25" y2="81" class="line-secondary dash-provisional" data-entity="surrogate-west-stress-line" data-authority="SURROGATE_SETTING_OUTSIDE_RH_C1" data-precision="approximate" data-role="lateral-width-stress-line-not-legal-boundary"/>
<line x1="121.75" y1="17" x2="121.75" y2="81" class="line-secondary dash-provisional" data-entity="surrogate-east-stress-line" data-authority="SURROGATE_SETTING_OUTSIDE_RH_C1" data-precision="approximate" data-role="lateral-width-stress-line-not-legal-boundary"/>
<line x1="44.25" y1="10" x2="121.75" y2="10" class="line-secondary dash-provisional" data-entity="surrogate-width-dimension" data-authority="SURROGATE_SETTING_OUTSIDE_RH_C1" data-role="surrogate-width-stress-test"/>
