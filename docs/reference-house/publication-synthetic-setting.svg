<text x="83" y="7" class="text-label" text-anchor="middle" data-entity="surrogate-width-label" data-authority="SURROGATE_SETTING_OUTSIDE_RH_C1">≈15.5 m surrogate width stress-test</text>
<text x="42.25" y="46" class="text-note" text-anchor="end" data-entity="west-strip-label">≈1.75 m</text>
<text x="42.25" y="50" class="text-note" text-anchor="end" data-entity="west-strip-role" data-authority="SURROGATE_SETTING_OUTSIDE_RH_C1">west access</text>
