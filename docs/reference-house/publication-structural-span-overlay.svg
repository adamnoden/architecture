<title id="title">Reference House structural and span reading</title>
<desc id="desc">Removable analytical overlay on the canonical first-floor plan. Permanent masonry support order, gross span directions and local opening-framing obligations are shown at architectural coordination level only; member sizes, joist centrelines, bearings, connections and foundations remain external structural-engineering work.</desc>
