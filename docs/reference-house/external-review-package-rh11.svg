<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-11 external review package map</title>
  <desc id="desc">Diagram showing the RH-10 coordinated baseline feeding four discipline reviews, which return findings that either confirm the baseline, qualify it, or reopen earlier Reference House gates.</desc>
  <style>
    .bg{fill:#fbfaf7}.box{fill:#f2efe7;stroke:#2e2e2e;stroke-width:1.5}.core{fill:#e7e2d6;stroke:#202020;stroke-width:2}.find{fill:#f7f5ef;stroke:#555;stroke-width:1.3}.ink{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke:#666;stroke-width:1.3;stroke-dasharray:7 5;fill:none}.head{font:600 25px system-ui,sans-serif;fill:#202020}.sub{font:600 17px system-ui,sans-serif;fill:#202020}.txt{font:15px system-ui,sans-serif;fill:#222}.small{font:13px system-ui,sans-serif;fill:#444}.tiny{font:12px system-ui,sans-serif;fill:#555}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="50" y="48" class="head">RH-11 — competent external attack on the M3 Reference House</text>
  <text x="50" y="75" class="small">Package preparation is not validation. Review findings either confirm, qualify or explicitly rewind the coordinated virtual design.</text>

  <rect x="440" y="110" width="400" height="110" rx="4" class="core"/>
  <text x="480" y="143" class="sub">RH-10 coordinated baseline — M3</text>
  <text x="474" y="171" class="txt">architecture + structure + services + environment</text>
  <text x="500" y="196" class="txt">roof/access + envelope + occupied interfaces</text>

  <path d="M520 220 L250 285" class="ink" marker-end="url(#arrow)"/>
  <path d="M600 220 L500 285" class="ink" marker-end="url(#arrow)"/>
  <path d="M680 220 L780 285" class="ink" marker-end="url(#arrow)"/>
  <path d="M760 220 L1030 285" class="ink" marker-end="url(#arrow)"/>

  <rect x="80" y="290" width="285" height="150" rx="4" class="box"/>
  <text x="112" y="320" class="sub">Structural engineer</text>
  <text x="102" y="349" class="small">masonry ring / floor / roof</text>
  <text x="102" y="371" class="small">edge beams / openings / PV</text>
  <text x="102" y="393" class="small">service penetrations / P03</text>
  <text x="102" y="420" class="tiny">Rewind if structure changes the architecture.</text>

  <rect x="380" y="290" width="285" height="150" rx="4" class="box"/>
  <text x="403" y="320" class="sub">Fire / building control</text>
  <text x="402" y="349" class="small">escape / stair / openings</text>
  <text x="402" y="371" class="small">service closure / PV / cavities</text>
  <text x="402" y="393" class="small">M4(1) entry / WC / thresholds</text>
  <text x="402" y="420" class="tiny">Rewind if compliance changes plan/order.</text>

  <rect x="680" y="290" width="285" height="150" rx="4" class="box"/>
  <text x="718" y="320" class="sub">MEP / acoustics</text>
  <text x="702" y="349" class="small">plant packing / MVHR / ASHP</text>
  <text x="702" y="371" class="small">DHW / hydronics / terminals</text>
  <text x="702" y="393" class="small">noise / crosstalk / commissioning</text>
  <text x="702" y="420" class="tiny">Use fallbacks before buying more building.</text>

  <rect x="980" y="290" width="220" height="150" rx="4" class="box"/>
  <text x="1002" y="320" class="sub">Physics / energy</text>
  <text x="1001" y="349" class="small">envelope / junctions</text>
  <text x="1001" y="371" class="small">daylight / overheating</text>
  <text x="1001" y="393" class="small">Future Homes / PV</text>
  <text x="1001" y="420" class="tiny">Rewind poor form; don't equip around it.</text>

  <path d="M220 440 L420 515" class="ink" marker-end="url(#arrow)"/>
  <path d="M520 440 L515 505" class="ink" marker-end="url(#arrow)"/>
  <path d="M820 440 L750 505" class="ink" marker-end="url(#arrow)"/>
  <path d="M1090 440 L850 515" class="ink" marker-end="url(#arrow)"/>

  <rect x="365" y="510" width="550" height="115" rx="4" class="find"/>
  <text x="525" y="542" class="sub">Structured reviewer findings</text>
  <text x="405" y="571" class="txt">CONFIRM  ·  QUALIFY  ·  MATERIAL FINDING  ·  REWIND  ·  OUTSIDE SCOPE</text>
  <text x="442" y="599" class="small">finding → affected object → RH gate → smallest correction → closure evidence</text>

  <path d="M640 625 L640 675" class="ink" marker-end="url(#arrow)"/>
  <rect x="330" y="680" width="620" height="52" rx="4" class="core"/>
  <text x="368" y="712" class="txt">Resolve findings in repository. Hold M3, demote if necessary; no automatic promotion from review.</text>

  <path d="M330 706 C180 706 140 610 160 452" class="dash" marker-end="url(#arrow)"/>
  <text x="82" y="565" class="tiny">material finding can reopen RH-03…RH-10</text>
</svg>