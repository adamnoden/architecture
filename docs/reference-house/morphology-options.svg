<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Reference House RH-01 gross morphology comparison</title>
  <desc id="desc">Four comparable courtyard-house plan silhouettes: the existing fixture, a compact central court, an offset thick-thin ring, and a long axial court. Option A, the compact central court, is selected as the RH-01 working baseline.</desc>
  <defs>
    <style>
      .head{font:700 28px system-ui,sans-serif;fill:#111}
      .sub{font:15px system-ui,sans-serif;fill:#333}
      .opt{font:700 20px system-ui,sans-serif;fill:#111}
      .label{font:14px system-ui,sans-serif;fill:#222}
      .small{font:12px system-ui,sans-serif;fill:#444}
      .dim{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#555}
      .shell{fill:#f2f2f2;stroke:#111;stroke-width:2.5;fill-rule:evenodd}
      .court{fill:#fff;stroke:#111;stroke-width:2;stroke-dasharray:7 5}
      .axis{stroke:#777;stroke-width:1.5;stroke-dasharray:7 6}
      .selected{fill:none;stroke:#111;stroke-width:4}
      .held{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:8 5}
      .arrow{stroke:#333;stroke-width:2;marker-end:url(#arrow)}
      .rule{stroke:#bbb;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="60" y="50" class="head">Reference House — RH-01 Gross Morphology Comparison</text>
  <text x="60" y="78" class="sub">Schematic only · dimensions in metres · front/street shown at bottom for comparison, not as a real site orientation</text>
  <line x1="60" y1="96" x2="1340" y2="96" class="rule"/>

  <!-- F0 -->
  <g transform="translate(70,145)">
    <text x="0" y="0" class="opt">F0 — Existing fixture</text>
    <text x="0" y="24" class="small">12.6 × 11.4 outer · 3.6 × 3.6 court</text>
    <g transform="translate(0,50)">
      <path class="shell" d="M0,0 H352.8 V319.2 H0 Z M126,109.2 H226.8 V210 H126 Z"/>
      <rect x="126" y="109.2" width="100.8" height="100.8" class="court"/>
      <line x1="176.4" y1="319.2" x2="176.4" y2="0" class="axis"/>
      <line x1="176.4" y1="345" x2="176.4" y2="326" class="arrow"/>
      <text x="176.4" y="365" text-anchor="middle" class="small">street → court → garden</text>
      <text x="176.4" y="163" text-anchor="middle" class="label">COURT</text>
    </g>
    <text x="0" y="445" class="dim">130.7 m²/storey · 261.4 m²/2 storeys</text>
    <text x="0" y="466" class="dim">plan-envelope perimeter 62.4 m</text>
    <text x="0" y="487" class="small">Generous and easy to coordinate, but area-rich.</text>
  </g>

  <!-- A -->
  <g transform="translate(735,145)">
    <rect x="-18" y="-30" width="555" height="545" rx="8" class="selected"/>
    <text x="0" y="0" class="opt">A — Compact central court · SELECTED</text>
    <text x="0" y="24" class="small">11.4 × 10.8 outer · 3.6 × 4.0 court</text>
    <g transform="translate(0,50)">
      <path class="shell" d="M0,0 H319.2 V302.4 H0 Z M109.2,95.2 H210 V207.2 H109.2 Z"/>
      <rect x="109.2" y="95.2" width="100.8" height="112" class="court"/>
      <line x1="159.6" y1="302.4" x2="159.6" y2="0" class="axis"/>
      <line x1="159.6" y1="328" x2="159.6" y2="309" class="arrow"/>
      <text x="159.6" y="348" text-anchor="middle" class="small">street → court → garden</text>
      <text x="159.6" y="155" text-anchor="middle" class="label">COURT</text>
      <text x="54.6" y="151" text-anchor="middle" class="dim">3.9</text>
      <text x="264.6" y="151" text-anchor="middle" class="dim">3.9</text>
      <text x="159.6" y="48" text-anchor="middle" class="dim">3.4</text>
      <text x="159.6" y="263" text-anchor="middle" class="dim">3.4</text>
    </g>
    <text x="0" y="445" class="dim">108.7 m²/storey · 217.4 m²/2 storeys</text>
    <text x="0" y="466" class="dim">plan-envelope perimeter 59.6 m</text>
    <text x="0" y="487" class="small">Balanced architectural centre; compact without pre-solving services.</text>
  </g>

  <!-- B -->
  <g transform="translate(70,650)">
    <rect x="-18" y="-30" width="555" height="285" rx="8" class="held"/>
    <text x="0" y="0" class="opt">B — Offset thick/thin ring · HELD CHALLENGER</text>
    <text x="0" y="24" class="small">11.2 × 10.6 outer · 3.4 × 4.0 court, offset east</text>
    <g transform="translate(0,50)">
      <path class="shell" d="M0,0 H313.6 V296.8 H0 Z M126,92.4 H221.2 V204.4 H126 Z"/>
      <rect x="126" y="92.4" width="95.2" height="112" class="court"/>
      <line x1="173.6" y1="296.8" x2="173.6" y2="0" class="axis"/>
      <text x="63" y="148" text-anchor="middle" class="dim">4.5 deep wing</text>
      <text x="267.4" y="148" text-anchor="middle" class="dim">3.3 thin wing</text>
      <text x="173.6" y="153" text-anchor="middle" class="label">COURT</text>
    </g>
    <text x="340" y="95" class="dim">105.1 m²/storey</text>
    <text x="340" y="116" class="dim">210.2 m²/2 storeys</text>
    <text x="340" y="137" class="dim">perimeter 58.4 m</text>
    <text x="340" y="168" class="small">Most compact and service-friendly.</text>
    <text x="340" y="188" class="small">Held because it bakes asymmetry into</text>
    <text x="340" y="208" class="small">morphology before room order exists.</text>
  </g>

  <!-- C -->
  <g transform="translate(735,650)">
    <text x="0" y="0" class="opt">C — Long axial court · REJECTED AT RH-01</text>
    <text x="0" y="24" class="small">10.8 × 11.4 outer · 3.4 × 5.0 court</text>
    <g transform="translate(0,50)">
      <path class="shell" d="M0,0 H302.4 V319.2 H0 Z M103.6,89.6 H198.8 V229.6 H103.6 Z"/>
      <rect x="103.6" y="89.6" width="95.2" height="140" class="court"/>
      <line x1="151.2" y1="319.2" x2="151.2" y2="0" class="axis"/>
      <text x="151.2" y="164" text-anchor="middle" class="label">LONG COURT</text>
    </g>
    <text x="330" y="95" class="dim">106.1 m²/storey</text>
    <text x="330" y="116" class="dim">212.2 m²/2 storeys</text>
    <text x="330" y="137" class="dim">perimeter 61.2 m</text>
    <text x="330" y="168" class="small">Strongest courtyard sequence, but almost</text>
    <text x="330" y="188" class="small">F0's wall-line burden for far less house.</text>
  </g>

  <line x1="60" y1="925" x2="1340" y2="925" class="rule"/>
  <text x="60" y="953" class="small">RH-01 result: A becomes the controlled gross-morphology baseline. B is retained only as a defined rewind option. Metrics are comparison proxies, not final GIA or energy results.</text>
</svg>