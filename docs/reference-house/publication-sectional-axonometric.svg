<title id="title">Reference House sectional axonometric</title>
<desc id="desc">NTS parallel sectional synthesis cut at the controlled south courtyard edge. Controlled shell, courtyard and level order are shown with bounded service geography; complete aperture geometry, construction-layer thicknesses, exact roof fall surfaces and packed MEP geometry remain absent.</desc>
