<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">G-01 D8-M05 — Marble Hill sectional flattening</title>
  <desc id="desc">Analytical not-to-scale section comparing the documented double-height Great Room with a counterfactual inserted upper floor.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; }
    .note { font-size: 15px; }
    .line { stroke: #111; stroke-width: 3; fill: none; }
    .thin { stroke: #111; stroke-width: 2; fill: none; }
    .dash { stroke: #666; stroke-width: 2; stroke-dasharray: 10 8; fill: none; }
    .box { fill: none; stroke: #111; stroke-width: 3; }
  </style>

  <text x="40" y="48" class="title">D8-M05 — Marble Hill sectional flattening</text>
  <text x="40" y="78" class="note">Analytical section only. The documented 24 ft cubic Great Room / upper-room void relation is preserved schematically, not metrically.</text>

  <text x="80" y="130" class="label">A — documented sectional privilege</text>
  <rect x="80" y="165" width="440" height="330" class="box"/>
  <line x1="80" y1="385" x2="210" y2="385" class="line"/>
  <line x1="390" y1="385" x2="520" y2="385" class="line"/>
  <text x="95" y="410" class="small">second-floor rooms</text>
  <text x="375" y="410" class="small">second-floor rooms</text>
  <rect x="210" y="205" width="180" height="250" class="thin"/>
  <text x="238" y="315" class="small">GREAT ROOM</text>
  <text x="245" y="340" class="small">double height</text>
  <text x="245" y="365" class="small">upper void</text>
  <line x1="80" y1="455" x2="520" y2="455" class="line"/>
  <text x="95" y="485" class="small">principal-floor datum</text>
  <text x="105" y="540" class="small">Plan rank + section jointly express hierarchy</text>
  <text x="105" y="565" class="small">Upper-floor topology is changed by the room below</text>

  <text x="650" y="130" class="label">B — counterfactual flattening</text>
  <rect x="650" y="165" width="440" height="330" class="box"/>
  <line x1="650" y1="385" x2="1090" y2="385" class="line"/>
  <rect x="780" y="260" width="180" height="195" class="thin"/>
  <text x="805" y="330" class="small">GREAT ROOM</text>
  <text x="815" y="355" class="small">single storey</text>
  <line x1="650" y1="455" x2="1090" y2="455" class="line"/>
  <text x="665" y="485" class="small">principal-floor datum</text>
  <text x="665" y="370" class="small">new occupied upper floor crosses former void</text>
  <path d="M870 240 L870 185" class="thin"/>
  <path d="M870 185 l-7 12 m7-12 l7 12" class="thin"/>
  <text x="675" y="540" class="small">Plan position can remain unchanged</text>
  <text x="675" y="565" class="small">Sectional privilege and upper-floor void are removed</text>
</svg>