<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <pattern id="masonry" width="54" height="28" patternUnits="userSpaceOnUse">
      <rect width="54" height="28" fill="#d8d5cc"/>
      <path d="M0 0H54M0 14H54M0 28H54M27 0V14M0 14V28M54 14V28" stroke="#8c8980" stroke-width="1"/>
    </pattern>
    <pattern id="mineral" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e8e7df"/>
      <circle cx="4" cy="5" r="1.3" fill="#8e8d87"/>
      <circle cx="14" cy="9" r="1.1" fill="#8e8d87"/>
      <circle cx="8" cy="16" r="1.1" fill="#8e8d87"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#333"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111}
      .subtitle{font:15px Arial,sans-serif;fill:#555}
      .head{font:700 16px Arial,sans-serif;fill:#111}
      .label{font:14px Arial,sans-serif;fill:#222}
      .small{font:12px Arial,sans-serif;fill:#444}
      .tiny{font:11px Arial,sans-serif;fill:#555}
      .call{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#777;stroke-width:1.2;stroke-dasharray:6 5;fill:none}
    </style>
  </defs>

  <rect width="1500" height="1050" fill="#fafaf8"/>
  <text x="60" y="52" class="title">W2 REPLACEABLE WALL — PROTOTYPE P01-W2</text>
  <text x="60" y="78" class="subtitle">Conceptual 1:1 mock-up detail • gravity-seated dense mineral panel + separate top restraint • NOT FOR CONSTRUCTION</text>

  <!-- Full wall face elevation -->
  <g transform="translate(60 130)">
    <text x="0" y="-15" class="head">ROOM-SIDE ELEVATION — FOUR NOMINAL 600 mm FIELDS</text>

    <rect x="0" y="0" width="840" height="640" fill="#f5f3ed" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="0" x2="210" y2="640" stroke="#777"/>
    <line x1="420" y1="0" x2="420" y2="640" stroke="#777"/>
    <line x1="630" y1="0" x2="630" y2="640" stroke="#777"/>

    <!-- picture rail -->
    <rect x="0" y="115" width="840" height="30" fill="#ceb68f" stroke="#555"/>
    <text x="22" y="136" class="small">removable picture rail / top restraint access datum</text>

    <!-- dado sample on right two fields -->
    <rect x="420" y="365" width="420" height="24" fill="#d8c6a8" stroke="#777"/>
    <text x="450" y="382" class="tiny">optional real horizontal split behind architectural datum</text>

    <!-- skirting -->
    <rect x="0" y="575" width="840" height="65" fill="#c8ac81" stroke="#555"/>
    <text x="22" y="610" class="small">removable solid-timber skirting</text>

    <!-- joint variants -->
    <rect x="202" y="145" width="16" height="430" fill="#3c3c3a"/>
    <text x="115" y="285" class="tiny" transform="rotate(-90 115 285)">J1 fine open reveal</text>

    <rect x="408" y="145" width="24" height="430" fill="#d1b995" stroke="#777"/>
    <text x="325" y="315" class="tiny" transform="rotate(-90 325 315)">J2 removable timber moulding</text>

    <rect x="625" y="145" width="10" height="430" fill="#ad8739"/>
    <text x="548" y="300" class="tiny" transform="rotate(-90 548 300)">J3 functional brass/bronze line</text>

    <!-- socket -->
    <rect x="515" y="460" width="52" height="42" rx="2" fill="#fff" stroke="#555"/>
    <circle cx="532" cy="480" r="4" fill="#777"/>
    <circle cx="550" cy="480" r="4" fill="#777"/>
    <text x="480" y="525" class="tiny">box fixed to service carrier, not decorative panel</text>

    <!-- loads -->
    <rect x="70" y="270" width="80" height="55" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="110" y1="270" x2="110" y2="240" stroke="#555" stroke-width="2"/>
    <text x="52" y="350" class="tiny">ordinary fixing test</text>
  </g>

  <!-- Vertical section -->
  <g transform="translate(980 140)">
    <text x="0" y="-25" class="head">VERTICAL SECTION — PANEL SUPPORT</text>

    <!-- masonry -->
    <rect x="0" y="0" width="130" height="710" fill="url(#masonry)" stroke="#333"/>
    <text x="15" y="30" class="small">permanent</text>
    <text x="15" y="48" class="small">masonry</text>

    <!-- parge -->
    <rect x="130" y="0" width="8" height="710" fill="#9cb6c7" stroke="#4f7185"/>

    <!-- anchors -->
    <line x1="180" y1="150" x2="105" y2="150" stroke="#555" stroke-width="4"/>
    <circle cx="105" cy="150" r="5" fill="#555"/>
    <line x1="180" y1="390" x2="105" y2="390" stroke="#555" stroke-width="4"/>
    <circle cx="105" cy="390" r="5" fill="#555"/>
    <line x1="180" y1="635" x2="105" y2="635" stroke="#555" stroke-width="4"/>
    <circle cx="105" cy="635" r="5" fill="#555"/>

    <!-- rail -->
    <rect x="178" y="70" width="20" height="590" fill="#a5a6a3" stroke="#444"/>
    <text x="205" y="102" class="tiny">adjustable vertical rail</text>

    <!-- mineral wool -->
    <rect x="198" y="70" width="55" height="590" fill="#eee8c5" stroke="#b0a568" stroke-dasharray="5 4"/>

    <!-- panel -->
    <rect x="253" y="70" width="25" height="590" fill="url(#mineral)" stroke="#333" stroke-width="2"/>
    <text x="292" y="210" class="small">dense 12.5 mm</text>
    <text x="292" y="229" class="small">gypsum-fibre</text>
    <text x="292" y="248" class="small">prototype panel</text>

    <!-- top restraint behind picture rail -->
    <rect x="250" y="100" width="72" height="32" fill="#ceb68f" stroke="#555"/>
    <path d="M253 119h-30v-28h-25" stroke="#555" stroke-width="4" fill="none"/>
    <circle cx="211" cy="91" r="4" fill="#555"/>
    <text x="330" y="112" class="tiny">picture rail hides top restraint</text>
    <text x="330" y="128" class="tiny">T1 screw/plate or T2 cleat</text>

    <!-- gravity seat -->
    <path d="M198 620h82v18h-62v22" stroke="#4f5960" stroke-width="7" fill="none"/>
    <rect x="220" y="614" width="58" height="6" fill="#7e8a73"/>
    <text x="330" y="622" class="tiny">lower gravity seat carries dead load</text>
    <text x="330" y="638" class="tiny">thin resilient strip kills rattle</text>

    <!-- skirting -->
    <rect x="240" y="642" width="90" height="62" fill="#c8ac81" stroke="#555"/>
    <text x="338" y="670" class="tiny">removable skirting conceals</text>
    <text x="338" y="686" class="tiny">seat + lower release</text>

    <!-- load arrows -->
    <line x1="266" y1="280" x2="266" y2="598" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="290" y="430" class="tiny">panel dead load</text>

    <line x1="250" y1="162" x2="220" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="330" y="160" class="tiny">top restraint prevents tip-out</text>

    <!-- service -->
    <path d="M210 480 C222 460 230 500 243 478" stroke="#875d3f" stroke-width="3" fill="none"/>
    <text x="330" y="484" class="tiny">shallow service only where justified</text>
  </g>

  <!-- principles -->
  <g transform="translate(60 835)">
    <text x="0" y="0" class="head">MECHANICAL PRINCIPLE</text>
    <text x="0" y="28" class="label">1. panel weight is supported by bearing, not hanging from concealed screws</text>
    <text x="0" y="52" class="label">2. separate top restraint only prevents tip-out / rattle / accidental unseating</text>
    <text x="0" y="76" class="label">3. masonry is penetrated sparsely by backplane anchors; later panel fixings stop at the backplane</text>
    <text x="0" y="100" class="label">4. skirting and picture rail are real removable interface components, not glued decorative covers</text>
    <text x="0" y="124" class="label">5. panel joints remain mechanically truthful: reveal, real moulding or functional metal edge — never filler</text>
  </g>

  <g transform="translate(920 835)">
    <text x="0" y="0" class="head">P01 TESTS</text>
    <text x="0" y="28" class="small">• 10 full removal / reinstall cycles</text>
    <text x="0" y="50" class="small">• filled versus unfilled cavity tap comparison</text>
    <text x="0" y="72" class="small">• ordinary fixing loads</text>
    <text x="0" y="94" class="small">• J1 / J2 / J3 joint comparison</text>
    <text x="0" y="116" class="small">• F1 mineral paint / F2 workshop skim / F3 real timber</text>
    <text x="0" y="138" class="small">• compare directly with excellent plaster control</text>
  </g>

  <rect x="35" y="95" width="1430" height="905" fill="none" stroke="#bbb"/>
</svg>