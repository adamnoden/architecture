<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-labelledby="title desc">
  <title id="title">P04 wall ceiling movement-junction test rig</title>
  <desc id="desc">Diagram showing a full-height 2950 mm wall, independently adjustable ceiling edge, concealed movement gap, removable cornice cover, measurement points and the three comparison families.</desc>
  <style>
    .bg{fill:#fbfaf7}.ink{stroke:#202020;fill:none;stroke-width:2}.thin{stroke:#666;fill:none;stroke-width:1.2}.wall{fill:#e8e3d8;stroke:#3b3731;stroke-width:1.5}.ceil{fill:#efede8;stroke:#3b3731;stroke-width:1.5}.trim{fill:#ddd4c3;stroke:#4f473c;stroke-width:1.5}.metal{fill:#d6d1c4;stroke:#514a3c;stroke-width:1.5}.gap{fill:#fff;stroke:#777;stroke-width:1;stroke-dasharray:5 4}.head{font:600 24px system-ui,sans-serif;fill:#202020}.sub{font:600 17px system-ui,sans-serif;fill:#202020}.txt{font:15px system-ui,sans-serif;fill:#202020}.small{font:13px system-ui,sans-serif;fill:#444}.note{font:12px system-ui,sans-serif;fill:#555}.move{stroke:#202020;stroke-width:2;fill:none;marker-start:url(#a);marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 4 L8 0 L8 8 z" fill="#202020"/></marker></defs>
  <rect class="bg" width="1300" height="860"/>
  <text x="55" y="48" class="head">P04 — wall / ceiling movement-junction test rig</text>
  <text x="55" y="74" class="small">Full-height Reference House room corner · 2950 mm ceiling datum · adjustable ceiling edge · conventional control + concealed-slip + functional-metal challenger.</text>

  <g transform="translate(70 130)">
    <text x="0" y="0" class="sub">Representative rig section</text>
    <rect x="25" y="55" width="150" height="520" class="wall"/>
    <rect x="175" y="55" width="470" height="90" class="ceil"/>
    <rect x="170" y="135" width="22" height="24" class="gap"/>
    <path d="M160 128 C205 118 238 122 270 142 L270 180 C225 160 195 160 160 171 Z" class="trim"/>
    <line x1="160" y1="128" x2="160" y2="171" class="ink"/>
    <text x="292" y="154" class="small">removable cover / cornice</text>
    <text x="207" y="198" class="small">hidden slip / movement zone</text>
    <line x1="530" y1="45" x2="530" y2="170" class="move"/>
    <text x="548" y="105" class="small">controlled ceiling-edge</text>
    <text x="548" y="124" class="small">vertical displacement</text>
    <line x1="175" y1="55" x2="175" y2="575" class="thin"/>
    <text x="0" y="612" class="small">wall remains fixed; ceiling support moves independently</text>
    <text x="0" y="636" class="small">rig capability ≥ ±5 mm · measurement resolution ≤ 0.5 mm</text>
  </g>

  <g transform="translate(760 130)">
    <text x="0" y="0" class="sub">A — conventional control</text>
    <rect x="0" y="40" width="75" height="130" class="wall"/>
    <rect x="75" y="40" width="180" height="45" class="ceil"/>
    <line x1="75" y1="85" x2="75" y2="98" class="ink"/>
    <text x="0" y="198" class="small">Best ordinary junction available.</text>

    <text x="0" y="255" class="sub">B — concealed slip</text>
    <rect x="0" y="295" width="75" height="130" class="wall"/>
    <rect x="75" y="295" width="180" height="45" class="ceil"/>
    <rect x="70" y="334" width="14" height="16" class="gap"/>
    <path d="M58 326 C95 316 118 320 145 337 L145 365 C108 349 84 349 58 360 Z" class="trim"/>
    <text x="0" y="454" class="small">Cover fixed to one controlling assembly only.</text>

    <text x="0" y="510" class="sub">C — functional metal challenger</text>
    <rect x="0" y="550" width="75" height="130" class="wall"/>
    <rect x="75" y="550" width="180" height="45" class="ceil"/>
    <rect x="67" y="588" width="18" height="28" class="metal"/>
    <text x="0" y="708" class="small">Metal must protect / locate / slip / release.</text>
    <text x="0" y="730" class="small">If it only decorates the joint, reject it.</text>
  </g>

  <g transform="translate(70 790)">
    <text x="0" y="0" class="txt">Test sequence: baseline quality → movement screen → 20 cycles → decoration-lock → 10 removal/reinstatement cycles → imperfect background → over-range failure/repair.</text>
  </g>
</svg>