<svg xmlns="http://www.w3.org/2000/svg" width="128mm" height="78mm" viewBox="0 0 128 78" role="img" aria-labelledby="title desc">
  <title id="title">Selective permanence and the architectural platform</title>
  <desc id="desc">Four qualitative temporal layers from permanent fabric to fit-out and wear. Ordinary renewal in faster layers stops at the designed interface; unavoidable crossings into permanent fabric remain sparse, deliberate and documented.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 3 3" refX="2.7" refY="1.5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M 0 0 L 3 1.5 L 0 3 z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .label{font-size:2.646px;font-weight:600}
      .note{font-size:2.293px}
      .rule{stroke:#000;stroke-width:.25;fill:none}
      .secondary{stroke:#000;stroke-width:.18;fill:none}
      .dash{stroke:#000;stroke-width:.18;fill:none;stroke-dasharray:1.6 1.2}
    </style>
  </defs>

  <text x="9" y="5.5" class="note">SLOWER / MORE ENDURING</text>
  <line x1="5.2" y1="8" x2="5.2" y2="68.5" class="secondary" marker-end="url(#arrow)"/>
  <text x="9" y="73.5" class="note">FASTER / MORE RENEWABLE</text>

  <rect x="9" y="8" width="68" height="12" class="rule"/>
  <text x="12" y="13" class="label">Permanent fabric</text>
  <text x="12" y="17.1" class="note">structure · major masonry · primary floors / roof</text>

  <rect x="9" y="23" width="68" height="12" class="rule"/>
  <text x="12" y="28" class="label">Interface infrastructure</text>
  <text x="12" y="32.1" class="note">bearings · backplanes · sleeves · fixing zones</text>

  <rect x="9" y="38" width="68" height="12" class="secondary"/>
  <text x="12" y="43" class="label">Replaceable systems</text>
  <text x="12" y="47.1" class="note">plant · distribution · controls · selected assemblies</text>

  <rect x="9" y="53" width="68" height="12" class="secondary"/>
  <text x="12" y="58" class="label">Fit-out and wear</text>
  <text x="12" y="62.1" class="note">finishes · fittings · appliances · seals</text>

  <path d="M 124 67 C 124 49, 103 34, 80 30" class="rule" marker-end="url(#arrow)"/>
  <text x="83" y="60.5" class="label">ordinary renewal</text>
  <text x="83" y="64" class="note">stops at the designed interface</text>

  <path d="M 124 54 C 124 32, 104 19, 80 15" class="dash" marker-end="url(#arrow)"/>
  <text x="83" y="46.5" class="label">unavoidable crossing</text>
  <text x="83" y="50" class="note">sparse · deliberate · documented</text>
</svg>
