<svg xmlns="http://www.w3.org/2000/svg" width="128mm" height="78mm" viewBox="0 0 128 78" role="img" aria-labelledby="title desc">
  <title id="title">Failure architecture sequence</title>
  <desc id="desc">A qualitative review sequence from avoidance and passive defence through a failure event to localisation, revelation and isolation, followed by repair, drying and reinstatement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 3 3" refX="2.7" refY="1.5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M 0 0 L 3 1.5 L 0 3 z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .label{font-size:2.646px;font-weight:600}
      .note{font-size:2.293px}
      .rule{stroke:#000;stroke-width:.25;fill:none}
      .secondary{stroke:#000;stroke-width:.18;fill:none}
      .dash{stroke:#000;stroke-width:.18;fill:none;stroke-dasharray:1.6 1.2}
    </style>
  </defs>

  <text x="2" y="6" class="note">FIRST DEFENCE</text>
  <line x1="2" y1="8" x2="49" y2="8" class="secondary"/>

  <rect x="2" y="12" width="19" height="16" class="rule"/>
  <text x="11.5" y="18" text-anchor="middle" class="label">Avoid</text>
  <text x="11.5" y="22.3" text-anchor="middle" class="note">remove needless</text>
  <text x="11.5" y="25.5" text-anchor="middle" class="note">sources</text>

  <rect x="27" y="12" width="24" height="16" class="rule"/>
  <text x="39" y="18" text-anchor="middle" class="label">Passive defence</text>
  <text x="39" y="22.3" text-anchor="middle" class="note">fall · shed · drain</text>
  <text x="39" y="25.5" text-anchor="middle" class="note">robust primary joint</text>

  <line x1="21" y1="20" x2="27" y2="20" class="rule" marker-end="url(#arrow)"/>
  <line x1="51" y1="20" x2="57" y2="20" class="rule" marker-end="url(#arrow)"/>

  <line x1="60" y1="9" x2="60" y2="31" class="dash"/>
  <circle cx="60" cy="20" r="1.4" fill="#000"/>
  <text x="60" y="35" text-anchor="middle" class="note">FAILURE EVENT</text>

  <text x="66" y="6" class="note">SECOND CONSEQUENCE</text>
  <line x1="66" y1="8" x2="126" y2="8" class="secondary"/>

  <rect x="66" y="12" width="18" height="16" class="rule"/>
  <text x="75" y="18" text-anchor="middle" class="label">Localise</text>
  <text x="75" y="22.3" text-anchor="middle" class="note">limit</text>
  <text x="75" y="25.5" text-anchor="middle" class="note">consequence</text>

  <rect x="87" y="12" width="18" height="16" class="rule"/>
  <text x="96" y="18" text-anchor="middle" class="label">Reveal</text>
  <text x="96" y="22.3" text-anchor="middle" class="note">make abnormal</text>
  <text x="96" y="25.5" text-anchor="middle" class="note">knowable</text>

  <rect x="108" y="12" width="18" height="16" class="rule"/>
  <text x="117" y="18" text-anchor="middle" class="label">Isolate</text>
  <text x="117" y="22.3" text-anchor="middle" class="note">stop event</text>
  <text x="117" y="25.5" text-anchor="middle" class="note">spreading</text>

  <line x1="61.5" y1="20" x2="66" y2="20" class="rule" marker-end="url(#arrow)"/>
  <line x1="84" y1="20" x2="87" y2="20" class="rule" marker-end="url(#arrow)"/>
  <line x1="105" y1="20" x2="108" y2="20" class="rule" marker-end="url(#arrow)"/>

  <text x="2" y="44" class="note">RECOVERY</text>
  <line x1="2" y1="46" x2="104" y2="46" class="secondary"/>
  <line x1="113" y1="46" x2="126" y2="46" class="secondary"/>

  <rect x="91" y="51" width="35" height="16" class="rule"/>
  <text x="108.5" y="57" text-anchor="middle" class="label">Reach + repair</text>
  <text x="108.5" y="61.3" text-anchor="middle" class="note">access · diagnose · renew</text>

  <rect x="48" y="51" width="35" height="16" class="rule"/>
  <text x="65.5" y="57" text-anchor="middle" class="label">Drain + dry</text>
  <text x="65.5" y="61.3" text-anchor="middle" class="note">remove retained water</text>

  <rect x="5" y="51" width="35" height="16" class="rule"/>
  <text x="22.5" y="57" text-anchor="middle" class="label">Reinstate</text>
  <text x="22.5" y="61.3" text-anchor="middle" class="note">restore boundaries</text>

  <path d="M 117 28 L 117 42 L 108.5 42 L 108.5 51" class="rule" marker-end="url(#arrow)"/>
  <line x1="91" y1="59" x2="83" y2="59" class="rule" marker-end="url(#arrow)"/>
  <line x1="48" y1="59" x2="40" y2="59" class="rule" marker-end="url(#arrow)"/>
</svg>
