<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Failure architecture sequence</title>
  <desc id="desc">A qualitative sequence from avoiding a failure source and passive first defence through a failure event to local containment, visible detection, isolation, access and repair, then drainage, drying and reinstatement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .head{font:700 24px Arial,Helvetica,sans-serif;fill:#111}
      .label{font:600 22px Arial,Helvetica,sans-serif;fill:#111}
      .small{font:19px Arial,Helvetica,sans-serif;fill:#444}
      .tiny{font:17px Arial,Helvetica,sans-serif;fill:#555}
      .rule{stroke:#111;stroke-width:3;fill:none}
      .dash{stroke:#777;stroke-width:2.5;fill:none;stroke-dasharray:9 8}
    </style>
  </defs>

  <text x="90" y="75" class="head">FIRST DEFENCE</text>
  <line x1="90" y1="95" x2="555" y2="95" class="rule"/>

  <rect x="90" y="145" width="210" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="195" y="190" text-anchor="middle" class="label">Avoid</text>
  <text x="195" y="220" text-anchor="middle" class="small">remove needless</text>
  <text x="195" y="247" text-anchor="middle" class="small">failure sources</text>

  <rect x="350" y="145" width="250" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="475" y="190" text-anchor="middle" class="label">Passive defence</text>
  <text x="475" y="220" text-anchor="middle" class="small">fall · shed · drain ·</text>
  <text x="475" y="247" text-anchor="middle" class="small">robust primary joint</text>

  <line x1="300" y1="205" x2="350" y2="205" class="rule" marker-end="url(#arrow)"/>

  <line x1="665" y1="105" x2="665" y2="665" class="dash"/>
  <text x="665" y="82" text-anchor="middle" class="head">IF IT FAILS</text>
  <circle cx="665" cy="205" r="20" fill="#111"/>
  <line x1="600" y1="205" x2="640" y2="205" class="rule" marker-end="url(#arrow)"/>

  <text x="760" y="75" class="head">SECOND CONSEQUENCE</text>
  <line x1="760" y1="95" x2="1410" y2="95" class="rule"/>

  <rect x="750" y="145" width="190" height="120" rx="4" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
  <text x="845" y="190" text-anchor="middle" class="label">Localise</text>
  <text x="845" y="220" text-anchor="middle" class="small">contain / limit</text>
  <text x="845" y="247" text-anchor="middle" class="small">the consequence</text>

  <rect x="990" y="145" width="190" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1085" y="190" text-anchor="middle" class="label">Reveal</text>
  <text x="1085" y="220" text-anchor="middle" class="small">make abnormal</text>
  <text x="1085" y="247" text-anchor="middle" class="small">operation knowable</text>

  <rect x="1230" y="145" width="180" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1320" y="190" text-anchor="middle" class="label">Isolate</text>
  <text x="1320" y="220" text-anchor="middle" class="small">stop the event</text>
  <text x="1320" y="247" text-anchor="middle" class="small">from spreading</text>

  <line x1="685" y1="205" x2="750" y2="205" class="rule" marker-end="url(#arrow)"/>
  <line x1="940" y1="205" x2="990" y2="205" class="rule" marker-end="url(#arrow)"/>
  <line x1="1180" y1="205" x2="1230" y2="205" class="rule" marker-end="url(#arrow)"/>

  <path d="M 1320 265 L 1320 350 L 1170 350" class="rule" marker-end="url(#arrow)"/>

  <rect x="930" y="320" width="240" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1050" y="365" text-anchor="middle" class="label">Reach + repair</text>
  <text x="1050" y="395" text-anchor="middle" class="small">diagnose · disconnect ·</text>
  <text x="1050" y="422" text-anchor="middle" class="small">remove / renew</text>

  <rect x="630" y="320" width="240" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="750" y="365" text-anchor="middle" class="label">Drain + dry</text>
  <text x="750" y="395" text-anchor="middle" class="small">remove retained water</text>
  <text x="750" y="422" text-anchor="middle" class="small">and expose wetting</text>

  <rect x="330" y="320" width="240" height="120" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="450" y="365" text-anchor="middle" class="label">Reinstate</text>
  <text x="450" y="395" text-anchor="middle" class="small">restore boundaries</text>
  <text x="450" y="422" text-anchor="middle" class="small">and close cleanly</text>

  <line x1="930" y1="380" x2="870" y2="380" class="rule" marker-end="url(#arrow)"/>
  <line x1="630" y1="380" x2="570" y2="380" class="rule" marker-end="url(#arrow)"/>

  <text x="90" y="535" class="label">Base layer: physical damage limitation</text>
  <text x="90" y="568" class="small">Geometry, locality and a credible recovery path continue to exist when power, sensors or networks do not.</text>

  <text x="90" y="630" class="label">Supplement where consequence warrants it</text>
  <text x="90" y="663" class="small">Detection and automation can shorten the event, but they do not replace a safe physical arrangement.</text>

  <text x="90" y="726" class="tiny">Review logic only — not a prescribed plumbing, drainage or control topology.</text>
</svg>