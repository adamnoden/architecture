<svg xmlns="http://www.w3.org/2000/svg" width="128mm" height="78mm" viewBox="0 0 128 78" role="img" aria-labelledby="title desc">
  <title id="title">Pattern language fields and one generative service-topology sequence</title>
  <desc id="desc">Five editorial fields organise twenty-one active patterns on the left. On the right, one service-topology sequence runs from demand mapping through utility entry, distribution, failure design and stewardship, with an explicit rewind. Strategies and held candidates remain outside the canonical count.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 3 3" refX="2.7" refY="1.5" markerWidth="2.4" markerHeight="2.4" orient="auto"><path d="M 0 0 L 3 1.5 L 0 3 z" fill="#000"/></marker>
    <marker id="openArrow" viewBox="0 0 3 3" refX="2.7" refY="1.5" markerWidth="2.4" markerHeight="2.4" orient="auto"><path d="M .2 .2 L 2.8 1.5 L .2 2.8" fill="none" stroke="#000" stroke-width=".25"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .label{font-size:2.646px;font-weight:600}
      .note{font-size:2.293px}
      .rule{stroke:#000;stroke-width:.25;fill:none}
      .secondary{stroke:#000;stroke-width:.18;fill:none}
      .dash{stroke:#000;stroke-width:.18;fill:none;stroke-dasharray:1.6 1.2}
    </style>
  </defs>

  <text x="2" y="5.5" class="label">EDITORIAL FIELDS</text>
  <text x="55" y="5.5" text-anchor="end" class="note">21 ACTIVE PATTERNS</text>
  <line x1="2" y1="8" x2="56" y2="8" class="secondary"/>

  <text x="2" y="13" class="label">A · Service geography &amp; distribution</text>
  <line x1="2" y1="16" x2="56" y2="16" class="secondary"/>
  <text x="2" y="21" class="label">B · Water, leakage &amp; failure</text>
  <line x1="2" y1="24" x2="56" y2="24" class="secondary"/>
  <text x="2" y="29" class="label">C · Openings, movement &amp; attachment</text>
  <line x1="2" y1="32" x2="56" y2="32" class="secondary"/>
  <text x="2" y="37" class="label">D · Environment &amp; external maintenance</text>
  <line x1="2" y1="40" x2="56" y2="40" class="secondary"/>
  <text x="2" y="45" class="label">E · Stewardship</text>
  <line x1="2" y1="48" x2="56" y2="48" class="secondary"/>

  <text x="2" y="53" class="note">Fields aid reading; they are not a taxonomy.</text>
  <text x="2" y="61" class="label">Strategies · 3</text>
  <text x="2" y="64.5" class="note">coordinate several patterns</text>
  <text x="2" y="70" class="label">Held candidates · 4</text>
  <text x="2" y="73.5" class="note">unresolved · outside canonical 21</text>

  <line x1="60" y1="2" x2="60" y2="76" class="secondary"/>
  <text x="64" y="5.5" class="label">ONE SERVICE-TOPOLOGY SEQUENCE</text>
  <line x1="64" y1="8" x2="126" y2="8" class="secondary"/>

  <line x1="67" y1="12" x2="67" y2="70" class="rule" marker-end="url(#arrow)"/>
  <circle cx="67" cy="12" r=".65" fill="#000"/><text x="71" y="12.8" class="label">Map service demand</text>
  <circle cx="67" cy="18.3" r=".65" fill="#000"/><text x="71" y="19.1" class="note">Controlled Utility Entry</text>
  <circle cx="67" cy="24.6" r=".65" fill="#000"/><text x="71" y="25.4" class="note">Plant Room as Service Hub</text>
  <circle cx="67" cy="30.9" r=".65" fill="#000"/><text x="71" y="31.7" class="note">Accessible Vertical Service Zone</text>
  <circle cx="67" cy="37.2" r=".65" fill="#000"/><text x="71" y="38" class="note">High-Service-Room Service Wall</text>
  <circle cx="67" cy="43.5" r=".65" fill="#000"/><text x="71" y="44.3" class="note">Coherent Horizontal Service Route</text>
  <circle cx="67" cy="49.8" r=".65" fill="#000"/><text x="71" y="50.2" class="note">Compartmented Service Void +</text><text x="71" y="52.8" class="note">Designed Structural Penetration</text>
  <circle cx="67" cy="57.2" r=".65" fill="#000"/><text x="71" y="57.6" class="note">Visible Leakage Path +</text><text x="71" y="60.2" class="note">Failure-Tolerant Wet Service Room</text>
  <circle cx="67" cy="64.6" r=".65" fill="#000"/><text x="71" y="65.4" class="note">Accessible Room Service Route</text>
  <circle cx="67" cy="70.9" r=".65" fill="#000"/><text x="71" y="71.7" class="note">Physical Service Index</text>

  <path d="M 123 44 C 127 44, 127 25, 123 25" class="dash" marker-end="url(#openArrow)"/>
  <text x="124" y="35.8" text-anchor="end" class="note">REWIND</text>
</svg>
