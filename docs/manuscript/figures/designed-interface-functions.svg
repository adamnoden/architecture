<svg xmlns="http://www.w3.org/2000/svg" width="128mm" height="78mm" viewBox="0 0 128 78" role="img" aria-labelledby="title desc">
  <title id="title">The designed interface as a functional element</title>
  <desc id="desc">Two assemblies meet through a deliberate interface. Six functional duties are assigned explicitly: support, restraint, movement, boundary continuity, tolerance, and fixing and removal.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#000}
    .label{font-size:2.646px;font-weight:600}
    .note{font-size:2.293px}
    .rule{stroke:#000;stroke-width:.25;fill:none}
    .secondary{stroke:#000;stroke-width:.18;fill:none}
  </style>

  <rect x="2" y="26" width="25" height="26" class="rule"/>
  <text x="14.5" y="35" text-anchor="middle" class="label">Assembly A</text>
  <text x="14.5" y="39.5" text-anchor="middle" class="note">longer-lived</text>
  <text x="14.5" y="43" text-anchor="middle" class="note">supporting</text>
  <text x="14.5" y="46.5" text-anchor="middle" class="note">or simply different</text>

  <rect x="101" y="26" width="25" height="26" class="rule"/>
  <text x="113.5" y="35" text-anchor="middle" class="label">Assembly B</text>
  <text x="113.5" y="39.5" text-anchor="middle" class="note">moving</text>
  <text x="113.5" y="43" text-anchor="middle" class="note">replaceable</text>
  <text x="113.5" y="46.5" text-anchor="middle" class="note">or simply different</text>

  <line x1="27" y1="39" x2="31" y2="39" class="rule"/>
  <line x1="97" y1="39" x2="101" y2="39" class="rule"/>

  <rect x="31" y="4" width="66" height="70" class="rule"/>
  <text x="64" y="10" text-anchor="middle" class="label">DESIGNED INTERFACE</text>
  <line x1="31" y1="14" x2="97" y2="14" class="secondary"/>

  <text x="34" y="20" class="label">Support</text>
  <text x="60" y="20" class="note">gravity load path</text>
  <line x1="31" y1="24" x2="97" y2="24" class="secondary"/>

  <text x="34" y="30" class="label">Restraint</text>
  <text x="60" y="30" class="note">held · direction</text>
  <line x1="31" y1="34" x2="97" y2="34" class="secondary"/>

  <text x="34" y="40" class="label">Movement</text>
  <text x="60" y="40" class="note">harmless movement allowed</text>
  <line x1="31" y1="44" x2="97" y2="44" class="secondary"/>

  <text x="34" y="50" class="label">Boundaries</text>
  <text x="60" y="50" class="note">safety / environmental continuity</text>
  <line x1="31" y1="54" x2="97" y2="54" class="secondary"/>

  <text x="34" y="60" class="label">Tolerance</text>
  <text x="60" y="60" class="note">construction variation absorbed</text>
  <line x1="31" y1="64" x2="97" y2="64" class="secondary"/>

  <text x="34" y="70" class="label">Fixing + removal</text>
  <text x="60" y="70" class="note">access · release · replacement</text>
</svg>
