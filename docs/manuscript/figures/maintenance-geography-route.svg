<svg xmlns="http://www.w3.org/2000/svg" width="128mm" height="78mm" viewBox="0 0 128 78" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance geography as four connected geometries</title>
  <desc id="desc">Four plan-like diagrams show approach, working space, disconnection clearance and withdrawal around the same replaceable component. A continuous route links the four task geometries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 3 3" refX="2.7" refY="1.5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M 0 0 L 3 1.5 L 0 3 z" fill="#000"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .label{font-size:2.646px;font-weight:600}
      .note{font-size:2.293px}
      .rule{stroke:#000;stroke-width:.25;fill:none}
      .secondary{stroke:#000;stroke-width:.18;fill:none}
      .dash{stroke:#000;stroke-width:.18;fill:none;stroke-dasharray:1.6 1.2}
    </style>
  </defs>

  <text x="16" y="6" text-anchor="middle" class="label">1 · Approach</text>
  <text x="48" y="6" text-anchor="middle" class="label">2 · Working space</text>
  <text x="80" y="6" text-anchor="middle" class="label">3 · Disconnection</text>
  <text x="112" y="6" text-anchor="middle" class="label">4 · Withdrawal</text>

  <g transform="translate(2 11)">
    <rect x="0" y="0" width="28" height="38" class="rule"/>
    <path d="M 0 24 H 7" stroke="#fff" stroke-width="1.2"/>
    <line x1="0" y1="24" x2="7" y2="24" class="dash" marker-end="url(#arrow)"/>
    <rect x="19" y="14" width="5" height="7" class="rule"/>
    <text x="21.5" y="18.4" text-anchor="middle" class="note">item</text>
    <path d="M 7 24 C 12 24, 13 18, 18.5 18" class="rule" marker-end="url(#arrow)"/>
    <text x="14" y="34.5" text-anchor="middle" class="note">reach</text>
  </g>

  <g transform="translate(34 11)">
    <rect x="0" y="0" width="28" height="38" class="rule"/>
    <rect x="19" y="14" width="5" height="7" class="rule"/>
    <text x="21.5" y="18.4" text-anchor="middle" class="note">item</text>
    <rect x="7" y="9" width="9" height="17" rx="4.5" class="dash"/>
    <circle cx="11.5" cy="12.2" r="1.2" fill="#000"/>
    <line x1="11.5" y1="13.4" x2="11.5" y2="20.5" class="rule"/>
    <line x1="11.5" y1="16.2" x2="15.8" y2="15" class="rule"/>
    <text x="14" y="34.5" text-anchor="middle" class="note">work</text>
  </g>

  <g transform="translate(66 11)">
    <rect x="0" y="0" width="28" height="38" class="rule"/>
    <line x1="10" y1="10" x2="10" y2="27" class="dash"/>
    <line x1="10" y1="10" x2="13" y2="10" class="dash"/>
    <line x1="10" y1="27" x2="13" y2="27" class="dash"/>
    <text x="6.2" y="19.5" text-anchor="middle" class="note">clear</text>
    <rect x="15" y="14" width="5" height="7" class="rule"/>
    <text x="17.5" y="18.4" text-anchor="middle" class="note">item</text>
    <line x1="20" y1="15.5" x2="24.5" y2="15.5" class="rule"/>
    <line x1="20" y1="19.5" x2="24.5" y2="19.5" class="rule"/>
    <path d="M 23 14.3 l 1.5 1.2 l -1.5 1.2" class="secondary"/>
    <path d="M 23 18.3 l 1.5 1.2 l -1.5 1.2" class="secondary"/>
    <text x="14" y="34.5" text-anchor="middle" class="note">release</text>
  </g>

  <g transform="translate(98 11)">
    <rect x="0" y="0" width="28" height="38" class="rule"/>
    <path d="M 28 24 H 21" stroke="#fff" stroke-width="1.2"/>
    <rect x="5" y="14" width="5" height="7" class="rule"/>
    <text x="7.5" y="18.4" text-anchor="middle" class="note">item</text>
    <rect x="13" y="15" width="5" height="7" class="dash"/>
    <path d="M 10.5 18 H 18 C 21 18, 23 21, 27 23.5" class="rule" marker-end="url(#arrow)"/>
    <text x="14" y="34.5" text-anchor="middle" class="note">remove</text>
  </g>

  <line x1="16" y1="62" x2="112" y2="62" class="rule" marker-end="url(#arrow)"/>
  <circle cx="16" cy="62" r=".65" fill="#000"/>
  <circle cx="48" cy="62" r=".65" fill="#000"/>
  <circle cx="80" cy="62" r=".65" fill="#000"/>
  <circle cx="112" cy="62" r=".65" fill="#000"/>
  <text x="64" y="69" text-anchor="middle" class="label">ONE CONTINUOUS MAINTENANCE ROUTE</text>
  <text x="64" y="73.3" text-anchor="middle" class="note">approach · work · disconnect · withdraw</text>
</svg>
