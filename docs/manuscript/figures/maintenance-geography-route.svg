<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance geography as four connected geometries</title>
  <desc id="desc">Four small plan-like diagrams show approach, working space, disconnection clearance and withdrawal route around the same replaceable component. The four geometries form one continuous maintenance route.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .head{font:700 25px Arial,Helvetica,sans-serif;fill:#111}
      .label{font:600 22px Arial,Helvetica,sans-serif;fill:#111}
      .small{font:19px Arial,Helvetica,sans-serif;fill:#444}
      .tiny{font:17px Arial,Helvetica,sans-serif;fill:#555}
      .wall{stroke:#111;stroke-width:5;fill:none}
      .rule{stroke:#111;stroke-width:3;fill:none}
      .soft{stroke:#777;stroke-width:2.5;fill:none}
      .dash{stroke:#555;stroke-width:2.5;fill:none;stroke-dasharray:10 8}
    </style>
  </defs>

  <text x="750" y="68" text-anchor="middle" class="head">ONE MAINTENANCE ROUTE — FOUR GEOMETRIES</text>
  <line x1="120" y1="92" x2="1380" y2="92" class="soft"/>

  <!-- 1 Approach -->
  <g transform="translate(70 140)">
    <text x="155" y="0" text-anchor="middle" class="label">1 · Approach</text>
    <rect x="0" y="40" width="310" height="330" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M 0 225 H 95" stroke="#fff" stroke-width="9"/>
    <line x1="0" y1="225" x2="95" y2="225" class="dash" marker-end="url(#arrow)"/>
    <rect x="205" y="135" width="65" height="85" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
    <text x="237" y="180" text-anchor="middle" class="tiny">item</text>
    <path d="M 95 225 C 145 225 155 180 196 180" class="rule" marker-end="url(#arrow)"/>
    <text x="155" y="408" text-anchor="middle" class="small">person + tools can reach it</text>
  </g>

  <!-- 2 Working -->
  <g transform="translate(430 140)">
    <text x="155" y="0" text-anchor="middle" class="label">2 · Working space</text>
    <rect x="0" y="40" width="310" height="330" fill="#fff" stroke="#111" stroke-width="3"/>
    <rect x="205" y="135" width="65" height="85" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
    <text x="237" y="180" text-anchor="middle" class="tiny">item</text>
    <rect x="95" y="105" width="95" height="145" rx="45" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="142" cy="142" r="14" fill="#111"/>
    <line x1="142" y1="158" x2="142" y2="212" class="rule"/>
    <line x1="142" y1="180" x2="178" y2="170" class="rule"/>
    <text x="155" y="408" text-anchor="middle" class="small">body + posture + tools fit</text>
  </g>

  <!-- 3 Disconnection -->
  <g transform="translate(790 140)">
    <text x="155" y="0" text-anchor="middle" class="label">3 · Disconnection</text>
    <rect x="0" y="40" width="310" height="330" fill="#fff" stroke="#111" stroke-width="3"/>
    <rect x="175" y="135" width="65" height="85" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
    <text x="207" y="180" text-anchor="middle" class="tiny">item</text>
    <line x1="240" y1="155" x2="282" y2="155" class="rule"/>
    <line x1="240" y1="200" x2="282" y2="200" class="rule"/>
    <path d="M 268 142 l 14 13 l -14 13" class="soft"/>
    <path d="M 268 187 l 14 13 l -14 13" class="soft"/>
    <line x1="140" y1="115" x2="140" y2="245" class="dash"/>
    <line x1="140" y1="115" x2="170" y2="115" class="dash"/>
    <line x1="140" y1="245" x2="170" y2="245" class="dash"/>
    <text x="92" y="187" text-anchor="middle" class="tiny">clearance</text>
    <text x="155" y="408" text-anchor="middle" class="small">connections can actually release</text>
  </g>

  <!-- 4 Withdrawal -->
  <g transform="translate(1150 140)">
    <text x="155" y="0" text-anchor="middle" class="label">4 · Withdrawal</text>
    <rect x="0" y="40" width="310" height="330" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M 310 225 H 230" stroke="#fff" stroke-width="9"/>
    <rect x="62" y="135" width="65" height="85" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
    <text x="94" y="180" text-anchor="middle" class="tiny">item</text>
    <rect x="148" y="145" width="65" height="85" fill="none" stroke="#777" stroke-width="2.5" stroke-dasharray="8 7"/>
    <path d="M 128 180 H 220 C 252 180 268 205 300 220" class="rule" marker-end="url(#arrow)"/>
    <text x="155" y="408" text-anchor="middle" class="small">old item leaves; replacement arrives</text>
  </g>

  <line x1="225" y1="630" x2="1275" y2="630" class="rule" marker-end="url(#arrow)"/>
  <circle cx="225" cy="630" r="6" fill="#111"/>
  <circle cx="585" cy="630" r="6" fill="#111"/>
  <circle cx="945" cy="630" r="6" fill="#111"/>
  <circle cx="1275" cy="630" r="6" fill="#111"/>

  <text x="750" y="690" text-anchor="middle" class="label">Access is only as good as the weakest geometry in the route.</text>
  <text x="750" y="728" text-anchor="middle" class="small">The route may extend through rooms, doors, stairs, roofs, courtyards, landscape and the site entrance.</text>
  <text x="750" y="766" text-anchor="middle" class="tiny">Diagram is qualitative: clearances depend on the actual task, person, tool and component.</text>
</svg>