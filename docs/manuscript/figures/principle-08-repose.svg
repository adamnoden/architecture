<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Principle 8 — Repose review</title>
  <desc id="desc">Architectural section with six numbered review domains: physical environment, spatial comprehension, privacy and retreat, local control, apparent structural equilibrium, and technical expression. Evidence strength is stated in the legend.</desc>

  <rect width="1440" height="900" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="72" y="78" font-size="22" letter-spacing="2.6">PRINCIPLE 8</text>
    <text x="72" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="42">Design for repose</text>
    <text x="72" y="160" font-size="18">A review of the demands an ordinary room places on its occupant</text>
  </g>

  <line x1="72" y1="192" x2="1368" y2="192" stroke="#111111" stroke-width="1.5"/>

  <!-- room section -->
  <g stroke="#171717" fill="none" stroke-width="3">
    <line x1="92" y1="704" x2="802" y2="704"/>
    <line x1="122" y1="260" x2="122" y2="704"/>
    <line x1="122" y1="260" x2="790" y2="260"/>
    <line x1="790" y1="260" x2="790" y2="704"/>

    <!-- expressed beam and supports -->
    <rect x="148" y="286" width="612" height="34" fill="#f3f3f3"/>
    <rect x="168" y="320" width="34" height="384" fill="#f7f7f7"/>
    <rect x="706" y="320" width="34" height="384" fill="#f7f7f7"/>

    <!-- window -->
    <rect x="244" y="372" width="198" height="214"/>
    <line x1="343" y1="372" x2="343" y2="586"/>
    <line x1="244" y1="479" x2="442" y2="479"/>
    <!-- exterior shade -->
    <line x1="226" y1="348" x2="460" y2="348"/>
    <line x1="234" y1="348" x2="234" y2="380"/>
    <line x1="452" y1="348" x2="452" y2="380"/>

    <!-- door / retreat boundary -->
    <line x1="598" y1="448" x2="598" y2="704"/>
    <line x1="598" y1="448" x2="682" y2="448"/>
    <path d="M598 704 A116 116 0 0 1 682 620" stroke-width="1.5"/>

    <!-- chair -->
    <path d="M468 620 L494 620 L510 666 L466 666 Z" fill="#f2f2f2"/>
    <line x1="472" y1="666" x2="464" y2="704"/>
    <line x1="504" y1="666" x2="512" y2="704"/>
    <path d="M464 620 L454 566 L486 566 L494 620" fill="#f2f2f2"/>

    <!-- local controls -->
    <rect x="548" y="520" width="28" height="38" rx="2"/>
    <line x1="555" y1="532" x2="569" y2="532" stroke-width="1.5"/>
    <circle cx="562" cy="547" r="5" stroke-width="1.5"/>

    <!-- service panel -->
    <rect x="688" y="550" width="52" height="92" stroke-width="1.5"/>
    <circle cx="731" cy="596" r="2" fill="#171717"/>

    <!-- daylight rays -->
    <g stroke-width="1.5">
      <line x1="78" y1="400" x2="238" y2="446"/>
      <line x1="78" y1="438" x2="238" y2="470"/>
      <line x1="78" y1="476" x2="238" y2="494"/>
    </g>

    <!-- noise wave outside -->
    <g stroke-width="1.5">
      <path d="M84 548 q18 -18 36 0"/>
      <path d="M74 570 q28 -28 56 0"/>
      <path d="M64 594 q38 -38 76 0"/>
    </g>
  </g>

  <!-- callout leaders -->
  <g stroke="#555555" fill="none" stroke-width="1.4">
    <path d="M292 428 L214 320 L126 320"/>
    <path d="M620 466 L638 382 L802 382"/>
    <path d="M628 584 L640 626 L802 626"/>
    <path d="M560 538 L518 448 L458 448"/>
    <path d="M454 302 L510 234 L802 234"/>
    <path d="M714 592 L770 548 L802 548"/>
  </g>

  <!-- callout numbers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g><circle cx="112" cy="320" r="15" fill="#111111"/><text x="112" y="325" fill="#ffffff">1</text></g>
    <g><circle cx="817" cy="382" r="15" fill="#111111"/><text x="817" y="387" fill="#ffffff">2</text></g>
    <g><circle cx="817" cy="626" r="15" fill="#111111"/><text x="817" y="631" fill="#ffffff">3</text></g>
    <g><circle cx="443" cy="448" r="15" fill="#111111"/><text x="443" y="453" fill="#ffffff">4</text></g>
    <g><circle cx="817" cy="234" r="15" fill="#111111"/><text x="817" y="239" fill="#ffffff">5</text></g>
    <g><circle cx="817" cy="548" r="15" fill="#111111"/><text x="817" y="553" fill="#ffffff">6</text></g>
  </g>

  <!-- legend -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="884" y="246" font-size="15" font-weight="700">5  APPARENT EQUILIBRIUM</text>
    <text x="884" y="270" font-size="14">Does expressed structure read as plausibly supported?</text>
    <text x="884" y="292" font-size="12" letter-spacing="1.2">DOCTRINE HYPOTHESIS</text>

    <text x="884" y="354" font-size="15" font-weight="700">1  PHYSICAL ENVIRONMENT</text>
    <text x="884" y="378" font-size="14">Heat, air, noise, daylight and glare.</text>
    <text x="884" y="400" font-size="12" letter-spacing="1.2">MEASURE / VERIFY</text>

    <text x="884" y="462" font-size="15" font-weight="700">2  SPATIAL COMPREHENSION</text>
    <text x="884" y="486" font-size="14">Are route, hierarchy and room relationships intelligible?</text>
    <text x="884" y="508" font-size="12" letter-spacing="1.2">SUPPORTED / CONTEXT-SENSITIVE</text>

    <text x="884" y="570" font-size="15" font-weight="700">6  TECHNICAL EXPRESSION</text>
    <text x="884" y="594" font-size="14">Do services and access remain subordinate to occupation?</text>
    <text x="884" y="616" font-size="12" letter-spacing="1.2">ARCHITECTURAL JUDGEMENT</text>

    <text x="884" y="678" font-size="15" font-weight="700">3  PRIVACY &amp; RETREAT</text>
    <text x="884" y="702" font-size="14">Can exposure be regulated where the programme requires it?</text>
    <text x="884" y="724" font-size="12" letter-spacing="1.2">SUPPORTED / CONTEXT-SENSITIVE</text>

    <text x="884" y="786" font-size="15" font-weight="700">4  LOCAL CONTROL</text>
    <text x="884" y="810" font-size="14">Can ordinary conditions be altered intelligibly and effectively?</text>
    <text x="884" y="832" font-size="12" letter-spacing="1.2">SUPPORTED</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#111111">
    <text x="72" y="822" font-size="18">Repose is not a single measurable variable.</text>
    <text x="72" y="852" font-size="16">The review keeps measured performance, supported human factors and architectural judgement distinct.</text>
  </g>
</svg>