<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Reference House type and orientation</title>
  <desc id="desc">Publication-oriented ground and first floor planning fields for the Reference House with north arrow and A–A section registration, plus a simple south-to-north section strip. The figure derives from the COA successor geometry and does not invent wall faces or unresolved internal openings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker>
    <style>.head{font:700 28px Arial,Helvetica,sans-serif;fill:#111}.sub{font:600 21px Arial,Helvetica,sans-serif;fill:#111}.room{font:600 320px Arial,Helvetica,sans-serif;fill:#222}.note{font:250px Arial,Helvetica,sans-serif;fill:#555}.small{font:18px Arial,Helvetica,sans-serif;fill:#444}.tiny{font:16px Arial,Helvetica,sans-serif;fill:#555}.outer{stroke:#111;stroke-width:85;fill:none}.court{stroke:#111;stroke-width:58;fill:#fff}.controlled{stroke:#333;stroke-width:42;fill:none}.provisional{stroke:#666;stroke-width:38;stroke-dasharray:150 100;fill:none}.cut{stroke:#111;stroke-width:34;stroke-dasharray:120 90;fill:none}.field{fill:#f2f1ed}.circ{fill:#e7e7e3}.service{fill:#e2e2df}.section{stroke:#111;stroke-width:4;fill:#f2f1ed}.datum{stroke:#777;stroke-width:2;stroke-dasharray:9 7}.roof{stroke:#111;stroke-width:4;fill:none}</style>
  </defs>
  <text x="80" y="65" class="head">REFERENCE HOUSE — TYPE AND ORIENTATION</text><text x="80" y="98" class="small">Planning fields derived from the controlled COA successor geometry · north up · wall faces not represented</text>
  <text x="80" y="145" class="sub">GROUND FLOOR</text><text x="850" y="145" class="sub">FIRST FLOOR</text>

  <g transform="translate(80 175) scale(.045)">
    <rect x="0" y="7400" width="4000" height="3400" class="field"/><rect x="0" y="5800" width="4200" height="1600" class="field"/><rect x="0" y="0" width="4200" height="5800" class="field"/><rect x="4200" y="0" width="3600" height="3400" class="field"/><rect x="4000" y="7400" width="3800" height="3400" class="circ"/><rect x="7800" y="0" width="4200" height="3400" class="field"/><rect x="9100" y="7400" width="2900" height="3400" class="field"/><rect x="9100" y="3400" width="2900" height="4000" class="service"/><rect x="7800" y="3400" width="1300" height="7400" class="circ"/><rect x="4200" y="3400" width="3600" height="4000" class="court"/>
    <rect x="0" y="0" width="12000" height="10800" class="outer"/><rect x="4200" y="3400" width="3600" height="4000" class="court"/><line x1="9100" y1="3400" x2="9100" y2="10800" class="controlled"/><line x1="7800" y1="0" x2="7800" y2="10800" class="controlled"/><line x1="4000" y1="7400" x2="4000" y2="10800" class="provisional"/><line x1="0" y1="5800" x2="4200" y2="5800" class="provisional"/>
    <text x="2100" y="3000" text-anchor="middle" class="room">Family</text><text x="2100" y="8450" text-anchor="middle" class="room">Drawing</text><text x="5250" y="9200" text-anchor="middle" class="room">Hall / stair</text><text x="5300" y="1700" text-anchor="middle" class="room">Garden dining</text><text x="9900" y="1700" text-anchor="middle" class="room">Kitchen</text><text x="10550" y="5350" text-anchor="middle" class="room">Service</text><text x="10550" y="9050" text-anchor="middle" class="room">Study</text><text x="5350" y="5350" text-anchor="middle" class="room">Open court</text>
    <line x1="6000" y1="-700" x2="6000" y2="11500" class="cut"/><text x="6000" y="-850" text-anchor="middle" class="note">A</text><text x="6000" y="11850" text-anchor="middle" class="note">A</text>
  </g>

  <g transform="translate(850 175) scale(.045)">
    <rect x="0" y="7400" width="4000" height="3400" class="field"/><rect x="0" y="5800" width="4200" height="1600" class="field"/><rect x="0" y="0" width="4200" height="5800" class="field"/><rect x="7800" y="7400" width="4200" height="3400" class="field"/><rect x="7800" y="0" width="4200" height="3400" class="field"/><rect x="9100" y="3400" width="2900" height="4000" class="service"/><rect x="7800" y="3400" width="1300" height="4000" class="circ"/><rect x="4000" y="7400" width="3800" height="3400" class="circ"/><rect x="4200" y="0" width="2200" height="2200" class="field"/><rect x="6400" y="0" width="1400" height="2200" class="field"/><rect x="4200" y="2200" width="3600" height="1200" class="circ"/><rect x="4200" y="3400" width="3600" height="4000" class="court"/>
    <rect x="0" y="0" width="12000" height="10800" class="outer"/><rect x="4200" y="3400" width="3600" height="4000" class="court"/><line x1="9100" y1="3400" x2="9100" y2="7400" class="controlled"/><line x1="7800" y1="0" x2="7800" y2="10800" class="controlled"/><line x1="4000" y1="7400" x2="4000" y2="10800" class="provisional"/><line x1="0" y1="5800" x2="4200" y2="5800" class="provisional"/><line x1="4200" y1="2200" x2="7800" y2="2200" class="provisional"/><line x1="6400" y1="0" x2="6400" y2="2200" class="provisional"/>
    <text x="2100" y="2900" text-anchor="middle" class="room">Principal bedroom</text><text x="2100" y="8450" text-anchor="middle" class="room">Bedroom</text><text x="9900" y="1700" text-anchor="middle" class="room">Bedroom</text><text x="9900" y="9050" text-anchor="middle" class="room">Bedroom</text><text x="10550" y="5350" text-anchor="middle" class="room">Bathroom</text><text x="5250" y="9200" text-anchor="middle" class="room">Stair / landing</text><text x="5350" y="5350" text-anchor="middle" class="room">Open court</text>
    <line x1="6000" y1="-700" x2="6000" y2="11500" class="cut"/><text x="6000" y="-850" text-anchor="middle" class="note">A</text><text x="6000" y="11850" text-anchor="middle" class="note">A</text>
  </g>

  <g transform="translate(670 190)"><line x1="0" y1="70" x2="0" y2="0" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="0" y="96" text-anchor="middle" class="small">N</text></g><g transform="translate(1440 190)"><line x1="0" y1="70" x2="0" y2="0" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="0" y="96" text-anchor="middle" class="small">N</text></g>

  <text x="80" y="705" class="sub">SECTION A–A · SOUTH → NORTH</text>
  <g transform="translate(80 735)">
    <rect x="0" y="190" width="360" height="150" class="section"/><rect x="0" y="45" width="360" height="130" class="section"/><rect x="790" y="190" width="360" height="150" class="section"/><rect x="790" y="45" width="360" height="130" class="section"/><line x1="360" y1="340" x2="360" y2="20" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><line x1="790" y1="340" x2="790" y2="20" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><line x1="0" y1="175" x2="360" y2="175" class="datum"/><line x1="790" y1="175" x2="1150" y2="175" class="datum"/><path d="M 0 45 L 360 35 M 790 35 L 1150 45" class="roof"/>
    <text x="180" y="276" text-anchor="middle" class="small">hall / stair field</text><text x="180" y="120" text-anchor="middle" class="small">upper stair field</text><text x="575" y="170" text-anchor="middle" class="sub">open court</text><text x="970" y="276" text-anchor="middle" class="small">garden dining</text><text x="970" y="120" text-anchor="middle" class="small">dry / landing field</text><text x="0" y="375" class="small">S</text><text x="1150" y="375" text-anchor="end" class="small">N</text>
    <text x="1225" y="103" class="tiny">upper clear ceiling ≈ +6.00 m</text><text x="1225" y="184" class="tiny">first FFL ≈ +3.30 m</text><text x="1225" y="266" class="tiny">ground clear ceiling ≈ +2.95 m</text><text x="1225" y="340" class="tiny">ground FFL ±0</text>
  </g>
  <text x="80" y="1125" class="tiny">Solid outer / court edges are controlled planning geometry; dashed internal divisions remain provisional. Section shows spatial datums, not construction build-ups.</text>
</svg>